<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>液态玻璃测试</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* 增加一个高级的彩色彩虹渐变色背景，为了让玻璃透过去更好看 */
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a4a 100%);
        }

        /* 背景增加发光柔光球，凸显液态玻璃的折射感 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(120, 119, 198, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 119, 198, 0.3) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        /* =======================================================
           核心：液态玻璃 CSS（完全复刻 Github 仓库代码）
           ======================================================= */
        .liquid-glass {
            position: relative;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(2px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 2rem;
            padding: 8px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2), inset 0 4px 20px rgba(255, 255, 255, 0.3);
        }

        /* 灵魂所在：制造边缘反光折射和水滴感的伪元素 */
        .liquid-glass::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            backdrop-filter: blur(1px);
            /* 高光反射阴影叠加 */
            box-shadow: inset -10px -8px 0px -11px rgba(255, 255, 255, 1),
                        inset 0px -9px 0px -8px rgba(255, 255, 255, 1);
            opacity: 0.6;
            z-index: -1;
            filter: blur(1px) drop-shadow(10px 4px 6px black) brightness(115%);
            pointer-events: none;
        }

        /* =======================================================
           测试滑动组件布局
           ======================================================= */
        .toggle-wrapper {
            display: flex;
            position: relative;
            width: 200px;
            height: 44px;
            align-items: center;
        }

        .toggle-wrapper input[type="radio"] {
            display: none;
        }

        .toggle-wrapper label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            font-size: 15px;
            z-index: 2;
            cursor: pointer;
            transition: color 0.3s ease;
            letter-spacing: 1px;
        }

        .toggle-wrapper input[type="radio"]:checked + label {
            color: #ffffff;
        }

        /* 滑动黑底滑块 */
        .glider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1.5rem;
            z-index: 1;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 滑动逻辑 */
        #tab-a:checked ~ .glider { transform: translateX(0); }
        #tab-b:checked ~ .glider { transform: translateX(100%); }

        /* 加一层极简提示文字 */
        .hint {
            position: fixed;
            bottom: 40px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 核心测试组件 -->
    <div class="liquid-glass toggle-wrapper">
        <input type="radio" name="test_tab" id="tab-a" checked>
        <label for="tab-a">测试A</label>
        
        <input type="radio" name="test_tab" id="tab-b">
        <label for="tab-b">测试B</label>
        
        <div class="glider"></div>
    </div>

    <div class="hint">可以点击测试A/测试B，体验滑动动画<br>边缘的那一圈高光折射，就是“液态玻璃”的精髓</div>

</body>
</html>
