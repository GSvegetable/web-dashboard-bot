<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 12%;
            padding-top: 14vh; 
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 确保两个标题绝对左对齐 */
            gap: 6px;
        }

        /* 核心修复：文字使用纯白 + 底部极浅的灰色渐变折射 */
        .text-gradient {
            font-weight: 900;
            text-align: left;
            margin: 0;
            /* 光线效果：90%是耀眼的白，只有最底部带一丁点微光折射 */
            background: linear-gradient(160deg, #ffffff 0%, #ffffff 70%, #e5e5e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            /* 轻微厚度阴影 */
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.15));
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        .main-title {
            font-size: 64px;
            letter-spacing: 8px;
            line-height: 1.1; /* 确保占位区域稳定 */
        }

        .sub-title {
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: 600;
            line-height: 1.1;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 24px;
            margin-top: 20px;
        }

        .glass-btn {
            padding: 14px 32px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
        }

        .glass-btn:active {
            transform: scale(0.94);
        }

        .btn-text {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(160deg, #ffffff 0%, #f5f5f5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.1));
        }

        @media (max-width: 600px) {
            body { padding-left: 6%; padding-top: 12vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { padding: 12px 20px; }
            .btn-text { font-size: 15px; }
            .btn-group { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="text-group">
        <h1 class="text-gradient main-title">宫水大世界</h1>
        <h2 class="text-gradient sub-title">Telegram bot编辑器</h2>
    </div>
    
    <div class="btn-group">
        <a href="#" class="glass-btn" onclick="alert('后续将跳转至创建作品页面')">
            <span class="btn-text">创建作品</span>
        </a>
        <a href="/dashboard" class="glass-btn" onclick="alert('点击了查看仓库')">
            <span class="btn-text">查看仓库</span>
        </a>
    </div>
</body>
</html>
