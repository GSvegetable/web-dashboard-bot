<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <!-- 引入 GSAP 及其滚动触发插件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button, a, input, textarea, select { outline: none; -webkit-tap-highlight-color: transparent; }
        button:focus, a:focus, input:focus { outline: none; }

        :root {
            --bg-img: url("{{ url_for('static', filename='bg.png') }}");
            --new-bg-img: url("{{ url_for('static', filename='mmexport1785785172198.jpg') }}");
        }

        body {
            width: 100vw;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        body.loaded { opacity: 1; }

        /* ================= 第一屏：顶部图片区域 ================= */
        .top-image-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh; 
            flex-shrink: 0;
            z-index: 1;
            /* 因为文字绝对定位在里面，背景图撑满 */
        }
        .top-image {
            width: 100%;
            height: 100%; 
            background-image: url("{{ url_for('static', filename='IMG_20260804_070056.png') }}");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* 🔽 第一张图片里面的新内容 */
        .top-image-content {
            position: absolute;
            top: 15%; /* 放置在屏幕左上方的约 1/4 处 */
            left: 12%; /* 保持和底部对齐 */
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            pointer-events: none; 
            z-index: 2;
        }
        /* 第一排：极大字体 */
        .cover-title {
            font-size: clamp(48px, 10vw, 100px);
            font-weight: 700;
            color: #ffffff; /* 纯白色，没有任何效果 */
            text-shadow: none;
            margin-bottom: 2vh; /* 与第二排的距离 */
        }
        /* 第二排：中等字体 + 加载动画 */
        .cover-sub-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2.5vh;
        }
        .cover-subtitle {
            font-size: clamp(22px, 4vw, 42px);
            font-weight: 500;
            color: #ffffff;
            text-shadow: none;
        }
        
        /* 🔴 核心修复：精确复刻 Uiverse 的 rollingRock 弹跳动画 */
        .loader {
            position: relative;
            width: 2rem; height: 2rem;
            display: inline-block;
            vertical-align: middle;
        }
        .loader::after {
            content: '';
            position: absolute;
            left: 0; bottom: 0.5rem;
            width: 1rem; height: 1rem;
            background-color: #f2a900; /* 橙色圆点 */
            border-radius: 50%;
            animation: rollingRock 2.5s cubic-bezier(.79, 0, .47, .97) infinite;
        }
        @keyframes rollingRock {
            0% { transform: translate(0, -1rem) rotate(-45deg); }
            5% { transform: translate(0, -1rem) rotate(-50deg); }
            20% { transform: translate(1rem, -2rem) rotate(47deg); }
            25% { transform: translate(1rem, -2rem) rotate(45deg); }
            30% { transform: translate(1rem, -2rem) rotate(40deg); }
            45% { transform: translate(2rem, -3rem) rotate(137deg); }
            50% { transform: translate(2rem, -3rem) rotate(135deg); }
            55% { transform: translate(2rem, -3rem) rotate(130deg); }
            70% { transform: translate(3rem, -4rem) rotate(217deg); }
            75% { transform: translate(3rem, -4rem) rotate(225deg); }
            100% { transform: translate(0, -1rem) rotate(225deg); }
        }

        /* 第三排：最小字体 */
        .cover-hint {
            font-size: clamp(14px, 2vw, 24px);
            font-weight: 300;
            color: #ffffff;
            opacity: 0.8;
            text-shadow: none;
            letter-spacing: 1px;
        }
        /* ======================================================== */

        /* ================= 第二屏：文字与按钮区域 ================= */
        .content-area {
            position: relative;
            width: 100%;
            min-height: 100vh; 
            background-image: var(--bg-img);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            margin-top: 0;
            padding-top: 15vh;
            padding-left: 12%;
            padding-bottom: 15vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 1;
            overflow: hidden;
        }

        /* ================= 内部遮罩层（负责主题切换） ================= */
        #theme-ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-color: transparent;
            background-image: var(--bg-img);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            clip-path: circle(0% at 0 0);
            will-change: clip-path, background-image;
        }

        /* ================= 标题行（文字 + 切换按钮） ================= */
        .title-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 12px;
            position: relative;
            z-index: 1;
            margin-bottom: 4px; 
            margin-top: 0; 
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            gap: 6px;
            opacity: 0; 
            transform: translateY(60px); 
        }

        /* 固定在“宫水大世界”右侧的切换按钮 */
        .theme-btn-title {
            width: 30px; height: 30px; padding: 0; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #ffffff; touch-action: manipulation;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateY(60px);
            flex-shrink: 0;
            margin-top: 6px;
        }
        .theme-btn-title:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        .text-pattern {
            color: #ffffff; 
            background-image: url("{{ url_for('static', filename='texture.jpg') }}"); 
            background-size: cover; background-position: center;
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 900; text-align: left; margin: 0; letter-spacing: 8px; text-shadow: none;
            text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; line-height: 1.3; padding-top: 2px; padding-bottom: 4px;
        }
        .main-title { font-size: 64px; }
        .sub-title { font-size: 22px; letter-spacing: 2px; font-weight: 600; }

        .btn-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            width: 100%; max-width: 320px;
            margin-top: 0;
            justify-items: center;
            opacity: 0;
            transform: translateY(60px);
            position: relative;
            z-index: 1;
        }

        /* ================= 屏幕顶部固定悬浮的按钮 ================= */
        .top-actions {
            position: fixed;
            top: 20px;
            right: 24px; 
            z-index: 9999; 
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-btn {
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            color: #ffffff; font-size: 14px; font-weight: 500;
            cursor: pointer; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            border: none; touch-action: manipulation;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .top-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }
        #loginBtn { margin-left: 16px; }

        @keyframes slideInFromRight {
            0% { opacity: 0; transform: translateX(280px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .top-actions .top-btn {
            opacity: 0;
            animation: slideInFromRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .top-actions .top-btn:nth-child(1) { animation-delay: 0.2s; }
        .top-actions .top-btn:nth-child(2) { animation-delay: 0.4s; }

        /* 底部按钮统一玻璃质感 */
        .glass-btn {
            position: relative; padding: 14px 0; width: 90%; text-align: center; border-radius: 24px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            color: #ffffff; font-size: 18px; font-weight: 600;
            cursor: pointer; letter-spacing: 1px; text-decoration: none;
            display: inline-block; z-index: 1; touch-action: manipulation;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .glass-btn:active { transform: scale(0.94); }
        .btn-text { position: relative; z-index: 2; color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.15); }

        @media (max-width: 600px) {
            .top-image-content { left: 6%; top: 12%; }
            .cover-title { margin-bottom: 1.5vh; }
            .cover-sub-row { gap: 8px; margin-bottom: 1.5vh; }
            .cover-subtitle { font-size: 20px; }

            .content-area { padding-top: 11vh; padding-left: 6%; min-height: 100vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { font-size: 15px; padding: 12px 0; border-radius: 20px; }
            .btn-grid { gap: 12px; max-width: 260px; }
            .top-actions { top: 16px; right: 16px; gap: 6px; }
            .top-btn { font-size: 12px; padding: 6px 14px; }
            #loginBtn { margin-left: 8px; }
            .theme-btn-title { width: 28px; height: 28px; margin-top: 3px; }
            .top-actions .top-btn { animation-duration: 0.5s; }
        }
    </style>
</head>
<body>
    <!-- 第一屏：顶部图片 + 文字 -->
    <div class="top-image-wrapper">
        <div class="top-image"></div>
        
        <!-- 第一张图片新增内容（纯白、左对齐、精确占位比例） -->
        <div class="top-image-content">
            <h1 class="cover-title">GsBot编辑器</h1>
            <div class="cover-sub-row">
                <h2 class="cover-subtitle">该网页施工中</h2>
                <div class="loader"></div>
            </div>
            <p class="cover-hint">向下滑动查看更多</p>
        </div>
    </div>

    <!-- 第二屏：宫水大世界 -->
    <div class="content-area" id="contentArea">
        <div id="theme-ring"></div>

        <div class="title-row">
            <div class="text-group">
                <h1 class="text-pattern main-title">宫水大世界</h1>
                <h2 class="text-pattern sub-title">Telegram Bot Editor</h2>
            </div>
            <button class="theme-btn-title" onclick="toggleTheme(event)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
            </button>
        </div>
        
        <div class="btn-grid">
            <a href="/create" class="glass-btn"><span class="btn-text">创建作品</span></a>
            <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">查看仓库</span></a>
            <a href="https://t.me/gsyxyc" class="glass-btn" target="_blank"><span class="btn-text">联系开发者</span></a>
            <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">加入社区</span></a>
        </div>
    </div>

    <!-- 顶部悬浮按钮 -->
    <div class="top-actions">
        <a href="javascript:void(0)" onclick="toggleFullScreen()" class="top-btn">全屏显示</a>
        <button class="top-btn" id="loginBtn" onclick="void(0)">Log in</button>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        let isExpanded = false;
        const themeRing = document.getElementById('theme-ring');
        const defaultBgUrl = "{{ url_for('static', filename='bg.png') }}";
        const newBgUrl = "{{ url_for('static', filename='mmexport1785785172198.jpg') }}";
        const defaultTextUrl = "{{ url_for('static', filename='texture.jpg') }}";
        const newTextUrl = "{{ url_for('static', filename='mmexport1785791861411.jpg') }}";
        const textElements = document.querySelectorAll('.text-pattern');
        const contentArea = document.getElementById('contentArea');

        // 预加载新图片
        const preloadNewBg = new Image();
        preloadNewBg.src = newBgUrl;
        const preloadNewText = new Image();
        preloadNewText.src = newTextUrl;

        function toggleTheme(event) {
            const btn = event.currentTarget;
            const btnRect = btn.getBoundingClientRect();
            const areaRect = contentArea.getBoundingClientRect();
            const x = (btnRect.left - areaRect.left) + btnRect.width / 2;
            const y = (btnRect.top - areaRect.top) + btnRect.height / 2;

            isExpanded = !isExpanded;
            gsap.killTweensOf(themeRing);

            if (isExpanded) {
                themeRing.style.backgroundImage = `url("${newBgUrl}")`;
                gsap.set(themeRing, { clipPath: `circle(0% at ${x}px ${y}px)` });
                gsap.delayedCall(0.2, () => {
                    textElements.forEach(el => { el.style.backgroundImage = `url("${newTextUrl}")`; });
                });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { duration: 0.8, ease: "power2.inOut", clipPath: `circle(150% at ${x}px ${y}px)` });
            } else {
                gsap.set(themeRing, { clipPath: `circle(150% at ${x}px ${y}px)` });
                gsap.delayedCall(0.35, () => {
                    textElements.forEach(el => { el.style.backgroundImage = `url("${defaultTextUrl}")`; });
                });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { duration: 0.8, ease: "power2.inOut", clipPath: `circle(0% at ${x}px ${y}px)`,
                    onComplete: () => {
                        themeRing.style.backgroundImage = `url("${defaultBgUrl}")`;
                    }
                });
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const bgImg = new Image();
            const imgUrl = "{{ url_for('static', filename='bg.png') }}";
            bgImg.src = imgUrl;
            bgImg.onload = function() { document.body.classList.add('loaded'); };
            setTimeout(() => {
                if(!document.body.classList.contains('loaded')) { document.body.classList.add('loaded'); }
            }, 3000);

            gsap.set(themeRing, { clipPath: `circle(0% at 0 0)` });
            setTimeout(() => {
                gsap.set(themeRing, { clipPath: `circle(150% at 0 0)` });
                setTimeout(() => {
                    gsap.set(themeRing, { clipPath: `circle(0% at 0 0)` });
                }, 100);
            }, 200);

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: ".content-area",
                    start: "top 85%",
                    toggleActions: "play none none reverse"
                }
            });
            tl.to(".text-group", { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0)
              .to(".theme-btn-title", { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0)
              .to(".btn-grid", { opacity: 1, y: 0, duration: 1.2, delay: 0.2, ease: "power3.out" }, 0.2);
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }
    </script>
</body>
</html>
