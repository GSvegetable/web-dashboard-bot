<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foldcraft - Brand & Visual Storytelling</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Geist Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS (keyframes + reset) -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .font-geist { font-family: 'Geist', sans-serif; }
    </style>
</head>
<body>
    <!-- Root container -->
    <div class="relative h-screen w-full overflow-hidden bg-black font-geist">

        <!-- Background Video (absolute) -->
        <video
            autoPlay
            muted
            loop
            playsInline
            class="absolute top-0 left-0 w-full h-full object-cover"
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204221_5339e40b-e73d-4ab0-9c65-79c18c66fd50.mp4"
            style="object-position: 70% center;"
        ></video>

        <!-- Navbar (z-30) -->
        <nav class="absolute top-0 left-0 w-full z-30 flex items-center justify-between px-6 py-5 md:px-12 lg:px-16">
            <div class="flex items-center gap-8">
                <span class="text-lg font-semibold tracking-tight text-white sm:text-xl">Foldcraft</span>
                <div class="hidden md:flex items-center gap-8">
                    <a href="#" class="text-sm text-white/80 hover:text-white transition-colors">Home</a>
                    <a href="#" class="text-sm text-white/80 hover:text-white transition-colors">Projects</a>
                    <a href="#" class="text-sm text-white/80 hover:text-white transition-colors">Studio</a>
                    <a href="#" class="text-sm text-white/80 hover:text-white transition-colors">Reach Us</a>
                </div>
            </div>
            <a href="#" class="hidden md:inline-block rounded-lg bg-white px-5 py-2 text-sm font-medium text-black hover:scale-105 transition-transform">Let's Talk</a>
            <button id="menuBtn" class="md:hidden relative z-50 w-10 h-10 flex items-center justify-center text-white active:scale-90 transition-transform duration-300">
                <svg id="iconMenu" class="w-6 h-6 absolute transition-all duration-300 rotate-0 scale-100 opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
                <svg id="iconX" class="w-6 h-6 absolute transition-all duration-300 rotate-90 scale-0 opacity-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </nav>

        <!-- Mobile Menu Overlay (z-20) -->
        <div id="mobileMenu" class="absolute inset-x-0 top-0 z-20 h-0 opacity-0 pointer-events-none bg-black/98 backdrop-blur-xl transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] overflow-hidden">
            <div class="flex h-full flex-col justify-center px-8">
                <div class="transition-all duration-500 delay-100 translate-y-8 opacity-0">
                    <div class="flex flex-col gap-6">
                        <a href="#" class="text-3xl font-medium text-white/90 hover:text-white" onclick="closeMenu()">Home</a>
                        <a href="#" class="text-3xl font-medium text-white/90 hover:text-white" onclick="closeMenu()">Projects</a>
                        <a href="#" class="text-3xl font-medium text-white/90 hover:text-white" onclick="closeMenu()">Studio</a>
                        <a href="#" class="text-3xl font-medium text-white/90 hover:text-white" onclick="closeMenu()">Reach Us</a>
                        <a href="#" class="mt-6 rounded-full bg-white px-8 py-3.5 text-base font-medium text-black hover:scale-105 transition-transform" onclick="closeMenu()">Let's Talk</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hero Content (z-10) -->
        <div class="relative z-10 flex flex-col justify-between h-[calc(100vh-80px)] px-6 pb-10 pt-12 sm:pb-12 sm:pt-16 md:px-12 md:pb-16 md:pt-20 lg:px-16">
            <div class="max-w-3xl">
                <p class="text-xs sm:text-sm text-white/90 mb-4 sm:mb-6 animate-[fadeSlideUp_0.8s_ease_0.2s_both]">Brand & Visual Storytelling</p>
                <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-medium leading-[1.1] tracking-tight text-white animate-[fadeSlideUp_0.8s_ease_0.4s_both]">
                    Shaping visual<br>narratives,<br>one pixel at a time.
                </h1>
            </div>
            <div>
                <p class="text-sm sm:text-base md:text-lg leading-relaxed text-white/60 max-w-sm sm:max-w-lg mb-5 sm:mb-6 animate-[fadeSlideUp_0.8s_ease_0.7s_both]">
                    Turning vision into reality through craft, motion, and an endless pursuit of beauty.
                </p>
                <a href="#" class="rounded-lg bg-white px-5 py-2.5 sm:px-6 sm:py-3 text-sm font-medium text-black hover:scale-105 transition-transform inline-flex items-center gap-2 animate-[fadeSlideUp_0.8s_ease_0.9s_both]">
                    Explore Work
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </a>
            </div>
        </div>

        <!-- Mobile Menu JS -->
        <script>
            const menuBtn = document.getElementById('menuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            const iconMenu = document.getElementById('iconMenu');
            const iconX = document.getElementById('iconX');

            function openMenu() {
                mobileMenu.classList.remove('h-0', 'opacity-0', 'pointer-events-none');
                mobileMenu.classList.add('h-screen', 'opacity-100');
                iconMenu.classList.add('rotate-90', 'scale-0', 'opacity-0');
                iconX.classList.remove('rotate-90', 'scale-0', 'opacity-0');
                document.querySelector('#mobileMenu > div > div').classList.remove('translate-y-8', 'opacity-0');
            }

            function closeMenu() {
                mobileMenu.classList.add('h-0', 'opacity-0', 'pointer-events-none');
                mobileMenu.classList.remove('h-screen', 'opacity-100');
                iconMenu.classList.remove('rotate-90', 'scale-0', 'opacity-0');
                iconX.classList.add('rotate-90', 'scale-0', 'opacity-0');
                document.querySelector('#mobileMenu > div > div').classList.add('translate-y-8', 'opacity-0');
            }

            menuBtn.addEventListener('click', () => {
                if (mobileMenu.classList.contains('h-screen')) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });

            document.querySelectorAll('#mobileMenu a').forEach(link => {
                link.addEventListener('click', closeMenu);
            });
        </script>
    </div>
</body>
</html>
