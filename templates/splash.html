<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button, a, input, textarea, select { outline: none; -webkit-tap-highlight-color: transparent; }
        button:focus, a:focus, input:focus { outline: none; }

        :root {
            --bg-img: url("{{ url_for('static', filename='bg.png') }}");
            --new-bg-img: url("{{ url_for('static', filename='mmexport1785785172198.jpg') }}");
        }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: #000000; display: flex; flex-direction: column; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        body.loaded { opacity: 1; }

        .content-area { position: relative; width: 100%; height: 100vh; background-image: var(--bg-img); background-size: cover; background-position: center; background-repeat: no-repeat; margin-top: 0; padding-top: 15vh; padding-left: 12%; padding-bottom: 15vh; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; z-index: 1; overflow: hidden; }
        #theme-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; background-color: transparent; background-image: var(--bg-img); background-size: cover; background-position: center; background-repeat: no-repeat; clip-path: circle(0% at 0 0); will-change: clip-path, background-image; }
        .title-row { display: flex; flex-direction: row; align-items: flex-start; justify-content: flex-start; gap: 12px; position: relative; z-index: 1; margin-bottom: 4px; margin-top: 0; }
        .text-group { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
        #themeToggleBtn { z-index: 9999; position: relative; width: 30px; height: 30px; padding: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; color: #ffffff; touch-action: manipulation; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); flex-shrink: 0; margin-top: 6px; }
        #themeToggleBtn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }
        .text-pattern { color: #ffffff; background-image: url("{{ url_for('static', filename='texture.jpg') }}"); background-size: cover; background-position: center; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; text-align: left; margin: 0; letter-spacing: 8px; text-shadow: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; line-height: 1.3; padding-top: 2px; padding-bottom: 4px; }
        .main-title { font-size: 64px; }
        .sub-title { font-size: 22px; letter-spacing: 2px; font-weight: 600; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 320px; margin-top: 0; justify-items: center; position: relative; z-index: 1; }
        .glass-btn { position: relative; padding: 14px 0; width: 90%; text-align: center; border-radius: 24px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3); color: #ffffff; font-size: 18px; font-weight: 600; cursor: pointer; letter-spacing: 1px; text-decoration: none; display: inline-block; z-index: 1; touch-action: manipulation; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .glass-btn:active { transform: scale(0.94); }
        .btn-text { position: relative; z-index: 2; color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.15); }

        .text-group, #themeToggleBtn, .btn-grid { opacity: 0; transform: translateY(60px); animation: fadeInUp 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        #themeToggleBtn { animation-delay: 0s; }
        .btn-grid { animation-delay: 0.2s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }

        .top-actions { position: fixed; top: 20px; right: 24px; z-index: 9999; display: flex; align-items: center; gap: 10px; width: auto; justify-content: flex-end; }
        .top-btn { text-align: center; padding: 8px 12px; border-radius: 30px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2); color: #ffffff; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; border: none; touch-action: manipulation; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); white-space: nowrap; flex-shrink: 0; width: auto; min-width: auto; }
        .top-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        @keyframes slideInFromRight { 0% { opacity: 0; transform: translateX(280px); } 100% { opacity: 1; transform: translateX(0); } }
        .top-actions .top-btn { opacity: 0; animation: slideInFromRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes shakeField { 0% { transform: translateX(0px); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-4px); } 100% { transform: translateX(0px); } }
        .shake-field { animation: shakeField 0.2s ease-in-out 2; }

        .modal-overlay { position: fixed; inset: 0; background: transparent; backdrop-filter: none; z-index: 9998; display: flex; justify-content: flex-end; align-items: flex-start; padding-top: 80px; padding-right: 24px; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; pointer-events: none; }
        .modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .modal-box { transform: translateY(-10px); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .modal-overlay.active .modal-box { transform: translateY(0); }

        .login-card { position: relative; width: 320px; padding: 24px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1); color: #e5e7eb; display: flex; flex-direction: column; gap: 14px; }
        #send-code-btn:disabled { background: rgba(255, 255, 255, 0.15) !important; color: #9ca3af !important; cursor: not-allowed !important; }

        .music-glass-card { max-width: 420px; width: 90%; padding: 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1); color: white; font-family: -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; }
        .track-info { display: flex; align-items: center; gap: 12px; }
        .album-art { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #ff9a9e, #fad0c4); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); flex-shrink: 0; transition: transform 0.3s ease; }
        .album-art:hover { transform: scale(1.05); }
        .track-details { flex-grow: 1; overflow: hidden; }
        .track-title { font-size: 1.3em; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .artist-name { font-size: 0.9em; color: #d1d1d6; margin-top: 2px; }
        .volume-bars { display: flex; align-items: flex-end; gap: 2px; width: 38px; height: 32px; }
        .volume-bars .bar { width: 3px; background: linear-gradient(180deg, #00c6ff, #0072ff); border-radius: 2px; animation: bounce 0.8s infinite ease-in-out; animation-delay: var(--delay); animation-play-state: running; }
        @keyframes bounce { 0%, 100% { height: 6px; } 50% { height: 26px; } }
        .playback-controls { display: flex; flex-direction: column; gap: 8px; }
        .time-info { display: flex; justify-content: space-between; font-size: 0.8em; color: #8e8e93; }
        .progress-bar { width: 100%; height: 4px; background-color: rgba(255, 255, 255, 0.1); border-radius: 2px; position: relative; overflow: hidden; }
        .进度-填写 { 高度: 100%; 宽度: 0%; 背景: 线性梯度(90deg，#00c6ff，#0072ff); 边界半径: 2PX; }
        .进度句柄 { 位置: 绝对的; 顶端: 50%; 左: 0%; 改变: 翻译(-50%, -50%); 宽度: 10PX; 高度: 10PX; 背景色: 白色的; 边界半径: 50%; 箱形阴影: 0 0 6PX RGBA(0, 0, 0, 0.5); }
        .按钮排 { 显示: 弯曲; justify-content: 间距; 差距: 12PX; }
        .控制按钮 { 上边距: 2%; 宽度: 52PX; 高度: 52PX; 边界半径: 50%; 边境: 没有一个; 背景: 没有一个; 显示: 弯曲; justify-content: 中心; 对齐项目: 中心; 光标: 指针; 过渡: 背景 0.2s, 改变 0.2s; 颜色：#fff；}
        .控制按钮.播放暂停按钮:盘旋, .控制按钮.d:盘旋 { 背景: RGBA(255, 255, 255, 0.1); 改变: 规模(1.05); }
        .主控-btns { justify-content: 中心; 对齐项目: 中心; 显示: 弯曲; 左边距: 10%; 差距: 20%; }
        .播放暂停按钮 .图标暂停 { 显示: 没有一个; }
        
        #定制烤面包 { 位置: 确定的; 底部: 40PX; 左: 50%; 改变: translateX(-50%); 背景：#1f2937；颜色：#f3f4f6；填充: 10PX 24PX; 边界半径: 8PX; 箱形阴影: 0 4PX 12PX RGBA(0,0,0,0.6); Z指数: 99999; 字体大小: 14PX; 不透明度: 0; 能见度: 隐藏的; 过渡: 所有 0.3s 缓解; 空白: noWrap; 左边框: 4PX 固体#8b5cf6；最大宽度: 90%; 空白: 正常的; 文本对齐: 中心; }
        #定制烤面包.误差 { 左框线彩色：#ef4444；}
        #定制烤面包.成功 { 左框线彩色：#22c55e；}
        #定制烤面包.显示 { 不透明度: 1; 能见度: 看得见的; }

        @介质 (最大宽度: 600PX) {
            .内容区 { 顶部衬垫: 11VH; 左填充: 6%; 最小高度: 100VH; }
            .主要标题 { 字体大小: 44PX; }
            .副标题 { 字体大小: 16PX; }
            .glass-btn { 字体大小: 15PX; 填充: 12PX 0; 边界半径: 20PX; }
            .btn-grid { 差距: 12PX; 最大宽度: 260PX; }
            .top-actions { 顶端: 12PX; 正确的: 12PX; 差距: 6PX; }
            .top-btn { 字体大小: 11PX; 填充: 6PX 8PX; }
            .模态覆盖 { 顶部衬垫: 70PX; 右边填充: 12PX; }
            .登录卡, .音乐玻璃卡 { 宽度: 280PX; 填充: 16PX; }
            #定制烤面包 { 字体大小: 13PX; 填充: 8PX 16PX; 底部: 30PX; }
        }
    </风格>
</头>

    <script>
        // ============================================================
        // 核心保障：所有点击触发的事件，全部挂在 window 上！
        // 只要测试版能通，这个版本绝对不可能按键失效！
        // ============================================================

        window.toggleTheme = function(event) {
            const themeRing = document.getElementById('theme-ring');
            const contentArea = document.getElementById('contentArea');
            if (!themeRing || !contentArea) return;

            const btn = event.currentTarget;
            const btnRect = btn.getBoundingClientRect();
            const areaRect = contentArea.getBoundingClientRect();
            const x = (btnRect.left - areaRect.left) + btnRect.width / 2;
            const y = (btnRect.top - areaRect.top) + btnRect.height / 2;

            const defaultBgUrl = "{{ url_for('static', filename='bg.png') }}";
            const newBgUrl = "{{ url_for('static', filename='mmexport1785785172198.jpg') }}";
            const defaultTextUrl = "{{ url_for('static', filename='texture.jpg') }}";
            const newTextUrl = "{{ url_for('static', filename='mmexport1785791861411.jpg') }}";
            const textElements = document.querySelectorAll('.text-pattern');

            let isExpanded = window.__gsapExpanded || false;
            isExpanded = !isExpanded;
            window.__gsapExpanded = isExpanded;

            gsap.killTweensOf(themeRing);

            if (isExpanded) {
                themeRing.style.backgroundImage = `url("${newBgUrl}")`;
                gsap.set(themeRing, { clipPath: `circle(0% at ${x}px ${y}px)` });
                gsap.delayedCall(0.2, () => { textElements.forEach(el => { el.style.backgroundImage = `url("${newTextUrl}")`; }); });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { duration: 0.8, ease: "power2.inOut", clipPath: `circle(150% at ${x}px ${y}px)` });
            } else {
                gsap.set(themeRing, { clipPath: `circle(150% at ${x}px ${y}px)` });
                gsap.delayedCall(0.35, () => { textElements.forEach(el => { el.style.backgroundImage = `url("${defaultTextUrl}")`; }); });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { duration: 0.8, ease: "power2.inOut", clipPath: `circle(0% at ${x}px ${y}px)`, onComplete: () => { themeRing.style.backgroundImage = `url("${defaultBgUrl}")`; } });
            }
