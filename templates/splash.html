<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <!-- ✅ 引入 Tailwind CSS CDN，确保 Uiverse 样式完全一致 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button, a, input, textarea, select { outline: none; -webkit-tap-highlight-color: transparent; }
        button:focus, a:focus, input:focus { outline: none; }

        :root {
            --bg-img: url("{{ url_for('static', filename='bg.png') }}");
            --new-bg-img: url("{{ url_for('static', filename='mmexport1785785172198.jpg') }}");
        }

        body {
            width: 100vw; min-height: 100vh; overflow-y: auto; overflow-x: hidden; background-color: #000000; display: flex; flex-direction: column; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        body.loaded { opacity: 1; }

        /* 第一屏 */
        .top-image-wrapper { position: relative; width: 100vw; height: 100vh; flex-shrink: 0; z-index: 1; display: flex; justify-content: center; align-items: center; }
        .top-image { position: absolute; inset: 0; width: 100%; height: 100%; background-image: url("{{ url_for('static', filename='IMG_20260804_070056.png') }}"); background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 0; }
        .tooltip { position: relative; display: inline-block; cursor: pointer; background-color: #282828; color: #ffffff; padding: 1em 2em; border-radius: 1em; z-index: 2; box-shadow: 0 4px 15px rgba(0,0,0,0.5); user-select: none; }
        .tooltip .tooltiptext { visibility: hidden; width: 200px; background-color: #282828; color: #ffffff; text-align: center; border-radius: 6px; padding: 10px; position: absolute; z-index: 1; bottom: 125%; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
        .tooltip .tooltiptext::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -5px; border-width: 5px; border-style: solid; border-color: #282828 transparent transparent transparent; transform: translateX(-50%); }
        .top-image-footer-left { position: absolute; bottom: 5%; left: 6%; z-index: 2; color: #ffffff; text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9); font-size: 17px; line-height: 1.8; font-weight: 500; pointer-events: none; text-align: left; max-width: 45%; }
        .top-image-footer-right { position: absolute; bottom: 5%; right: 6%; z-index: 2; color: #ffffff; text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9); font-size: 17px; line-height: 1.8; font-weight: 500; pointer-events: none; text-align: right; max-width: 45%; }

        /* 第二屏 */
        .content-area { position: relative; width: 100%; min-height: 100vh; background-image: var(--bg-img); background-size: cover; background-position: center; background-repeat: no-repeat; margin-top: 0; padding-top: 15vh; padding-left: 12%; padding-bottom: 15vh; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; z-index: 1; overflow: hidden; }
        #theme-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; background-color: transparent; background-image: var(--bg-img); background-size: cover; background-position: center; background-repeat: no-repeat; clip-path: circle(0% at 0 0); will-change: clip-path, background-image; }
        .title-row { display: flex; flex-direction: row; align-items: flex-start; justify-content: flex-start; gap: 12px; position: relative; z-index: 1; margin-bottom: 4px; margin-top: 0; }
        .text-group { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; opacity: 0; transform: translateY(60px); }
        .theme-btn-title { width: 30px; height: 30px; padding: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; color: #ffffff; touch-action: manipulation; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0; transform: translateY(60px); flex-shrink: 0; margin-top: 6px; }
        .theme-btn-title:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }
        .text-pattern { color: #ffffff; background-image: url("{{ url_for('static', filename='texture.jpg') }}"); background-size: cover; background-position: center; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; text-align: left; margin: 0; letter-spacing: 8px; text-shadow: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; line-height: 1.3; padding-top: 2px; padding-bottom: 4px; }
        .main-title { font-size: 64px; }
        .sub-title { font-size: 22px; letter-spacing: 2px; font-weight: 600; }

        /* 底部 4 按钮 */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 320px; margin-top: 0; justify-items: center; opacity: 0; transform: translateY(60px); position: relative; z-index: 1; }
        .glass-btn { position: relative; padding: 14px 0; width: 90%; text-align: center; border-radius: 24px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3); color: #ffffff; font-size: 18px; font-weight: 600; cursor: pointer; letter-spacing: 1px; text-decoration: none; display: inline-block; z-index: 1; touch-action: manipulation; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .glass-btn:active { transform: scale(0.94); }
        .btn-text { position: relative; z-index: 2; color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.15); }

        /* ================= 顶部按钮 ================= */
        .top-actions {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 280px;
        }
        .top-btn {
            flex: 1; min-width: 50px; text-align: center; padding: 8px 6px; border-radius: 30px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2); color: #ffffff; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; border: none; touch-action: manipulation; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .top-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        /* 顶部按钮入场动画 */
        @keyframes slideInFromRight { 0% { opacity: 0; transform: translateX(280px); } 100% { opacity: 1; transform: translateX(0); } }
        .top-actions .top-btn { opacity: 0; animation: slideInFromRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .top-actions .top-btn:nth-child(1) { animation-delay: 0.2s; }
        .top-actions .top-btn:nth-child(2) { animation-delay: 0.4s; }
        .top-actions .top-btn:nth-child(3) { animation-delay: 0.6s; }

        /* ================= 下拉登录卡片（定位至按钮下方） ================= */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px); /* 🔽 虚化减弱 */
            -webkit-backdrop-filter: blur(3px);
            z-index: 9998;
            display: flex;
            justify-content: flex-end; /* 靠右对齐 */
            align-items: flex-start; /* 靠上对齐 */
            padding-top: 80px; /* 精准落在右上角按钮的下方 */
            padding-right: 24px;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none;
        }
        .modal-overlay.active {
            opacity: 1; visibility: visible; pointer-events: auto;
        }

        .modal-box {
            transform: translateY(-15px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        /* 手机上让卡片居中 */
        @media (max-width: 600px) {
            .top-image-footer-left, .top-image-footer-right { font-size: 13px; bottom: 4%; max-width: 45%; }
            .content-area { padding-top: 11vh; padding-left: 6%; min-height: 100vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { font-size: 15px; padding: 12px 0; border-radius: 20px; }
            .btn-grid { gap: 12px; max-width: 260px; }
            .top-actions { top: 16px; right: 16px; gap: 6px; width: 200px; }
            .top-btn { font-size: 11px; padding: 6px 4px; min-width: 40px; }
            .top-actions .top-btn { animation-duration: 0.5s; }
            .modal-overlay { padding-top: 70px; padding-right: 12px; }
        }
    </style>
</head>
<body>
    <!-- 第一屏 -->
    <div class="top-image-wrapper">
        <div class="top-image"></div>
        <div class="tooltip">正在施工中，请向上滑动<div class="tooltiptext">Hi there!</div></div>
        <div class="top-image-footer-left">
            <p>联系开发者不提供QQ了 你们太坏了</p>
            <p>刷屏笑哭表情 还发片的 你真死妈了</p>
            <p>手机建议横屏浏览 开启全图显示</p>
        </div>
        <div class="top-image-footer-right">
            <p>卡顿就挂vpn  服务器在海外</p>
        </div>
    </div>

    <!-- 第二屏 -->
    <div class="content-area" id="contentArea">
        <div id="theme-ring"></div>
        <div class="title-row">
            <div class="text-group">
                <h1 class="text-pattern main-title">宫水大世界</h1>
                <h2 class="text-pattern sub-title">Telegram Bot Editor</h2>
            </div>
            <button class="theme-btn-title" onclick="toggleTheme(event)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
        </div>
        <div class="btn-grid">
            <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">创建作品</span></a>
            <a href="/warehouse" class="glass-btn"><span class="btn-text">查看仓库</span></a>
            <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">加入社区</span></a>
            <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">AGent</span></a>
        </div>
    </div>

    <!-- 顶部按钮 -->
    <div class="top-actions">
        <a href="https://t.me/gsyxyc" class="top-btn" target="_blank">联系开发者</a>
        <a href="javascript:void(0)" onclick="toggleFullScreen()" class="top-btn">全屏显示</a>
        <!-- 下拉菜单的触发源 -->
        <button class="top-btn" id="loginBtn" onclick="openLoginModal()">Log in</button>
    </div>

    <!-- ========== 登录下拉卡片（适配 Tailwind） ========== -->
    <div class="modal-overlay" id="loginModal" onclick="closeLoginOnBg(event)">
        <div class="modal-box">
            <form class="text-neutral-800 py-6 relative overflow-hidden flex flex-col justify-start gap-4 w-80 border border-neutral-500 rounded-lg bg-neutral-50 p-4 shadow-xl">
                <!-- 发光背景特效 -->
                <div class="relative z-10 before:absolute before:w-32 before:h-20 before:right-2 before:bg-rose-300 before:-z-10 before:rounded-full before:blur-xl before:-top-12 after:absolute after:w-24 after:h-24 after:bg-purple-300 after:-z-10 after:rounded-full after:blur after:-top-12 after:-right-6 flex flex-col gap-1">
                    <span class="font-extrabold text-xl text-violet-600">登录或注册你的GsBot账号</span>
                    <p class="text-neutral-700 text-xs leading-tight">绑定邮箱账号 最快的了解所有新功能</p>
                </div>

                <!-- 第1行：邮箱 + 验证 -->
                <div class="flex gap-2 w-full relative z-10">
                    <div class="relative rounded-lg flex-1 overflow-hidden before:absolute before:w-8 before:h-8 before:content[''] before:right-0 before:bg-violet-500 before:rounded-full before:blur-lg after:absolute after:z-10 after:w-14 after:h-14 after:content[''] after:bg-rose-300 after:right-8 after:top-2 after:rounded-full after:blur-lg">
                        <input type="text" class="relative bg-transparent ring-0 outline-none border border-neutral-500 text-neutral-900 placeholder-violet-700 text-sm rounded-lg focus:ring-violet-500 placeholder-opacity-60 focus:border-violet-500 block w-full p-2.5" placeholder="邮箱" />
                    </div>
                    <button class="bg-violet-500 text-neutral-50 px-4 py-2.5 rounded-lg hover:bg-violet-400 text-sm font-medium whitespace-nowrap relative z-10">
                        验证
                    </button>
                </div>

                <!-- 第2行：验证码 与第1行等宽 -->
                <div class="relative rounded-lg w-full overflow-hidden before:absolute before:w-8 before:h-8 before:content[''] before:right-0 before:bg-violet-500 before:rounded-full before:blur-lg after:absolute after:z-10 after:w-14 after:h-14 after:content[''] after:bg-rose-300 after:right-8 after:top-2 after:rounded-full after:blur-lg relative z-10">
                    <input type="text" class="relative bg-transparent ring-0 outline-none border border-neutral-500 text-neutral-900 placeholder-violet-700 text-sm rounded-lg focus:ring-violet-500 placeholder-opacity-60 focus:border-violet-500 block w-full p-2.5" placeholder="验证码" />
                </div>

                <!-- 第3行：注册按钮 与第1行等宽 -->
                <button class="bg-violet-500 text-neutral-50 w-full p-2.5 rounded-lg hover:bg-violet-400 text-sm font-medium relative z-10">
                    注册
                </button>
            </form>
        </div>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);
        let isExpanded = false;
        const themeRing = document.getElementById('theme-ring');
        const defaultBgUrl = "{{ url_for('static', filename='bg.png') }}";
        const newBgUrl = "{{ url_for('static', filename='mmexport1785785172198.jpg') }}";
        const defaultTextUrl = "{{ url_for('static', filename='texture.jpg') }}";
        const newTextUrl = "{{ url_for('static', filename='mmexport1785791861411.jpg') }}";
        const textElements = document.querySelectorAll('.text-pattern');
        const contentArea = document.getElementById('contentArea');

        const preloadNewBg = new Image(); preloadNewBg.src = newBgUrl;
        const preloadNewText = new Image(); preloadNewText.src = newTextUrl;

        function toggleTheme(event) {
            const btn = event.currentTarget;
            const btnRect = btn.getBoundingClientRect();
            const areaRect = contentArea.getBoundingClientRect();
            const x = (btnRect.left - areaRect.left) + btnRect.width / 2;
            const y = (btnRect.top - areaRect.top) + btnRect.height / 2;

            isExpanded = !isExpanded;
            gsap.killTweensOf(themeRing);

            if (isExpanded) {
                themeRing.style.backgroundImage = `url("${newBgUrl}")`;
                gsap.set(themeRing, { clipPath: `circle(0% at ${x}px ${y}px)` });
                gsap.delayedCall(0.2, () => { textElements.forEach(el => { el.style.backgroundImage = `url("${newTextUrl}")`; }); });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { duration: 0.8, ease: "power2.inOut", clipPath: `circle(150% at ${x}px ${y}px)` });
            } else {
                gsap.set(themeRing, { clipPath: `circle(150% at ${x}px ${y}px)` });
                gsap.delayedCall(0.35, () => { textElements.forEach(el => { el.style.backgroundImage = `url("${defaultTextUrl}")`; }); });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { duration: 0.8, ease: "power2.inOut", clipPath: `circle(0% at ${x}px ${y}px)`, onComplete: () => { themeRing.style.backgroundImage = `url("${defaultBgUrl}")`; } });
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const bgImg = new Image(); const imgUrl = "{{ url_for('static', filename='bg.png') }}";
            bgImg.src = imgUrl;
            bgImg.onload = function() { document.body.classList.add('loaded'); };
            setTimeout(() => { if(!document.body.classList.contains('loaded')) { document.body.classList.add('loaded'); } }, 3000);

            gsap.set(themeRing, { clipPath: `circle(0% at 0 0)` });
            setTimeout(() => { gsap.set(themeRing, { clipPath: `circle(150% at 0 0)` }); setTimeout(() => { gsap.set(themeRing, { clipPath: `circle(0% at 0 0)` }); }, 100); }, 200);

            const tl = gsap.timeline({ scrollTrigger: { trigger: ".content-area", start: "top 85%", toggleActions: "play none none reverse" } });
            tl.to(".text-group", { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0)
              .to(".theme-btn-title", { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0)
              .to(".btn-grid", { opacity: 1, y: 0, duration: 1.2, delay: 0.2, ease: "power3.out" }, 0.2);
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } else { if (document.exitFullscreen) { document.exitFullscreen(); } }
        }

        // ================= 弹窗交互控制 =================
        function openLoginModal() {
            document.getElementById('loginModal').classList.add('active');
            document.body.style.overflow = 'hidden'; // 🔽 锁定底层滚动
        }
        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.body.style.overflow = ''; // 🔽 恢复底层滚动
        }
        function closeLoginOnBg(event) {
            if (event.target === event.currentTarget) {
                closeLoginModal();
            }
        }
    </script>
</body>
</html>
