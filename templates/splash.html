<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 12%;
            padding-top: 14vh; 
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 核心优化：直接使用纯白色，彻底告别黑色/深灰色 */
        .text-white {
            color: #ffffff;
            font-weight: 900;
            /* 渲染圆润化 */
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            /* 模拟左上方打下来的光线 */
            text-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.3),  /* 顶部受光面 */
                0 4px 20px rgba(0, 0, 0, 0.7);    /* 底部阴影，让字完全浮在图上 */
            letter-spacing: 8px;
        }

        .main-title {
            font-size: 64px;
        }

        .sub-title {
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 24px;
            margin-top: 20px;
        }

        /* 纯透明玻璃效果按钮 */
        .glass-btn {
            padding: 14px 32px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
        }

        .glass-btn:active {
            transform: scale(0.94);
        }

        /* 按钮里的文字，同样使用纯白色加光影 */
        .btn-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 600px) {
            body { padding-left: 6%; padding-top: 12vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { padding: 12px 20px; }
            .btn-text { font-size: 15px; }
            .btn-group { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="text-group">
        <h1 class="text-white main-title">宫水大世界</h1>
        <h2 class="text-white sub-title">Telegram bot编辑器</h2>
    </div>
    
    <div class="btn-group">
        <a href="#" class="glass-btn" onclick="alert('后续将跳转至创建作品页面')">
            <span class="btn-text">创建作品</span>
        </a>
        <a href="/dashboard" class="glass-btn" onclick="alert('点击了查看仓库')">
            <span class="btn-text">查看仓库</span>
        </a>
    </div>
</body>
</html>
