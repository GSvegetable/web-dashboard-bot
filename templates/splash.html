<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button, a, input, textarea, select { outline: none; -webkit-tap-highlight-color: transparent; }
        button:focus, a:focus, input:focus { outline: none; }

        :root {
            --bg-img: url("{{ url_for('static', filename='bg.png') }}");
            --new-bg-img: url("{{ url_for('static', filename='mmexport1785785172198.jpg') }}");
        }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: #000000;
            background-image: var(--bg-img);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex; flex-direction: column; align-items: flex-start;
            padding-left: 12%; padding-top: 14vh; 
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        body.loaded { opacity: 1; }

        /* 扩散/收缩遮罩层 */
        #theme-ring {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            background-color: transparent;
            background-image: var(--bg-img);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            clip-path: circle(0% at 0 0);
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1); /* 速度调整为 0.8s */
        }

        /* 顶部三连排 */
        .top-actions {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-btn {
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            display: flex; align-items: center; justify-content: center;
        }
        .top-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        .theme-btn {
            width: 34px; height: 34px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center;
            color: #ffffff;
        }
        .theme-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        /* ================= 背景模糊 (6px) ================= */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        /* ================= 纹理玻璃卡片 ================= */
        .modal-card {
            position: relative;
            background-image: url("{{ url_for('static', filename='texture.jpg') }}");
            background-size: cover; background-position: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            width: 80%; max-width: 380px;
            min-height: 280px;
            position: relative;
            overflow: hidden;
            transform: translateY(-110vh); 
        }
        .modal-card::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
            border-radius: inherit; pointer-events: none; z-index: 1;
        }
        .modal-card > * { position: relative; z-index: 2; }

        /* ================= 两根白绳子 ================= */
        #ropes-svg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 1000;
            opacity: 0;
        }

        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(80px); } 100% { opacity: 1; transform: translateY(0); } }
        .text-group { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; z-index: 1; opacity: 0; animation: slideUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .text-pattern {
            color: #ffffff; background-image: url("{{ url_for('static', filename='texture.jpg') }}"); background-size: cover; background-position: center;
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 900; text-align: left; margin: 0; letter-spacing: 8px; text-shadow: none;
            text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; line-height: 1.3; padding-top: 2px; padding-bottom: 4px;
        }
        .main-title { font-size: 64px; }
        .sub-title { font-size: 22px; letter-spacing: 2px; font-weight: 600; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 320px; z-index: 1; opacity: 0; margin-top: 20px; animation: slideUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; justify-items: center; }

        .glass-btn {
            position: relative; padding: 14px 0; width: 90%; text-align: center; border-radius: 24px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            color: #ffffff; font-size: 18px; font-weight: 600;
            cursor: pointer; letter-spacing: 1px; text-decoration: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); display: inline-block; z-index: 1;
        }
        .glass-btn:active { transform: scale(0.94); }
        .btn-text { position: relative; z-index: 2; color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.15); }

        @media (max-width: 600px) {
            body { padding-left: 6%; padding-top: 20vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { font-size: 15px; padding: 12px 0; border-radius: 20px; }
            .btn-grid { gap: 12px; max-width: 260px; }
            .top-actions { top: 16px; right: 16px; gap: 8px; }
            .top-btn { font-size: 12px; padding: 6px 14px; }
            .theme-btn { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>
    <div id="theme-ring"></div>

    <div class="top-actions">
        <a href="javascript:void(0)" onclick="toggleFullScreen()" class="top-btn">全屏显示</a>
        <button class="top-btn" onclick="openLoginModal()">Log in</button>
        <button class="theme-btn" onclick="toggleTheme(event)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
        </button>
    </div>

    <svg id="ropes-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path id="rope-l" d="M 0 0 Q 15 30, 10 40" fill="none" stroke="white" stroke-width="0.5"/>
        <path id="rope-r" d="M 100 0 Q 85 30, 90 40" fill="none" stroke="white" stroke-width="0.5"/>
    </svg>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-card" id="modal-card">
        </div>
    </div>

    <div class="text-group">
        <h1 class="text-pattern main-title">宫水大世界</h1>
        <h2 class="text-pattern sub-title">Telegram bot编辑器</h2>
    </div>
    
    <div class="btn-grid">
        <a href="/create" class="glass-btn"><span class="btn-text">创建作品</span></a>
        <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">查看仓库</span></a>
        <a href="https://t.me/gsyxyc" class="glass-btn" target="_blank"><span class="btn-text">联系开发者</span></a>
        <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">加入社区</span></a>
    </div>

    <script>
        let isDefaultBg = true;
        const themeRing = document.getElementById('theme-ring');
        const defaultBgUrl = "{{ url_for('static', filename='bg.png') }}";
        const newBgUrl = "{{ url_for('static', filename='mmexport1785785172198.jpg') }}";

        // ================= 完美拆分的扩出与收回动画 =================
        function toggleTheme(event) {
            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            if (isDefaultBg) {
                // 1. 扩出去（切到新图）
                themeRing.style.transition = 'none';
                themeRing.style.backgroundImage = `url("${newBgUrl}")`;
                themeRing.style.clipPath = `circle(0% at ${x}px ${y}px)`;

                requestAnimationFrame(() => {
                    themeRing.style.transition = 'clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                    themeRing.style.clipPath = `circle(150% at ${x}px ${y}px)`;
                });
                isDefaultBg = false;
            } else {
                // 2. 收回来（切回原图，动画反向执行）
                themeRing.style.transition = 'none';
                themeRing.style.backgroundImage = `url("${defaultBgUrl}")`;
                themeRing.style.clipPath = `circle(150% at ${x}px ${y}px)`;

                requestAnimationFrame(() => {
                    themeRing.style.transition = 'clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                    themeRing.style.clipPath = `circle(0% at ${x}px ${y}px)`;
                });
                isDefaultBg = true;
            }
        }

        // ================= 登录弹窗逻辑（原封不动） =================
        function openLoginModal() {
            const overlay = document.getElementById('loginModal');
            const card = document.getElementById('modal-card');
            const ropeL = document.getElementById('rope-l');
            const ropeR = document.getElementById('rope-r');
            const ropesContainer = document.getElementById('ropes-svg');

            const leftX = 10;
            const rightX = 90;
            const targetY = 15; 

            const curvedL = `M ${leftX} 0 Q ${leftX - 10} ${targetY * 0.8}, ${leftX} ${targetY}`;
            const curvedR = `M ${rightX} 0 Q ${rightX + 10} ${targetY * 0.8}, ${rightX} ${targetY}`;
            const straightL = `M ${leftX} 0 L ${leftX} ${targetY}`;
            const straightR = `M ${rightX} 0 L ${rightX} ${targetY}`;

            overlay.classList.add('active');
            ropesContainer.style.opacity = '1';
            
            gsap.set(card, { y: '-100vh', rotation: 0, x: 0 });
            gsap.set(ropeL, { attr: { d: curvedL } });
            gsap.set(ropeR, { attr: { d: curvedR } });

            const tl = gsap.timeline();
            tl.to(card, { y: 0, x: 15, rotation: 3, duration: 1.2, ease: "bounce.out" }, 0)
            .to(card, { x: -10, rotation: -2, duration: 0.6, ease: "power2.out" }, 1.2)
            .to(card, { x: 0, rotation: 0, duration: 0.4, ease: "power2.out" }, 1.8);

            tl.to(ropeL, { attr: { d: straightL }, duration: 1.6, ease: "power2.inOut" }, 0)
            .to(ropeR, { attr: { d: straightR }, duration: 1.6, ease: "power2.inOut" }, 0);
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('ropes-svg').style.opacity = '0';
        }

        document.getElementById('loginModal').addEventListener('click', function(e) { 
            if (e.target === this) { closeLoginModal(); } 
        });

        document.addEventListener("DOMContentLoaded", function() {
            const bgImg = new Image();
            const imgUrl = "{{ url_for('static', filename='bg.png') }}";
            bgImg.src = imgUrl;
            bgImg.onload = function() { document.body.classList.add('loaded'); };
            setTimeout(() => {
                if(!document.body.classList.contains('loaded')) { document.body.classList.add('loaded'); }
            }, 3000);
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }
    </script>
</body>
</html>
