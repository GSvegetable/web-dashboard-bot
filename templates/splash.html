<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宫水大世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 顶部导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .logo {
            font-weight: 800;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .nav-links a:hover { opacity: 1; }

        /* 开始探索按钮：深绿棕色渐变 + 玻璃质感 */
        .btn-capsule {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(147, 150, 95, 0.8), rgba(73, 63, 54, 0.8), rgba(245, 230, 207, 0.8));
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            font-size: 15px;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: inset 0px 0px 5px rgba(255, 255, 255, 0.6), inset 0px 35px 30px rgba(0, 0, 0, 0.8), 0px 5px 10px rgba(0, 0, 0, 0.7);
            text-shadow: 1px 1px 1px #000;
        }
        .btn-capsule:hover {
            filter: brightness(1.2);
        }

        /* 主内容区 */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: relative;
        }

        /* 左侧文字 */
        .hero-text {
            max-width: 700px;
        }
        .hero-subtitle {
            font-size: 16px;
            letter-spacing: 5px;
            color: #8b2fc9;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.9;
            font-weight: 600;
        }

        /* 中间大字：放大 + 圆润 + 英文副标题 */
        .hero-title {
            font-size: 80px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 12px;
            letter-spacing: -2px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
            font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "PingFang SC", sans-serif;
        }
        .hero-title span {
            color: #8b2fc9;
        }
        .hero-english {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
        }

        .hero-bottom {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        }
        .hero-bottom .arrow {
            font-size: 20px;
            color: #8b2fc9;
        }

        /* 右侧留白 */
        .hero-image {
            flex: 1;
            max-width: 400px;
            height: 400px;
        }

        /* 丝滑入场动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar { padding: 8px 20px; }
            .nav-links { display: none; }
            .hero { padding: 0 20px; flex-direction: column; justify-content: center; text-align: left; }
            .hero-title { font-size: 52px; }
            .hero-english { font-size: 16px; }
            .hero-image { display: none; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="logo">宫水大世界</div>
        <div class="nav-links">
            <a href="#">作品</a>
            <a href="#">服务</a>
            <a href="#">理念</a>
            <a href="#">联系</a>
        </div>
        <a href="/workspace" class="btn-capsule">开始探索</a>
    </nav>

    <!-- 主内容 -->
    <section class="hero">
        <div class="hero-text">
            <div class="hero-subtitle">宫水大世界</div>
            <h1 class="hero-title">将创意<br><span>变为现实</span></h1>
            <div class="hero-english">From Idea to Reality</div>
            <div class="hero-bottom">
                <span>我们的愿景</span>
                <span class="arrow">→</span>
            </div>
        </div>
        
        <!-- 右侧留白区，鸟先留着空位 -->
        <div class="hero-image"></div>
    </section>

</body>
</html>
