<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宫水大世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==================== 顶部导航栏 ==================== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .logo { font-weight: 800; font-size: 24px; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 1; }

        /* ==================== 玻璃质感按钮 ==================== */
        .btn-glass {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 999px;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), inset 0 -1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 2.2);
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.02);
        }

        /* ==================== 主内容区 ==================== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: relative;
        }
        .hero-text { max-width: 700px; }

        /* ✅ 高级数字营销解决方案：改成白色，去掉紫色 */
        .hero-subtitle {
            font-size: 14px;
            letter-spacing: 5px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 1s ease 0.1s forwards;
        }

        /* ==================== 大标题：保证永远可见 ==================== */
        .hero-title {
            font-size: 80px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 0;
            letter-spacing: -1px;
        }
        
        /* 深绿黑渐变，直接作用于整块文字，保证渲染 */
        .line {
            display: block;
            color: transparent;
            background: linear-gradient(90deg, #93965F, #493F36, #000000);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(30px);
            animation: lineUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            /* 增加一点点发光效果，防止黑字在黑背景上看不清 */
            filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.2));
        }
        .line-1 { animation-delay: 0.2s; }
        .line-2 { animation-delay: 0.5s; }

        .hero-image { flex: 1; max-width: 400px; height: 400px; }

        /* ==================== 动画定义 ==================== */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes lineUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .navbar { padding: 10px 20px; }
            .nav-links { display: none; }
            .hero { padding: 0 20px; flex-direction: column; justify-content: center; text-align: left; }
            .hero-title { font-size: 48px; }
            .hero-image { display: none; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="logo">宫水大世界</div>
        <div class="nav-links">
            <a href="#">作品</a>
            <a href="#">服务</a>
            <a href="#">理念</a>
            <a href="#">联系</a>
        </div>
        <a href="/workspace" class="btn-glass">开始探索</a>
    </nav>

    <!-- 主内容 -->
    <section class="hero">
        <div class="hero-text">
            <div class="hero-subtitle">高级数字营销解决方案</div>
            <!-- ✅ 两行字直接显示，线条动画从下往上滑入，不再拆字，绝对可见 -->
            <h1 class="hero-title">
                <span class="line line-1">将创意</span>
                <span class="line line-2">变为现实</span>
            </h1>
            <!-- ✅ 删除了“我们的愿景” -->
        </div>
        
        <!-- 右侧留白区，鸟先留着空位 -->
        <div class="hero-image"></div>
    </section>

</body>
</html>
