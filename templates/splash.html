<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button, a, input, textarea, select { outline: none; -webkit-tap-highlight-color: transparent; }
        button:focus, a:focus, input:focus { outline: none; }

        :root {
            --bg-img: url("{{ url_for('static', filename='bg.png') }}");
        }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: #000000;
            background-image: var(--bg-img);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex; flex-direction: column; align-items: flex-start;
            padding-left: 12%; 
            padding-top: 14vh; 
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        body.loaded { opacity: 1; }

        .top-login-btn {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            padding: 8px 20px; border-radius: 30px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            color: #ffffff; font-size: 14px; font-weight: 500; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .top-login-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        /* ================= 修正：纯透玻璃弹窗 ================= */
        .modal-overlay {
            position: fixed; inset: 0;
            /* 背景用极深色，负责模糊底图 */
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 999; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            /* 【核心修复】去掉它自己的模糊滤镜，只让底图模糊透上来 */
            background: rgba(255, 255, 255, 0.08); /* 非常浅的半透明白色 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            
            /* 尺寸和位置 */
            width: 80%; max-width: 380px;
            min-height: 260px;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .modal-overlay.active .modal-card { transform: scale(1) translateY(0); }
        /* ====================================================== */

        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(80px); } 100% { opacity: 1; transform: translateY(0); } }
        .text-group { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; opacity: 0; animation: slideUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .text-pattern {
            color: #ffffff; background-image: url("{{ url_for('static', filename='texture.jpg') }}"); background-size: cover; background-position: center;
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 900; text-align: left; margin: 0; letter-spacing: 8px; text-shadow: none;
            text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; line-height: 1.3; padding-top: 2px; padding-bottom: 4px;
        }
        .main-title { font-size: 64px; }
        .sub-title { font-size: 22px; letter-spacing: 2px; font-weight: 600; }

        .btn-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            width: 100%; max-width: 320px;
            opacity: 0; margin-top: 20px;
            animation: slideUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
            justify-items: center;
        }

        .glass-btn {
            position: relative;
            padding: 14px 0; 
            width: 90%; 
            text-align: center;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 18px; font-weight: 600;
            cursor: pointer; letter-spacing: 1px; text-decoration: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
            z-index: 1;
        }
        .glass-btn:active { transform: scale(0.94); }
        .btn-text { position: relative; z-index: 2; color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.15); }

        @media (max-width: 600px) {
            body { padding-left: 6%; padding-top: 20vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { font-size: 15px; padding: 12px 0; border-radius: 20px; }
            .btn-grid { gap: 12px; max-width: 260px; }
            .top-login-btn { top: 16px; right: 16px; padding: 6px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <button class="top-login-btn" onclick="openLoginModal()">Log in</button>

    <!-- 玻璃空弹窗 -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-card"></div>
    </div>

    <div class="text-group">
        <h1 class="text-pattern main-title">宫水大世界</h1>
        <h2 class="text-pattern sub-title">Telegram bot编辑器</h2>
    </div>
    
    <div class="btn-grid">
        <a href="/create" class="glass-btn">
            <span class="btn-text">创建作品</span>
        </a>
        <a href="javascript:void(0);" class="glass-btn">
            <span class="btn-text">查看仓库</span>
        </a>
        <a href="tg://resolve?domain=gsyxyc" class="glass-btn">
            <span class="btn-text">联系开发者</span>
        </a>
        <a href="javascript:void(0)" onclick="toggleFullScreen()" class="glass-btn">
            <span class="btn-text">全屏显示</span>
        </a>
    </div>

    <script>
        function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }
        document.getElementById('loginModal').addEventListener('click', function(e) { 
            if (e.target === this) { closeLoginModal(); } 
        });

        document.addEventListener("DOMContentLoaded", function() {
            const bgImg = new Image();
            const imgUrl = "{{ url_for('static', filename='bg.png') }}";
            bgImg.src = imgUrl;
            bgImg.onload = function() { document.body.classList.add('loaded'); };
            setTimeout(function() {
                if(!document.body.classList.contains('loaded')) { document.body.classList.add('loaded'); }
            }, 3000);
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
