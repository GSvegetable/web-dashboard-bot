<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宫水大世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 顶部导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .logo { font-weight: 800; font-size: 24px; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 1; }

        /* 玻璃按钮 */
        .btn-glass {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 999px;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), inset 0 -1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 2.2);
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.02);
        }

        /* 主内容区：往上抬 */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: relative;
            margin-top: -10vh;
        }
        .hero-text { max-width: 700px; }

        /* 大标题样式 */
        .hero-title {
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.3;
        }

        /* 每一行动画：完全同步上移 + 从左往右展开，速度放慢 */
        .line {
            display: block;
            color: transparent;
            background: linear-gradient(90deg, #93965F, #493F36, #000000);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.2));
            
            /* 初始状态：向上偏移 + 左侧隐藏 */
            opacity: 0;
            transform: translateY(50px);
            clip-path: inset(0 100% 0 0); /* 隐藏右侧 */
            
            /* ✅ 核心修改：两个动画同时进行，时长拉长到 2.5s */
            animation: revealAndRise 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* 第一行英文稍小 */
        .line-1 { font-size: 30px; animation-delay: 0.2s; }
        .line-2 { font-size: 88px; animation-delay: 0.55s; }

        /* ✅ 核心修改：一个动画同时完成上移和展开 */
        @keyframes revealAndRise {
            0% {
                opacity: 0;
                transform: translateY(50px);
                clip-path: inset(0 100% 0 0);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                clip-path: inset(0 0% 0 0);
            }
        }

        .hero-image { flex: 1; max-width: 400px; height: 400px; }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar { padding: 10px 20px; }
            .nav-links { display: none; }
            .hero { padding: 0 20px; flex-direction: column; justify-content: center; text-align: left; margin-top: -8vh; }
            .line-1 { font-size: 20px; }
            .line-2 { font-size: 48px; }
            .hero-image { display: none; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="logo">宫水大世界</div>
        <div class="nav-links">
            <a href="#">作品</a>
            <a href="#">服务</a>
            <a href="#">理念</a>
            <a href="#">联系</a>
        </div>
        <a href="/workspace" class="btn-glass">开始探索</a>
    </nav>

    <!-- 主内容 -->
    <section class="hero">
        <div class="hero-text">
            <h1 class="hero-title">
                <!-- ✅ 英文保留 -->
                <span class="line line-1">Professional Telegram bot development services.</span>
                <!-- ✅ 中文改成 创作 搭建 部署 -->
                <span class="line line-2">创作 搭建 部署</span>
            </h1>
        </div>
        <!-- 右侧留白 -->
        <div class="hero-image"></div>
    </section>
</body>
</html>
