<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页 - 极简测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000; width: 100vw; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #ffffff;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        .btn-group { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px; padding: 20px; border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; }
        .btn-group h2 { text-align: center; color: #e5e7eb; margin-bottom: 10px; font-weight: 600; }
        .btn {
            width: 100%; padding: 15px 0; border-radius: 30px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff; font-size: 18px; font-weight: 500; cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.15); }
        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #f3f4f6; padding: 10px 24px; border-radius: 8px; display: none; border-left: 4px solid #22c55e; }
        #toast.error { border-left-color: #ef4444; }
    </style>
</head>
<body>

    <!-- 第一屏 -->
    <h1 style="font-size: 2rem; margin-bottom: 20px;">宫水大世界</h1>

    <!-- 测试用的按钮组 -->
    <div class="btn-group">
        <h2>原生测试按钮</h2>
        <!-- 全部使用原生 onclick -->
        <button class="btn" onclick="window.testTheme()">1. 切换主题按钮</button>
        <button class="btn" onclick="window.testFullscreen()">2. 全屏显示按钮</button>
        <button class="btn" onclick="window.testLogin()">3. Log in 按钮</button>
        <button class="btn" onclick="window.testMusic()">4. 音乐按钮</button>
    </div>

    <div id="toast">测试提示</div>

    <script>
        // 极度精简，全部挂载在 window 上
        function showToast(msg, isError=false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = isError ? 'error' : '';
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        window.testTheme = function() {
            showToast("✅ 切换主题按钮被正常点击！");
        };
        window.testFullscreen = function() {
            showToast("✅ 全屏按钮被正常点击！");
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } else { if (document.exitFullscreen) { document.exitFullscreen(); } }
        };
        window.testLogin = function() {
            showToast("✅ 登录按钮被正常点击！");
        };
        window.testMusic = function() {
            showToast("✅ 音乐按钮被正常点击！");
        };
    </script>
</body>
</html>
