<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宫水大世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==================== 顶部导航栏 ==================== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .logo { font-weight: 800; font-size: 24px; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 1; }

        /* 玻璃按钮 */
        .btn-glass {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 999px;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), inset 0 -1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 2.2);
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.02);
        }

        /* ==================== 第一屏：Hero 区 ==================== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: relative;
            margin-top: -10vh;
        }
        .hero-text { max-width: 700px; }

        .hero-title {
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.3;
        }

        /* 大标题动画：上移 + 从左往右展开 */
        .line {
            display: block;
            color: transparent;
            background: linear-gradient(90deg, #93965F, #493F36, #000000);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.2));
            opacity: 0;
            transform: translateY(50px);
            clip-path: inset(0 100% 0 0);
            animation: revealAndRise 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .line-1 { font-size: 30px; animation-delay: 0.2s; }
        .line-2 { font-size: 88px; animation-delay: 0.55s; }

        @keyframes revealAndRise {
            0% { opacity: 0; transform: translateY(50px); clip-path: inset(0 100% 0 0); }
            100% { opacity: 1; transform: translateY(0); clip-path: inset(0 0% 0 0); }
        }

        .hero-image { flex: 1; max-width: 400px; height: 400px; }

        /* ==================== 第二屏：卡片滚动区域 ==================== */
        .cards-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 1000px;
            width: 100%;
        }

        .white-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            height: 220px;
            box-shadow: 0 20px 60px rgba(255,255,255,0.1);
            opacity: 0;
            will-change: transform, opacity;
        }

        .white-card h3 {
            color: #000000;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .white-card p {
            color: #333333;
            font-size: 14px;
            line-height: 1.6;
        }

        /* 初始偏移位置 */
        .card-left { transform: translateX(-120px); }
        .card-right { transform: translateX(120px); }
        .card-center { transform: translateY(80px); }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar { padding: 10px 20px; }
            .nav-links { display: none; }
            .hero { padding: 0 20px; flex-direction: column; justify-content: center; text-align: left; margin-top: -8vh; }
            .line-1 { font-size: 20px; }
            .line-2 { font-size: 48px; }
            .hero-image { display: none; }
            .cards-grid { grid-template-columns: 1fr; gap: 16px; }
            .white-card { height: auto; padding: 24px; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="logo">宫水大世界</div>
        <div class="nav-links">
            <a href="#">作品</a>
            <a href="#">服务</a>
            <a href="#">理念</a>
            <a href="#">联系</a>
        </div>
        <a href="/workspace" class="btn-glass">开始探索</a>
    </nav>

    <!-- 第一屏：Hero -->
    <section class="hero">
        <div class="hero-text">
            <h1 class="hero-title">
                <span class="line line-1">Professional Telegram bot<br>development services.</span>
                <span class="line line-2">创作 搭建 部署</span>
            </h1>
        </div>
        <div class="hero-image"></div>
    </section>

    <!-- 第二屏：滚动时卡片横向滑入 -->
    <section class="cards-section" id="cardsSection">
        <div class="cards-grid">
            <div class="white-card card-left" id="card1">
                <h3>一键部署</h3>
                <p>无需编写代码，几分钟内完成Telegram机器人部署，自动处理服务器配置。</p>
            </div>
            <div class="white-card card-center" id="card2">
                <h3>功能扩展</h3>
                <p>轻松添加自动回复、按钮菜单、支付系统、社区功能，让机器人更具商业价值。</p>
            </div>
            <div class="white-card card-right" id="card3">
                <h3>安全托管</h3>
                <p>专业级服务器托管，实时监控，数据加密，确保机器人24小时稳定运行。</p>
            </div>
        </div>
    </section>

    <!-- 核心逻辑：滚动时实时控制卡片滑入/缩回 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const section = document.getElementById('cardsSection');
            const cards = [
                document.getElementById('card1'),
                document.getElementById('card2'),
                document.getElementById('card3')
            ];

            window.addEventListener('scroll', function() {
                // 获取视口相对于 section 顶部的距离
                const rect = section.getBoundingClientRect();
                const viewportHeight = window.innerHeight;
                
                // 计算 section 进入视口的比例（0 表示刚开始进入，1 表示完全进入）
                // 使用 min + max 限制在 0 到 1 之间
                const progress = Math.min(1, Math.max(0, (viewportHeight - rect.top) / (viewportHeight * 0.8)));
                
                // 为每张卡设置不同的进度偏移，产生交错效果
                const offset1 = Math.max(0, Math.min(1, (progress - 0.1) / 0.8));
                const offset2 = Math.max(0, Math.min(1, (progress - 0.25) / 0.8));
                const offset3 = Math.max(0, Math.min(1, (progress - 0.4) / 0.8));

                // 卡片1：从左往右滑入
                cards[0].style.transform = `translateX(${-120 * (1 - offset1)}px)`;
                cards[0].style.opacity = offset1;

                // 卡片2：从下方往上滑入
                cards[1].style.transform = `translateY(${80 * (1 - offset2)}px)`;
                cards[1].style.opacity = offset2;

                // 卡片3：从右往左滑入
                cards[2].style.transform = `translateX(${120 * (1 - offset3)}px)`;
                cards[2].style.opacity = offset3;
            });
        });
    </script>
</body>
</html>
