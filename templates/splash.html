<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 12%;
            padding-top: 14vh; 
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 同一套光源效果：左上角打下来的淡灰色渐变 */
        .gradient-text {
            font-weight: 900; /* 加粗 */
            background: linear-gradient(135deg, #ffffff 20%, #d9d9d9 100%); /* 光效减弱，渐变末端偏浅灰 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            text-shadow: none; /* 外部阴影去掉，只靠内部渐变 */
            letter-spacing: 8px;
        }

        /* 主标题：放大 */
        .main-title {
            font-size: 64px; /* 字再放大 */
        }

        /* 副标题：继承同样的光效，字号小所以光自然更淡 */
        .sub-title {
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* 按钮组：离字体稍微近一点 */
        .btn-group {
            display: flex;
            gap: 24px;
            margin-top: 30px; /* 稍微往上移 */
        }

        /* 纯透明玻璃效果按钮 */
        .glass-btn {
            padding: 14px 32px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
        }

        .glass-btn:active {
            transform: scale(0.94);
        }

        @media (max-width: 600px) {
            body { padding-left: 6%; padding-top: 12vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { padding: 12px 20px; font-size: 15px; }
            .btn-group { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="text-group">
        <h1 class="gradient-text main-title">宫水大世界</h1>
        <h2 class="gradient-text sub-title">Telegram bot编辑器</h2>
    </div>
    
    <div class="btn-group">
        <a href="#" class="glass-btn" onclick="alert('后续将跳转至创建作品页面')">创建作品</a>
        <a href="/dashboard" class="glass-btn" onclick="alert('点击了查看仓库')">查看仓库</a>
    </div>
</body>
</html>
