<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宫水大世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000 !important;
            color: #ffffff;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 顶部导航栏 */
        .navbar { position: fixed; top: 0; width: 100%; padding: 10px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-weight: 800; font-size: 24px; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 1; }

        /* 玻璃按钮 */
        .btn-glass { display: inline-block; padding: 12px 30px; border-radius: 999px; color: #ffffff; font-weight: 600; text-decoration: none; font-size: 14px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px) saturate(160%); -webkit-backdrop-filter: blur(12px) saturate(160%); border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), inset 0 -1px 1px rgba(255, 255, 255, 0.1); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 2.2); }
        .btn-glass:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.5); transform: scale(1.02); }

        /* 第一屏 Hero */
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: relative; margin-top: -10vh; }
        .hero-text { max-width: 700px; }
        .hero-title { font-weight: 900; letter-spacing: -1px; line-height: 1.3; }

        /* 大标题动画 */
        .line { display: block; color: transparent; background: linear-gradient(90deg, #93965F, #493F36, #000000); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.2)); opacity: 0; transform: translateY(50px); -webkit-mask-image: linear-gradient(to right, transparent 0%, black 40%); mask-image: linear-gradient(to right, transparent 0%, black 40%); -webkit-mask-size: 0% 100%; mask-size: 0% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: left center; mask-position: left center; animation: riseAndReveal 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .line-1 { font-size: 30px; animation-delay: 0.2s; }
        .line-2 { font-size: 88px; animation-delay: 0.55s; }
        @keyframes riseAndReveal { 0% { opacity: 0; transform: translateY(50px); -webkit-mask-size: 0% 100%; mask-size: 0% 100%; } 100% { opacity: 1; transform: translateY(0); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; } }

        .hero-image { flex: 1; max-width: 400px; height: 400px; }

        /* 第二屏：卡片区域 */
        .cards-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 60px 40px; margin-top: -30vh; }

        /* 固定网格：间距永远32px，绝对不变 */
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; max-width: 1000px; width: 100%; }

        /* 卡片基础样式 */
        .card-item {
            position: relative;
            border-radius: 16px;
            padding: 32px;
            height: 220px;
            box-shadow: 0 20px 60px rgba(255,255,255,0.1);
            opacity: 0;
            overflow: hidden;
        }
        /* 背景层：模糊图片 */
        .card-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            filter: blur(5px);
            transform: scale(1.1);
            z-index: 0;
        }
        /* 文字层 */
        .card-item h3, .card-item p {
            position: relative;
            z-index: 1;
        }

        /* 初始位置：从不同方向准备好 */
        .card-left { transform: translateX(-120px); }
        .card-center { transform: translateY(80px); }
        .card-right { transform: translateX(120px); }

        @media (max-width: 768px) {
            .navbar { padding: 10px 20px; }
            .nav-links { display: none; }
            .hero { padding: 0 20px; flex-direction: column; justify-content: center; text-align: left; margin-top: -8vh; }
            .line-1 { font-size: 20px; }
            .line-2 { font-size: 48px; }
            .hero-image { display: none; }
            .cards-grid { grid-template-columns: 1fr; gap: 16px; }
            .cards-section { margin-top: -20vh; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="logo">宫水大世界</div>
        <div class="nav-links">
            <a href="#">作品</a>
            <a href="#">服务</a>
            <a href="#">理念</a>
            <a href="#">联系</a>
        </div>
        <a href="/workspace" class="btn-glass">开始探索</a>
    </nav>

    <!-- 第一屏 Hero -->
    <section class="hero">
        <div class="hero-text">
            <h1 class="hero-title">
                <span class="line line-1">Professional Telegram bot<br>development services.</span>
                <span class="line line-2">创作 搭建 部署</span>
            </h1>
        </div>
        <div class="hero-image"></div>
    </section>

    <!-- 第二屏：卡片区域（从左、下、右合拢） -->
    <section class="cards-section" id="cardsSection">
        <div class="cards-grid">
            <div class="card-item card-left" id="card1" style="background-image: url('{{ url_for('static', filename='IMG_20260823_011449.png') }}');">
                <h3 style="color: #000000 !important; font-size: 18px; font-weight: 700; margin-bottom: 12px; text-shadow: 2px 2px 4px rgba(255,255,255,0.8);">一键部署</h3>
                <p style="color: #000000 !important; font-size: 14px; line-height: 1.6; text-shadow: 1px 1px 3px rgba(255,255,255,0.8);">无需编写代码，几分钟内完成Telegram机器人部署，自动处理服务器配置。</p>
            </div>
            <div class="card-item card-center" id="card2" style="background-image: url('{{ url_for('static', filename='IMG_20260823_011541.png') }}');">
                <h3 style="color: #000000 !important; font-size: 18px; font-weight: 700; margin-bottom: 12px; text-shadow: 2px 2px 4px rgba(255,255,255,0.8);">功能扩展</h3>
                <p style="color: #000000 !important; font-size: 14px; line-height: 1.6; text-shadow: 1px 1px 3px rgba(255,255,255,0.8);">轻松添加自动回复、按钮菜单、支付系统、社区功能，让机器人更具商业价值。</p>
            </div>
            <div class="card-item card-right" id="card3" style="background-image: url('{{ url_for('static', filename='IMG_20260823_011604.png') }}');">
                <h3 style="color: #000000 !important; font-size: 18px; font-weight: 700; margin-bottom: 12px; text-shadow: 2px 2px 4px rgba(255,255,255,0.8);">安全托管</h3>
                <p style="color: #000000 !important; font-size: 14px; line-height: 1.6; text-shadow: 1px 1px 3px rgba(255,255,255,0.8);">专业级服务器托管，实时监控，数据加密，确保机器人24小时稳定运行。</p>
            </div>
        </div>
    </section>

    <!-- 滚动逻辑：左右下三种方向滑入，阻尼感强，保证最终全对齐 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const section = document.getElementById('cardsSection');
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');
            const card3 = document.getElementById('card3');

            // 阻尼缓动：easeOutCubic，先快后慢，阻尼感明显
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            window.addEventListener('scroll', function() {
                const rect = section.getBoundingClientRect();
                const viewportHeight = window.innerHeight;
                
                // 滚动足够长距离，让动画慢慢展开
                const baseProgress = Math.min(1, Math.max(0, (viewportHeight - rect.top) / (viewportHeight * 1.2)));
                
                // 将 baseProgress 先做阻尼处理，再分流给三张卡片
                const easedProgress = easeOutCubic(baseProgress);

                // 三张卡片按顺序依次合拢，但都要在完全展开时归位
                const offset1 = Math.max(0, Math.min(1, (easedProgress - 0.05) / 0.9));
                const offset2 = Math.max(0, Math.min(1, (easedProgress - 0.15) / 0.9));
                const offset3 = Math.max(0, Math.min(1, (easedProgress - 0.25) / 0.9));

                // 左卡片：从左边滑入
                card1.style.transform = `translateX(${-120 * (1 - offset1)}px)`;
                card1.style.opacity = offset1;

                // 中间卡片：从下方滑入
                card2.style.transform = `translateY(${80 * (1 - offset2)}px)`;
                card2.style.opacity = offset2;

                // 右卡片：从右边滑入
                card3.style.transform = `translateX(${120 * (1 - offset3)}px)`;
                card3.style.opacity = offset3;
            });
        });
    </script>
</body>
</html>
