<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 12%;
            padding-top: 12vh; 
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .main-title {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 6px;
        }

        .sub-title {
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.7);
        }

        .btn-group {
            display: flex;
            gap: 24px;
            margin-top: 50px;
        }

        /* 加了一点点高光折射的玻璃按钮 */
        .glass-btn {
            padding: 14px 32px;
            border-radius: 40px;
            /* 底透底色 + 左上角极细微的白色光晕折射 */
            background: rgba(255, 255, 255, 0.03);
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 30%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* 内发光外发光，强化玻璃边缘反光 */
            box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.4), 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
        }

        .glass-btn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 600px) {
            body { padding-left: 6%; padding-top: 10vh; }
            .main-title { font-size: 34px; letter-spacing: 2px; }
            .sub-title { font-size: 16px; }
            .glass-btn { padding: 12px 20px; font-size: 15px; }
            .btn-group { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="text-group">
        <h1 class="main-title">宫水大世界</h1>
        <h2 class="sub-title">Telegram bot编辑器</h2>
    </div>
    
    <div class="btn-group">
        <a href="#" class="glass-btn" onclick="alert('后续将跳转至创建作品页面')">创建作品</a>
        <a href="/dashboard" class="glass-btn" onclick="alert('点击了查看仓库')">查看仓库</a>
    </div>
</body>
</html>
