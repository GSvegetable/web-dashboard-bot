<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 10%; /* 左上偏中间留白 */
            padding-top: 10vh;
        }

        /* 标题文字：宫水大世界 */
        .main-title {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            /* 纯白色带一点点灰色渐变 */
            background: linear-gradient(135deg, #ffffff 0%, #c0c0c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); /* 增加文字的层次感 */
        }

        /* 副标题文字：Telegram bot编辑器 */
        .sub-title {
            font-size: 24px; /* 主标题的一半 */
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 40px;
            /* 继承一样的渐变 */
            background: linear-gradient(135deg, #ffffff 0%, #c0c0c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* 底部双按钮（左右排列） */
        .btn-group {
            display: flex;
            gap: 20px;
        }

        /* 苹果同款玻璃按钮核心样式 */
        .glass-btn {
            padding: 14px 32px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.15);
            /* 核心玻璃折射与模糊扭曲效果 */
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            /* 玻璃反光质感 */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
            display: inline-block; /* 确保a标签行为正常 */
        }

        /* 点击：轻微果冻回弹反馈 */
        .glass-btn:active {
            transform: scale(0.94); /* 轻微按下去的尺度 */
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* 手机端适配 */
        @media (max-width: 600px) {
            body { padding-left: 8%; padding-top: 15vh; }
            .main-title { font-size: 36px; }
            .sub-title { font-size: 18px; }
            .glass-btn { padding: 12px 24px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <h1 class="main-title">宫水大世界</h1>
    <h2 class="sub-title">Telegram bot编辑器</h2>
    
    <div class="btn-group">
        <a href="#" class="glass-btn" onclick="alert('后续将跳转至创建作品页面')">创建作品</a>
        <a href="/dashboard" class="glass-btn" onclick="alert('点击了查看仓库')">查看仓库</a>
    </div>
</body>
</html>
