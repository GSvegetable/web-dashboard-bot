<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宫水大世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==================== 顶部导航栏 ==================== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .logo { font-weight: 800; font-size: 24px; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 1; }

        /* ==================== 玻璃质感按钮 ==================== */
        .btn-glass {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 999px;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), inset 0 -1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 2.2);
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.02);
        }

        /* ==================== 主内容区 ==================== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: relative;
        }
        .hero-text { max-width: 700px; }
        .hero-subtitle {
            font-size: 14px;
            letter-spacing: 5px;
            color: #a04ee0;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 1s ease 0.1s forwards;
        }

        /* ==================== 核心修改：大标题效果 ==================== */
        .hero-title {
            font-size: 80px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        /* 每行的外层容器（快动画，先整行出现） */
        .title-row {
            display: block;
            opacity: 0;
            filter: blur(4px);
            animation: lineIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .title-row:nth-child(1) { animation-delay: 0.1s; }
        .title-row:nth-child(2) { animation-delay: 0.45s; }

        /* ✅ 深绿黑渐变（完全照搬首页按钮配色） */
        .gradient-text {
            background: linear-gradient(90deg, #93965F, #493F36, #000000);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* 每个字的内层容器（慢动画，整行出现后再逐字出来） */
        .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: charIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .hero-bottom {
            display: flex; align-items: center; gap: 15px;
            font-size: 14px; font-weight: 600; color: #ffffff;
            opacity: 0; transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.2s forwards;
        }
        .hero-bottom .arrow { font-size: 18px; color: #a04ee0; }

        .hero-image { flex: 1; max-width: 400px; height: 400px; }

        /* ==================== 动画定义 ==================== */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes lineIn { from { opacity: 0; filter: blur(4px); transform: translateY(10px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
        @keyframes charIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .navbar { padding: 10px 20px; }
            .nav-links { display: none; }
            .hero { padding: 0 20px; flex-direction: column; justify-content: center; text-align: left; }
            .hero-title { font-size: 48px; }
            .hero-image { display: none; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="logo">宫水大世界</div>
        <div class="nav-links">
            <a href="#">作品</a>
            <a href="#">服务</a>
            <a href="#">理念</a>
            <a href="#">联系</a>
        </div>
        <a href="/workspace" class="btn-glass">开始探索</a>
    </nav>

    <!-- 主内容 -->
    <section class="hero">
        <div class="hero-text">
            <div class="hero-subtitle">高级数字营销解决方案</div>
            
            <!-- ✅ 使用JS自动拆字，实现“整行快出，单字慢出” -->
            <h1 class="hero-title" id="titleContainer">
                <span class="title-row gradient-text">将创意</span>
                <span class="title-row gradient-text">变为现实</span>
            </h1>
            
            <div class="hero-bottom">
                <span>我们的愿景</span>
                <span class="arrow">→</span>
            </div>
        </div>
        
        <!-- 右侧留白区，鸟先留着空位 -->
        <div class="hero-image"></div>
    </section>

    <!-- ✅ 核心逻辑：拆分每一行的字，赋予不同的慢动画延迟 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const rows = document.querySelectorAll('.title-row');
            
            rows.forEach((row, rowIndex) => {
                const text = row.textContent.trim();
                row.innerHTML = '';
                
                // 行动画的基准延迟（由CSS控制，快慢通过animationDelay决定）
                // 这里我们只处理字的动画延迟
                text.split('').forEach((char, charIndex) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char;
                    
                    // 行快（0.1s 和 0.45s 出现完）
                    // 字慢：每个字的动画延迟 = 行动画的结束时间 + 字的索引 * 0.12秒
                    // 第一行：0.1s + 0.4s(行动画时长) + 字索引 * 0.12s = 0.5s + ...
                    // 第二行：0.45s + 0.4s + 字索引 * 0.12s = 0.85s + ...
                    const baseDelay = rowIndex === 0 ? 0.5 : 0.85;
                    const charDelay = baseDelay + (charIndex * 0.12); 
                    span.style.animationDelay = charDelay + 's';
                    
                    row.appendChild(span);
                });
            });
        });
    </script>
</body>
</html>
