<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 12%;
            padding-top: 14vh; 
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            gap: 6px;
        }

        /* 【核心修复】回归 100% 纯白底色，用内发光代替颜色渐变 */
        .text-white {
            color: #ffffff; /* 强制指定纯白色，永不变黑 */
            font-weight: 900;
            text-align: left;
            margin: 0;
            letter-spacing: 8px;
            /* 微弱的发光光效，模拟光线打在上面的感觉 */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.15), 0 4px 10px rgba(0, 0, 0, 0.5);
            /* 保持清晰度 */
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        .main-title {
            font-size: 64px;
            line-height: 1.1;
        }

        .sub-title {
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: 600;
            line-height: 1.1;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 24px;
            margin-top: 20px;
        }

        /* 玻璃质感按钮 + 绝对白字的按钮 */
        .glass-btn {
            padding: 14px 32px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
        }

        .glass-btn:active {
            transform: scale(0.94);
        }

        .btn-text {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff; /* 按钮字也是绝对纯白，永不变黑 */
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1); /* 按钮字同样带一丢丢光效 */
        }

        @media (max-width: 600px) {
            body { padding-left: 6%; padding-top: 12vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { padding: 12px 20px; }
            .btn-text { font-size: 15px; }
            .btn-group { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="text-group">
        <h1 class="text-white main-title">宫水大世界</h1>
        <h2 class="text-white sub-title">Telegram bot编辑器</h2>
    </div>
    
    <div class="btn-group">
        <a href="#" class="glass-btn" onclick="alert('后续将跳转至创建作品页面')">
            <span class="btn-text">创建作品</span>
        </a>
        <a href="/dashboard" class="glass-btn" onclick="alert('点击了查看仓库')">
            <span class="btn-text">查看仓库</span>
        </a>
    </div>
</body>
</html>
