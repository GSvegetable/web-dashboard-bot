<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 12%;
            padding-top: 14vh; 
            /* 强制指定主流系统原生圆体字 */
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 主标题：字间距大幅拉开、加粗、左上角淡灰色光效 */
        .main-title {
            font-size: 56px;
            font-weight: 900;  /* 加粗到最大级别 */
            letter-spacing: 8px; /* 每个字中间的距离明显拉开 */
            
            /* 模拟从左上方斜打下来的淡灰色光效 */
            background: linear-gradient(145deg, #ffffff 20%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            /* 内部光晕与底部阴影，让光效有体积感 */
            filter: drop-shadow(0 4px 10px rgba(255, 255, 255, 0.15));
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            
            /* 渲染优化，让字体更柔和 */
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        /* 副标题：保持原样 */
        .sub-title {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.7);
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 24px;
            margin-top: 50px;
        }

        /* 纯透明玻璃效果按钮 */
        .glass-btn {
            padding: 14px 32px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
        }

        .glass-btn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 600px) {
            body { padding-left: 6%; padding-top: 12vh; }
            .main-title { font-size: 40px; letter-spacing: 6px; }
            .sub-title { font-size: 16px; }
            .glass-btn { padding: 12px 20px; font-size: 15px; }
            .btn-group { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="text-group">
        <h1 class="main-title">宫水大世界</h1>
        <h2 class="sub-title">Telegram bot编辑器</h2>
    </div>
    
    <div class="btn-group">
        <a href="#" class="glass-btn" onclick="alert('后续将跳转至创建作品页面')">创建作品</a>
        <a href="/dashboard" class="glass-btn" onclick="alert('点击了查看仓库')">查看仓库</a>
    </div>
</body>
</html>
