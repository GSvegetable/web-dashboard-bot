<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <!-- 引入 GSAP 及其滚动触发插件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button, a, input, textarea, select { outline: none; -webkit-tap-highlight-color: transparent; }
        button:focus, a:focus, input:focus { outline: none; }

        :root {
            --bg-img: url("{{ url_for('static', filename='bg.png') }}");
            --new-bg-img: url("{{ url_for('static', filename='mmexport1785785172198.jpg') }}");
        }

        body {
            width: 100vw;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        body.loaded { opacity: 1; }

        /* ================= 第一屏：顶部图片 ================= */
        .top-image {
            width: 100vw;
            height: 100vh; 
            background-image: url("{{ url_for('static', filename='IMG_20260804_070056.png') }}");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            flex-shrink: 0;
            z-index: 1;
            position: relative;
        }

        /* ================= 第二屏：文字与按钮区域 ================= */
        .content-area {
            position: relative;
            width: 100%;
            min-height: 100vh; 
            background-image: var(--bg-img);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            /* 🔽 修正位置：移除强制居中，把负边距从 -12vh 缩小到 -7vh，稍微往下移一点 */
            margin-top: -7vh;
            padding-top: 1vh;
            padding-left: 12%;
            padding-bottom: 15vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 1;
            overflow: hidden;
        }

        /* ================= 内部遮罩层（负责主题切换） ================= */
        #theme-ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-color: transparent;
            background-image: var(--bg-img);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            clip-path: circle(0% at 0 0);
            will-change: clip-path, background-image;
        }

        /* ================= 标题行（文字 + 切换按钮） ================= */
        .title-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 12px;
            position: relative;
            z-index: 1;
            margin-bottom: 4px; 
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            gap: 6px;
            opacity: 0; 
            transform: translateY(60px); 
        }

        /* 固定在“宫水大世界”右侧的缩小版切换按钮 */
        .theme-btn-title {
            width: 30px; height: 30px; padding: 0; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #ffffff; touch-action: manipulation;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateY(60px);
            flex-shrink: 0;
            margin-top: 6px;
        }
        .theme-btn-title:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        .text-pattern {
            color: #ffffff; 
            background-image: url("{{ url_for('static', filename='texture.jpg') }}"); 
            background-size: cover; background-position: center;
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 900; text-align: left; margin: 0; letter-spacing: 8px; text-shadow: none;
            text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; line-height: 1.3; padding-top: 2px; padding-bottom: 4px;
        }
        .main-title { font-size: 64px; }
        .sub-title { font-size: 22px; letter-spacing: 2px; font-weight: 600; }

        .btn-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            width: 100%; max-width: 320px;
            margin-top: 0;
            justify-items: center;
            opacity: 0;
            transform: translateY(60px);
            position: relative;
            z-index: 1;
        }

        /* ================= 屏幕顶部固定悬浮的按钮 ================= */
        .top-actions {
            position: fixed;
            top: 20px;
            right: 24px; 
            z-index: 9999; 
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-btn {
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            color: #ffffff; font-size: 14px; font-weight: 500;
            cursor: pointer; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            border: none; touch-action: manipulation;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .top-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }
        #loginBtn { margin-left: 16px; }

        /* 底部按钮统一玻璃质感 */
        .glass-btn {
            position: relative; padding: 14px 0; width: 90%; text-align: center; border-radius: 24px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            color: #ffffff; font-size: 18px; font-weight: 600;
            cursor: pointer; letter-spacing: 1px; text-decoration: none;
            display: inline-block; z-index: 1; touch-action: manipulation;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .glass-btn:active { transform: scale(0.94); }
        .btn-text { position: relative; z-index: 2; color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.15); }

        @media (max-width: 600px) {
            .top-image { height: 100vh; }
            .content-area { margin-top: -4vh; padding-left: 6%; min-height: 100vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { font-size: 15px; padding: 12px 0; border-radius: 20px; }
            .btn-grid { gap: 12px; max-width: 260px; }
            .top-actions { top: 16px; right: 16px; gap: 6px; }
            .top-btn { font-size: 12px; padding: 6px 14px; }
            #loginBtn { margin-left: 8px; }
            .theme-btn-title { width: 28px; height: 28px; margin-top: 3px; }
        }
    </style>
</head>
<body>
    <!-- 第一屏：顶部图片 -->
    <div class="top-image"></div>

    <!-- 第二屏：文字与按钮区域 -->
    <div class="content-area" id="contentArea">
        <div id="theme-ring"></div>

        <!-- 标题行：包含文字与右上角切换按钮 -->
        <div class="title-row">
            <div class="text-group">
                <h1 class="text-pattern main-title">宫水大世界</h1>
                <h2 class="text-pattern sub-title">Telegram Bot Editor</h2>
            </div>
            
            <!-- 固定在“宫水大世界”右侧的切换按钮 -->
            <button class="theme-btn-title" onclick="toggleTheme(event)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
            </button>
        </div>
        
        <div class="btn-grid">
            <a href="/create" class="glass-btn"><span class="btn-text">创建作品</span></a>
            <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">查看仓库</span></a>
            <a href="https://t.me/gsyxyc" class="glass-btn" target="_blank"><span class="btn-text">联系开发者</span></a>
            <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">加入社区</span></a>
        </div>
    </div>

    <!-- 整个网页顶部悬浮的按钮 -->
    <div class="top-actions">
        <a href="javascript:void(0)" onclick="toggleFullScreen()" class="top-btn">全屏显示</a>
        <button class="top-btn" id="loginBtn" onclick="void(0)">Log in</button>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        let isExpanded = false;
        const themeRing = document.getElementById('theme-ring');
        const defaultBgUrl = "{{ url_for('static', filename='bg.png') }}";
        const newBgUrl = "{{ url_for('static', filename='mmexport1785785172198.jpg') }}";
        const defaultTextUrl = "{{ url_for('static', filename='texture.jpg') }}";
        const newTextUrl = "{{ url_for('static', filename='mmexport1785791861411.jpg') }}";
        const textElements = document.querySelectorAll('.text-pattern');
        const contentArea = document.getElementById('contentArea');

        const EXPAND_TEXT_DELAY = 0.4;
        const CONTRACT_TEXT_DELAY = 0.3;

        function toggleTheme(event) {
            const btn = event.currentTarget;
            
            // ⚠️ 核心修复：获取按钮相对于父容器 (contentArea) 的坐标，而不是屏幕坐标
            const btnRect = btn.getBoundingClientRect();
            const areaRect = contentArea.getBoundingClientRect();
            
            const x = (btnRect.left - areaRect.left) + btnRect.width / 2;
            const y = (btnRect.top - areaRect.top) + btnRect.height / 2;

            isExpanded = !isExpanded;
            gsap.killTweensOf(themeRing);

            if (isExpanded) {
                gsap.set(themeRing, { 
                    backgroundImage: `url("${newBgUrl}")`,
                    clipPath: `circle(0% at ${x}px ${y}px)` 
                });
                gsap.delayedCall(EXPAND_TEXT_DELAY, () => {
                    textElements.forEach(el => { el.style.backgroundImage = `url("${newTextUrl}")`; });
                });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { 
                    duration: 0.8, ease: "power2.inOut", clipPath: `circle(150% at ${x}px ${y}px)` 
                });
            } else {
                gsap.set(themeRing, { clipPath: `circle(150% at ${x}px ${y}px)` });
                gsap.delayedCall(CONTRACT_TEXT_DELAY, () => {
                    textElements.forEach(el => { el.style.backgroundImage = `url("${defaultTextUrl}")`; });
                });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { 
                    duration: 0.8, ease: "power2.inOut", clipPath: `circle(0% at ${x}px ${y}px)`,
                    onComplete: () => {
                        themeRing.style.backgroundImage = `url("${defaultBgUrl}")`;
                    }
                });
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const bgImg = new Image();
            const imgUrl = "{{ url_for('static', filename='bg.png') }}";
            bgImg.src = imgUrl;
            bgImg.onload = function() { document.body.classList.add('loaded'); };
            setTimeout(() => {
                if(!document.body.classList.contains('loaded')) { document.body.classList.add('loaded'); }
            }, 3000);

            // 预渲染切换动画（解决第一次点击卡顿）
            gsap.set(themeRing, { clipPath: `circle(0% at 0 0)` });
            setTimeout(() => {
                gsap.set(themeRing, { clipPath: `circle(150% at 0 0)` });
                setTimeout(() => {
                    gsap.set(themeRing, { clipPath: `circle(0% at 0 0)` });
                }, 100);
            }, 200);

            // 滚动触发动画
            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: ".content-area",
                    start: "top 85%",
                    toggleActions: "play none none none"
                }
            });
            tl.to(".text-group", { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0)
              .to(".theme-btn-title", { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0)
              .to(".btn-grid", { opacity: 1, y: 0, duration: 1.2, delay: 0.2, ease: "power3.out" }, 0.2);
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }
    </script>
</body>
</html>
