        body {

            显示: 弯曲;
            挠曲方向: 柱;
            对齐项目: 灵活启动;
            justify-content: flex-start;
            z-index: 1;
            overflow: hidden;
        }

        /* ================= 内部遮罩层（负责主题切换） ================= */
        #theme-ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-color: transparent;
            background-image: var(--bg-img);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            clip-path: circle(0% at 0 0);
            will-change: clip-path, background-image;
        }

        /*=================标题行(文字+切换按钮)=================*/
        .标题行 {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 12px;
            position: relative;
            z-index: 1;
            margin-bottom: 4px; 
            margin-top: 0; 
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            gap: 6px;
            opacity: 0; 
            transform: translateY(60px); 
        }

        /* 固定在“宫水大世界”右侧的切换按钮 */
        .theme-btn-title {
            width: 30px; height: 30px; padding: 0; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #ffffff; touch-action: manipulation;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            改变: translateY(60PX);
            挠曲收缩: 0;
            上边距: 6PX;
        }
        .主题-btn-标题:活跃的 { 改变: 规模(0.94); 背景: RGBA(255, 255, 255, 0.15); }

        .文本模式 {

            背景尺寸: 覆盖; 背景位置: 中心;
            -webkit-background-clip: 文本; 背景剪辑: 文本; -webkit-text-fill-color: 透明的;
            字体粗细: 900; 文本对齐: 左; 边缘: 0; 字母间距: 8PX; 文本阴影: 没有一个;

        }
        .主要标题 { 字体大小: 64PX; }
        .副标题 { 字体大小: 22PX; 字母间距: 2PX; 字体粗细: 600; }

        .btn-grid {

            宽度: 100%; 最大宽度: 320PX;
