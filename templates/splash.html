<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宫水大世界 宫水.com － Professional Telegram bot development services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/0e6de1ec911a2e267ff136bbdd384a44?family=Helvetica+Neue+Light" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/terranova.css') }}" />

    <style>
        * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
        }

        html, body {
            height: auto !important;
            min-height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            background: #000000 !important;
            touch-action: pan-y !important;
            color: #ffffff !important;
            user-select: none !important;
        }

        .hero {
            height: auto !important;
            min-height: 100vh !important;
            pointer-events: auto !important;
        }

        video::-webkit-media-controls, video::-webkit-media-controls-enclosure,
        video::-webkit-media-controls-panel, video::-webkit-media-controls-play-button,
        video::-webkit-media-controls-start-playback-button,
        video::-webkit-media-controls-overlay-play-button {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* 背景层容器 */
        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* 旧主题背景（始终显示在后面） */
        #theme-bg-white, #theme-bg-black {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: 0;
            pointer-events: none;
        }

        #theme-bg-white {
            background-image: url('{{ url_for('static', filename='IMG_20250824_162613.jpg') }}');
            background-color: #ffffff;
            opacity: 1;
        }

        #theme-bg-black {
            background-image: url('{{ url_for('static', filename='IMG_20260823_040708.png') }}');
            background-color: #000000;
            opacity: 0;
        }

        /* 新主题背景（圆形遮罩扩散） - 从按钮位置出发 */
        #theme-new-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: 1;
            pointer-events: none;
            clip-path: circle(0px at 50% 50%);
            opacity: 0;
        }

        #theme-new-bg.white {
            background-image: url('{{ url_for('static', filename='IMG_20250824_162613.jpg') }}');
            background-color: #ffffff;
        }

        #theme-new-bg.black {
            background-image: url('{{ url_for('static', filename='IMG_20260823_040708.png') }}');
            background-color: #000000;
        }

        .hero, .cards-section, .menu {
            position: relative;
            z-index: 3;
        }

        /* 右上角固定按钮组 */
        .top-right {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 16px;
            pointer-events: auto;
        }

        .login-btn {
            color: #fff;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .theme-toggle {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            z-index: 10001;
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        /* 汉堡菜单（固定左上角） */
        .hamburger {
            cursor: pointer;
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 100000;
            pointer-events: auto;
        }

        .hamburger input {
            display: none;
        }

        .hamburger svg {
            height: 2.5em;
            transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .line {
            fill: none;
            stroke: white;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 3;
            transition: stroke-dasharray 600ms cubic-bezier(0.4, 0, 0.2, 1),
                        stroke-dashoffset 600ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .line-top-bottom {
            stroke-dasharray: 12 63;
        }

        .hamburger input:checked + svg {
            transform: rotate(-45deg);
        }

        .hamburger input:checked + svg .line-top-bottom {
            stroke-dasharray: 20 300;
            stroke-dashoffset: -32.42;
        }

        /* 卡片区域 */
        .cards-section { 
            min-height: 90vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 40px 40px 100px; 
            margin-top: -20vh; 
            position: relative; 
            z-index: 3;
        }

        .cards-grid { 
            position: relative; 
            width: 100%; 
            max-width: 1100px; 
            height: 260px; 
            margin: 0 auto;
        }

        .card-item { 
            position: absolute; 
            left: 50%; 
            top: 50%; 
            width: calc(30% - 10px); 
            max-width: 320px; 
            height: 180px; 
            border-radius: 32px; 
            padding: 24px; 
            overflow: hidden; 
            background: rgba(255, 255, 255, 0.08);
            transform: translate3d(0, 0, 0);
            will-change: transform, opacity;
        }

        .card-left { z-index: 1; } 
        .card-center { z-index: 3; } 
        .card-right { z-index: 2; }

        .card-item::before { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background-size: cover; 
            background-position: center; 
            filter: blur(8px) brightness(0.7); 
            transform: scale(1.1);
        }

        .card-content { 
            position: relative; 
            z-index: 1; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
        }

        .card-content h3 { 
            font-size: 20px; 
            font-weight: 700; 
            margin-bottom: 10px; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.6); 
            color: white;
        }

        .card-content p { 
            font-size: 14px; 
            line-height: 1.7; 
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
            color: white;
        }

        .card.group {
            animation: fade-slide-up-card 2.5s cubic-bezier(0.16, 1, 0.3, 1) both !important;
        }

        @keyframes fade-slide-up-card {
            0% { opacity: 0; transform: translateY(100px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 侧边菜单 */
        .menu {
            position: fixed;
            inset: 0;
            z-index: 50;
            visibility: hidden;
            pointer-events: none;
            transition: visibility 0s linear 500ms;
        }

        .menu.is-open {
            visibility: visible;
            pointer-events: auto;
            transition-delay: 0s;
        }

        .menu__backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 500ms;
        }

        .menu.is-open .menu__backdrop { 
            opacity: 1; 
        }

        .menu__panel {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            width: 380px;
            max-width: 100%;
            height: 100%;
            padding: 1.5rem 2rem;
            background: #1a1a1a;
            transform: translateX(-100%);
            transition: transform 500ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu.is-open .menu__panel { 
            transform: translateX(0); 
        }

        .menu__nav { 
            margin-top: 80px; 
            display: flex; 
            flex-direction: column; 
        }

        .menu__link {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            text-decoration: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 500ms, transform 500ms;
        }

        .menu.is-open .menu__link {
            opacity: 1;
            transform: translateY(0);
        }

        .menu.is-open .menu__link:nth-child(1) { transition-delay: 100ms; }
        .menu.is-open .menu__link:nth-child(2) { transition-delay: 150ms; }
        .menu.is-open .menu__link:nth-child(3) { transition-delay: 200ms; }
        .menu.is-open .menu__link:nth-child(4) { transition-delay: 250ms; }
        .menu.is-open .menu__link:nth-child(5) { transition-delay: 300ms; }

        .menu__foot {
            margin-top: auto;
            padding: 1.5rem 0 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 500ms, transform 500ms;
        }

        .menu.is-open .menu__foot { 
            opacity: 1; 
            transform: translateY(0); 
            transition-delay: 400ms; 
        }

        .menu__footLabel { 
            font-size: 0.75rem; 
            color: rgba(255,255,255,0.5); 
            margin: 0; 
        }

        .menu__mail { 
            font-size: 0.875rem; 
            color: #ffffff; 
            text-decoration: none; 
        }
    </style>
</head>

    <script type="module" src="{{ url_for('static', filename='js/glass-card.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var menuToggle = document.getElementById('menu-toggle');
            var menu = document.getElementById('menu');
            var menuBackdrop = document.getElementById('menu-backdrop');
            var menuLinks = document.querySelectorAll('.menu__link');

            menuToggle.addEventListener('change', function() {
                if (this.checked) {
                    menu.classList.add('is-open');
                } else {
                    menu.classList.remove('is-open');
                }
            });

            menuBackdrop.addEventListener('click', function() {
                menuToggle.checked = false;
                menu.classList.remove('is-open');
            });

            menuLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    menuToggle.checked = false;
                    menu.classList.remove('is-open');
                });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && menu.classList.contains('is-open')) {
                    menuToggle.checked = false;
                    menu.classList.remove('is-open');
                }
            });

            // 卡片式主题切换：从按钮位置精确扩散的圆形
            var toggleBtn = document.getElementById('theme-toggle-btn');
            var whiteBg = document.getElementById('theme-bg-white');
            var blackBg = document.getElementById('theme-bg-black');
            var newBg = document.getElementById('theme-new-bg');
            
            if (toggleBtn && whiteBg && blackBg && newBg) {
                var isBlack = false;
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    isBlack = !isBlack;
                    
                    // 精确获取按钮位置（相对于视口）
                    var rect = toggleBtn.getBoundingClientRect();
                    var btnCenterX = rect.left + rect.width / 2;
                    var btnCenterY = rect.top + rect.height / 2;
                    
                    // 转换为百分比位置（相对于视口）
                    var percentX = (btnCenterX / window.innerWidth) * 100;
                    var percentY = (btnCenterY / window.innerHeight) * 100;
                    
                    // 计算最大扩散半径
                    var maxDist = Math.hypot(
                        Math.max(btnCenterX, window.innerWidth - btnCenterX),
                        Math.max(btnCenterY, window.innerHeight - btnCenterY)
                    );
                    
                    // 设置新背景样式
                    if (isBlack) {
                        newBg.classList.remove('white');
                        newBg.classList.add('black');
                        // 最终状态：黑色主题全屏显示
                        setTimeout(() => {
                            blackBg.style.opacity = '1';
                            whiteBg.style.opacity = '0';
                            newBg.style.opacity = '0';
                            newBg.style.clipPath = `circle(0px at ${percentX}% ${percentY}%)`;
                        }, 1600);
                    } else {
                        newBg.classList.remove('black');
                        newBg.classList.add('white');
                        // 最终状态：白色主题全屏显示
                        setTimeout(() => {
                            whiteBg.style.opacity = '1';
                            blackBg.style.opacity = '0';
                            newBg.style.opacity = '0';
                            newBg.style.clipPath = `circle(0px at ${percentX}% ${percentY}%)`;
                        }, 1600);
                    }
                    
                    // 启动圆形扩散动画（从按钮位置开始）
                    newBg.style.opacity = '1';
                    newBg.style.clipPath = `circle(0px at ${percentX}% ${percentY}%)`;
                    newBg.style.transition = 'none';
                    
                    // 触发动画（1.6秒：两倍的0.8秒）
                    setTimeout(() => {
                        newBg.style.transition = `clip-path 1.6s cubic-bezier(0.4, 0, 0.2, 1)`;
                        newBg.style.clipPath = `circle(${maxDist}px at ${percentX}% ${percentY}%)`;
                    }, 10);
                    
                    document.body.classList.toggle('theme-black', isBlack);
                });
            }

            // 卡片滑动动画
            var section = document.getElementById('cardsSection');
            var card1 = document.getElementById('card1');
            var card2 = document.getElementById('card2');
            var card3 = document.getElementById('card3');
            
            if (section && card1 && card2 && card3) {
                var clamp = function(v, min, max) { return Math.max(min, Math.min(max, v)); };
                var lerp = function(a, b, t) { return a + (b - a) * t; };
                var easeOutCubic = function(x) { return 1 - Math.pow(1 - x, 3); };
                
                function makeInitials() {
                    var vw = window.innerWidth, vh = window.innerHeight;
                    return { 
                        cX: 0, cY: vh * 0.55, cR: 0, cS: 0.82, cO: 0.5, 
                        lX: -vw * 0.45, lY: vh * 0.22, lR: -18, lS: 0.72, lO: 0.25, 
                        rX: vw * 0.45, rY: vh * 0.22, rR: 18, rS: 0.72, rO: 0.25 
                    };
                }
                
                var current = makeInitials(), target = makeInitials(), running = false;
                
                function updateTargets() {
                    var rect = section.getBoundingClientRect();
                    var vw = window.innerWidth, vh = window.innerHeight;
                    var offset = (rect.top + rect.height * 0.5) - vh * 0.5;
                    var progress = clamp(1 - offset / (vh * 0.85), 0, 1);
                    var t = easeOutCubic(progress);
                    var distance = vw * 0.28;
                    var ini = makeInitials();
                    
                    target.cX = 0; target.cY = lerp(ini.cY, 0, t); target.cR = 0; target.cS = lerp(ini.cS, 1, t); target.cO = lerp(ini.cO, 1, t);
                    target.lX = lerp(ini.lX, -distance, t); target.lY = lerp(ini.lY, 0, t); target.lR = lerp(ini.lR, -6, t); target.lS = lerp(ini.lS, 1, t); target.lO = lerp(ini.lO, 1, t);
                    target.rX = lerp(ini.rX, distance, t); target.rY = lerp(ini.rY, 0, t); target.rR = lerp(ini.rR, 6, t); target.rS = lerp(ini.rS, 1, t); target.rO = lerp(ini.rO, 1, t);
                }
                
                function apply() {
                    card1.style.transform = `translate3d(${current.lX}px, ${current.lY}px, 0) translate(-50%, -50%) rotate(${current.lR}deg) scale(${current.lS})`;
                    card2.style.transform = `translate3d(${current.cX}px, ${current.cY}px, 0) translate(-50%, -50%) rotate(${current.cR}deg) scale(${current.cS})`;
                    card3.style.transform = `translate3d(${current.rX}px, ${current.rY}px, 0) translate(-50%, -50%) rotate(${current.rR}deg) scale(${current.rS})`;
                    card1.style.opacity = current.lO; card2.style.opacity = current.cO; card3.style.opacity = current.rO;
                }
                
                function frame() {
                    updateTargets();
                    var keys = ['cX','cY','cR','cS','cO','lX','lY','lR','lS','lO','rX','rY','rR','rS','rO'];
                    var delta = 0;
                    for (var i = 0; i < keys.length; i++) {
                        var k = keys[i], old = current[k];
                        current[k] = lerp(old, target[k], 0.09);
                        delta += Math.abs(current[k] - old);
                    }
                    apply();
                    if (delta > 0.001) requestAnimationFrame(frame);
                    else running = false;
                }
                
                function start() { if (!running) { running = true; requestAnimationFrame(frame); } }
                window.addEventListener('scroll', start, { passive: true });
                window.addEventListener('resize', start, { passive: true });
                start();
            }
