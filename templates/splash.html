<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宫水大世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==================== 顶部导航栏 ==================== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .logo {
            font-weight: 800;
            font-size: 24px;
            letter-spacing: 2px;
            color: #ffffff;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .nav-links a:hover { opacity: 1; }

        /* ==================== 玻璃质感胶囊按钮 ==================== */
        .btn-glass {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 999px;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            position: relative;
            /* 核心：玻璃质感 = 半透明背景 + 背景模糊 + 白色内发光 */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), inset 0 -1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 2.2);
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 8px 32px rgba(255,255,255,0.1);
            transform: scale(1.02);
        }

        /* ==================== 主内容区 ==================== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: relative;
        }

        /* 左侧文字 */
        .hero-text {
            max-width: 700px;
        }
        .hero-subtitle {
            font-size: 14px;
            letter-spacing: 5px;
            color: #a04ee0;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.9;
            animation: fadeIn 1s ease 0.1s forwards;
            opacity: 0;
        }

        /* ==================== 核心修改：超大圆润字体 + 深绿黑渐变 + 逐排动画 ==================== */
        .hero-title {
            font-size: 80px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 30px;
            letter-spacing: -1px;
            /* 极其圆润的字体：使用 PingFang SC 并加粗，系统会渲染圆角 */
            font-family: "PingFang SC", "Arial Rounded MT Bold", "Helvetica Neue", sans-serif;
            font-weight: 800;
        }
        .hero-title .line {
            display: block;
            opacity: 0;
            transform: translateY(40px);
            animation: lineUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .hero-title .line-1 { animation-delay: 0.3s; }
        .hero-title .line-2 { animation-delay: 0.8s; }

        /* ✅ 深绿色到黑色的渐变（匹配原有大按钮配色） */
        .hero-title .gradient-green {
            background: linear-gradient(90deg, #2e7d32, #1b5e20, #000000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .hero-bottom {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s cubic-bezier(0.22, 1, 0.36, 1) 1.3s forwards;
        }
        .hero-bottom .arrow {
            font-size: 18px;
            color: #a04ee0;
        }

        /* 右侧留白（鸟先不做，保持空） */
        .hero-image {
            flex: 1;
            max-width: 400px;
            height: 400px;
        }

        /* ==================== 动画定义 ==================== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 逐行上移动画：每行从下方滑入 */
        @keyframes lineUp {
            from { opacity: 0; transform: translateY(50px); filter: blur(2px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar { padding: 10px 20px; }
            .nav-links { display: none; }
            .hero { padding: 0 20px; flex-direction: column; justify-content: center; text-align: left; }
            .hero-title { font-size: 48px; }
            .hero-image { display: none; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="logo">宫水大世界</div>
        <div class="nav-links">
            <a href="#">作品</a>
            <a href="#">服务</a>
            <a href="#">理念</a>
            <a href="#">联系</a>
        </div>
        <a href="/workspace" class="btn-glass">开始探索</a>
    </nav>

    <!-- 主内容 -->
    <section class="hero">
        <div class="hero-text">
            <div class="hero-subtitle">高级数字营销解决方案</div>
            <!-- ✅ 逐排动画：两行文字先后出现 -->
            <h1 class="hero-title">
                <span class="line line-1">将创意</span>
                <span class="line line-2"><span class="gradient-green">变为现实</span></span>
            </h1>
            <div class="hero-bottom">
                <span>我们的愿景</span>
                <span class="arrow">→</span>
            </div>
        </div>
        
        <!-- 右侧留白区，鸟先留着空位 -->
        <div class="hero-image"></div>
    </section>

</body>
</html>
