<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 启动页</title>
    <!-- 引入 GSAP 动画库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button, a, input, textarea, select { outline: none; -webkit-tap-highlight-color: transparent; }
        button:focus, a:focus, input:focus { outline: none; }

        :root {
            --bg-img: url("{{ url_for('static', filename='bg.png') }}");
            --new-bg-img: url("{{ url_for('static', filename='mmexport1785785172198.jpg') }}");
        }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: #000000;
            background-image: var(--bg-img);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex; flex-direction: column; align-items: flex-start;
            padding-left: 12%; padding-top: 14vh; 
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        body.loaded { opacity: 1; }

        /* ================= 扩散/收缩遮罩层 ================= */
        #theme-ring {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            background-color: transparent;
            background-image: var(--bg-img);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            clip-path: circle(0% at 0 0);
            will-change: clip-path, background-image;
        }

        /* ================= 顶部三连排容器 ================= */
        .top-actions {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-btn {
            position: relative;
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            border: none;
        }
        .top-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        .theme-btn {
            width: 34px; height: 34px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center;
            color: #ffffff;
        }
        .theme-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        /* ================= 顶部按钮的入场动画：从右侧滑入 ================= */
        @keyframes slideInFromRight {
            0% { opacity: 0; transform: translateX(280px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .top-actions .top-btn, .top-actions .theme-btn {
            opacity: 0;
            animation: slideInFromRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .top-actions .top-btn:nth-child(1) { animation-delay: 0.2s; }
        .top-actions .top-btn:nth-child(2) { animation-delay: 0.4s; }
        .top-actions .theme-btn:nth-child(3) { animation-delay: 0.6s; }

        /* ================= 登录下拉面板 ================= */
        #login-dropdown {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%) scaleY(0);
            transform-origin: top center;
            width: 80%; 
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            padding: 16px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            z-index: 1000;
        }
        #login-dropdown.active {
            pointer-events: auto;
            opacity: 1;
            transform: translateX(-50%) scaleY(1);
        }

        /* ================= 精确复刻的 3D 斜切堆叠表单 ================= */
        .form {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            position: relative;
            transform: skewY(-4deg);
            list-style: none;
            padding: 0; margin: 0;
            width: 80%;
        }
        .wrapper li {
            position: relative;
            list-style: none;
            width: 100%;
            height: 40px;
            z-index: var(--i);
            margin-bottom: -6px; /* 产生层叠的关键 */
        }
        /* 输入框与按钮的公共样式 */
        .wrapper li .input, 
        .wrapper li .button {
            width: 100%;
            height: 40px;
            border: none;
            padding: 0 16px;
            position: relative;
            z-index: 2;
            font-size: 15px;
            color: #f0f0f0;
        }
        .wrapper li .input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .wrapper li .input:focus {
            outline: none;
            border-bottom: 2px solid rgba(255, 200, 150, 0.6); /* 中世纪暖光 */
            background: rgba(255, 255, 255, 0.02);
        }
        .wrapper li .button {
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .wrapper li .button:active {
            transform: scale(0.94);
        }

        /* 3D 厚度两侧与底部斜切伪元素 */
        .wrapper li::before {
            content: '';
            position: absolute;
            top: 0; left: -40px;
            width: 40px; height: 100%;
            transform-origin: right;
            transform: skewY(45deg);
            z-index: 1;
        }
        .wrapper li::after {
            content: '';
            position: absolute;
            top: -40px; left: 0;
            width: 100%; height: 40px;
            transform-origin: bottom;
            transform: skewX(45deg);
            z-index: 1;
        }

        /* 中世纪暗黑图配色（4层递进） */
        /* 第1层：邮箱 */
        .wrapper li:nth-child(1) { background: #3a3f44; }
        .wrapper li:nth-child(1)::before { background: #2a2e32; }
        .wrapper li:nth-child(1)::after { background: #2a2e32; }

        /* 第2层：输入密码 */
        .wrapper li:nth-child(2) { background: #2d3236; }
        .wrapper li:nth-child(2)::before { background: #1f2225; }
        .wrapper li:nth-child(2)::after { background: #1f2225; }

        /* 第3层：确定密码 */
        .wrapper li:nth-child(3) { background: #212428; }
        .wrapper li:nth-child(3)::before { background: #141619; }
        .wrapper li:nth-child(3)::after { background: #141619; }

        /* 第4层：注册（暖黄火光） */
        .wrapper li:nth-child(4) { background: #db7c45; }
        .wrapper li:nth-child(4)::before { background: #bd6535; }
        .wrapper li:nth-child(4)::after { background: #bd6535; }
        .wrapper li:nth-child(4) .button { color: #23140c; } /* 深棕字 */

        /* ================= 背景模糊层 ================= */
        .bg-blur {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0); 
            backdrop-filter: blur(0px);
            pointer-events: none;
            z-index: 50;
            transition: all 0.3s ease;
        }
        .bg-blur.active {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        /* ================= 文本与底部按钮 ================= */
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(80px); } 100% { opacity: 1; transform: translateY(0); } }
        .text-group { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; z-index: 1; opacity: 0; animation: slideUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .text-pattern {
            color: #ffffff; background-image: url("{{ url_for('static', filename='texture.jpg') }}"); background-size: cover; background-position: center;
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 900; text-align: left; margin: 0; letter-spacing: 8px; text-shadow: none;
            text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; line-height: 1.3; padding-top: 2px; padding-bottom: 4px;
        }
        .main-title { font-size: 64px; }
        .sub-title { font-size: 22px; letter-spacing: 2px; font-weight: 600; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 320px; z-index: 1; margin-top: 20px; justify-items: center; }
        .btn-grid .glass-btn { opacity: 0; animation: slideUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .btn-grid .glass-btn:nth-child(1) { animation-delay: 0.1s; }
        .btn-grid .glass-btn:nth-child(2) { animation-delay: 0.3s; }
        .btn-grid .glass-btn:nth-child(3) { animation-delay: 0.5s; }
        .btn-grid .glass-btn:nth-child(4) { animation-delay: 0.7s; }

        .glass-btn {
            position: relative; padding: 14px 0; width: 90%; text-align: center; border-radius: 24px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            color: #ffffff; font-size: 18px; font-weight: 600;
            cursor: pointer; letter-spacing: 1px; text-decoration: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); display: inline-block; z-index: 1;
        }
        .glass-btn:active { transform: scale(0.94); }
        .btn-text { position: relative; z-index: 2; color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.15); }

        @media (max-width: 600px) {
            body { padding-left: 6%; padding-top: 20vh; }
            .main-title { font-size: 44px; }
            .sub-title { font-size: 16px; }
            .glass-btn { font-size: 15px; padding: 12px 0; border-radius: 20px; }
            .btn-grid { gap: 12px; max-width: 260px; }
            .top-actions { top: 16px; right: 16px; gap: 8px; }
            .top-btn { font-size: 12px; padding: 6px 14px; }
            .theme-btn { width: 30px; height: 30px; }
            #login-dropdown { width: 90%; padding: 12px; min-height: 150px; }
            .wrapper { width: 90%; }
            .wrapper li { height: 36px; }
            .wrapper li .input, .wrapper li .button { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="theme-ring"></div>

    <div class="bg-blur" id="bg-blur"></div>

    <div class="top-actions">
        <a href="javascript:void(0)" onclick="toggleFullScreen()" class="top-btn">全屏显示</a>
        <button class="top-btn" id="loginBtn" onclick="toggleLogin()">Log in</button>
        
        <div id="login-dropdown">
            <!-- 完全照着 Uiverse 骨架搭出来的 3D 暗黑表单 -->
            <form class="form">
                <ul class="wrapper">
                    <li style="--i:4;">
                        <input class="input" type="text" placeholder="邮箱" required>
                    </li>
                    <li style="--i:3;">
                        <input class="input" type="password" placeholder="输入密码" required>
                    </li>
                    <li style="--i:2;">
                        <input class="input" type="password" placeholder="确定密码" required>
                    </li>
                    <li style="--i:1;">
                        <button class="button">注册</button>
                    </li>
                </ul>
            </form>
        </div>

        <button class="theme-btn" onclick="toggleTheme(event)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
        </button>
    </div>

    <div class="text-group">
        <h1 class="text-pattern main-title">宫水大世界</h1>
        <h2 class="text-pattern sub-title">Telegram Bot Editor</h2>
    </div>
    
    <div class="btn-grid">
        <a href="/create" class="glass-btn"><span class="btn-text">创建作品</span></a>
        <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">查看仓库</span></a>
        <a href="https://t.me/gsyxyc" class="glass-btn" target="_blank"><span class="btn-text">联系开发者</span></a>
        <a href="javascript:void(0);" class="glass-btn"><span class="btn-text">加入社区</span></a>
    </div>

    <script>
        let isExpanded = false;
        const themeRing = document.getElementById('theme-ring');
        const defaultBgUrl = "{{ url_for('static', filename='bg.png') }}";
        const newBgUrl = "{{ url_for('static', filename='mmexport1785785172198.jpg') }}";
        const defaultTextUrl = "{{ url_for('static', filename='texture.jpg') }}";
        const newTextUrl = "{{ url_for('static', filename='mmexport1785791861411.jpg') }}";
        const textElements = document.querySelectorAll('.text-pattern');

        // ================= 1. 双向切换动画 =================
        function toggleTheme(event) {
            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            isExpanded = !isExpanded;
            gsap.killTweensOf(themeRing);

            if (isExpanded) {
                gsap.set(themeRing, { 
                    backgroundImage: `url("${newBgUrl}")`,
                    clipPath: `circle(0% at ${x}px ${y}px)` 
                });
                textElements.forEach(el => { el.style.backgroundImage = `url("${newTextUrl}")`; });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { 
                    duration: 0.8, 
                    ease: "power2.inOut", 
                    clipPath: `circle(150% at ${x}px ${y}px)` 
                });
            } else {
                gsap.set(themeRing, { clipPath: `circle(150% at ${x}px ${y}px)` });
                void themeRing.offsetHeight; 
                gsap.to(themeRing, { 
                    duration: 0.8, 
                    ease: "power2.inOut", 
                    clipPath: `circle(0% at ${x}px ${y}px)`,
                    onComplete: () => {
                        themeRing.style.backgroundImage = `url("${defaultBgUrl}")`;
                        textElements.forEach(el => { el.style.backgroundImage = `url("${defaultTextUrl}")`; });
                    }
                });
            }
        }

        // ================= 2. 登录面板下拉与全局点击关闭 =================
        let isLoginOpen = false;
        let loginTl = null;

        function toggleLogin() {
            const panel = document.getElementById('login-dropdown');
            const blurBg = document.getElementById('bg-blur');

            if (loginTl) loginTl.kill();
            
            if (isLoginOpen) {
                loginTl = gsap.timeline();
                loginTl.to(panel, { scaleY: 0, opacity: 0, duration: 0.3, ease: "power2.in", transformOrigin: "top center" });
                loginTl.to(blurBg, { backdropFilter: "blur(0px)", background: "rgba(0,0,0,0)", duration: 0.3 }, 0);
                panel.classList.remove('active');
                blurBg.classList.remove('active');
                isLoginOpen = false;
                return;
            }

            panel.classList.add('active');
            blurBg.classList.add('active');
            isLoginOpen = true;

            gsap.set(panel, { scaleY: 0, opacity: 0, transformOrigin: "top center" });
            gsap.set(blurBg, { backdropFilter: "blur(6px)", background: "rgba(0,0,0,0.3)" });

            loginTl = gsap.timeline();
            loginTl.to(panel, { 
                scaleY: 1, 
                opacity: 1, 
                duration: 0.9, 
                ease: "bounce.out",
                transformOrigin: "top center" 
            });
            loginTl.to(blurBg, { backdropFilter: "blur(6px)", background: "rgba(0,0,0,0.3)", duration: 0.9 }, 0);
        }

        document.addEventListener('click', function(e) {
            const panel = document.getElementById('login-dropdown');
            const btn = document.getElementById('loginBtn');
            if (isLoginOpen && !panel.contains(e.target) && !btn.contains(e.target)) {
                toggleLogin();
            }
        });

        // ================= 3. 全屏显示 =================
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }

        // 背景预加载
        document.addEventListener("DOMContentLoaded", function() {
            const bgImg = new Image();
            const imgUrl = "{{ url_for('static', filename='bg.png') }}";
            bgImg.src = imgUrl;
            bgImg.onload = function() { document.body.classList.add('loaded'); };
            setTimeout(() => {
                if(!document.body.classList.contains('loaded')) { document.body.classList.add('loaded'); }
            }, 3000);
        });
    </script>
</body>
</html>
