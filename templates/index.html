<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* 顶部导航条 */
        .navbar {
            background-color: #161b22; display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; border-bottom: 1px solid #30363d; flex-shrink: 0;
        }
        .navbar-left { font-weight: 600; font-size: 18px; color: #ffffff; }
        .navbar-right { display: flex; gap: 20px; font-size: 14px; color: #8b949e; }
        .nav-item { cursor: pointer; transition: color 0.2s; user-select: none; }
        .nav-item:hover { color: #ffffff; }
        .nav-item.active { color: #58a6ff; }

        /* 主体结构 (默认隐藏，点击仓库显示) */
        .main-layout {
            display: none; flex: 1; overflow: hidden;
        }

        /* 左侧 1/3 (固定，不可拖动缩放) */
        .sidebar {
            width: 33.33%; min-width: 280px; height: 100%;
            background-color: #161b22; border-right: 1px solid #30363d;
            display: flex; flex-direction: column; padding: 16px; overflow-y: auto; flex-shrink: 0;
        }
        .sidebar-btn {
            width: 100%; padding: 12px; margin-bottom: 16px;
            background: #238636; color: white; border: 1px solid #238636;
            border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center;
            touch-action: manipulation;
        }
        .sidebar-btn:active { transform: scale(0.98); }
        
        .sidebar label { display: block; margin: 12px 0 4px; font-size: 13px; color: #8b949e; }
        .sidebar input {
            width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d;
            background-color: #0d1117; color: #c9d1d9; margin-bottom: 12px; outline: none;
        }
        .sidebar input:focus { border-color: #58a6ff; }
        .sidebar-confirm {
            width: 100%; padding: 10px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
            border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .sidebar-confirm:active { background: #30363d; }

        .robot-list-title { margin-top: 20px; font-size: 13px; color: #8b949e; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        #robot-list { list-style: none; margin-top: 8px; }
        #robot-list li {
            padding: 10px; border-bottom: 1px solid #30363d; cursor: pointer; border-radius: 4px;
            transition: background 0.2s; font-size: 14px;
        }
        #robot-list li:hover { background: #0d1117; }

        /* 右侧 2/3 (支持内容缩放和拖拽) */
        .main-content {
            flex: 1; height: 100%; position: relative;
            background-color: #0d1117; overflow: hidden;
        }

        /* 默认提示 */
        #placeholder-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #8b949e; font-size: 16px; text-align: center; pointer-events: none;
        }

        /* 可拖拽/缩放的独立卡片容器 */
        #floating-card-container {
            position: absolute; top: 10%; left: 10%;
            width: 260px; min-width: 220px; min-height: 100px;
            background: #161b22; border: 1px solid #30363d; border-radius: 16px; /* 圆润边缘 */
            padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: none; touch-action: none; /* 避免在卡片上触发系统手势 */
            /* 核心功能：支持自由缩放 */
            resize: both; overflow: auto; 
            text-align: left; /* 内容左对齐 */
        }

        /* 卡片内部文字 */
        #card-bot-name { font-size: 18px; font-weight: 600; color: #f0f6fc; margin-bottom: 8px; }
        #card-bot-token { font-size: 13px; color: #8b949e; word-wrap: break-word; }

        /* 手机端适配 */
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid #30363d; }
            .main-content { min-height: 60vh; }
            .navbar { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
            .navbar-right { gap: 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="navbar-left">gsbot编辑器</div>
        <div class="navbar-right">
            <div class="nav-item" onclick="switchMenu('repo')">仓库</div>
            <div class="nav-item" onclick="switchMenu('agent')">agent</div>
            <div class="nav-item" onclick="switchMenu('email')">邮箱</div>
            <div class="nav-item" onclick="switchMenu('settings')">设置</div>
            <div class="nav-item" onclick="switchMenu('mine')">我的</div>
        </div>
    </nav>

    <!-- 主界面 (初始隐藏) -->
    <div class="main-layout" id="mainLayout">
        <!-- 左侧 1/3 -->
        <div class="sidebar">
            <button class="sidebar-btn" id="new-robot-btn">+ 新建机器人</button>
            
            <label>机器人名字</label>
            <input type="text" id="bot-name-input" placeholder="例如：测试Bot">
            
            <label>机器人简介 (夹在中间)</label>
            <input type="text" id="bot-desc-input" placeholder="例如：专注TG开发">
            
            <label>输入你的机器人 Token</label>
            <input type="text" id="bot-token-input" placeholder="例如: 8506542682:AAH...">
            
            <button class="sidebar-confirm" id="confirm-btn">确定绑定</button>

            <div class="robot-list-title">我的机器人</div>
            <ul id="robot-list"></ul>
        </div>

        <!-- 右侧 2/3 -->
        <div class="main-content">
            <div id="placeholder-msg">请点击顶部导航【仓库】开始配置</div>
            
            <!-- 独立的悬浮拖拽卡片 -->
            <div id="floating-card-container">
                <div id="card-bot-name">未命名机器人</div>
                <div id="card-bot-token">未绑定 Token</div>
            </div>
        </div>
    </div>

    <script>
        // --- 顶部菜单切换逻辑 ---
        function switchMenu(menu) {
            const layout = document.getElementById('mainLayout');
            const placeholder = document.getElementById('placeholder-msg');
            const card = document.getElementById('floating-card-container');
            const navItems = document.querySelectorAll('.nav-item');
            
            navItems.forEach(el => el.classList.remove('active'));
            
            if(menu === 'repo') {
                layout.style.display = 'flex';
                const activeNav = Array.from(navItems).find(el => el.innerText === '仓库');
                if(activeNav) activeNav.classList.add('active');
                // 如果没新建机器人，展示提示；新建了就展示卡片
                if(card.style.display === 'none') {
                    placeholder.style.display = 'block';
                } else {
                    placeholder.style.display = 'none';
                }
            } else {
                layout.style.display = 'flex';
                placeholder.innerText = '当前页面暂未开放';
                placeholder.style.display = 'block';
                card.style.display = 'none';
                const clickedNav = Array.from(navItems).find(el => el.innerText === menu);
                if(clickedNav) clickedNav.classList.add('active');
            }
        }

        // --- 卡片实时更新 (输入即显示) ---
        const nameInput = document.getElementById('bot-name-input');
        const tokenInput = document.getElementById('bot-token-input');
        const cardName = document.getElementById('card-bot-name');
        const cardToken = document.getElementById('card-bot-token');

        nameInput.addEventListener('input', function() {
            cardName.innerText = this.value.trim() || '未命名机器人';
        });
        tokenInput.addEventListener('input', function() {
            const val = this.value.trim();
            cardToken.innerText = val ? `Token: ${val}` : '未绑定 Token';
        });

        // --- “新建机器人”显示悬浮卡片 ---
        document.getElementById('new-robot-btn').addEventListener('click', function() {
            document.getElementById('placeholder-msg').style.display = 'none';
            const card = document.getElementById('floating-card-container');
            card.style.display = 'block';
            // 重置卡片内容
            cardName.innerText = '未命名机器人';
            cardToken.innerText = '未绑定 Token';
        });

        // --- 实现自由拖拽移动 (触屏/鼠标通用) ---
        const dragCard = document.getElementById('floating-card-container');
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

        function dragMouseDown(e) {
            e = e || window.event;
            e.preventDefault();
            // 获取鼠标/触屏起始位置
            if(e.type === 'touchstart') {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
            } else {
                pos3 = e.clientX;
                pos4 = e.clientY;
            }
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
            document.ontouchend = closeDragElement;
            document.ontouchmove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            let clientX, clientY;
            if(e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            // 计算新位置
            pos1 = pos3 - clientX;
            pos2 = pos4 - clientY;
            pos3 = clientX;
            pos4 = clientY;
            // 设置卡片位置（限制在 2/3 区域避免拖出界）
            let newTop = dragCard.offsetTop - pos2;
            let newLeft = dragCard.offsetLeft - pos1;
            if(newTop < 0) newTop = 0;
            if(newLeft < 0) newLeft = 0;
            if(newTop > document.querySelector('.main-content').clientHeight - dragCard.clientHeight) newTop = document.querySelector('.main-content').clientHeight - dragCard.clientHeight;
            if(newLeft > document.querySelector('.main-content').clientWidth - dragCard.clientWidth) newLeft = document.querySelector('.main-content').clientWidth - dragCard.clientWidth;
            
            dragCard.style.top = newTop + "px";
            dragCard.style.left = newLeft + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
        }

        // 给卡片挂载拖拽事件
        dragCard.addEventListener('mousedown', dragMouseDown);
        dragCard.addEventListener('touchstart', dragMouseDown);

        // --- 确认绑定添加到列表 (保留原功能) ---
        document.getElementById('confirm-btn').addEventListener('click', function() {
            const name = nameInput.value.trim() || '未命名机器人';
            const token = tokenInput.value.trim();
            if(!token) { alert('请输入 Token！'); return; }
            const li = document.createElement('li');
            li.innerText = name;
            document.getElementById('robot-list').appendChild(li);
            alert(`✅ 机器人「${name}」配置完成！`);
        });
    </script>
</body>
</html>
