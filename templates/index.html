<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- 顶部导航 --- */
        .navbar {
            background-color: #161b22; display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; border-bottom: 1px solid #30363d; flex-shrink: 0;
        }
        .navbar-left { font-weight: 600; font-size: 18px; color: #ffffff; }
        .navbar-right { display: flex; gap: 20px; font-size: 14px; color: #8b949e; }
        .nav-item { cursor: pointer; transition: color 0.2s; user-select: none; }
        .nav-item:hover { color: #ffffff; }
        .nav-item.active { color: #58a6ff; }

        /* --- 页面容器 --- */
        #app-content { display: none; flex: 1; overflow: hidden; position: relative; }

        /* === 1. 仓库页面 (卡片网格) === */
        #repo-page {
            display: flex; flex-direction: column; height: 100%;
            position: absolute; inset: 0; background: #0d1117; overflow-y: auto;
        }
        .repo-toolbar {
            background: #161b22; padding: 12px 24px; border-bottom: 1px solid #30363d;
            display: flex; align-items: center;
        }
        .repo-toolbar button {
            padding: 8px 16px; background: #238636; border: 1px solid #238636;
            border-radius: 6px; color: white; font-weight: 600; cursor: pointer;
        }
        .repo-toolbar button:active { transform: scale(0.98); }
        
        .repo-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
            padding: 24px; width: 100%;
        }
        .repo-card {
            border: 2px solid #58a6ff; /* 蓝色包裹 */
            border-radius: 16px; padding: 16px; background: #161b22;
            text-align: left; cursor: pointer; transition: transform 0.1s;
        }
        .repo-card:active { transform: scale(0.96); }
        .repo-card h3 { font-size: 16px; color: #f0f6fc; margin-bottom: 4px; }
        .repo-card p { font-size: 12px; color: #8b949e; }
        
        /* 移动端适配：卡片自动变为一行 2 个 */
        @media (max-width: 768px) {
            .repo-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* === 2. 详情页面 (1/3 和 2/3 布局) === */
        #detail-page {
            display: none; height: 100%; width: 100%;
            background: #0d1117; flex-direction: row; overflow: hidden;
        }

        /* --- 左侧 1/3 (固定) --- */
        .sidebar {
            width: 33.33%; min-width: 280px; height: 100%;
            background-color: #161b22; border-right: 1px solid #30363d;
            display: flex; flex-direction: column; padding: 16px; overflow-y: auto; flex-shrink: 0;
        }
        .sidebar label { display: block; margin: 12px 0 4px; font-size: 13px; color: #8b949e; }
        .sidebar input {
            width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d;
            background-color: #0d1117; color: #c9d1d9; margin-bottom: 12px; outline: none;
            /* 输入框取消 placeholder 样式，让它彻底干净 */
        }
        .sidebar input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3); }
        .sidebar-confirm {
            width: 100%; padding: 10px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
            border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px;
        }
        .sidebar-confirm:active { background: #30363d; }

        /* 隐藏了之前的 新建机器人和机器人列表，因为你移到仓库了 */

        /* --- 右侧 2/3 (可滚动、可拖拽、可缩放) --- */
        .main-content {
            flex: 1; height: 100%; overflow-y: auto; /* 2/3 区域无限滚动 */
            background-color: #0d1117; position: relative;
        }
        #placeholder-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #8b949e; font-size: 16px; text-align: center; pointer-events: none;
        }

        /* 悬浮可拖拽卡片 */
        #floating-card-container {
            position: absolute; top: 20px; left: 20px;
            width: 260px; min-width: 220px; min-height: 100px;
            background: #161b22; border: 1px solid #30363d; border-radius: 16px;
            padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: none; touch-action: none;
            resize: both; overflow: auto; text-align: left;
        }
        #card-bot-name { font-size: 18px; font-weight: 600; color: #f0f6fc; margin-bottom: 8px; }
        #card-bot-token { font-size: 13px; color: #8b949e; word-wrap: break-word; }

        /* --- 自定义 Toast 提示 --- */
        #custom-toast {
            display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 12px 20px; color: #f0f6fc; font-size: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8); z-index: 999;
            border-left: 4px solid #238636;
        }
        #custom-toast.error { border-left: 4px solid #da3633; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid #30363d; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="navbar-left">gsbot编辑器</div>
        <div class="navbar-right">
            <div class="nav-item" onclick="switchMenu('repo')">仓库</div>
            <div class="nav-item" onclick="switchMenu('agent')">agent</div>
            <div class="nav-item" onclick="switchMenu('email')">邮箱</div>
            <div class="nav-item" onclick="switchMenu('settings')">设置</div>
            <div class="nav-item" onclick="switchMenu('mine')">我的</div>
        </div>
    </nav>

    <!-- 核心应用内容 -->
    <div id="app-content">
        
        <!-- ================= 仓库页面 (卡片网格) ================= -->
        <div id="repo-page">
            <div class="repo-toolbar">
                <button id="create-card-btn">+ 创建卡片</button>
            </div>
            <div class="repo-grid" id="repoGrid">
                <!-- 初始样稿卡片（方便你理解布局，点击可进入详情页） -->
                <div class="repo-card" onclick="openRobotDetail('测试Bot-1', 'Token绑定')">
                    <h3>测试Bot-1</h3>
                    <p>Token: 已绑定</p>
                </div>
                <div class="repo-card" onclick="openRobotDetail('宫水助手', '无状态')">
                    <h3>宫水助手</h3>
                    <p>Token: 未绑定</p>
                </div>
            </div>
        </div>

        <!-- ================= 详情配置页面 (1/3 与 2/3) ================= -->
        <div id="detail-page">
            <!-- 左侧 1/3 -->
            <div class="sidebar">
                <label>机器人名字</label>
                <input type="text" id="bot-name-input">

                <label>机器人简介</label>
                <input type="text" id="bot-desc-input">
                
                <label>机器人 Token</label>
                <input type="text" id="bot-token-input">
                
                <button class="sidebar-confirm" id="confirm-btn">确定绑定</button>
            </div>

            <!-- 右侧 2/3 (无限滚动区域) -->
            <div class="main-content" id="mainContent">
                <div id="placeholder-msg">请点击仓库里的卡片以开始配置</div>
                
                <!-- 可拖拽、可缩放的卡片 -->
                <div id="floating-card-container">
                    <div id="card-bot-name">未命名机器人</div>
                    <div id="card-bot-token">未绑定 Token</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 自定义 Toast 提示组件 -->
    <div id="custom-toast"></div>

    <script>
        const appContent = document.getElementById('app-content');
        const repoPage = document.getElementById('repo-page');
        const detailPage = document.getElementById('detail-page');
        const mainContent = document.getElementById('mainContent');
        const placeholderMsg = document.getElementById('placeholder-msg');
        const floatingCard = document.getElementById('floating-card-container');

        // === 1. 顶部菜单切换 ===
        function switchMenu(menu) {
            appContent.style.display = 'flex';
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(el => el.classList.remove('active'));

            if(menu === 'repo') {
                repoPage.style.display = 'flex';
                detailPage.style.display = 'none';
                const activeNav = Array.from(navItems).find(el => el.innerText === '仓库');
                if(activeNav) activeNav.classList.add('active');
            } else {
                repoPage.style.display = 'none';
                detailPage.style.display = 'none';
                const clickedNav = Array.from(navItems).find(el => el.innerText === menu);
                if(clickedNav) clickedNav.classList.add('active');
            }
        }
        // 初始自动进入仓库页面
        switchMenu('repo');

        // === 2. 仓库卡片 -> 进入详情 ===
        function openRobotDetail(name, status) {
            repoPage.style.display = 'none';
            detailPage.style.display = 'flex';
            
            // 更新右侧可拖动卡片的文字
            document.getElementById('card-bot-name').innerText = name;
            document.getElementById('card-bot-token').innerText = status;
            placeholderMsg.style.display = 'none';
            floatingCard.style.display = 'block';
            
            // 加载详情时，把名字顺便填入左侧输入框
            document.getElementById('bot-name-input').value = name;
        }

        // === 3. 输入框实时联动 ===
        const nameInput = document.getElementById('bot-name-input');
        const tokenInput = document.getElementById('bot-token-input');
        const cardName = document.getElementById('card-bot-name');
        const cardToken = document.getElementById('card-bot-token');

        nameInput.addEventListener('input', function() {
            cardName.innerText = this.value.trim() || '未命名机器人';
        });
        tokenInput.addEventListener('input', function() {
            const val = this.value.trim();
            cardToken.innerText = val ? `Token: ${val}` : '未绑定 Token';
            
            // 自动校验 Token 格式：必须是 数字+冒号+字母数字
            const regex = /^\d+:[A-Za-z0-9_]+$/;
            if(val.length > 0 && !regex.test(val)){
                this.style.borderColor = '#f85149'; // 红色
                this.style.boxShadow = '0 0 0 3px rgba(248, 81, 73, 0.3)';
            } else {
                this.style.borderColor = '#30363d'; // 恢复默认灰色，如果 focus 会自动蓝
                this.style.boxShadow = 'none';
            }
        });

        // === 4. 自定义 Toast 提示 (替换 alert) ===
        function showToast(msg, isError = false) {
            const toast = document.getElementById('custom-toast');
            toast.innerText = msg;
            toast.className = isError ? 'error' : '';
            toast.style.display = 'block';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        document.getElementById('confirm-btn').addEventListener('click', function() {
            const name = nameInput.value.trim() || '未命名机器人';
            const token = tokenInput.value.trim();
            if(!token) { 
                showToast('请先填写机器人的 Token', true); 
                return; 
            }
            const regex = /^\d+:[A-Za-z0-9_]+$/;
            if(!regex.test(token)) { 
                showToast('Token 格式不合法，请检查输入', true);
                return;
            }
            showToast(`✅ 机器人「${name}」绑定配置成功！`);
        });

        // === 5. 卡片拖拽和缩放 (平移) ===
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

        function dragMouseDown(e) {
            e = e || window.event; e.preventDefault();
            if(e.type === 'touchstart') { pos3 = e.touches[0].clientX; pos4 = e.touches[0].clientY; } 
            else { pos3 = e.clientX; pos4 = e.clientY; }
            document.onmouseup = closeDragElement; document.onmousemove = elementDrag;
            document.ontouchend = closeDragElement; document.ontouchmove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event; e.preventDefault();
            let clientX, clientY;
            if(e.type === 'touchmove') { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } 
            else { clientX = e.clientX; clientY = e.clientY; }
            pos1 = pos3 - clientX; pos2 = pos4 - clientY;
            pos3 = clientX; pos4 = clientY;
            
            let newTop = floatingCard.offsetTop - pos2;
            let newLeft = floatingCard.offsetLeft - pos1;
            
            // 限制在 2/3 容器内
            const mHeight = mainContent.clientHeight;
            const mWidth = mainContent.clientWidth;
            if(newTop < 0) newTop = 0;
            if(newLeft < 0) newLeft = 0;
            if(newTop > mHeight - floatingCard.clientHeight) newTop = mHeight - floatingCard.clientHeight;
            if(newLeft > mWidth - floatingCard.clientWidth) newLeft = mWidth - floatingCard.clientWidth;
            
            floatingCard.style.top = newTop + "px";
            floatingCard.style.left = newLeft + "px";
        }

        function closeDragElement() {
            document.onmouseup = null; document.onmousemove = null;
            document.ontouchend = null; document.ontouchmove = null;
        }
        floatingCard.addEventListener('mousedown', dragMouseDown);
        floatingCard.addEventListener('touchstart', dragMouseDown);

        // === 6. “创建卡片”目前没有任何效果 (按要求) ===
        document.getElementById('create-card-btn').addEventListener('click', function() {
            showToast('点击创建卡片 (目前无任何效果)');
        });

        // 让空白的区域点击不显示任何东西
        document.addEventListener('click', function(e) {
            if(e.target === mainContent || e.target === placeholderMsg) {
                // 点了右边空白，不做任何响应（保持当前状态）
            }
        });
    </script>
</body>
</html>
