<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .navbar { background-color: #161b22; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid #30363d; flex-shrink: 0; z-index: 10; }
        .navbar-left { font-weight: 600; font-size: 18px; color: #ffffff; letter-spacing: 0.5px; }
        .navbar-right { display: flex; gap: 20px; font-size: 14px; }
        .nav-item { cursor: pointer; transition: color 0.2s; color: #ffffff; user-select: none; -webkit-tap-highlight-color: transparent; }
        .nav-item:hover { color: #c9d1d9; }
        .nav-item.active { color: #58a6ff; }

        #app-content { display: none; flex: 1; overflow: hidden; position: relative; flex-direction: column; }
        #repo-page { display: none; flex-direction: column; height: 100%; width: 100%; background: #0d1117; overflow-y: auto; position: absolute; inset: 0; }
        .repo-toolbar { background: #161b22; padding: 6px 40px; border-bottom: 1px solid #30363d; display: flex; justify-content: flex-end; align-items: center; height: 44px; flex-shrink: 0; }
        .repo-toolbar button { padding: 6px 16px; background: #238636; border: none; border-radius: 6px; color: white; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
        .repo-toolbar button:active { transform: scale(0.96); }
        .repo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; padding: 24px; width: 100%; flex: 1; align-content: start; }
        .repo-card { border: 2px solid #58a6ff; border-radius: 12px; padding: 16px; background: #161b22; text-align: left; cursor: pointer; transition: transform 0.1s; min-height: 80px; }
        .repo-card:active { transform: scale(0.96); }
        .repo-card h3 { font-size: 16px; color: #f0f6fc; margin-bottom: 4px; }
        .repo-card p { font-size: 12px; color: #8b949e; word-break: break-all; }

        #detail-page { display: none; height: 100%; width: 100%; flex-direction: row; overflow: hidden; position: absolute; inset: 0; }
        .sidebar { width: 33.33%; min-width: 280px; height: 100%; background-color: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; padding: 16px; overflow-y: auto; flex-shrink: 0; }
        .sidebar label { display: block; margin: 12px 0 4px; font-size: 13px; color: #8b949e; }
        .sidebar input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: #c9d1d9; margin-bottom: 14px; outline: none; }
        .sidebar input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3); }
        .sidebar-confirm { width: 100%; padding: 10px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; transition: background 0.2s; }
        .sidebar-confirm:active { background: #30363d; }

        .main-content { flex: 1; height: 100%; overflow: auto; position: relative; background-color: #0d1117; -webkit-overflow-scrolling: touch; }
        .canvas { width: 3000px; height: 3000px; position: relative; background: radial-gradient(circle at 20% 30%, #161b22 0%, #0d1117 100%); }
        #placeholder-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #8b949e; font-size: 16px; text-align: center; pointer-events: none; }
        #floating-card { position: absolute; display: none; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; min-width: 220px; min-height: 120px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); touch-action: none; text-align: left; resize: both; overflow: auto; cursor: grab; }
        #floating-card:active { cursor: grabbing; }
        #card-bot-name { font-size: 18px; font-weight: 600; color: #f0f6fc; margin-bottom: 8px; }
        #card-bot-api { font-size: 13px; color: #8b949e; word-wrap: break-word; }

        #custom-toast { display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #21262d; border: 1px solid #30363d; border-radius: 8px; padding: 12px 24px; color: #f0f6fc; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); z-index: 999; border-left: 4px solid #238636; white-space: nowrap; }
        #custom-toast.error { border-left: 4px solid #da3633; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid #30363d; }
            .main-content { height: 60vh; }
            #custom-toast { white-space: normal; max-width: 90%; text-align: center; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">gsbot编辑器</div>
        <div class="navbar-right">
            {% if current_user.is_authenticated %}
                <div class="nav-item" onclick="switchMenu('repo')">仓库</div>
                <div class="nav-item" onclick="switchMenu('agent')">agent</div>
                <div class="nav-item" onclick="switchMenu('email')">邮箱</div>
                <div class="nav-item" onclick="switchMenu('settings')">设置</div>
                {% if current_user.is_admin %}
                    <div class="nav-item" onclick="window.location.href='/admin'">管理后台</div>
                {% endif %}
                <div class="nav-item" onclick="window.location.href='/logout'">退出</div>
            {% else %}
                <div class="nav-item" onclick="window.location.href='/login'">登录</div>
                <div class="nav-item" onclick="window.location.href='/register'">注册</div>
            {% endif %}
        </div>
    </nav>

    <div id="app-content">
        <div id="repo-page">
            <div class="repo-toolbar"><button id="create-card-btn">+ 创建卡片</button></div>
            <div class="repo-grid" id="repoGrid"></div>
        </div>

        <div id="detail-page">
            <div class="sidebar">
                <label>机器人名字</label>
                <input type="text" id="bot-name-input" placeholder="例：测试Bot">
                <label>机器人简介</label>
                <input type="text" id="bot-desc-input" placeholder="例：专注TG开发">
                <label>机器人 API</label>
                <input type="text" id="bot-api-input" placeholder="例：123456:ABCdef">
                <button class="sidebar-confirm" id="confirm-btn">确定绑定</button>
            </div>

            <div class="main-content" id="mainContent">
                <div class="canvas" id="canvas">
                    <div id="placeholder-msg">请先输入机器人的名字和 API</div>
                    <div id="floating-card">
                        <div id="card-bot-name">未命名机器人</div>
                        <div id="card-bot-api">API: 未绑定</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="custom-toast"></div>

    <script>
        const appContent = document.getElementById('app-content');
        const repoPage = document.getElementById('repo-page');
        const detailPage = document.getElementById('detail-page');
        const repoGrid = document.getElementById('repoGrid');
        const createBtn = document.getElementById('create-card-btn');
        const mainContent = document.getElementById('mainContent');
        const canvas = document.getElementById('canvas');
        const placeholderMsg = document.getElementById('placeholder-msg');
        const floatingCard = document.getElementById('floating-card');
        const cardName = document.getElementById('card-bot-name');
        const cardApi = document.getElementById('card-bot-api');
        const nameInput = document.getElementById('bot-name-input');
        const apiInput = document.getElementById('bot-api-input');
        const confirmBtn = document.getElementById('confirm-btn');
        const toast = document.getElementById('custom-toast');
        let currentRepoCard = null;
        let isDragging = false;

        // 首次加载默认显示仓库
        appContent.style.display = 'flex';
        repoPage.style.display = 'flex';
        detailPage.style.display = 'none';

        function switchMenu(menu) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (menu === 'repo') {
                repoPage.style.display = 'flex';
                detailPage.style.display = 'none';
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            } else {
                repoPage.style.display = 'none';
                detailPage.style.display = 'none';
                const items = document.querySelectorAll('.nav-item');
                for(let i=0; i<items.length; i++) if(items[i].innerText === menu) items[i].classList.add('active');
            }
        }

        function createRepoCard(name, api) {
            const card = document.createElement('div');
            card.className = 'repo-card';
            card.innerHTML = `<h3>${name}</h3><p>API: ${api}</p>`;
            card.addEventListener('click', function() { openDetailPage(name, api, card); });
            repoGrid.appendChild(card);
            return card;
        }

        createBtn.addEventListener('click', function() {
            createRepoCard('未命名api', '未绑定');
            showToast('✅ 已创建新卡片');
        });

        function openDetailPage(name, api, repoCardElement) {
            currentRepoCard = repoCardElement;
            repoPage.style.display = 'none';
            detailPage.style.display = 'flex';
            nameInput.value = name === '未命名api' ? '' : name;
            apiInput.value = (api === '未绑定' || api === '') ? '' : api;
            mainContent.scrollTop = 0; mainContent.scrollLeft = 0;
            floatingCard.style.display = 'none';
            placeholderMsg.style.display = 'block';
        }

        function updateCardFromInputs() {
            const name = nameInput.value.trim();
            const api = apiInput.value.trim();
            if (name && api) {
                floatingCard.style.display = 'block';
                placeholderMsg.style.display = 'none';
                floatingCard.style.top = '50%'; floatingCard.style.left = '50%';
                floatingCard.style.transform = 'translate(-50%, -50%)';
                cardName.innerText = name; cardApi.innerText = `API: ${api}`;
            } else {
                floatingCard.style.display = 'none'; placeholderMsg.style.display = 'block';
            }
        }
        nameInput.addEventListener('input', updateCardFromInputs);
        apiInput.addEventListener('input', function() {
            const val = this.value.trim(); const regex = /^\d+:[A-Za-z0-9_]+$/;
            if (val.length > 0 && !regex.test(val)) {
                this.style.borderColor = '#f85149'; this.style.boxShadow = '0 0 0 3px rgba(248, 81, 73, 0.3)';
            } else {
                this.style.borderColor = '#30363d'; this.style.boxShadow = 'none';
            }
            updateCardFromInputs();
        });

        confirmBtn.addEventListener('click', async function() {
            const name = nameInput.value.trim() || '未命名api';
            const api = apiInput.value.trim();
            if (!api) { showToast('❌ 请填写机器人的 API', true); return; }
            const regex = /^\d+:[A-Za-z0-9_]+$/;
            if (!regex.test(api)) { showToast('❌ API 格式不正确', true); return; }

            try {
                const res = await fetch('/api/set_custom_command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bot_token: api, command: "/gs", response: "你好" })
                });
                const data = await res.json();
                if(data.ok) {
                    if (currentRepoCard) {
                        currentRepoCard.querySelector('h3').innerText = name;
                        currentRepoCard.querySelector('p').innerText = `API: ${api}`;
                    }
                    showToast(`✅ ${data.desc}`);
                } else {
                    showToast(`❌ ${data.desc}`, true);
                }
            } catch(e) {
                showToast(`❌ 请求失败：${e.message}`, true);
            }
        });

        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        function dragStart(e) {
            e = e || window.event; e.preventDefault();
            isDragging = true;
            floatingCard.style.transform = 'none';
            if (e.type === 'touchstart') { pos3 = e.touches[0].clientX; pos4 = e.touches[0].clientY; }
            else { pos3 = e.clientX; pos4 = e.clientY; }
            document.onmouseup = closeDragElement; document.onmousemove = elementDrag;
            document.ontouchend = closeDragElement; document.ontouchmove = elementDrag;
        }
        function elementDrag(e) {
            e = e || window.event; e.preventDefault();
            let clientX, clientY;
            if (e.type === 'touchmove') { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
            else { clientX = e.clientX; clientY = e.clientY; }
            pos1 = pos3 - clientX; pos2 = pos4 - clientY;
            pos3 = clientX; pos4 = clientY;
            let newTop = floatingCard.offsetTop - pos2;
            let newLeft = floatingCard.offsetLeft - pos1;
            const maxTop = canvas.clientHeight - floatingCard.clientHeight;
            const maxLeft = canvas.clientWidth - floatingCard.clientWidth;
            if (newTop < 0) newTop = 0; if (newLeft < 0) newLeft = 0;
            if (newTop > maxTop) newTop = maxTop; if (newLeft > maxLeft) newLeft = maxLeft;
            floatingCard.style.top = newTop + 'px'; floatingCard.style.left = newLeft + 'px';
        }
        function closeDragElement() {
            isDragging = false;
            document.onmouseup = null; document.onmousemove = null;
            document.ontouchend = null; document.ontouchmove = null;
        }
        floatingCard.addEventListener('mousedown', dragStart);
        floatingCard.addEventListener('touchstart', dragStart);

        function showToast(msg, isError = false) {
            toast.innerText = msg; toast.className = isError ? 'error' : '';
            toast.style.display = 'block';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
        document.addEventListener('touchmove', function(e) { if(!isDragging) return; }, { passive: false });
    </script>
</body>
</html>
