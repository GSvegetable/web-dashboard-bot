<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column;
        }

        /* 顶部导航条 */
        .navbar {
            background-color: #161b22; display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; border-bottom: 1px solid #30363d; flex-shrink: 0;
        }
        .navbar-left { font-weight: 600; font-size: 18px; color: #ffffff; }
        .navbar-right { display: flex; gap: 20px; font-size: 14px; color: #8b949e; }
        .nav-item { cursor: pointer; transition: color 0.2s; }
        .nav-item:hover { color: #ffffff; }

        /* 主体双栏布局 (1/3 和 2/3) */
        .main-layout {
            display: flex; flex: 1; overflow: hidden;
        }

        /* 左栏 (1/3) */
        .sidebar {
            width: 33.33%; min-width: 280px;
            background-color: #161b22; border-right: 1px solid #30363d;
            display: flex; flex-direction: column; padding: 16px; overflow-y: auto;
        }
        .sidebar-btn {
            width: 100%; padding: 12px; margin-bottom: 16px;
            background: #238636; color: white; border: 1px solid #238636;
            border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center;
        }
        .sidebar-btn:active { transform: scale(0.98); }
        
        .sidebar label { display: block; margin: 12px 0 4px; font-size: 13px; color: #8b949e; }
        .sidebar input {
            width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d;
            background-color: #0d1117; color: #c9d1d9; margin-bottom: 12px; outline: none;
        }
        .sidebar input:focus { border-color: #58a6ff; }
        .sidebar-confirm {
            width: 100%; padding: 10px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
            border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .sidebar-confirm:active { background: #30363d; }

        .robot-list-title { margin-top: 20px; font-size: 13px; color: #8b949e; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        #robot-list { list-style: none; margin-top: 8px; }
        #robot-list li {
            padding: 10px; border-bottom: 1px solid #30363d; cursor: pointer; border-radius: 4px;
            transition: background 0.2s; font-size: 14px;
        }
        #robot-list li:hover { background: #0d1117; }

        /* 右栏 (2/3) */
        .main-content {
            width: 66.66%; flex: 1;
            background-color: #0d1117; padding: 40px; overflow-y: auto;
            display: flex; justify-content: center; align-items: flex-start;
        }

        /* 初始状态提示 */
        #welcome-message {
            color: #8b949e; text-align: center; margin-top: 80px; font-size: 16px;
            width: 100%; max-width: 500px;
        }

        /* 默认配置卡片 */
        .config-card {
            background-color: #161b22; border: 1px solid #30363d; border-radius: 6px;
            padding: 24px; width: 100%; max-width: 500px; display: none;
        }
        .config-card label { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 500; color: #f0f6fc; }
        .config-card input {
            width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d;
            background-color: #0d1117; color: #c9d1d9; font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        .config-card input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3); }
        .config-card button {
            width: 100%; margin-top: 24px; padding: 10px 16px;
            background-color: #238636; color: #ffffff; border: 1px solid #238636;
            border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer;
        }
        .config-card button:active { transform: scale(0.98); }

        /* 新建机器人的黑色卡片 */
        #new-robot-panel {
            display: none; width: 100%; max-width: 500px;
            background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px;
            padding: 60px 20px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        #new-robot-panel h1 { color: #f0f6fc; margin: 0; font-size: 24px; font-weight: 600; }
        #new-robot-panel p { color: #8b949e; margin-top: 12px; font-size: 14px; }

        /* 手机端自适应处理 */
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid #30363d; padding: 16px; }
            .main-content { width: 100%; padding: 20px; align-items: center; }
            .navbar { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
            .navbar-right { gap: 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">gsbot编辑器</div>
        <div class="navbar-right">
            <div class="nav-item">仓库</div>
            <div class="nav-item">agent</div>
            <div class="nav-item">邮箱</div>
            <div class="nav-item">设置</div>
            <div class="nav-item">我的</div>
        </div>
    </nav>

    <div class="main-layout">
        <div class="sidebar">
            <button class="sidebar-btn" id="new-robot-btn">+ 新建机器人</button>
            
            <label>机器人名字</label>
            <input type="text" id="bot-name-input" placeholder="例如：测试Bot">
            
            <label>输入你的机器人 Token</label>
            <input type="text" id="bot-token-input" placeholder="例如: 8506542682:AAH...">
            
            <button class="sidebar-confirm" id="confirm-btn">确定绑定</button>

            <div class="robot-list-title">我的机器人</div>
            <ul id="robot-list"></ul>
        </div>

        <!-- 右栏 -->
        <div class="main-content">
            <!-- 1. 初始空白提示 -->
            <div id="welcome-message">请点击左侧「+ 新建机器人」以开始</div>

            <!-- 2. 默认配置面板 -->
            <div class="config-card" id="default-panel">
                <label>绑定指令</label>
                <input type="text" id="command" placeholder="例如: /gs" value="/gs" />

                <label>绑定的内容</label>
                <input type="text" id="content" placeholder="例如: 你好" value="你好" />
                
                <button id="run_btn">🚀 运行绑定</button>
                <div id="status" style="margin-top:16px; font-size:13px; text-align:center; padding:8px; border-radius:6px; background-color:#21262d; color:#8b949e;">等待配置...</div>
            </div>

            <!-- 3. 新建机器人的纯黑卡片 -->
            <div id="new-robot-panel">
                <h1 id="robot-name-display">未命名机器人</h1>
                <p id="robot-token-display">Token：未绑定</p>
            </div>
        </div>
    </div>

    <script>
        const welcomeMsg = document.getElementById('welcome-message');
        const defaultPanel = document.getElementById('default-panel');
        const newRobotPanel = document.getElementById('new-robot-panel');
        const newRobotBtn = document.getElementById('new-robot-btn');
        const confirmBtn = document.getElementById('confirm-btn');
        const nameInput = document.getElementById('bot-name-input');
        const tokenInput = document.getElementById('bot-token-input');
        const robotNameDisplay = document.getElementById('robot-name-display');
        const robotTokenDisplay = document.getElementById('robot-token-display');
        const robotList = document.getElementById('robot-list');

        // 1. 点击“新建机器人” -> 右边切换到黑色卡片
        newRobotBtn.addEventListener('click', function() {
            welcomeMsg.style.display = 'none';
            defaultPanel.style.display = 'none';
            newRobotPanel.style.display = 'block';
            
            robotNameDisplay.innerText = '未命名机器人';
            robotTokenDisplay.innerText = 'Token：未绑定';
        });

        // 2. 点击“确定绑定” -> 右边更新并自动切换到配置面板
        confirmBtn.addEventListener('click', function() {
            const name = nameInput.value.trim() || '未命名机器人';
            const token = tokenInput.value.trim();
            
            if(!token) {
                alert('请输入 Token！');
                return;
            }

            // 更新卡片内容
            robotNameDisplay.innerText = name;
            robotTokenDisplay.innerText = 'Token：已绑定';

            // 添加到左侧列表
            const li = document.createElement('li');
            li.innerText = name;
            li.onclick = function() {
                // 后续点击列表项查看机器人时，可以显示配置面板（预留接口）
                defaultPanel.style.display = 'block';
                newRobotPanel.style.display = 'none';
                welcomeMsg.style.display = 'none';
            };
            robotList.appendChild(li);

            // 清空左侧输入框并给出反馈
            nameInput.value = '';
            tokenInput.value = '';
            alert(`✅ 机器人「${name}」绑定并添加成功！`);

            // 【重要】绑定成功后，自动隐藏黑色卡片，显示配置面板
            newRobotPanel.style.display = 'none';
            defaultPanel.style.display = 'block';
        });

        // 3. 运行绑定按钮（点击无效果）
        document.getElementById('run_btn').addEventListener('click', function() {
            const status = document.getElementById('status');
            status.className = '';
            status.innerText = '点击无任何反应 (纯 UI 演示)';
        });
    </script>
</body>
</html>
