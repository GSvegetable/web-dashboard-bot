<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>创建作品</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* 依然保持巨大的无限滑动空间 */
            width: 10000px;
            height: 10000px;
            overflow: auto;
            background-color: #000000; /* 纯黑背景，删掉白点 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        body::-webkit-scrollbar {
            display: none;
        }

        /* 左侧悬浮面板：灰色、拉长、完美等距 */
        .left-panel {
            position: fixed;
            /* 统一使用 6vw，保证上、下、左的距离绝对相等 */
            top: 6vw;
            bottom: 6vw;
            left: 6vw;
            /* 宽度从 48vw 增加到了 60vw，往右边拉长 */
            width: 60vw;
            background-color: #2c2c2e; /* 改为灰色 */
            border-radius: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 左侧纯灰色、完美等距的面板 -->
    <div class="left-panel"></div>

    <script>
        // 页面加载后，依然准确定位到画布正中心
        window.addEventListener('load', function() {
            window.scrollTo(5000, 5000);
        });
    </script>
</body>
</html>
