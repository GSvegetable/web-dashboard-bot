<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>创建作品</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #000000;
            /* 关键修复：改为 0px 到 2px 的纯白硬边缘，彻底解决抗锯齿导致的发灰问题 */
            background-image: radial-gradient(circle, #ffffff 0px, #ffffff 2px, transparent 2px);
            background-size: 28px 28px; 
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- 纯黑背景 + 真正亮白的 2px 纯色点阵 -->
</body>
</html>
