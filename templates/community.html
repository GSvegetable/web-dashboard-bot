<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>社区 - 宫水大世界</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0d1117; 
            color: #e5e7eb;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        /* 模拟涂鸦背景 */
        .doodle-bg {
            background-color: #0d1117;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* 滚动条隐藏但可滚动 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .chat-item:hover { background: rgba(255,255,255,0.05); }

        @media (max-width: 768px) {
            .left-panel { width: 100% !important; display: flex; flex-direction: column; }
            .right-panel { display: none; }
        }
    </style>
</head>
<body>
    <div class="flex h-screen w-full doodle-bg overflow-hidden">
        
        <!-- ==================== 左侧：聊天列表（空壳框架） ==================== -->
        <div class="left-panel w-[380px] min-w-[380px] h-full border-r border-[#30363d] flex flex-col bg-[#0d1117]/80 backdrop-blur-sm">
            
            <!-- 顶部：标题栏 -->
            <div class="p-4 flex items-center justify-between border-b border-[#30363d] bg-[#161b22]">
                <div class="flex items-center gap-2 text-xl font-bold text-white">
                    <span class="bg-red-500 text-white text-xs rounded-full w-6 h-6 flex items-center justify-center">✈</span>
                    Telegram
                </div>
                <button class="text-gray-400 hover:text-white"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
            </div>

            <!-- 搜索框 -->
            <div class="p-3 bg-[#161b22]">
                <div class="relative bg-[#0d1117] rounded-lg border border-[#30363d] flex items-center px-3">
                    <svg width="16" height="16" class="text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" placeholder="搜索聊天" class="w-full bg-transparent border-none outline-none text-sm py-2 px-2 text-white placeholder-gray-500">
                </div>
            </div>

            <!-- 标签分类 -->
            <div class="flex gap-2 px-4 py-3 overflow-x-auto border-b border-[#30363d] whitespace-nowrap scrollbar-hide">
                <span class="px-3 py-1 rounded-full bg-[#2b5278] text-white text-xs font-medium">全部 0</span>
                <span class="px-3 py-1 rounded-full bg-[#30363d] text-gray-400 text-xs font-medium">私信 0</span>
                <span class="px-3 py-1 rounded-full bg-[#30363d] text-gray-400 text-xs font-medium">频道 0</span>
                <span class="px-3 py-1 rounded-full bg-[#30363d] text-gray-400 text-xs font-medium">bot 0</span>
                <span class="px-3 py-1 rounded-full bg-[#30363d] text-gray-400 text-xs font-medium">群组 0</span>
            </div>

            <!-- 聊天列表（完全为空） -->
            <div class="flex-1 overflow-y-auto py-2 flex items-center justify-center text-gray-500 text-sm">
                <span>暂无聊天记录，快去联系好友吧</span>
            </div>

            <!-- 底部导航（仿 App 风格，UI 框架） -->
            <div class="flex justify-around items-center py-3 px-2 border-t border-[#30363d] bg-[#161b22]">
                <div class="flex flex-col items-center gap-1 cursor-pointer text-[#6ab4f7]">
                    <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    <span class="text-[10px] font-medium">聊天</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer text-gray-400 hover:text-white">
                    <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                    <span class="text-[10px] font-medium">联系人</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer text-gray-400 hover:text-white">
                    <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    <span class="text-[10px] font-medium">设置</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer text-gray-400 hover:text-white">
                    <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span class="text-[10px] font-medium">个人资料</span>
                </div>
            </div>
            
        </div>

        <!-- ==================== 右侧：聊天窗口（空的，占位符） ==================== -->
        <div class="right-panel flex-1 h-full flex flex-col bg-transparent relative">
            
            <!-- 顶部：对话标题栏 -->
            <div class="p-4 flex items-center justify-between border-b border-[#30363d] bg-[#161b22]/80 backdrop-blur-sm">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='/'" class="text-gray-400 hover:text-white">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                    <div class="w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-white">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M6 2a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6H6z"/></svg>
                    </div>
                    <span class="text-lg font-semibold text-white">我的收藏</span>
                </div>
                <div class="flex items-center gap-4 text-gray-400">
                    <button class="hover:text-white"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                    <button class="hover:text-white"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
                </div>
            </div>

            <!-- 中间：对话区域（完全空置，无气泡、无日期、无文件） -->
            <div class="flex-1 overflow-y-auto p-4 pb-24 flex items-center justify-center text-gray-500 text-sm">
                <div class="text-center">
                    <div class="text-6xl mb-4 text-[#30363d]">💬</div>
                    <div>暂无消息</div>
                    <div class="text-xs mt-1 text-gray-600">所有对话将显示在这里</div>
                </div>
            </div>

            <!-- 底部：输入框（UI 框架，可点击输入） -->
            <div class="absolute bottom-0 w-full p-4 bg-gradient-to-t from-[#0d1117] via-[#0d1117] to-transparent">
                <div class="flex items-center gap-3 bg-[#161b22] border border-[#30363d] rounded-2xl px-4 py-2">
                    <button class="text-gray-400 hover:text-white"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
                    <input type="text" placeholder="输入消息" class="flex-1 bg-transparent border-none outline-none text-sm text-white placeholder-gray-500 py-1">
                    <button class="text-gray-400 hover:text-white"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/></svg></button>
                    <button class="text-[#6ab4f7] hover:text-[#88c8ff]"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></button>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
