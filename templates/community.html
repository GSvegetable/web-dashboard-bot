<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>频道动态 - 宫水大世界</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0d1117; 
            color: #e5e7eb;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        
        /* 滚动条保持清爽 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* 发帖框样式 */
        .post-input-area {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
        }
        .post-input-area:focus-within {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }
        
        /* 空状态动画 */
        .empty-state-icon {
            animation: floatPulse 3s ease-in-out infinite;
        }
        @keyframes floatPulse {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }

        /* 回复/转发/点赞按钮的悬浮效果 */
        .action-btn:hover { background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>
    
    <div class="w-full max-w-xl mx-auto px-4 pb-12 relative z-10">
        
        <!-- ==================== 顶部导航栏 ==================== -->
        <div class="sticky top-0 bg-[#0d1117]/80 backdrop-blur-lg border-b border-[#30363d] py-3 px-2 z-20 flex justify-between items-center -mx-2">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='/'" class="text-gray-400 hover:text-white transition text-sm flex items-center gap-1">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <span class="text-base font-bold text-white tracking-wide"># 宫水社区</span>
            </div>
            <div class="flex gap-4 text-gray-500 text-xs">
                <span>首页</span>
                <span>最新</span>
                <span>热门</span>
            </div>
        </div>

        <!-- ==================== 发帖区（框架） ==================== -->
        <div class="post-input-area mt-4 p-4 flex gap-3 items-start">
            <!-- 默认占位头像 -->
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-gray-600 to-gray-800 flex-shrink-0 flex items-center justify-center text-gray-300 text-xs">我</div>
            
            <!-- 输入框和按钮 -->
            <div class="flex-1 flex flex-col gap-2">
                <input type="text" placeholder="有什么新鲜事？在这里发消息..." class="w-full bg-transparent border-none outline-none text-sm text-white placeholder-gray-500 py-1">
                <div class="flex justify-between items-center mt-1">
                    <div class="flex gap-2 text-gray-500">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    </div>
                    <button class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white text-xs font-bold px-4 py-1.5 rounded-full transition active:scale-95">发布</button>
                </div>
            </div>
        </div>

        <!-- ==================== 信息流区域 ==================== -->
        <div class="mt-6 flex flex-col gap-3 min-h-[60vh]">
            
            <!-- ✅ 如果没有任何人发帖，展示这个精美的“空状态” -->
            <div class="flex flex-col items-center justify-center py-20 text-center border border-[#30363d] rounded-2xl bg-[#161b22]/50">
                <div class="empty-state-icon text-6xl mb-4 text-gray-500">
                    🕊️
                </div>
                <h3 class="text-base font-semibold text-white">这里空空的</h3>
                <p class="text-sm text-gray-500 max-w-[200px] mt-1 leading-relaxed">
                    还没有人在这里发过消息。<br>成为第一个发言的人吧！
                </p>
            </div>

            <!-- 
            ============================================================
            【重要提示】：如果有人发帖了，帖子会显示在下面这个区域。
            你之后通过 JS 动态往这下面插入帖子即可。
            帖子卡片的结构（你不必现在用，这是参考）：
            
            <div class="flex gap-3 p-4 border-b border-[#30363d]">
                <div class="w-10 h-10 rounded-full bg-gray-700 flex-shrink-0"></div>
                <div class="flex-1">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-white text-sm">用户昵称</span>
                            <span class="text-xs text-gray-500">@username · 1小时前</span>
                        </div>
                        <div class="text-gray-500 text-xs">···</div>
                    </div>
                    <div class="mt-1 text-sm text-white leading-relaxed">这是帖子内容。</div>
                    <div class="mt-2 flex gap-4 text-gray-500 text-xs">
                        <span class="flex items-center gap-1 cursor-pointer action-btn px-2 py-1 rounded-full">💬 0</span>
                        <span class="flex items-center gap-1 cursor-pointer action-btn px-2 py-1 rounded-full">🔁 0</span>
                        <span class="flex items-center gap-1 cursor-pointer action-btn px-2 py-1 rounded-full">❤️ 0</span>
                        <span class="flex items-center gap-1 cursor-pointer action-btn px-2 py-1 rounded-full">📌</span>
                    </div>
                </div>
            </div>
            ============================================================
            -->

        </div>

    </div>
</body>
</html>
