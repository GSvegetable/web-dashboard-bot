<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>社区动态 - 宫水大世界</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0a0c10; 
            color: #e5e7eb;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #2a2d35; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .post-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 16px 20px;
            margin-bottom: 8px;
        }
        .post-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .code-block {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .code-block:hover { border-color: #58a6ff; }
        .code-content { display: none; margin-top: 10px; overflow-x: auto; }

        .action-btn {
            color: #8b949e;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.05); color: #e5e7eb; }
        .action-btn.liked { color: #f91880; }

        .glass-bg {
            background: rgba(10, 12, 16, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body>
    <!-- 移除居中限制，改为 w-full 铺满 -->
    <div class="w-full px-4 pb-12 relative z-10">
        
        <!-- 顶部导航（仅保留返回按钮） -->
        <div class="glass-bg sticky top-0 border-b border-[#30363d] py-3 px-2 z-20 flex items-center -mx-2">
            <button onclick="window.location.href='/'" class="text-gray-400 hover:text-white transition text-sm flex items-center gap-1">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
        </div>

        <!-- 搜索与过滤 -->
        <div class="mt-4 flex flex-col sm:flex-row gap-3">
            <div class="flex-1 relative">
                <svg class="absolute left-3 top-2.5 text-gray-500" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="搜索帖子、作者..." class="w-full bg-[#161b22] border border-[#30363d] rounded-full pl-10 pr-4 py-2 text-sm text-white placeholder-gray-500 outline-none focus:border-[#58a6ff] transition">
            </div>
            <select id="timeFilter" class="bg-[#161b22] border border-[#30363d] rounded-full px-4 py-2 text-sm text-white outline-none focus:border-[#58a6ff]">
                <option value="all">全部时间</option>
                <option value="today">今日</option>
                <option value="week">本周</option>
                <option value="month">本月</option>
            </select>
        </div>

        <!-- 帖子信息流（已删除空状态） -->
        <div id="postFeed" class="mt-4 min-h-[40vh]">
            <div id="postList" class="flex-col gap-2"></div>
        </div>

        <!-- 加载更多 -->
        <div id="loadMoreArea" class="hidden mt-4 text-center">
            <button id="loadMoreBtn" class="text-gray-400 hover:text-white text-sm border border-[#30363d] px-4 py-1.5 rounded-full transition">加载更多</button>
        </div>
    </div>

    <!-- ✅ 右下角浮动加号按钮 -->
    <button id="composeFloatingBtn" class="fixed bottom-8 right-8 z-40 w-14 h-14 rounded-full bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white text-4xl font-light shadow-lg flex items-center justify-center transition active:scale-95">
        +
    </button>

    <!-- ✅ 新增：发帖弹窗 -->
    <div id="composeModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[9999] hidden flex items-center justify-center">
        <div class="bg-[#161b22] border border-[#30363d] rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-3">发布动态</h3>
            <textarea id="modalPostContent" rows="4" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 outline-none focus:border-[#58a6ff] resize-none" placeholder="今天有什么新鲜事？"></textarea>
            
            <!-- 进阶发帖选项（可折叠） -->
            <div class="mt-2 flex flex-col gap-2">
                <div class="flex gap-2 text-xs text-gray-400">
                    <button onclick="toggleModalMedia()" class="hover:text-white px-2 py-0.5 rounded bg-[#0d1117] border border-[#30363d]">📷 链接</button>
                    <button onclick="toggleModalCode()" class="hover:text-white px-2 py-0.5 rounded bg-[#0d1117] border border-[#30363d]">&lt;/&gt; 代码</button>
                </div>
                <div id="modalMediaArea" class="hidden">
                    <input id="modalMediaUrls" type="text" placeholder="图片/视频链接 (多个用逗号隔开)" class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-1.5 text-xs text-white placeholder-gray-500 outline-none focus:border-[#58a6ff]">
                </div>
                <div id="modalCodeArea" class="hidden flex flex-col gap-2">
                    <input id="modalCodeLang" type="text" placeholder="语言 (如 python, json)" class="w-1/2 bg-[#0d1117] border border-[#30363d] rounded px-3 py-1.5 text-xs text-white placeholder-gray-500 outline-none focus:border-[#58a6ff]">
                    <textarea id="modalCodeContent" rows="3" placeholder="粘贴代码..." class="w-full bg-[#0d1117] border border-[#30363d] rounded px-3 py-1.5 text-xs text-white placeholder-gray-500 outline-none focus:border-[#58a6ff] resize-none"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-4">
                <button onclick="closeComposeModal()" class="text-gray-400 hover:text-white text-sm px-3 py-1.5 rounded-full transition">取消</button>
                <button id="modalSubmitBtn" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white text-sm font-medium px-5 py-1.5 rounded-full transition active:scale-95 disabled:opacity-50" disabled>发布</button>
            </div>
        </div>
    </div>

    <script>
        // ===========================
        // 状态管理 & 帖子加载
        // ===========================
        let currentPage = 1;
        let hasMore = true;
        let isLoading = false;

        function loadPosts(reset = false) {
            if (isLoading) return;
            isLoading = true;
            
            const keyword = document.getElementById('searchInput').value.trim();
            const time = document.getElementById('timeFilter').value;
            
            if (reset) {
                currentPage = 1;
                hasMore = true;
                document.getElementById('postList').innerHTML = '';
            }
            
            let url = `/api/posts?page=${currentPage}&time=${time}`;
            if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
            
            fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    const list = document.getElementById('postList');
                    if (reset) {
                        list.innerHTML = '';
                        currentPage = 1;
                    }
                    
                    if (data.posts.length > 0) {
                        data.posts.forEach((post, index) => {
                            const el = createPostElement(post);
                            list.appendChild(el);
                            gsap.fromTo(el, 
                                { opacity: 0, y: 20, scale: 0.98 },
                                { opacity: 1, y: 0, scale: 1, duration: 0.5, delay: index * 0.05, ease: "power2.out" }
                            );
                        });
                        
                        hasMore = data.has_next;
                        currentPage++;
                        
                        const loadArea = document.getElementById('loadMoreArea');
                        if (hasMore) {
                            loadArea.classList.remove('hidden');
                        } else {
                            loadArea.classList.add('hidden');
                        }
                    }
                }
            })
            .catch(err => console.error('加载失败:', err))
            .finally(() => { isLoading = false; });
        }

        // ===========================
        // 创建帖子 DOM（保持不变）
        // ===========================
        function createPostElement(post) {
            const div = document.createElement('div');
            div.className = 'post-card';
            div.id = `post-${post.id}`;
            
            let mediaHtml = '';
            if (post.media_urls && post.media_urls.length > 0) {
                mediaHtml = post.media_urls.map(url => 
                    `<div class="mt-2 rounded-lg overflow-hidden border border-[#30363d] bg-[#161b22] p-1">
                        ${url.match(/\.(mp4|webm|ogg)$/i) ? 
                            `<video src="${url}" controls class="w-full max-h-60 object-contain"></video>` :
                            `<img src="${url}" class="w-full max-h-60 object-contain" loading="lazy">`
                        }
                    </div>`
                ).join('');
            }
            
            let codeHtml = '';
            if (post.code_lang && post.code_content) {
                codeHtml = `
                    <div class="code-block" onclick="toggleCode(this)">
                        <div class="flex justify-between items-center text-xs text-gray-400">
                            <span class="font-mono text-[#58a6ff]">&lt;/&gt; ${post.code_lang}</span>
                            <span>点击展开</span>
                        </div>
                        <div class="code-content font-mono text-xs text-gray-300 whitespace-pre-wrap">${escapeHtml(post.code_content)}</div>
                    </div>
                `;
            }
            
            div.innerHTML = `
                <div class="flex gap-3">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-gray-600 to-gray-800 flex-shrink-0 flex items-center justify-center text-gray-300 text-xs border border-[#30363d]">
                        ${post.author_name[0] || '?'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="font-bold text-white text-sm">${escapeHtml(post.author_name)}</span>
                            <span class="text-xs text-gray-500">@${post.author_display_id}</span>
                            <span class="text-xs text-gray-600">·</span>
                            <span class="text-xs text-gray-500">${post.created_at}</span>
                            ${post.is_subscribed ? '<span class="text-[10px] text-[#1d9bf0] border border-[#1d9bf0] px-1.5 rounded-full">已订阅</span>' : ''}
                        </div>
                        <div class="mt-1 text-sm text-white leading-relaxed whitespace-pre-wrap">${escapeHtml(post.content)}</div>
                        ${mediaHtml}
                        ${codeHtml}
                        <div class="mt-3 flex gap-4 text-xs text-gray-500">
                            <button class="action-btn flex items-center gap-1 ${post.is_liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                                ${post.is_liked ? '❤️' : '🤍'} <span id="like-count-${post.id}">${post.likes}</span>
                            </button>
                            <button class="action-btn flex items-center gap-1" onclick="toggleComment(${post.id})">
                                💬 <span>${post.comments}</span>
                            </button>
                            <button class="action-btn flex items-center gap-1" onclick="toggleSubscribe(${post.user_id}, this)">
                                ${post.is_subscribed ? '✅ 已订阅' : '+ 订阅'}
                            </button>
                        </div>
                        <div id="comment-area-${post.id}" class="hidden mt-3 border-t border-[#30363d]/50 pt-3">
                            <div id="comment-list-${post.id}" class="mb-2 max-h-40 overflow-y-auto"></div>
                            <div class="flex gap-2">
                                <input type="text" id="comment-input-${post.id}" placeholder="写下你的评论..." class="flex-1 bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-1.5 text-xs text-white placeholder-gray-500 outline-none focus:border-[#58a6ff]">
                                <button class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white text-xs px-3 py-1.5 rounded-full" onclick="submitComment(${post.id})">发送</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===========================
        // 帖子交互（点赞、评论、订阅、代码折叠）
        // ===========================
        function toggleCode(el) {
            const content = el.querySelector('.code-content');
            const label = el.querySelector('span:last-child');
            if (content.style.display === 'block') {
                content.style.display = 'none';
                label.textContent = '点击展开';
            } else {
                content.style.display = 'block';
                label.textContent = '点击收起';
            }
        }

        function toggleLike(postId) {
            fetch(`/api/posts/${postId}/like`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    const btn = document.querySelector(`#post-${postId} .action-btn`);
                    const count = document.getElementById(`like-count-${postId}`);
                    if (data.action === 'liked') {
                        btn.classList.add('liked');
                        btn.innerHTML = `❤️ <span id="like-count-${postId}">${data.count}</span>`;
                    } else {
                        btn.classList.remove('liked');
                        btn.innerHTML = `🤍 <span id="like-count-${postId}">${data.count}</span>`;
                    }
                }
            });
        }

        function toggleComment(postId) {
            const area = document.getElementById(`comment-area-${postId}`);
            const list = document.getElementById(`comment-list-${postId}`);
            if (area.classList.contains('hidden')) {
                area.classList.remove('hidden');
                fetch(`/api/posts/${postId}/comments`)
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        list.innerHTML = '';
                        data.comments.forEach(c => {
                            const div = document.createElement('div');
                            div.className = 'flex gap-2 py-1.5 text-xs';
                            div.innerHTML = `
                                <span class="font-bold text-white">${c.author_name}</span>
                                <span class="text-gray-400">${c.content}</span>
                            `;
                            list.appendChild(div);
                        });
                    }
                });
            } else {
                area.classList.add('hidden');
            }
        }

        function submitComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const content = input.value.trim();
            if (!content) return;
            fetch(`/api/posts/${postId}/comments`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: content })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    input.value = '';
                    toggleComment(postId);
                }
            });
        }

        function toggleSubscribe(userId, btn) {
            fetch(`/api/users/${userId}/subscribe`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    if (data.action === 'subscribed') {
                        btn.textContent = '✅ 已订阅';
                    } else {
                        btn.textContent = '+ 订阅';
                    }
                }
            });
        }

        // ===========================
        // 搜索与过滤监听
        // ===========================
        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentPage = 1;
                loadPosts(true);
            }, 400);
        });

        document.getElementById('timeFilter').addEventListener('change', function() {
            currentPage = 1;
            loadPosts(true);
        });

        document.getElementById('loadMoreBtn').addEventListener('click', function() {
            loadPosts(false);
        });

        // ===========================
        // 弹窗发帖控制逻辑
        // ===========================
        const modal = document.getElementById('composeModal');
        const floatingBtn = document.getElementById('composeFloatingBtn');

        floatingBtn.addEventListener('click', function() {
            modal.classList.remove('hidden');
            document.getElementById('modalPostContent').focus();
        });

        window.closeComposeModal = function() {
            modal.classList.add('hidden');
            // 清理输入框
            document.getElementById('modalPostContent').value = '';
            document.getElementById('modalMediaUrls').value = '';
            document.getElementById('modalCodeLang').value = '';
            document.getElementById('modalCodeContent').value = '';
            document.getElementById('modalSubmitBtn').disabled = true;
        };

        // 点击模态框外部关闭
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeComposeModal();
        });

        // 监听弹窗文本输入
        document.getElementById('modalPostContent').addEventListener('input', function() {
            document.getElementById('modalSubmitBtn').disabled = !this.value.trim();
        });

        // 弹窗内的折叠选项
        function toggleModalMedia() {
            document.getElementById('modalMediaArea').classList.toggle('hidden');
        }
        function toggleModalCode() {
            document.getElementById('modalCodeArea').classList.toggle('hidden');
        }

        // 提交弹窗发帖
        document.getElementById('modalSubmitBtn').addEventListener('click', function() {
            const content = document.getElementById('modalPostContent').value.trim();
            if (!content) return;
            
            const mediaUrls = document.getElementById('modalMediaUrls').value.trim();
            const codeLang = document.getElementById('modalCodeLang').value.trim();
            const codeContent = document.getElementById('modalCodeContent').value.trim();
            
            this.innerText = '发布中...';
            this.disabled = true;
            
            fetch('/api/posts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: content,
                    media_urls: mediaUrls,
                    code_lang: codeLang,
                    code_content: codeContent
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    closeComposeModal();
                    currentPage = 1;
                    loadPosts(true);
                } else {
                    alert('发布失败: ' + data.msg);
                }
            })
            .catch(() => alert('发布异常，请检查网络'))
            .finally(() => {
                this.innerText = '发布';
                this.disabled = false;
            });
        });

        // ===========================
        // 初始加载
        // ===========================
        document.addEventListener('DOMContentLoaded', function() {
            loadPosts(true);
        });
    </script>
</body>
</html>
