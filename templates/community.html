<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宫水市场</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 0; border-bottom: 1px solid #30363d;
        }
        .nav-tabs { display: flex; gap: 4px; background: #161b22; padding: 4px; border-radius: 8px; }
        .tab {
            padding: 8px 24px; cursor: pointer; border-radius: 6px;
            color: #8b949e; font-weight: 500; transition: 0.2s;
        }
        .tab.active { background: #30363d; color: #f0f6fc; }
        
        .search-bar {
            margin: 32px 0; display: flex; gap: 12px;
        }
        .search-bar input {
            flex: 1; background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 12px 16px; color: white;
            outline: none;
        }
        .search-bar input:focus { border-color: #58a6ff; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; margin-top: 24px; }
        .card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            overflow: hidden; transition: 0.2s; cursor: pointer;
        }
        .card:hover { border-color: #58a6ff; transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .card-header {
            height: 140px; background: linear-gradient(135deg, #1f6feb 0%, #3fb950 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .card-header.blue { background: linear-gradient(135deg, #1f6feb 0%, #6e40c9 100%); }
        .card-header.orange { background: linear-gradient(135deg, #d29922 0%, #f78166 100%); }
        .card-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .card-title { font-size: 16px; font-weight: 600; color: white; }
        .card-meta { display: flex; justify-content: space-between; font-size: 13px; color: #8b949e; }
        .card-price { color: #f0c000; font-weight: 700; font-size: 18px; }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #d29922; color: black; font-weight: 600; }
        
        .empty-space { height: 200px; display: flex; justify-content: center; align-items: center; color: #484f58; }
        
        /* 弹窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.open { display: flex; }
        .modal { width: 480px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; }
        .btn { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; width: 100%; margin-top: 12px; }
        .btn-primary { background: #238636; color: white; }
        .btn-secondary { background: #30363d; color: #c9d1d9; }
        input, select, textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div style="font-weight: 700; font-size: 18px; color: white;">宫水 Market</div>
            <div class="nav-tabs">
                <div class="tab active" onclick="switchTab('market')">市场</div>
                <div class="tab" onclick="switchTab('community')">社区</div>
                <div class="tab" onclick="switchTab('my')">我的</div>
            </div>
        </nav>

        <div id="market-panel">
            <div class="search-bar">
                <input type="text" placeholder="搜索虚拟商品、代码、工具...">
            </div>
            <div class="grid">
                <div class="card" onclick="openDetail('豪华版机器人源码包', 500, '320')">
                    <div class="card-header blue"></div>
                    <div class="card-body">
                        <div class="card-title">豪华版机器人源码包</div>
                        <div class="card-meta"><span>已售 320</span><span class="tag">热销</span></div>
                        <div class="card-meta"><span>卖家 @张三</span><span class="card-price">500星星</span></div>
                    </div>
                </div>
                <!-- 其他商品卡片同理，不重复堆砌 -->
            </div>
            <div class="empty-space">欢迎来到市场</div>
        </div>

        <div id="community-panel" style="display:none;">
            <div style="padding: 32px 0; color: #8b949e;">社区功能建设中，仅展示优质内容。</div>
        </div>

        <div id="my-panel" style="display:none;">
            <div style="padding: 32px 0;">
                <h3 style="color: white; margin-bottom: 20px;">我的账户</h3>
                <div style="background: #161b22; border: 1px solid #30363d; padding: 24px; border-radius: 12px;">
                    <div style="display: flex; justify-content: space-between;">
                        <div>
                            <div style="color: #8b949e;">当前余额</div>
                            <div style="font-size: 32px; font-weight: 800; color: white;">0 星星</div>
                        </div>
                        <div class="btn btn-secondary" onclick="openMerchant()">成为商家</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="productModal" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 style="color: white; margin-bottom: 16px;">购买确认</h3>
            <div style="color: #8b949e;">名称：<span id="productName"></span></div>
            <div style="color: #f0c000; font-size: 24px; margin: 12px 0;">价格：<span id="productPrice"></span> 星星</div>
            <button class="btn btn-primary" onclick="alert('购买成功！')">确认支付</button>
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        </div>
    </div>

    <div class="modal-overlay" id="merchantModal" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 style="color: white; margin-bottom: 16px;">商家入驻</h3>
            <div style="color: #8b949e; margin-bottom: 12px;">缴纳 1000 星星保证金后，即可上架商品。</div>
            <button class="btn btn-primary" onclick="alert('已提交申请')">缴纳保证金</button>
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('market-panel').style.display = tab === 'market' ? 'block' : 'none';
            document.getElementById('community-panel').style.display = tab === 'community' ? 'block' : 'none';
            document.getElementById('my-panel').style.display = tab === 'my' ? 'block' : 'none';
        }
        function openDetail(title, price, sales) {
            document.getElementById('productName').innerText = title;
            document.getElementById('productPrice').innerText = price;
            document.getElementById('productModal').classList.add('open');
        }
        function openMerchant() { document.getElementById('merchantModal').classList.add('open'); }
        function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); }
    </script>
</body>
</html>
