<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理后台 - gsbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; min-height: 100vh;
        }
        .navbar { background: #161b22; padding: 16px 24px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .nav-left { font-weight: 600; font-size: 18px; color: #ffffff; }
        .nav-right { display: flex; gap: 16px; }
        .btn-outline { background: transparent; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; }
        .btn-outline:active { background: #21262d; }
        .container { padding: 24px; max-width: 1200px; width: 100%; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #161b22; border-radius: 8px; overflow: hidden; border: 1px solid #30363d; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #30363d; }
        th { background: #21262d; color: #8b949e; font-weight: 600; }
        td { color: #c9d1d9; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge.admin { background: #da3633; color: white; }
        .badge.vip { background: #d29922; color: white; }
        .badge.banned { background: #21262d; color: #8b949e; }
        .btn-sm { padding: 4px 12px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; margin: 2px; }
        .btn-ban { background: #da3633; color: white; }
        .btn-unban { background: #238636; color: white; }
        .btn-vip { background: #d29922; color: white; }
        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #21262d; padding: 12px 24px; border-radius: 8px; border-left: 4px solid #238636; display: none; z-index: 999; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-left">管理后台</div>
        <div class="nav-right">
            <a href="/" class="btn-outline">返回首页</a>
            <a href="/logout" class="btn-outline">退出</a>
        </div>
    </div>
    <div class="container">
        <h2 style="color: #f0f6fc; font-weight: 600; margin-bottom: 16px;">用户管理列表</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>QQ 邮箱</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                {% for user in users %}
                <tr id="row-{{ user.id }}">
                    <td>{{ user.id }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        {% if user.is_admin %}<span class="badge admin">管理员</span>{% endif %}
                        {% if user.is_vip %}<span class="badge vip">VIP</span>{% endif %}
                        {% if user.is_banned %}<span class="badge banned">已封禁</span>{% endif %}
                    </td>
                    <td>
                        {% if not user.is_admin %}
                            <button class="btn-sm btn-ban" onclick="toggleBan({{ user.id }})">
                                {% if user.is_banned %}解封{% else %}封号{% endif %}
                            </button>
                            <button class="btn-sm btn-vip" onclick="toggleVip({{ user.id }})">
                                {% if user.is_vip %}取消VIP{% else %}设为VIP{% endif %}
                            </button>
                        {% else %}
                            <span style="color: #8b949e;">不可操作</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div id="toast"></div>

    <script>
        function showToast(msg, error=false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.borderLeftColor = error ? '#da3633' : '#238636';
            toast.style.display = 'block';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function toggleBan(userId) {
            const res = await fetch('/admin/toggle_ban/' + userId, { method: 'POST' });
            const data = await res.json();
            if(data.success) {
                showToast(data.banned ? '已封禁该用户' : '已解封该用户');
                window.location.reload();
            } else {
                showToast('操作失败：' + data.error, true);
            }
        }

        async function toggleVip(userId) {
            const res = await fetch('/admin/toggle_vip/' + userId, { method: 'POST' });
            const data = await res.json();
            if(data.success) {
                showToast(data.vip ? '已设为VIP' : '已取消VIP');
                window.location.reload();
            } else {
                showToast('操作失败：' + data.error, true);
            }
        }
    </script>
</body>
</html>
