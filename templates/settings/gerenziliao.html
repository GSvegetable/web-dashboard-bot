<h1 class="text-2xl font-semibold text-[#f0f6fc] mb-1">个人资料</h1>

<div class="mt-6 settings-grid grid grid-cols-[2fr_1fr] gap-12 animate-item">
    <!-- 左侧：表单信息 -->
    <div class="flex flex-col gap-6">
        <div class="animate-item delay-2">
            <label class="gh-label" for="name">名称</label>
            <input type="text" id="name" class="gh-input" 
                   value="{{ current_user.first_name if current_user.first_name else (current_user.email.split('@')[0] if current_user.email else '') }}" />
            <span class="gh-note">你的名字将在宫水大世界社区里对外展示 你也可以随时设置为匿名</span>
        </div>

        <div class="animate-item delay-3">
            <label class="gh-label" for="display_id">ID</label>
            <input type="text" id="display_id" class="gh-input" 
                   value="{{ current_user.display_id or '000000' }}" readonly />
            <span class="gh-note">你的 6 位唯一公开身份标识</span>
        </div>

        <div class="animate-item delay-4">
            <label class="gh-label" for="email">邮箱</label>
            <input type="text" id="email" class="gh-input" 
                   value="{{ current_user.email if current_user.email else '' }}" 
                   placeholder="{{ '未绑定邮箱' if not current_user.email else '' }}" 
                   {% if current_user.email %}readonly{% endif %} />
            <span class="gh-note">你可以在 <a href="#" class="text-[#58a6ff] hover:underline">邮箱设置</a> 中管理已验证的邮箱地址。</span>
        </div>

        <div class="animate-item delay-5">
            <label class="gh-label" for="bio">个人简介</label>
            <textarea id="bio" class="gh-textarea" placeholder="简单介绍一下你自己吧"></textarea>
            <span class="gh-note">你可以通过 @提及其他用户和组织，链接到他们。</span>
        </div>

        <div class="animate-item delay-6">
            <label class="gh-label" for="url">网址</label>
            <input type="url" id="url" class="gh-input" placeholder="输入你的个人网站或社交主页链接" />
        </div>
    </div>

    <!-- 右侧：头像 -->
    <div class="flex flex-col items-start gap-4 animate-item delay-3">
        <div class="flex flex-col items-center gap-4 w-full max-w-[160px]">
            <label class="gh-label w-full">头像</label>
            
            <div class="relative w-28 h-28 rounded-full bg-[#afb8c1] flex items-center justify-center overflow-hidden border-2 border-[#30363d] shadow-sm text-[#0d1117]">
                <img id="profileAvatarImg" src="{{ current_user.avatar_url if current_user.avatar_url else '' }}" 
                     class="w-full h-full object-cover" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                <svg id="avatarPlaceholder" viewBox="0 0 24 24" width="64" height="64" fill="currentColor" style="display: none;">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            
            <input type="file" id="avatarInput" accept="image/*" style="display:none;">
            <button class="gh-edit-btn" id="editAvatarBtn">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 012.474 0l1.086 1.086a1.75 1.75 0 010 2.474L3.522 14.038a.75.75 0 01-.416.197l-2.936.326a.75.75 0 01-.82-.82l.326-2.936a.75.75 0 01.197-.416L11.013 1.427z"/></svg>
                编辑
            </button>
        </div>
    </div>
</div>
