<!-- 星星储备大数字 -->
<div class="mb-6 animate-item delay-4">
    <label class="gh-label">星星储备</label>
    <div id="stars-display" class="flex items-center gap-0.5 text-8xl font-black text-white perspective-800 tracking-tight mt-2">
        {% set stars_str = '%05d' % (current_user.stars or 0) %}
        {% for char in stars_str %}
            <span class="digit spin-animate inline-block" style="animation-delay: {{ (4 - loop.index0) * 0.12 }}s;">{{ char }}</span>
        {% endfor %}
    </div>
</div>

<!-- ✅ 搬过来的 3D 悬停卡片（缩小版，内容只显示“更多星星”） -->
<style>
    /* 避免与首页左上角的卡片 ID 冲突，单独定义 */
    #starToggleCard3D {
        width: 180px;
        height: 56px;
        padding: 0 14px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
    }
    /* 点击后的 3D 倾斜效果 */
    #starToggleCard3D.is-active {
        transform: translateZ(10px) rotateX(8deg) rotateY(12deg);
    }
    #starToggleCard3D .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 18px;
        flex-shrink: 0;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    /* 卡片激活时，头像向外突出飞起 */
    #starToggleCard3D.is-active .avatar {
        transform: translateZ(200px) translateX(10px) translateY(-4px);
    }
    #starToggleCard3D .text-box {
        flex: 1;
        pointer-events: none;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    /* 卡片激活时，文字向外突出 */
    #starToggleCard3D.is-active .text-box {
        transform: translateZ(200px) translateX(20px) translateY(-4px);
    }
</style>

<div class="flex justify-end mt-6">
    <figure id="starToggleCard3D">
        <!-- 头像图标 -->
        <div class="avatar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
        </div>
        <!-- 文字容器 -->
        <div class="text-box text-white text-sm font-semibold">
            更多星星
        </div>
    </figure>
</div>

<!-- 点击触发 3D 翻转动画的 JS（完全复刻首页效果） -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const card = document.getElementById('starToggleCard3D');
    if (card) {
        card.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('is-active');
        });
        document.addEventListener('click', function(e) {
            if (!card.contains(e.target) && card.classList.contains('is-active')) {
                card.classList.remove('is-active');
            }
        });
    }
});
</script>
