<!-- 星星储备大数字 -->
<div class="mb-6 animate-item delay-4">
    <label class="gh-label">星星储备</label>
    <div id="stars-display" class="flex items-center gap-0.5 text-8xl font-black text-white perspective-800 tracking-tight mt-2">
        {% set stars_str = '%05d' % (current_user.stars or 0) %}
        {% for char in stars_str %}
            <span class="digit spin-animate inline-block" style="animation-delay: {{ (4 - loop.index0) * 0.12 }}s;">{{ char }}</span>
        {% endfor %}
    </div>
</div>

<!-- ✅ 完美复刻 Uiverse 动画的横向卡片（尺寸、颜色已改，文字点击切换） -->
<div class="flex justify-center mt-10">
    <div id="starCard" class="relative overflow-hidden w-80 h-40 rounded-3xl cursor-pointer text-xl font-bold bg-[#1e293b] border border-[#334155] shadow-lg group">
        
        <!-- 悬停动画触发层（原汁原味的 peer 结构） -->
        <div class="z-10 absolute w-full h-full peer"></div>
        
        <!-- 左上角球体扩散动画（颜色改成了跟暗黑风更搭的蓝紫色） -->
        <div class="absolute peer-hover:-top-20 peer-hover:-left-16 peer-hover:w-[140%] peer-hover:h-[140%] -top-32 -left-16 w-32 h-44 rounded-full bg-indigo-500/20 transition-all duration-500"></div>
        
        <!-- 右下角球体扩散动画（点击/悬停后展示的层） -->
        <div class="absolute flex text-lg text-center items-end justify-end peer-hover:right-0 peer-hover:rounded-b-none peer-hover:bottom-0 peer-hover:items-center peer-hover:justify-center peer-hover:w-full peer-hover:h-full -bottom-32 -right-16 w-36 h-44 rounded-full bg-[#2d3748]/90 transition-all duration-500">
            <span id="cardStatusText" class="text-indigo-200">更多星星</span>
        </div>
        
        <!-- 卡片默认显示的文字（鼠标移入时会同步淡出） -->
        <div class="w-full h-full items-center justify-center flex uppercase tracking-wider text-slate-400 peer-hover:opacity-0 transition-opacity duration-300">
            更多星星
        </div>
        
    </div>
</div>

<!-- ✅ 纯 JS 控制：仅负责切换文字，绝不干涉 CSS 动画 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const card = document.getElementById('starCard');
    const statusText = document.getElementById('cardStatusText');
    let isClicked = false;

    if (card) {
        card.addEventListener('click', function() {
            isClicked = !isClicked;
            if (isClicked) {
                statusText.innerHTML = '✨ 还没想好你随便想一个吧';
            } else {
                statusText.innerHTML = '更多星星';
            }
        });
    }
});
</script>
