<!-- ✅ 星星余额：靠左（按你的视角，左边） -->
<div class="flex justify-start mt-6 pl-16 mb-6">
    <div class="flex flex-col items-start">
        <div class="text-white/60 text-sm font-medium tracking-wider mb-1 select-none">星星储备</div>
        <div id="stars-display" class="flex items-center gap-0.5 text-8xl font-black text-white perspective-800 tracking-tight">
            {% set stars_str = '%05d' % (current_user.stars or 0) %}
            {% for char in stars_str %}
                <!-- 从右往左逐次延迟 0.15s -->
                <span class="digit spin-animate inline-block" style="animation-delay: {{ (4 - loop.index0) * 0.15 }}s;">{{ char }}</span>
            {% endfor %}
        </div>
    </div>
</div>

<!-- 选择充值金额 -->
<div class="mb-6 animate-item delay-4">
    <label class="gh-label">选择充值金额</label>
    <div class="flex flex-wrap gap-3">
        <button class="stars-amount-btn selected" data-amount="10">10 颗</button>
        <button class="stars-amount-btn" data-amount="50">50 颗</button>
        <button class="stars-amount-btn" data-amount="100">100 颗</button>
        <button class="stars-amount-btn" data-amount="500">500 颗</button>
    </div>
</div>

<!-- 支付方式 -->
<div class="mb-6 animate-item delay-5">
    <label class="gh-label">选择支付方式</label>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <button class="payment-method-btn selected">
            <span class="text-2xl">💳</span> <span>OKpay</span>
        </button>
        <button class="payment-method-btn">
            <span class="text-2xl">💚</span> <span>微信</span>
        </button>
        <button class="payment-method-btn">
            <span class="text-2xl">💙</span> <span>支付宝</span>
        </button>
        <button class="payment-method-btn">
            <span class="text-2xl">₮</span> <span>USDT</span>
        </button>
    </div>
</div>

<!-- 立即充值按钮 -->
<button class="w-full py-3 bg-[#238636] hover:bg-[#2ea043] text-white font-semibold rounded-lg transition active:scale-95 shadow-md animate-item delay-6">
    立即充值
</button>
<p class="text-xs text-[#8b949e] text-center mt-2 animate-item delay-7">充值后星星将自动到账，如有问题请联系客服</p>
