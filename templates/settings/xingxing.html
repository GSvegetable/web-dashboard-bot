<style>
    .card-6 {
        display: flex;
        justify-content: center;
        margin: 16px 0 20px 0;
    }
    
    .card-6__holo {
        position: relative;
        width: auto;
        min-width: 120px;
        padding: 10px 30px;
        border-radius: 26px;
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        animation: card6-wobble 6.2s ease-in-out infinite;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(0, 123, 255, 0.25);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    @keyframes card6-wobble {
        0% { transform: rotateX(8deg) rotateY(-10deg) scale(1); }
        50% { transform: rotateX(10deg) rotateY(10deg) scale(1.03); }
        100% { transform: rotateX(8deg) rotateY(-10deg) scale(1); }
    }

    .card-6__digit {
        font-weight: 900;
        font-size: 80px;
        line-height: 1;
        letter-spacing: -2px;
        background: linear-gradient(90deg, rgba(0, 123, 255, 0.6) 0%, rgba(0, 180, 255, 1) 50%, rgba(0, 123, 255, 0.6) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-stroke: 1px rgba(0, 123, 255, 0.2);
        filter: drop-shadow(0 4px 12px rgba(0, 123, 255, 0.3));
    }

    @media (max-width: 600px) {
        .card-6__holo { min-width: 100px; padding: 8px 20px; }
        .card-6__digit { font-size: 56px; letter-spacing: -1px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .card-6__holo { animation: none !important; }
    }
</style>

<div class="mb-6 animate-item delay-4">
    <label class="gh-label">星星储备</label>
    
    <div class="card-6">
        <div class="card-6__holo">
            {% set stars_str = '%05d' % (current_user.stars or 0) %}
            {% for char in stars_str %}
                <span class="card-6__digit">{{ char }}</span>
            {% endfor %}
        </div>
    </div>
</div>
