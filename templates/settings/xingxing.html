<!-- 星星储备大数字 -->
<div class="mb-6 animate-item delay-4">
    <label class="gh-label">星星储备</label>
    <div id="stars-display" class="flex items-center gap-0.5 text-8xl font-black text-white perspective-800 tracking-tight mt-2">
        {% set stars_str = '%05d' % (current_user.stars or 0) %}
        {% for char in stars_str %}
            <span class="digit spin-animate inline-block" style="animation-delay: {{ (4 - loop.index0) * 0.12 }}s;">{{ char }}</span>
        {% endfor %}
    </div>
</div>

<!-- ✅ 完美复刻动效 + 统一颜色的横向交互卡片 -->
<div class="flex justify-center mt-10">
    <div id="starCard" class="relative overflow-hidden w-80 h-40 rounded-3xl cursor-pointer text-xl font-bold bg-[#1e293b] border border-[#334155] shadow-lg group">
        
        <!-- 左上角圆球（点击/悬停后往右下扩散） -->
        <div class="ball-tl absolute -top-32 -left-16 w-32 h-44 rounded-full bg-[#334155] transition-all duration-500"></div>
        
        <!-- 右下角圆球（点击/悬停后往左上扩散，完全覆盖） -->
        <div class="ball-br absolute flex text-lg text-center items-end justify-end -bottom-32 -right-16 w-36 h-44 rounded-full bg-[#334155] transition-all duration-500">
            <span id="cardStatusText" class="text-white">更多星星</span>
        </div>
        
        <!-- 卡片初始显示的文字 -->
        <div class="w-full h-full items-center justify-center flex uppercase tracking-wider text-slate-400 group-hover:opacity-0 transition-opacity duration-300">
            更多星星
        </div>
        
    </div>
</div>

<style>
    /* 左上圆球基础状态 */
    #starCard .ball-tl {
        position: absolute;
        top: -8rem;
        left: -4rem;
        width: 8rem;
        height: 11rem;
        border-radius: 9999px;
        background-color: #334155;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* 右下圆球基础状态 */
    #starCard .ball-br {
        position: absolute;
        bottom: -8rem;
        right: -4rem;
        width: 9rem;
        height: 11rem;
        border-radius: 9999px;
        background-color: #334155;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        text-align: center;
        font-size: 1.125rem;
    }
    
    /* ✅ 鼠标悬停 或 点击触发 active 状态时，两个圆球的扩张动画完全一致 */
    #starCard:hover .ball-tl,
    #starCard.active .ball-tl {
        top: -5rem !important;
        left: -4rem !important;
        width: 140% !important;
        height: 140% !important;
    }
    #starCard:hover .ball-br,
    #starCard.active .ball-br {
        right: 0 !important;
        bottom: 0 !important;
        border-bottom-right-radius: 0 !important;
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const card = document.getElementById('starCard');
    const statusText = document.getElementById('cardStatusText');
    let isActive = false;

    if (card) {
        card.addEventListener('click', function() {
            isActive = !isActive;
            if (isActive) {
                this.classList.add('active'); // 触发并卡住动画
                statusText.innerText = '✨ 还没想好你随便想一个吧';
            } else {
                this.classList.remove('active'); // 撤销卡住状态
                statusText.innerText = '更多星星';
            }
        });
    }
});
</script>
