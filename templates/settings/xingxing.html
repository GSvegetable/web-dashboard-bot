<!-- 星星储备大数字 -->
<div class="mb-6 animate-item delay-4">
    <label class="gh-label">星星储备</label>
    <div id="stars-display" class="flex items-center gap-0.5 text-8xl font-black text-white perspective-800 tracking-tight mt-2">
        {% set stars_str = '%05d' % (current_user.stars or 0) %}
        {% for char in stars_str %}
            <span class="digit spin-animate inline-block" style="animation-delay: {{ (4 - loop.index0) * 0.12 }}s;">{{ char }}</span>
        {% endfor %}
    </div>
</div>

<!-- ✅ 全新的横向交互卡片（点击锁定状态，不回弹） -->
<div class="flex justify-center mt-10">
    <div id="starCard" class="group relative overflow-hidden w-80 h-40 rounded-2xl cursor-pointer text-xl font-bold bg-[#1e293b] border border-[#334155] shadow-lg transition-all duration-300 select-none" onclick="this.classList.toggle('active')">
        
        <!-- 左上角展开的辉光圆球 -->
        <div class="absolute -top-32 -left-16 w-32 h-44 rounded-full bg-indigo-500/30 transition-all duration-500 group-[.active]:-top-20 group-[.active]:-left-16 group-[.active]:w-[140%] group-[.active]:h-[140%]"></div>
        
        <!-- 右下角展开的辉光圆球（点击后会出现，并覆盖整个卡片） -->
        <div class="absolute flex text-lg text-center items-end justify-end -bottom-32 -right-16 w-36 h-44 rounded-full bg-purple-500/30 transition-all duration-500 group-[.active]:right-0 group-[.active]:rounded-b-none group-[.active]:bottom-0 group-[.active]:items-center group-[.active]:justify-center group-[.active]:w-full group-[.active]:h-full">
            <span class="hidden group-[.active]:block text-slate-200 px-4 leading-relaxed">
                ✨ 还没想好你随便想一个吧
            </span>
        </div>
        
        <!-- 初始状态文字（点击前显示） -->
        <div class="w-full h-full items-center justify-center flex uppercase tracking-wider text-slate-200 group-[.active]:hidden">
            更多星星
        </div>
        
    </div>
</div>
