<!-- 专门为星星页面写的内联 CSS（融合了你给的 Uiverse 代码） -->
<style>
    .stars-bg-container {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, #777777 2px, transparent 2px),
            radial-gradient(circle, #eaeaea 10px, transparent 32px),
            linear-gradient(-45deg, #eaeaea 0%, transparent 49%, transparent 50%, transparent 51%, #eaeaea 100%),
            linear-gradient(45deg, #eaeaea 0%, transparent 49%, #777777 50%, transparent 51%, #eaeaea 100%),
            linear-gradient(-45deg, transparent 49%, #777777 50%, transparent 51%);
        background-size: 8rem 8rem;
        background-repeat: repeat;
        z-index: 0;
        pointer-events: none; /* 确保背景不干扰点击 */
    }

    .stars-bg-paper {
        position: absolute;
        inset: 0;
        filter: url(#void-texture);
        background: linear-gradient(
            to bottom,
            rgba(194, 167, 87, 0.241) 0%,
            rgba(162, 125, 55, 0.255) 100%
        );
        background-size: cover;
        z-index: 0;
        pointer-events: none;
    }

    /* 保证纹理 SVG 能正确覆盖 */
    .texture-filter {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
    }
</style>

<!-- ==================== 背景层 ==================== -->
<div class="stars-bg-container"></div>
<div class="stars-bg-paper">
    <svg class="texture-filter">
        <filter id="void-texture">
            <feTurbulence seed="5" result="noise1" numOctaves="8" baseFrequency="0.015" type="fractalNoise"></feTurbulence>
            <feTurbulence seed="2" result="noise2" numOctaves="8" baseFrequency="0.015" type="fractalNoise"></feTurbulence>
            <feMerge result="noise">
                <feMergeNode in="noise1"></feMergeNode>
                <feMergeNode in="noise1"></feMergeNode>
                <feMergeNode in="noise2"></feMergeNode>
            </feMerge>
            <feGaussianBlur result="blur" stdDeviation="0" in="noise"></feGaussianBlur>
            <feSpecularLighting result="specular" lighting-color="#ffffff" specularExponent="20" specularConstant="1" surfaceScale="3" in="blur">
                <feDistantLight elevation="45" azimuth="90"></feDistantLight>
            </feSpecularLighting>
            <feComposite result="lit" operator="over" in2="SourceGraphic" in="specular"></feComposite>
            <feBlend mode="screen" in2="lit" in="SourceGraphic"></feBlend>
        </filter>
    </svg>
</div>

<!-- ==================== 内容层（垫高层级，确保显示在背景之上） ==================== -->
<div class="relative z-10 w-full h-full p-6 flex flex-col">
    
    <!-- 星星储备大数字 -->
    <div class="mb-6 animate-item delay-4">
        <label class="gh-label">星星储备</label>
        <div id="stars-display" class="flex items-center gap-0.5 text-8xl font-black text-white perspective-800 tracking-tight mt-2">
            {% set stars_str = '%05d' % (current_user.stars or 0) %}
            {% for char in stars_str %}
                <span class="digit spin-animate inline-block" style="animation-delay: {{ (4 - loop.index0) * 0.12 }}s;">{{ char }}</span>
            {% endfor %}
        </div>
    </div>

    <!-- 3D 悬停卡片（移到了大数字的右下方） -->
    <style>
        #starToggleCard3D {
            width: 180px; height: 56px; padding: 0 14px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            position: relative; transform-style: preserve-3d; backface-visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
            cursor: pointer; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
        }
        #starToggleCard3D.is-active {
            transform: translateZ(10px) rotateX(8deg) rotateY(12deg);
        }
        #starToggleCard3D .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; flex-shrink: 0;
            transform-style: preserve-3d; backface-visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #starToggleCard3D.is-active .avatar {
            transform: translateZ(200px) translateX(10px) translateY(-4px);
        }
        #starToggleCard3D .text-box {
            flex: 1; pointer-events: none; transform-style: preserve-3d; backface-visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #starToggleCard3D.is-active .text-box {
            transform: translateZ(200px) translateX(20px) translateY(-4px);
        }
    </style>

    <div class="flex justify-end mt-6">
        <figure id="starToggleCard3D">
            <div class="avatar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
            </div>
            <div class="text-box text-white text-sm font-semibold">
                更多星星
            </div>
        </figure>
    </div>

</div>

<!-- 点击触发 3D 翻转动画的 JS -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const card = document.getElementById('starToggleCard3D');
    if (card) {
        card.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('is-active');
        });
        document.addEventListener('click', function(e) {
            if (!card.contains(e.target) && card.classList.contains('is-active')) {
                card.classList.remove('is-active');
            }
        });
    }
});
</script>
