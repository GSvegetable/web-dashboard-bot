<!-- 星星储备大数字 -->
<div class="mb-6 animate-item delay-4">
    <label class="gh-label text-sm font-semibold text-white">星星储备</label>
    <div id="stars-display" class="flex items-center gap-0.5 text-8xl font-black text-white perspective-800 tracking-tight mt-2">
        {% set stars_str = '%05d' % (current_user.stars or 0) %}
        {% for char in stars_str %}
            <span class="digit spin-animate inline-block" style="animation-delay: {{ (4 - loop.index0) * 0.12 }}s;">{{ char }}</span>
        {% endfor %}
    </div>
</div>

<!-- ✅ 卡片移到对面：flex justify-end 改为 justify-start -->
<style>
    .star-3d-card {
        min-width: 90px;
        height: 40px;
        padding: 0 14px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        flex-shrink: 0;
    }
    .star-3d-card:hover {
        transform: translateZ(5px) rotateX(4deg) rotateY(6deg);
    }
    .star-3d-card.is-active {
        transform: translateZ(10px) rotateX(8deg) rotateY(12deg);
    }
</style>

<!-- ✅ justify-start 移到左侧 -->
<div class="flex justify-start mt-6 gap-3 flex-wrap">
    <!-- 更多星星（已删除单独小圆圈） -->
    <figure id="starToggleCard3D" class="star-3d-card">
        <div class="text-box text-white text-sm font-semibold">更多星星</div>
    </figure>

    <!-- 成为商户 -->
    <figure class="star-3d-card">成为商户</figure>

    <!-- 交易历史 -->
    <figure class="star-3d-card">交易历史</figure>

    <!-- 使用权限 -->
    <figure class="star-3d-card">使用权限</figure>
</div>

<!-- JS 交互 -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const card = document.getElementById('starToggleCard3D');
    if (card) {
        card.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('is-active');
        });
        document.addEventListener('click', function(e) {
            if (!card.contains(e.target) && card.classList.contains('is-active')) {
                card.classList.remove('is-active');
            }
        });
    }
});
</script>
