<!-- 星星储备大数字 -->
<div class="mb-6 animate-item delay-4">
    <label class="gh-label">星星储备</label>
    <div id="stars-display" class="flex items-center gap-0.5 text-8xl font-black text-white perspective-800 tracking-tight mt-2">
        {% set stars_str = '%05d' % (current_user.stars or 0) %}
        {% for char in stars_str %}
            <span class="digit spin-animate inline-block" style="animation-delay: {{ (4 - loop.index0) * 0.12 }}s;">{{ char }}</span>
        {% endfor %}
    </div>
</div>

<!-- ✅ 改造后的点击切换横向卡片（暗黑配色 + 长方形） -->
<div class="flex justify-center mt-10">
    <!-- 用隐藏的 Checkbox 作为纯 CSS 点击触发开关 -->
    <input type="checkbox" id="starCardToggle" class="hidden peer" />
    
    <!-- Label 作为卡片容器 -->
    <label for="starCardToggle" class="relative overflow-hidden w-80 h-28 rounded-xl cursor-pointer text-base font-bold bg-slate-800 border border-slate-700 hover:border-slate-400 block transition-colors duration-300 select-none">
        
        <!-- 动态辉光圆圈（背景特效） -->
        <div class="absolute peer-checked:-top-20 peer-checked:-left-24 -top-24 -left-16 w-32 h-32 rounded-full bg-blue-500/20 transition-all duration-700 blur-md"></div>
        <div class="absolute peer-checked:-bottom-20 peer-checked:-right-24 -bottom-24 -right-16 w-32 h-32 rounded-full bg-purple-500/20 transition-all duration-700 blur-md"></div>

        <!-- 点击前的状态（更多星星） -->
        <div class="w-full h-full flex items-center justify-center text-slate-200 tracking-widest peer-checked:opacity-0 peer-checked:scale-90 transition-all duration-300 absolute inset-0">
            更多星星
        </div>

        <!-- 点击后的状态（自定义占位符） -->
        <div class="w-full h-full flex items-center justify-center text-blue-300 tracking-widest opacity-0 scale-90 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-300 absolute inset-0">
            ✨ 星河滚烫，你是人间理想
        </div>
        
    </label>
</div>
