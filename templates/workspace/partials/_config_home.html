<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>机器人绑定 - 开发工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ✅ 设置页同款背景纹理 */
        .bg-container {
            position: absolute; inset: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #777777 2px, transparent 2px), radial-gradient(circle, #eaeaea 10px, transparent 32px), linear-gradient(-45deg, #eaeaea 0%, transparent 49%, transparent 50%, transparent 51%, #eaeaea 100%), linear-gradient(45deg, #eaeaea 0%, transparent 49%, #777777 50%, transparent 51%, #eaeaea 100%), linear-gradient(-45deg, transparent 49%, #777777 50%, transparent 51%);
            background-size: 8rem 8rem; background-repeat: repeat;
        }
        .bg-paper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            filter: url(#void-texture);
            background: linear-gradient(to bottom, rgba(194, 167, 87, 0.241) 0%, rgba(162, 125, 55, 0.255) 100%);
            background-size: cover;
        }
        body { background: transparent !important; margin: 0; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .glass-panel {
            width: 100%; max-width: 480px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            padding: 32px;
            text-align: left;
            position: relative;
            z-index: 10;
        }

        /* ✅ 透明毛玻璃输入框 */
        .gh-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            padding: 10px 14px;
            width: 100%;
            outline: none;
            transition: 0.2s;
        }
        .gh-input:focus { border-color: #58a6ff; box-shadow: 0 0 10px rgba(88, 166, 255, 0.2); }

        /* ✅ 透明毛玻璃绑定按钮 */
        .btn-primary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #c9d1d9;
            padding: 12px 20px;
            font-weight: 600;
            transition: 0.2s;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-primary:active { transform: scale(0.98); }

        .back-btn {
            position: absolute; top: 16px; left: 16px; color: rgba(255, 255, 255, 0.5);
            text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 14px;
        }
        .back-btn:hover { color: #ffffff; }
        .modal-overlay { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <!-- 背景层 -->
    <div style="position: fixed; inset: 0; z-index: 0; pointer-events: none;">
        <div class="bg-container"></div>
        <div class="bg-paper">
            <svg class="texture-filter" style="position: absolute; width: 0; height: 0;">
                <filter id="void-texture">
                    <feTurbulence seed="5" result="noise1" numOctaves="8" baseFrequency="0.015" type="fractalNoise"></feTurbulence>
                    <feTurbulence seed="2" result="noise2" numOctaves="8" baseFrequency="0.015" type="fractalNoise"></feTurbulence>
                    <feMerge result="noise"><feMergeNode in="noise1"></feMergeNode><feMergeNode in="noise1"></feMergeNode><feMergeNode in="noise2"></feMergeNode></feMerge>
                    <feGaussianBlur result="blur" stdDeviation="0" in="noise"></feGaussianBlur>
                    <feSpecularLighting result="specular" lighting-color="#ffffff" specularExponent="20" specularConstant="1" surfaceScale="3" in="blur">
                        <feDistantLight elevation="45" azimuth="90"></feDistantLight>
                    </feSpecularLighting>
                    <feComposite result="lit" operator="over" in2="SourceGraphic" in="specular"></feComposite>
                    <feBlend mode="screen" in2="lit" in="SourceGraphic"></feBlend>
                </filter>
            </svg>
        </div>
    </div>

    <div class="modal-overlay" onclick="if(event.target===this) window.location.href='/workspace'">
        <div class="glass-panel">
            <a href="/workspace" class="back-btn">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                返回
            </a>

            <h2 class="text-2xl font-bold text-white tracking-tight text-center pt-4">绑定机器人</h2>
            <p class="text-xs text-gray-400 text-center mb-6">绑定后，机器人将向你的 Telegram 发送一条确认通知</p>

            <!-- ✅ 无占位符输入框 -->
            <div class="flex flex-col gap-2 mb-4">
                <label class="text-sm font-medium text-white/80">你的 Telegram ID (纯数字)</label>
                <input id="inputUserId" type="text" class="gh-input" />
            </div>

            <!-- ✅ 无占位符输入框 -->
            <div class="flex flex-col gap-2 mb-4">
                <label class="text-sm font-medium text-white/80">机器人 Token</label>
                <input id="inputToken" type="text" class="gh-input" />
            </div>

            <!-- ✅ 透明毛玻璃按钮 -->
            <button id="bindBtn" class="btn-primary text-base mt-2">绑定</button>
            
            <div id="statusMsg" class="mt-3 text-xs text-center text-gray-400 hidden"></div>
        </div>
    </div>

    <script>
        document.getElementById('bindBtn').addEventListener('click', function() {
            const userIdInput = document.getElementById('inputUserId');
            const tokenInput = document.getElementById('inputToken');
            const statusMsg = document.getElementById('statusMsg');
            
            const userId = userIdInput.value.trim();
            const token = tokenInput.value.trim();

            if (!userId) { userIdInput.style.borderColor='rgba(239,68,68,0.8)'; userIdInput.focus(); return; }
            userIdInput.style.borderColor = '';

            if (!token) { tokenInput.style.borderColor='rgba(239,68,68,0.8)'; tokenInput.focus(); return; }
            if (!/^\d+:[A-Za-z0-9_-]+$/.test(token)) { alert('Token 格式不正确。'); tokenInput.focus(); return; }
            tokenInput.style.borderColor = '';

            this.innerText = '绑定中...';
            this.disabled = true;
            statusMsg.classList.remove('hidden');
            statusMsg.innerText = '正在发送请求...';
            statusMsg.className = 'mt-3 text-xs text-center text-gray-400';

            fetch('/api/send_bind_request', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, token: token })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    statusMsg.innerText = '✅ 绑定成功！';
                    statusMsg.className = 'mt-3 text-xs text-center text-green-400';
                    setTimeout(() => { window.location.href = '/workspace'; }, 1500);
                } else {
                    statusMsg.innerText = '❌ 失败: ' + data.msg;
                    statusMsg.className = 'mt-3 text-xs text-center text-red-400';
                    this.innerText = '绑定';
                    this.disabled = false;
                }
            })
            .catch(() => {
                statusMsg.innerText = '❌ 网络异常，请稍后重试。';
                statusMsg.className = 'mt-3 text-xs text-center text-red-400';
                this.innerText = '绑定';
                this.disabled = false;
            });
        });
    </script>
</body>
</html>
