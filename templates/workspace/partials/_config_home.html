<div id="configHome" class="flex flex-col items-start justify-start h-full w-full p-6 relative">
    
    <!-- ✅ 核心修复：用 Flex 布局，彻底解决定位溢出和边缘被切的问题 -->
    <div class="flex flex-row justify-between items-center w-full relative z-10">
        <!-- 左侧标题 -->
        <h2 class="text-white text-3xl font-bold tracking-wider drop-shadow-md">机器人仓库</h2>
        
        <!-- 右侧按钮 -->
        <div class="outer-cont" onclick="addPanel()">
            <span class="action-flex font-bold whitespace-nowrap">

            </span>
        </div>
    </div>

    <!-- 其他所有说明、状态卡、按钮全部删除了 -->
</div>

<!-- 按钮样式和交互逻辑 -->
<style>
  .action-flex {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 100%;
  }
  .outer-cont {
    padding: 10px 16px;
    border: none;
    font-size: 0.95rem;
    cursor: pointer;
    position: relative;
    background: linear-gradient(90deg, rgba(30, 64, 175, 0.7), rgba(147, 197, 253, 0.7), rgba(255, 255, 255, 0.9));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 12px;
    color: #fff;
    transition: all 0.3s ease;
    box-shadow:
      inset 0px 0px 5px rgba(255, 255, 255, 0.6),
      inset 0px 35px 30px rgba(0, 0, 0, 0.8),
      0px 5px 10px rgba(0, 0, 0, 0.7);
    text-shadow: 1px 1px 1px #000;
    pointer-events: auto !important;
    display: inline-flex;
  }
  .outer-cont::before {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 12px;
    filter: blur(0);
    z-index: -1;
    box-shadow: none;
    background: conic-gradient(
      rgba(0,0,0,0) 80deg,
      #2563EB,
      #93C5FD,
      #FFFFFF,
      rgba(0,0,0,0) 280deg
    );
    transition: all 0.3s ease;
  }
  .outer-cont:hover::before { filter: blur(15px); }
  .outer-cont:active::before { filter: blur(5px); transform: translateY(1px); }
  .outer-cont:active {
    box-shadow: inset 0px 0px 5px rgba(255, 255, 255, 0.6), inset 0px 35px 30px rgba(0, 0, 0, 0.8);
    margin-top: 3px;
  }
</style>

<script>
function addPanel() {
    const panelName = prompt("请输入新面板的名称：");
    if (panelName && panelName.trim() !== "") {
        alert(`准备创建面板：「${panelName}」`);
    } else if (panelName !== null) {
        alert("面板名称不能为空！");
    }
}
</script>
