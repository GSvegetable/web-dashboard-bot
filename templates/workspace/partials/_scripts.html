<script>
// ==========================================
// 1. 核心状态变量与DOM初始化
// ==========================================
let nodes = [];
let history = [];
let historyIndex = -1;
let isDraggingCanvas = false;
let isDraggingNode = false;
let startX, startY, startLeft, startTop;
let currentDragNode = null;
let canvasOffsetX = 0, canvasOffsetY = 0;
let lastMouseX = 0, lastMouseY = 0;

// ✨ 缩放状态
let currentScale = 1.0;
let lastPinchDist = 0;
let isPinching = false;

const canvasArea = document.getElementById('canvasArea');
const canvasAreaWrapper = document.getElementById('canvasAreaWrapper');
const nodeContainer = document.getElementById('nodeContainer');
const previewBox = document.getElementById('previewBox');
const previewMessages = document.getElementById('previewMessages');
const previewInput = document.getElementById('previewInput');

// ✨ 核心修复：完美的边界限制（完全杜绝黑屏）
function applyCanvasTransform() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // 画布原点必须在 [-50vw, -50vh]；缩放后：
    // 左侧边缘：dx - 50% * scale * vw
    // 右侧边缘：dx + 150% * scale * vw
    // 要使左右不露出黑屏：
    // 1. 左侧不允许小于0 => dx >= 50% * scale * vw
    // 2. 右侧不允许超过视口 => dx <= 100% - 150% * scale * vw
    const limitXMin = vw * 0.5 * currentScale;          // 绝对左边界（防止左侧黑屏）
    const limitXMax = vw * (1 - 1.5 * currentScale);     // 绝对右边界（防止右侧黑屏）
    const limitYMin = vh * 0.5 * currentScale;
    const limitYMax = vh * (1 - 1.5 * currentScale);

    let cX = canvasOffsetX;
    let cY = canvasOffsetY;

    // 🎯 判断画面是否已经小到可以完全显示
    if (limitXMin > limitXMax) {
        // 如果完全能显示，强制居中 (中心点保持在 50% 位置)
        cX = vw * 0.5 * (1 - currentScale);
        cY = vh * 0.5 * (1 - currentScale);
    } else {
        // 如果画面比视口大，严格限制拖拽边界，绝不露出黑屏
        // 极限向右推时，限制在 limitXMax；极限向左推时，限制在 limitXMin
        cX = Math.min(limitXMax, Math.max(limitXMin, cX));
        cY = Math.min(limitYMax, Math.max(limitYMin, cY));
    }

    canvasOffsetX = cX;
    canvasOffsetY = cY;
    canvasArea.style.transform = `translate(${cX}px, ${cY}px) scale(${currentScale})`;
}

// ✨ 新增：一键还原视图（当你在画布上迷失方向时，马上点它回到正中央）
window.resetCanvasView = function() {
    canvasOffsetX = 0;
    canvasOffsetY = 0;
    currentScale = 1.0;
    applyCanvasTransform();
};

// ==========================================
// 2. 历史记录与撤销/重做等常规逻辑...
// ==========================================
function saveHistory() {
    history = history.slice(0, historyIndex + 1);
    history.push(JSON.parse(JSON.stringify(nodes)));
    historyIndex++;
    if (history.length > 50) { history.shift(); historyIndex--; }
}
window.undoAction = function() {
    if (historyIndex > 0) { historyIndex--; nodes = JSON.parse(JSON.stringify(history[historyIndex])); renderNodes(); }
};
window.redoAction = function() {
    if (historyIndex < history.length - 1) { historyIndex++; nodes = JSON.parse(JSON.stringify(history[historyIndex])); renderNodes(); }
};
window.clearCanvas = function() {
    if (nodes.length === 0) return;
    nodes = []; saveHistory(); renderNodes();
};
window.deleteNode = function(index) {
    nodes.splice(index, 1); saveHistory(); renderNodes();
};
window.addNode = function(type) {
    const baseX = 200 + Math.random() * 300;
    const baseY = 200 + Math.random() * 300;
    const newNode = {
        id: Date.now() + Math.random(),
        type: type,
        x: baseX,
        y: baseY,
        content: type === 'text' ? '输入你的回复...' : '按钮名称',
        buttons: type === 'button' ? ['按钮1', '按钮2'] : []
    };
    nodes.push(newNode); saveHistory(); renderNodes();
};

// ==========================================
// 3. 右键菜单与滚轮缩放控制
// ==========================================
let hideTimeout = null;
function hideContextMenu() {
    const menu = document.getElementById('ctxMenu');
    if (!menu.classList.contains('open')) return;
    if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }
    menu.classList.remove('open');
    hideTimeout = setTimeout(() => { menu.style.display = 'none'; hideTimeout = null; }, 150);
}
function showContextMenu(e) {
    const menu = document.getElementById('ctxMenu');
    const menuItems = document.querySelectorAll('#ctxMenu .value');
    if (menu.classList.contains('open')) { hideContextMenu(); return; }
    menuItems.forEach(b => b.classList.remove('active'));
    let x = e.clientX, y = e.clientY;
    menu.style.display = 'block'; menu.classList.remove('open');
    let left = x + 12, top = y + 12;
    const menuWidth = menu.offsetWidth, menuHeight = menu.offsetHeight;
    const winWidth = window.innerWidth, winHeight = window.innerHeight;
    if (left + menuWidth > winWidth) { left = x - menuWidth - 12; }
    if (top + menuHeight > winHeight) { top = y - menuHeight - 12; }
    menu.style.left = left + 'px'; menu.style.top = top + 'px';
    setTimeout(() => { menu.classList.add('open'); }, 20);
}
document.addEventListener("DOMContentLoaded", function() {
    const menu = document.getElementById('ctxMenu');
    const menuItems = document.querySelectorAll('#ctxMenu .value');
    document.addEventListener('click', function(e) {
        if (menu.contains(e.target)) {
            const item = e.target.closest('.value');
            if (item) {
                e.stopPropagation(); e.preventDefault();
                menuItems.forEach(b => b.classList.remove('active'));
                item.classList.add('active');
                if (item.dataset.action === 'toggle_panel') {
                    const btnText = item.querySelector('.btn-text');
                    togglePanel();
                    const isHidden = document.getElementById('configPanel').dataset.hidden === 'true';
                    btnText.textContent = isHidden ? '展开面板' : '隐藏面板';
                    hideContextMenu();
                } else { hideContextMenu(); }
            }
            return;
        }
        if (canvasArea.contains(e.target) && !e.target.closest('.canvas-node')) {
            showContextMenu(e); return;
        }
        hideContextMenu();
    });

    // PC 滚轮缩放（带中心计算）
    canvasAreaWrapper.addEventListener('wheel', function(e) {
        e.preventDefault();
        const rect = canvasAreaWrapper.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const delta = -e.deltaY * 0.001;
        const newScale = Math.min(Math.max(0.1, currentScale + delta), 3.0);
        const canvasCoordX = (mouseX - canvasOffsetX) / currentScale;
        const canvasCoordY = (mouseY - canvasOffsetY) / currentScale;
        currentScale = newScale;
        canvasOffsetX = mouseX - canvasCoordX * currentScale;
        canvasOffsetY = mouseY - canvasCoordY * currentScale;
        applyCanvasTransform();
    }, { passive: false });
});

// ==========================================
// 4. 绑定与机器人相关（保持不变）
// ==========================================
window.connectBot = function() {
    const token = document.getElementById('botTokenInput').value;
    const chatId = document.getElementById('telegramIdInput').value;
    const name = '宫水编辑器';
    const status = document.getElementById('botStatus');
    if (token.length < 10) {
        status.innerHTML = '❌ Token 格式错误'; status.className = 'mt-2 text-[10px] text-red-400'; return;
    }
    if (!chatId || chatId.length < 1) {
        status.innerHTML = '❌ 请输入绑定的 Telegram ID'; status.className = 'mt-2 text-[10px] text-red-400'; return;
    }
    status.innerHTML = '⏳ 正在验证并发送绑定消息...'; status.className = 'mt-2 text-[10px] text-gray-400';
    fetch('/api/bind_bot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, telegram_id: chatId, name: name })
    })
    .then(res => res.json())
    .then(data => {
        if (data.ok) {
            status.innerHTML = `✅ 绑定成功！已向 ${chatId} 发送确认消息。`;
            status.className = 'mt-2 text-[10px] text-green-400';
            window.addBotNode(data.bot_name || name, data.bot_avatar_url);
        } else {
            status.innerHTML = `❌ 绑定失败: ${data.msg}`;
            status.className = 'mt-2 text-[10px] text-red-400';
        }
    })
    .catch(() => {
        status.innerHTML = '❌ 网络请求失败，请稍后重试。'; status.className = 'mt-2 text-[10px] text-red-400';
    });
};
window.autoFillBot = function() {
    const tokenInput = document.getElementById('botTokenInput');
    const idInput = document.getElementById('telegramIdInput');
    const status = document.getElementById('botStatus');
    if (!navigator.clipboard) {
        status.innerHTML = '❌ 你的浏览器不支持读取剪贴板'; status.className = 'mt-2 text-[10px] text-red-400'; return;
    }
    navigator.clipboard.readText().then(text => {
        if (!text || text.trim() === '') {
            status.innerHTML = '❌ 自动填写失败：剪贴板为空'; status.className = 'mt-2 text-[10px] text-red-400'; return;
        }
        let foundToken = false, foundId = false;
        const lines = text.split(/\r?\n/);
        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;
            if (/^\d+:[A-Za-z0-9_-]+$/.test(trimmed)) {
                tokenInput.value = trimmed; foundToken = true;
            } 
            else if (/^\d{5,15}$/.test(trimmed) && !foundId) {
                idInput.value = trimmed; foundId = true;
            }
        });
        if (foundToken || foundId) {
            let msg = `✅ 自动识别成功！`;
            if (foundToken) msg += ` Token 已填入`;
            if (foundId) msg += ` ID 已填入`;
            status.innerHTML = msg; status.className = 'mt-2 text-[10px] text-green-400';
        } else {
            status.innerHTML = '❌ 自动填写失败：剪贴板内容不符合 ID 或 Token 的格式';
            status.className = 'mt-2 text-[10px] text-red-400';
        }
    }).catch(err => {
        status.innerHTML = '❌ 读取剪贴板失败，请检查网页权限设置'; status.className = 'mt-2 text-[10px] text-red-400';
    });
};

// ==========================================
// 5. 界面基础功能（全屏、面板折叠）
// ==========================================
function toggleFullScreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else if (document.exitFullscreen) document.exitFullscreen();
}
function togglePanel() {
    const panel = document.getElementById('configPanel'), handle = document.getElementById('panelHandle');
    const isHidden = panel.dataset.hidden === 'true';
    if (isHidden) {
        panel.style.transform = 'translateY(0)'; panel.dataset.hidden = 'false'; handle.classList.add('hidden');
    } else {
        const translateY = window.innerHeight - 84; panel.style.transform = `translateY(${translateY}px)`;
        panel.dataset.hidden = 'true'; handle.classList.remove('hidden');
    }
}
document.addEventListener("DOMContentLoaded", function() {
    const originalToggle = window.toggleAgentPanel;
    window.toggleAgentPanel = function() {
        const wrapper = document.getElementById('agentPanelWrapper'), panel = document.getElementById('agentPanel');
        if (!wrapper || !panel) return;
        const isWorkspace = !document.getElementById('cardStackContainer');
        if (isWorkspace) {
            if (wrapper.style.display === 'block') { panel.classList.add('translate-y-full'); setTimeout(() => { wrapper.style.display = 'none'; }, 300); }
            else {
                wrapper.style.display = 'block'; wrapper.style.width = '360px'; wrapper.style.left = 'auto'; wrapper.style.right = '24px'; wrapper.style.transform = 'none';
                setTimeout(() => { panel.classList.remove('translate-y-full'); const input = document.getElementById('agentInput'); if (input) setTimeout(() => input.focus(), 400); }, 10);
            }
        } else { if (typeof originalToggle === 'function') originalToggle(); }
    };
});

// ==========================================
// 6. 画布拖拽与双指缩放（彻底修复黑屏bug）
// ==========================================
canvasArea.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || e.target !== canvasArea && e.target.id === 'canvasArea') return;
    isDraggingCanvas = true; lastMouseX = e.clientX; lastMouseY = e.clientY;
    canvasArea.style.cursor = 'grabbing';
});
document.addEventListener('mousemove', (e) => {
    if (isDraggingNode && currentDragNode) {
        const left = e.clientX - startX - canvasArea.getBoundingClientRect().left;
        const top = e.clientY - startY - canvasArea.getBoundingClientRect().top;
        currentDragNode.style.left = left + 'px'; currentDragNode.style.top = top + 'px';
    }
    if (isDraggingCanvas) {
        const dx = e.clientX - lastMouseX; const dy = e.clientY - lastMouseY;
        canvasOffsetX += dx; canvasOffsetY += dy;
        applyCanvasTransform();
        lastMouseX = e.clientX; lastMouseY = e.clientY;
    }
});
document.addEventListener('mouseup', (e) => {
    if (isDraggingNode && currentDragNode) {
        const index = parseInt(currentDragNode.dataset.index);
        if (!isNaN(index)) {
            nodes[index].x = parseFloat(currentDragNode.style.left);
            nodes[index].y = parseFloat(currentDragNode.style.top);
            saveHistory();
        }
        currentDragNode.style.zIndex = 1; isDraggingNode = false; currentDragNode = null;
    }
    if (isDraggingCanvas) {
        isDraggingCanvas = false; canvasArea.style.cursor = 'grab';
    }
});
canvasArea.addEventListener('touchstart', (e) => {
    if (e.target.closest('.canvas-node')) return; 
    if (e.touches.length === 1) {
        const touch = e.touches[0];
        isDraggingCanvas = true; lastMouseX = touch.clientX; lastMouseY = touch.clientY;
    } else if (e.touches.length === 2) {
        const touch1 = e.touches[0]; const touch2 = e.touches[1];
        lastPinchDist = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
        isPinching = true;
    }
});
document.addEventListener('touchmove', (e) => {
    if (isDraggingNode && currentDragNode && e.touches.length === 1) {
        const touch = e.touches[0];
        const left = touch.clientX - startX - canvasArea.getBoundingClientRect().left;
        const top = touch.clientY - startY - canvasArea.getBoundingClientRect().top;
        currentDragNode.style.left = left + 'px'; currentDragNode.style.top = top + 'px';
        e.preventDefault(); return;
    }
    if (isDraggingCanvas && e.touches.length === 1) {
        const touch = e.touches[0];
        const dx = touch.clientX - lastMouseX; const dy = touch.clientY - lastMouseY;
        canvasOffsetX += dx; canvasOffsetY += dy;
        applyCanvasTransform();
        lastMouseX = touch.clientX; lastMouseY = touch.clientY;
        e.preventDefault(); return;
    }
    if (isPinching && e.touches.length === 2) {
        const touch1 = e.touches[0]; const touch2 = e.touches[1];
        const currentDist = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
        const midX = (touch1.clientX + touch2.clientX) / 2;
        const midY = (touch1.clientY + touch2.clientY) / 2;
        const rect = canvasAreaWrapper.getBoundingClientRect();
        const mouseX = midX - rect.left; const mouseY = midY - rect.top;
        
        const canvasCoordX = (mouseX - canvasOffsetX) / currentScale;
        const canvasCoordY = (mouseY - canvasOffsetY) / currentScale;
        const scaleFactor = currentDist / lastPinchDist;
        const newScale = Math.min(Math.max(0.1, currentScale * scaleFactor), 3.0);
        
        currentScale = newScale;
        canvasOffsetX = mouseX - canvasCoordX * currentScale;
        canvasOffsetY = mouseY - canvasCoordY * currentScale;
        applyCanvasTransform();
        lastPinchDist = currentDist;
        e.preventDefault();
    }
}, { passive: false });
document.addEventListener('touchend', (e) => {
    if (isDraggingNode && currentDragNode) {
        const index = parseInt(currentDragNode.dataset.index);
        if (!isNaN(index)) {
            nodes[index].x = parseFloat(currentDragNode.style.left);
            nodes[index].y = parseFloat(currentDragNode.style.top);
            saveHistory();
        }
        currentDragNode.style.zIndex = 1; isDraggingNode = false; currentDragNode = null;
    }
    if (isDraggingCanvas) {
        isDraggingCanvas = false; canvasArea.style.cursor = 'grab';
    }
    if (isPinching) { isPinching = false; }
});

// ==========================================
// 7. 节点渲染逻辑
// ==========================================
function renderNodes() {
    nodeContainer.innerHTML = '';
    nodes.forEach((node, index) => {
        const el = document.createElement('div');
        el.className = 'canvas-node';
        if (node.type === 'bot') { el.classList.add('bot-node'); }
        el.style.left = node.x + 'px'; el.style.top = node.y + 'px';
        el.dataset.index = index;
        let bodyHtml = ``;
        if (node.type === 'text') {
            bodyHtml = `<div class="node-handle"><span>节点 #${index+1}</span><span onclick="deleteNode(${index})" class="cursor-pointer hover:text-red-400">✕</span></div>`;
            bodyHtml += `<div class="node-title">自动回复</div>`;
            bodyHtml += `<div class="node-body">${node.content || '点击输入文本...'}</div>`;
        } else if (node.type === 'button') {
            bodyHtml = `<div class="node-handle"><span>节点 #${index+1}</span><span onclick="deleteNode(${index})" class="cursor-pointer hover:text-red-400">✕</span></div>`;
            bodyHtml += `<div class="node-title">按钮菜单</div>`;
            bodyHtml += `<div class="node-body">${node.content || '点击编辑按钮...'}</div>`;
            if (node.buttons && node.buttons.length > 0) {
                node.buttons.forEach(b => {
                    bodyHtml += `<span class="inline-block bg-[#493F36] text-white px-2 py-1 rounded text-[10px] mt-1 mr-1">${b}</span>`;
                });
            }
        } else if (node.type === 'bot') {
            const avatarUrl = node.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(node.name)}&background=493F36&color=fff&size=128`;
            bodyHtml = `
                <div class="relative">
                    <div class="absolute -top-3 -right-3 z-10 cursor-pointer w-6 h-6 bg-black/70 rounded-full flex items-center justify-center text-[11px] text-gray-400 hover:text-red-400 transition border border-white/10" onclick="deleteNode(${index})">✕</div>
                    <div class="flex flex-col items-center justify-center gap-2 pt-2">
                        <div class="w-[80px] h-[80px] rounded-full overflow-hidden border-2 border-[#F5E6CF]/30 shadow-lg bg-[#333] flex items-center justify-center flex-shrink-0">
                            <img src="${avatarUrl}" class="w-full h-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=Bot&background=493F36&color=fff&size=128'">
                        </div>
                        <div class="text-[#F5E6CF] font-bold text-[15px] truncate max-w-[140px] text-center mt-1">${node.name}</div>
                        <div class="text-[10px] text-gray-400/80 mt-1">已绑定</div>
                    </div>
                </div>
            `;
        }
        el.innerHTML = bodyHtml;
        el.addEventListener('mousedown', (e) => {
            e.stopPropagation(); if (e.button !== 0) return;
            isDraggingNode = true; currentDragNode = el;
            const rect = el.getBoundingClientRect();
            startX = e.clientX - rect.left; startY = e.clientY - rect.top;
            el.style.zIndex = 100;
        });
        el.addEventListener('touchstart', (e) => {
            e.stopPropagation(); if (e.touches.length !== 1) return;
            isDraggingNode = true; currentDragNode = el;
            const rect = el.getBoundingClientRect();
            startX = e.touches[0].clientX - rect.left; startY = e.touches[0].clientY - rect.top;
            el.style.zIndex = 100;
        });
        nodeContainer.appendChild(el);
    });
}
window.addBotNode = function(name, avatar) {
    const botCount = nodes.filter(n => n.type === 'bot').length;
    const baseX = 1500; const baseY = 750 + (botCount * 160);
    const newNode = {
        id: Date.now() + Math.random(),
        type: 'bot',
        name: name || '我的机器人',
        avatar: avatar || null,
        x: baseX,
        y: baseY
    };
    nodes.push(newNode); saveHistory(); renderNodes();
};
</script>
