<!-- 工作台顶部按钮：精准顶部对齐（适配所有设备） -->
<style>
  /* 保留原尺寸与外观 */
  .action-flex {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 100%;
  }
  .outer-cont {
    padding: 10px 16px;
    border: none;
    font-size: 0.95rem;
    cursor: pointer;
    position: relative;
    /* 蓝白渐变 */
    background: linear-gradient(90deg, rgba(30, 64, 175, 0.7), rgba(147, 197, 253, 0.7), rgba(255, 255, 255, 0.9));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 12px;
    color: #fff;
    transition: all 0.3s ease;
    box-shadow:
      inset 0px 0px 5px rgba(255, 255, 255, 0.6),
      inset 0px 35px 30px rgba(0, 0, 0, 0.8),
      0px 5px 10px rgba(0, 0, 0, 0.7);
    text-shadow: 1px 1px 1px #000;
    pointer-events: auto !important;
    display: inline-flex;
  }
  .outer-cont::before {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 12px;
    filter: blur(0);
    z-index: -1;
    box-shadow: none;
    /* 光晕跟着改成蓝白 */
    background: conic-gradient(
      rgba(0,0,0,0) 80deg,
      #2563EB,
      #93C5FD,
      #FFFFFF,
      rgba(0,0,0,0) 280deg
    );
    transition: all 0.3s ease;
  }
  .outer-cont:hover::before { filter: blur(15px); }
  .outer-cont:active::before { filter: blur(5px); transform: translateY(1px); }
  .outer-cont:active {
    box-shadow: inset 0px 0px 5px rgba(255, 255, 255, 0.6), inset 0px 35px 30px rgba(0, 0, 0, 0.8);
    margin-top: 3px;
  }
</style>

<!-- ✅ 核心改法：和左面板的 top:20px 强制保持同一水平线，适配所有手机/平板/电脑 -->
<div class="fixed top-[20px] right-[24px] z-50">
    <div class="outer-cont" onclick="addPanel()">
        <span class="action-flex font-bold whitespace-nowrap">
            <span>+ 添加面板</span>
        </span>
    </div>
</div>

<script>
function addPanel() {
    const panelName = prompt("请输入新面板的名称：");
    if (panelName && panelName.trim() !== "") {
        alert(`准备创建面板：「${panelName}」`);
        // 替换你的后端接口
        // fetch('/api/create_panel', { method: 'POST', body: JSON.stringify({name: panelName}) })
    } else if (panelName !== null) {
        alert("面板名称不能为空！");
    }
}
</script>
