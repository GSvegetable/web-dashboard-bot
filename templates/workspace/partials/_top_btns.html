<!-- 固定在右上角 -->
<div class="fixed top-4 right-4 z-50">
    <div class="outer-cont" onclick="addProject()">
        <span class="action-flex font-bold whitespace-nowrap">
            <span>+ 添加项目</span>
        </span>
    </div>
</div>

<!-- 点击按钮后的交互逻辑（可自行替换为真实 API 请求） -->
<script>
function addProject() {
    // 示例：弹窗让用户输入项目名称
    const projectName = prompt("请输入新项目的名称：");
    if (projectName && projectName.trim() !== "") {
        // 这里未来可以改成 fetch 请求后端创建项目
        alert(`准备创建项目：「${projectName}」`);
        // 示例接口调用：
        // fetch('/api/create_project', { method: 'POST', body: JSON.stringify({name: projectName}) })
    } else if (projectName !== null) {
        alert("项目名称不能为空！");
    }
}
</script>
