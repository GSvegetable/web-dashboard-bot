<!-- 工作台顶部按钮：只保留一个蓝色渐变“添加项目”按钮 -->
<style>
  /* 保留原尺寸与外观 */
  .action-flex {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 100%;
  }
  .outer-cont {
    padding: 10px 16px;
    border: none;
    font-size: 0.95rem;
    cursor: pointer;
    position: relative;
    /* ✅ 颜色修改：改成蓝白渐变 */
    background: linear-gradient(90deg, rgba(30, 64, 175, 0.7), rgba(147, 197, 253, 0.7), rgba(255, 255, 255, 0.9));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 12px;
    color: #fff;
    transition: all 0.3s ease;
    box-shadow:
      inset 0px 0px 5px rgba(255, 255, 255, 0.6),
      inset 0px 35px 30px rgba(0, 0, 0, 0.8),
      0px 5px 10px rgba(0, 0, 0, 0.7);
    text-shadow: 1px 1px 1px #000;
    pointer-events: auto !important;
    display: inline-flex;
  }
  .outer-cont::before {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 12px;
    filter: blur(0);
    z-index: -1;
    box-shadow: none;
    /* ✅ 光晕颜色跟着改成蓝白 */
    background: conic-gradient(
      rgba(0,0,0,0) 80deg,
      #2563EB,
      #93C5FD,
      #FFFFFF,
      rgba(0,0,0,0) 280deg
    );
    transition: all 0.3s ease;
  }
  .outer-cont:hover::before {
    filter: blur(15px);
  }
  .outer-cont:active::before {
    filter: blur(5px);
    transform: translateY(1px);
  }
  .outer-cont:active {
    box-shadow:
      inset 0px 0px 5px rgba(255, 255, 255, 0.6),
      inset 0px 35px 30px rgba(0, 0, 0, 0.8);
    margin-top: 3px;
  }
</style>

<!-- ✅ 位置调整：top-20 (往下移一点), right-6 (往左移一点) -->
<div class="fixed top-20 right-6 z-50">
    <div class="outer-cont" onclick="addProject()">
        <span class="action-flex font-bold whitespace-nowrap">
            <span>+ 添加项目</span>
        </span>
    </div>
</div>

<!-- 点击按钮后的交互逻辑（可自行替换为真实 API 请求） -->
<script>
function addProject() {
    // 弹窗让用户输入项目名称
    const projectName = prompt("请输入新项目的名称：");
    if (projectName && projectName.trim() !== "") {
        alert(`准备创建项目：「${projectName}」`);
        // 未来可以替换为后端接口：
        // fetch('/api/create_project', { method: 'POST', body: JSON.stringify({name: projectName}) })
    } else if (projectName !== null) {
        alert("项目名称不能为空！");
    }
}
</script>
