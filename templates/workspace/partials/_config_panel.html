<!-- 🟢 外层：控制四边边距、外角圆润 -->
<div id="configPanel" class="panel-fullscreen fixed z-30 transition-all duration-500 ease-out">
    
    <!-- 🔵 内层：承载毛玻璃、30px台阶、内角圆润 -->
    <div class="panel-inner">
        {% include 'workspace/partials/_config_home.html' %}
        {% include 'workspace/partials/_config_form.html' %}
    </div>

    <!-- ✅ 右上角添加面板按钮 -->
    <div id="addPanelBtnContainer" class="absolute top-[32px] right-[32px] z-40 flex items-center">
        <div id="addPanelBtn" class="outer-cont" onclick="addPanel()">
            <span class="action-flex font-bold whitespace-nowrap">
                <span>+ 添加面板</span>
            </span>
        </div>
    </div>

    <div id="panelHandle" class="absolute top-0 left-0 w-full h-[60px] cursor-pointer z-50 rounded-t-[28px] hidden" onclick="togglePanel()"></div>

    <!-- ✅ 添加面板弹窗 -->
    <div id="customAddPanelModal" class="fixed top-[85px] right-[32px] z-[9999] hidden pointer-events-none" onclick="closeAddPanelIfOutside(event)">
        <div id="modalWrapper" class="pointer-events-auto w-[360px] max-w-[calc(100vw-48px)] origin-top">
            <!-- 毛玻璃卡片 + 表单 -->
            <div class="glass-card p-6">
                
                <div class="w-full flex flex-col gap-4">
                    
                    <!-- 字段 1：你的ID -->
                    <div class="flex flex-col gap-1">
                        <label class="text-white/70 text-sm font-medium tracking-wide">你的ID</label>
                        <input id="addPanelIdInput" type="text" placeholder="请输入你的 ID" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/20 transition-all" />
                    </div>

                    <!-- 字段 2：机器人名称 -->
                    <div class="flex flex-col gap-1">
                        <label class="text-white/70 text-sm font-medium tracking-wide">机器人名称</label>
                        <input id="addPanelNameInput" type="text" placeholder="请输入机器人名称" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/20 transition-all" />
                    </div>

                    <!-- 字段 3：机器人Token（增加了自动补全逻辑） -->
                    <div class="flex flex-col gap-1">
                        <label class="text-white/70 text-sm font-medium tracking-wide">机器人Token</label>
                        <input id="addPanelTokenInput" type="text" placeholder="请输入 Bot Token" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/20 transition-all" onblur="autoFetchBotInfo()" />
                    </div>

                    <!-- 底部：双按钮布局 -->
                    <div class="mt-2 pt-2 border-t border-white/5 flex flex-col gap-2">
                        
                        <button onclick="autoFillClipboard()" class="w-full py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-white text-sm font-medium transition active:scale-95">
                            自动补齐
                        </button>
                        <button onclick="createPanel()" class="w-full py-2.5 bg-white/10 hover:bg-white/20 border border-white/10 rounded-lg text-white text-sm font-medium transition active:scale-95">
                            创建
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <style>
        /* 样式部分保持不变，重点增加 CSS 确保遮罩逻辑 */
        #customAddPanelModal { pointer-events: none; }
        #customAddPanelModal #modalWrapper { pointer-events: auto; }
    </style>

    <script>
        // ✅ 点击背景关闭弹窗的核心函数
        function closeAddPanelIfOutside(e) {
            var modal = document.getElementById('customAddPanelModal');
            var wrapper = document.getElementById('modalWrapper');
            if (modal && wrapper && e.target === modal) {
                closeAddPanel();
            }
        }

        function closeAddPanel() {
            const modal = document.getElementById('customAddPanelModal');
            const wrapper = document.getElementById('modalWrapper');
            if (!modal || !wrapper) return;
            
            wrapper.classList.remove('animate-in');
            wrapper.classList.add('animate-out');
            setTimeout(() => {
                modal.classList.add('hidden');
                wrapper.classList.remove('animate-out');
            }, 220);
        }

        // ✅ 打开面板功能
        window.addPanel = function() {
            const modal = document.getElementById('customAddPanelModal');
            const wrapper = document.getElementById('modalWrapper');
            const btn = document.getElementById('addPanelBtn');
            if (!modal || !wrapper || !btn) return;
            
            if (!modal.classList.contains('hidden')) {
                closeAddPanel();
                return;
            }

            btn.classList.remove('pulling');
            void btn.offsetHeight;
            btn.classList.add('pulling');

            modal.classList.remove('hidden');
            wrapper.classList.remove('animate-in', 'animate-out');
            wrapper.style.opacity = '0';

            setTimeout(() => {
                wrapper.style.opacity = '';
                wrapper.classList.add('animate-in');
            }, 40);
        };

        // ✅ 自动补齐：失败直接静默，不做任何提示
        window.autoFillClipboard = function() {
            const idInput = document.getElementById('addPanelIdInput');
            const tokenInput = document.getElementById('addPanelTokenInput');
            
            if (!navigator.clipboard) {
                // 完全静默
                return;
            }

            navigator.clipboard.readText().then(text => {
                if (text) {
                    const lines = text.split(/\r?\n/);
                    let matched = false;
                    lines.forEach(line => {
                        const trimmed = line.trim();
                        if (!trimmed) return;
                        if (/^\d+:[A-Za-z0-9_-]+$/.test(trimmed)) {
                            if (!tokenInput.value) {
                                tokenInput.value = trimmed;
                                // 触发自动拉取
                                autoFetchBotInfo(); 
                            }
                            matched = true;
                        }
                        else if (/^\d{5,15}$/.test(trimmed)) {
                            if (!idInput.value) idInput.value = trimmed;
                            matched = true;
                        }
                    });
                }
            }).catch(() => {
                // 失败静默
            });
        };

        // ✅ 输入 Token 后，离焦自动拉取机器人的名字和 ID
        function autoFetchBotInfo() {
            const tokenInput = document.getElementById('addPanelTokenInput');
            const nameInput = document.getElementById('addPanelNameInput');
            const idInput = document.getElementById('addPanelIdInput');
            const token = tokenInput.value.trim();

            if (!/^\d+:[A-Za-z0-9_-]+$/.test(token)) return;

            // 这里复用 execute_bind_bot 的请求方法，或者专门开一个只拉取的接口
            // 为了不产生副作用，我们模拟一个轻量请求：
            fetch('/api/bind_bot', { 
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token: token, telegram_id: '000000', name: '临时获取' }) 
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok && data.bot_name) {
                    if (!nameInput.value) nameInput.value = data.bot_name;
                    if (data.bot_avatar_url && !idInput.value) {
                        // 可以用作ID参考，如果没有自己填
                    }
                }
            })
            .catch(() => { /* 静默处理 */ });
        }

        // 辅助函数：高亮错误
        function markInvalid(input) {
            if (!input) return;
            input.style.borderColor = 'rgba(239, 68, 68, 0.8)';
            input.style.boxShadow = '0 0 10px rgba(239, 68, 68, 0.3)';
            input.focus();
        }
        function clearInvalid(input) {
            if (!input) return;
            input.style.borderColor = '';
            input.style.boxShadow = '';
        }

        // ✅ 创建功能：错误提示改用自定义 Toast 而不是 alert
        window.createPanel = function() {
            const idInput = document.getElementById('addPanelIdInput');
            const nameInput = document.getElementById('addPanelNameInput');
            const tokenInput = document.getElementById('addPanelTokenInput');

            const idVal = idInput.value.trim();
            const nameVal = nameInput.value.trim();
            const tokenVal = tokenInput.value.trim();

            if (!nameVal) {
                markInvalid(nameInput);
                if (typeof showTopToast === 'function') {
                    showTopToast('请填写机器人名称。');
                }
                return;
            }
            clearInvalid(nameInput);

            if (!idVal) {
                markInvalid(idInput);
                if (typeof showTopToast === 'function') {
                    showTopToast('请填写你的 ID（纯数字）。');
                }
                return;
            }
            if (!/^\d{5,15}$/.test(idVal)) {
                markInvalid(idInput);
                if (typeof showTopToast === 'function') {
                    showTopToast('ID 格式不正确，应为 5~15 位纯数字。');
                }
                return;
            }
            clearInvalid(idInput);

            if (!tokenVal) {
                markInvalid(tokenInput);
                if (typeof showTopToast === 'function') {
                    showTopToast('请填写机器人 Token。');
                }
                return;
            }
            if (!/^\d+:[A-Za-z0-9_-]+$/.test(tokenVal)) {
                markInvalid(tokenInput);
                if (typeof showTopToast === 'function') {
                    showTopToast('Token 格式不正确。');
                }
                return;
            }
            clearInvalid(tokenInput);

            let cards = [];
            try { cards = JSON.parse(localStorage.getItem(window.BOT_REPO_KEY || 'gsbot_bot_repo_cards')) || []; } catch(e) { cards = []; }
            cards.push({ id: idVal, name: nameVal, token: tokenVal });
            localStorage.setItem(window.BOT_REPO_KEY || 'gsbot_bot_repo_cards', JSON.stringify(cards));

            idInput.value = ''; nameInput.value = ''; tokenInput.value = '';
            closeAddPanel();
            if (typeof window.renderBotRepo === 'function') window.renderBotRepo();
        };
    </script>
</div>
