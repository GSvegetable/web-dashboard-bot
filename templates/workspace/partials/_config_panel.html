<div id="configPanel" class="fixed left-6 bottom-6 w-[480px] glass-panel flex flex-col z-20 transition-all duration-500 ease-out">
    <div id="panelHandle" class="absolute top-0 left-0 w-full h-[60px] cursor-pointer z-50 rounded-t-[28px] hidden" onclick="togglePanel()"></div>
    
    <!-- 引入两个视图组件 -->
    {% include 'workspace/partials/_config_home.html' %}
    {% include 'workspace/partials/_config_form.html' %}

    <!-- 控制面板切换的 JS 逻辑 -->
    <script>
        window.switchToConfig = function() {
            document.getElementById('configHome').classList.add('hidden');
            document.getElementById('configForm').classList.remove('hidden');
        };
        window.switchToHome = function() {
            document.getElementById('configForm').classList.add('hidden');
            document.getElementById('configHome').classList.remove('hidden');
        };
    </script>
</div>
