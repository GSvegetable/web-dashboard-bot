<!-- 🟢 外层：控制四边边距、外角圆润 -->
<div id="configPanel" class="panel-fullscreen fixed z-30 transition-all duration-500 ease-out">
    
    <!-- 🔵 内层：承载毛玻璃、30px台阶、内角圆润 -->
    <div class="panel-inner">
        {% include 'workspace/partials/_config_home.html' %}
        {% include 'workspace/partials/_config_form.html' %}
    </div>

    <div id="panelHandle" class="absolute top-0 left-0 w-full h-[60px] cursor-pointer z-50 rounded-t-[28px] hidden" onclick="togglePanel()"></div>

    <style>
        .panel-fullscreen { top: 20px !important; left: 32px !important; right: 32px !important; bottom: 32px !important; width: auto !important; height: auto !important; border-radius: 28px !important; background: rgba(255, 255, 255, 0.04) !important; backdrop-filter: blur(24px) !important; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5) !important; }
        .panel-fullscreen .panel-inner { width: 100% !important; height: 100% !important; border-radius: 28px !important; }
        @media (min-width: 768px) {
            .panel-fullscreen .panel-inner {
                clip-path: polygon(0% 0%, calc(100% - 220px) 0%, calc(100% - 220px) 30px, 100% 30px, 100% 100%, 0% 100%) !important;
                mask-image: radial-gradient(circle at calc(100% - 220px) 30px, transparent 16px, black 18px) !important;
                -webkit-mask-image: radial-gradient(circle at calc(100% - 220px) 30px, transparent 16px, black 18px) !important;
            }
        }
        .panel-collapsed { top: auto !important; left: 24px !important; bottom: 24px !important; right: 24px !important; width: auto !important; max-width: 480px !important; height: auto !important; max-height: calc(100vh - 48px) !important; border-radius: 28px !important; background: rgba(255, 255, 255, 0.04) !important; backdrop-filter: blur(24px) !important; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5) !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; }
        .panel-collapsed .panel-inner { clip-path: none !important; mask-image: none !important; }
        .panel-fullscreen #configHome { display: flex !important; }
        .panel-fullscreen #configForm { display: none !important; }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const panel = document.getElementById('configPanel');
            panel.classList.remove('panel-collapsed');
            panel.classList.add('panel-fullscreen');
        });

        window.switchToConfig = function() {
            const panel = document.getElementById('configPanel');
            const home = document.getElementById('configHome');
            const form = document.getElementById('configForm');
            panel.classList.remove('panel-fullscreen');
            panel.classList.add('panel-collapsed');
            setTimeout(() => { home.classList.add('hidden'); form.classList.remove('hidden'); }, 50);
        };
        window.switchToHome = function() {
            const panel = document.getElementById('configPanel');
            const home = document.getElementById('configHome');
            const form = document.getElementById('configForm');
            form.classList.add('hidden'); home.classList.remove('hidden');
            panel.classList.remove('panel-collapsed'); panel.classList.add('panel-fullscreen');
        };
    </script>
</div>
