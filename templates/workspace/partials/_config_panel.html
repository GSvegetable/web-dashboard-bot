<div id="configPanel" class="fixed left-6 bottom-6 w-[480px] glass-panel flex flex-col z-20 transition-all duration-500 ease-out">
    <div id="panelHandle" class="absolute top-0 left-0 w-full h-[60px] cursor-pointer z-50 rounded-t-[28px] hidden" onclick="togglePanel()"></div>
    <div class="flex-1 flex flex-col p-8 relative">
        <h2 class="text-white text-2xl font-bold mb-6">机器人配置</h2>
        
        <div class="flex flex-col gap-6">
            <div>
                <label class="text-gray-400 text-xs mb-1 block">Bot Token</label>
                <input id="botTokenInput" type="password" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none transition-all duration-300">
            </div>

            <div>
                <label class="text-gray-400 text-xs mb-1 block">Telegram ID</label>
                <input id="telegramIdInput" type="text" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none transition-all duration-300">
            </div>
        </div>
        
        <div class="mt-6 mb-2">
            <button onclick="connectBot()" class="w-full bg-[#3c4779] hover:bg-[#2e385e] text-white rounded-xl px-5 py-3 text-sm font-medium transition active:scale-95">绑定机器人</button>
        </div>

        <div class="mt-2">
            <button onclick="autoFillBot()" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl px-5 py-3 text-white text-sm font-medium transition active:scale-95">自动填写</button>
        </div>

        <!-- 🧹 纯文字状态，左边不再有任何空隙 -->
        <div id="botStatusContainer" class="mt-3 h-4 text-[10px] text-gray-400">
            <span id="statusText">未连接</span>
        </div>
    </div>
</div>
