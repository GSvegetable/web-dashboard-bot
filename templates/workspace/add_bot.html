<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>机器人绑定 - 开发工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d1117;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            color: #e5e7eb;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-panel {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            padding: 32px;
            text-align: left;
        }
        .gh-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            padding: 10px 14px;
            width: 100%;
            outline: none;
            transition: 0.2s;
        }
        .gh-input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
        }
        .btn-primary {
            background: #238636;
            border: none;
            border-radius: 10px;
            color: white;
            padding: 12px 20px;
            font-weight: 600;
            transition: 0.2s;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:hover { background: #2ea043; }
        .btn-primary:active { transform: scale(0.98); }
        .back-btn {
            position: absolute; top: 16px; left: 16px; color: rgba(255, 255, 255, 0.5);
            text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 14px;
        }
        .back-btn:hover { color: #ffffff; }
        .modal-overlay { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="modal-overlay" onclick="if(event.target===this) window.location.href='/workspace'">
        <div class="glass-panel relative">
            <a href="/workspace" class="back-btn">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                返回
            </a>

            <h2 class="text-2xl font-bold text-white tracking-tight text-center pt-4">绑定机器人</h2>
            <p class="text-xs text-gray-400 text-center mb-6">绑定后，机器人将向你的 Telegram 发送一条确认通知</p>

            <div class="flex flex-col gap-2 mb-4">
                <label class="text-sm font-medium text-white/80">你的 Telegram ID (纯数字)</label>
                <input id="inputUserId" type="text" placeholder="例如: 7857605443" class="gh-input" />
            </div>

            <div class="flex flex-col gap-2 mb-4">
                <label class="text-sm font-medium text-white/80">机器人 Token</label>
                <input id="inputToken" type="text" placeholder="请输入 Bot Token" class="gh-input" />
            </div>

            <button id="bindBtn" class="btn-primary text-base mt-2">绑定</button>
            
            <div id="statusMsg" class="mt-3 text-xs text-center text-gray-400 hidden"></div>
        </div>
    </div>

    <script>
        document.getElementById('bindBtn').addEventListener('click', function() {
            const userIdInput = document.getElementById('inputUserId');
            const tokenInput = document.getElementById('inputToken');
            const statusMsg = document.getElementById('statusMsg');
            
            const userId = userIdInput.value.trim();
            const token = tokenInput.value.trim();

            if (!userId) { userIdInput.style.borderColor='rgba(239,68,68,0.8)'; userIdInput.focus(); return; }
            userIdInput.style.borderColor = '';

            if (!token) { tokenInput.style.borderColor='rgba(239,68,68,0.8)'; tokenInput.focus(); return; }
            if (!/^\d+:[A-Za-z0-9_-]+$/.test(token)) { alert('Token 格式不正确。'); tokenInput.focus(); return; }
            tokenInput.style.borderColor = '';

            this.innerText = '发送中...';
            this.disabled = true;
            statusMsg.classList.remove('hidden');
            statusMsg.innerText = '已发送请求，等待 Telegram 确认...';
            statusMsg.className = 'mt-3 text-xs text-center text-yellow-400';

            fetch('/api/send_bind_request', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, token: token })
            })
            .then(res => res.json())
            .then(data => {
                if (!data.ok) {
                    statusMsg.innerText = '❌ 失败: ' + data.msg;
                    statusMsg.className = 'mt-3 text-xs text-center text-red-400';
                    this.innerText = '绑定';
                    this.disabled = false;
                    return;
                }

                // ✅ 发起轮询，每隔 1.5 秒检查后端状态
                const pollInterval = setInterval(() => {
                    fetch(`/api/bind_status/${encodeURIComponent(token)}`)
                    .then(res => res.json())
                    .then(pollData => {
                        if (pollData.status === 'confirmed') {
                            clearInterval(pollInterval);
                            statusMsg.innerText = '✅ 确认成功，正在添加卡片...';
                            statusMsg.className = 'mt-3 text-xs text-center text-green-400';
                            
                            // ✅ 把机器人卡片直接存入 localStorage
                            let cards = JSON.parse(localStorage.getItem('gsbot_bot_repo_cards')) || [];
                            // 避免重复添加（清除之前可能残留的）
                            const existing = cards.find(c => c.token === token);
                            if (!existing) {
                                cards.push({
                                    token: token,
                                    code: '',
                                    name: pollData.bot_name || '未命名',
                                    id: pollData.bot_id || '',
                                    username: pollData.bot_username || ''
                                });
                                localStorage.setItem('gsbot_bot_repo_cards', JSON.stringify(cards));
                            }
                            
                            // 延迟 1.5 秒后跳回工作台（让卡片渲染生效）
                            setTimeout(() => { window.location.href = '/workspace'; }, 1500);
                            
                        } else if (pollData.status === 'canceled') {
                            clearInterval(pollInterval);
                            statusMsg.innerText = '❌ 绑定已取消';
                            statusMsg.className = 'mt-3 text-xs text-center text-red-400';
                            // 延迟跳回工作台
                            setTimeout(() => { window.location.href = '/workspace'; }, 2000);
                        }
                        // 如果仍是 pending，继续轮询
                    })
                    .catch(() => {
                        // 轮询网络错误，尝试继续
                    });
                }, 1500); // 1.5秒轮询一次
            })
            .catch(() => {
                statusMsg.innerText = '❌ 网络异常，请稍后重试。';
                statusMsg.className = 'mt-3 text-xs text-center text-red-400';
                this.innerText = '绑定';
                this.disabled = false;
            });
        });
    </script>
</body>
</html>
