<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>空白页面 - 开发工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d1117;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            color: #e5e7eb;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-panel {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            padding: 40px;
            text-align: center;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #c9d1d9;
            text-decoration: none;
            transition: 0.2s;
            font-weight: 500;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <!-- 点击空白卡片外面也能返回工作台 -->
    <div style="width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; cursor: pointer;" onclick="window.location.href='/workspace'">
        <div class="glass-panel" onclick="event.stopPropagation()">
            <h2 class="text-2xl font-bold text-white mb-3">空页面</h2>
            <p class="text-gray-400">这里没有任何内容，</p>
            <p class="text-gray-400">你可以点击下方按钮返回工作台。</p>
            
            <a href="/workspace" class="back-btn">← 返回工作台</a>
        </div>
    </div>
</body>
</html>
