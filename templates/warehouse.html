<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查看仓库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            padding: 5vh 3vw;
            box-sizing: border-box;
            justify-content: flex-start;
        }

        /* ================= 左侧新布局 ================= */
        .left-panel-wrapper {
            flex: 1;
            width: 100%;
            max-width: 380px; /* 控制左侧整体宽度，不让它占据整个屏幕 */
            display: flex;
            flex-direction: column;
            gap: 20px; /* 上下长方形之间的距离 */
            height: 100%;
        }

        .box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 24px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 上部分：缩小到下面的 1/10 */
        .top-box {
            flex: 1;
            min-height: 40px;
            display: flex;
            align-items: center;
            padding: 12px 16px;
        }

        /* 下部分：占比 10/10 */
        .bottom-box {
            flex: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: hidden;
            padding: 16px; /* 减少一点内边距 */
        }

        /* 上方按钮（缩小版） */
        .file-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .file-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.1); }

        .file-btn .icon { width: 14px; height: 14px; stroke: currentColor; fill: none; }

        /* 空白占位状态 */
        .empty-state {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #8b949e;
            font-size: 14px;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* 下拉展开动画容器 */
        .file-tree-accordion {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }
        .file-tree-accordion.open {
            max-height: 1500px;
        }

        .file-tree-content {
            padding-top: 10px;
            width: 100%;
        }

        /* ==========================================================
           Uiverse 树形菜单组件 (去掉了外部的黑/白背景和边框)
           ========================================================== */
        .tree-container {
            width: 100%;
            padding: 4px;
            /* 彻底去掉背景和边框，融入下方盒子 */
            background: transparent;
            border: none;
            box-shadow: none;
            box-sizing: border-box;
        }

        ul { list-style: none; padding: 0; margin: 0; }
        ul ul { margin-left: 11px; padding-left: 11px; border-left: 1px solid rgba(255, 255, 255, 0.1); }
        .tree-item { position: relative; margin-top: 4px; }
        ul ul .tree-item::before {
            content: ""; position: absolute; left: -11px; top: 14px;
            width: 11px; height: 1px; background-color: rgba(255, 255, 255, 0.1);
        }

        .tree-label, .file-item {
            display: flex; align-items: center; gap: 8px; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 14px;
            color: #c9d1d9; transition: background-color 0.2s; user-select: none;
            text-decoration: none; height: 28px;
        }
        .tree-label:hover, .file-item:hover { background-color: rgba(255, 255, 255, 0.05); }
        .is-selected { background-color: rgba(255, 255, 255, 0.05); color: #ffffff; font-weight: 500; }

        .icon { width: 16px; height: 16px; color: #8b949e; flex-shrink: 0; }
        .folder-open-icon { display: none; }
        .folder-closed-icon { display: block; }

        .tree-toggle:checked ~ .tree-label .folder-open-icon { display: block; color: #ffffff; }
        .tree-toggle:checked ~ .tree-label .folder-closed-icon { display: none; }
        .tree-toggle { display: none; }

        .tree-children-wrapper {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
        }
        .tree-children { overflow: hidden; }
        .tree-toggle:checked ~ .tree-children-wrapper { grid-template-rows: 1fr; }
        /* ========================================================== */

        @media (max-width: 600px) {
            body { padding: 3vh 3vw; overflow-y: auto; }
            .left-panel-wrapper { max-width: 100%; height: 100vh; }
            .top-box { flex: 1; min-height: 40px; padding: 10px 14px; }
            .bottom-box { flex: 10; padding: 12px; }
            .tree-container { padding: 0; }
        }
    </style>
</head>
<body>
    <!-- 左侧纯双面板结构 -->
    <div class="left-panel-wrapper">
        <!-- 上半部分（缩小至 1/10） -->
        <div class="box top-box">
            <button class="file-btn" id="fileToggleBtn" onclick="toggleFileTree()">
                <svg class="icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                文件
            </button>
        </div>

        <!-- 下半部分（10/10） -->
        <div class="box bottom-box">
            <!-- 空状态提示 -->
            <div id="emptyState" class="empty-state">点击上方“文件”展开目录</div>

            <!-- 可折叠树形菜单 (去掉黑底，透明融合) -->
            <div id="fileTreeAccordion" class="file-tree-accordion">
                <div class="file-tree-content">
                    <div class="tree-container">
                        <ul>
                            <li class="tree-item">
                                <input type="checkbox" class="tree-toggle" id="t1" checked>
                                <label for="t1" class="tree-label is-selected">
                                    <span class="icon folder-closed-icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
                                    </span>
                                    <span class="icon folder-open-icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg>
                                    </span>
                                    src
                                </label>
                                <div class="tree-children-wrapper">
                                    <ul class="tree-children">
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-1">
                                            <label for="t1-1" class="tree-label">
                                                <span class="icon folder-closed-icon">
                                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
                                                </span>
                                                <span class="icon folder-open-icon">
                                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg>
                                                </span>
                                                app
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>layout.tsx</span></li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>page.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-2">
                                            <label for="t1-2" class="tree-label">
                                                <span class="icon folder-closed-icon">
                                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
                                                </span>
                                                <span class="icon folder-open-icon">
                                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg>
                                                </span>
                                                components
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item">
                                                        <input type="checkbox" class="tree-toggle" id="t1-2-1">
                                                        <label for="t1-2-1" class="tree-label">
                                                            <span class="icon folder-closed-icon">
                                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
                                                            </span>
                                                            <span class="icon folder-open-icon">
                                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg>
                                                            </span>
                                                            ui
                                                        </label>
                                                        <div class="tree-children-wrapper">
                                                            <ul class="tree-children">
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>button.tsx</span></li>
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>card.tsx</span></li>
                                                            </ul>
                                                        </div>
                                                    </li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>header.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleFileTree() {
            const accordion = document.getElementById('fileTreeAccordion');
            const emptyState = document.getElementById('emptyState');
            // 按钮文字不再改变，始终保持为“文件”

            const isOpen = accordion.classList.toggle('open');
            
            if (isOpen) {
                emptyState.style.display = 'none';
            } else {
                setTimeout(() => {
                    emptyState.style.display = 'block';
                }, 400); // 等待折叠动画结束后再显示空状态
            }
        }
    </script>
</body>
</html>
