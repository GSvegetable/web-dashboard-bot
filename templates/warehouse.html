<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查看仓库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            padding: 5vh 3vw;
            box-sizing: border-box;
        }

        /* 主容器 */
        .left-panel-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            margin-top: -12px;
        }

        .box {
            border-radius: 24px;
            width: 100%;
            padding: 14px 20px;
            box-sizing: border-box;
        }

        /* ================= 上方细长条 ================= */
        .top-box {
            flex: 0 0 auto;
            width: 100%;
            min-height: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            
            /* 蜂巢背景 */
            --s: 200px;
            --c1: #1d1d1d;
            --c2: #4e4f51;
            --c3: #3c3c3c;
            background: 
                repeating-conic-gradient(
                    from 30deg,
                    #0000 0 120deg,
                    var(--c3) 0 180deg
                ) calc(0.5 * var(--s)) calc(0.5 * var(--s) * 0.577),
                repeating-conic-gradient(
                    from 30deg,
                    var(--c1) 0 60deg,
                    var(--c2) 0 120deg,
                    var(--c3) 0 180deg
                );
            background-size: var(--s) calc(var(--s) * 0.577);
        }

        /* 玻璃质感按钮 */
        .top-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 8px;
            padding: 6px 14px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); }
        .top-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

        /* ================= 下方主盒子 ================= */
        .bottom-box {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: hidden;
            padding: 16px;
            background-color: #161b22;
            border: 1px solid #30363d;
            height: 100%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 收缩状态 */
        .bottom-box.shrink {
            width: 33.33% !important;
            align-self: flex-start !important;
        }

        /* ================= 你提供的怪物背景动画 ================= */
        .monster-bg {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: none; /* 默认隐藏 */
            background-color: #111;
            z-index: 0; /* 放在底层 */
            --color-0: #fff;
            --color-1: #111;
            --color-2: #222;
            --color-3: #333;
            --color-4: #2e2e2e;
            --color-5: #d2b48c;
            --color-6: #b22222;
            --color-7: #871a1a;
            --color-8: #ff6347;
            --color-9: #ff3814;
            background-image: linear-gradient(to top, var(--color-2) 5%, var(--color-1) 6%, var(--color-1) 7%, transparent 7%),
                linear-gradient(to bottom, var(--color-1) 30%, transparent 80%),
                linear-gradient(to right, var(--color-2), var(--color-4) 5%, transparent 5%),
                linear-gradient(to right, transparent 6%, var(--color-2) 6%, var(--color-4) 9%, transparent 9%),
                linear-gradient(to right, transparent 27%, var(--color-2) 27%, var(--color-4) 34%, transparent 34%),
                linear-gradient(to right, transparent 51%, var(--color-2) 51%, var(--color-4) 57%, transparent 57%),
                linear-gradient(to bottom, var(--color-1) 35%, transparent 35%),
                linear-gradient(to right, transparent 42%, var(--color-2) 42%, var(--color-4) 44%, transparent 44%),
                linear-gradient(to right, transparent 45%, var(--color-2) 45%, var(--color-4) 47%, transparent 47%),
                linear-gradient(to right, transparent 48%, var(--color-2) 48%, var(--color-4) 50%, transparent 50%),
                linear-gradient(to right, transparent 87%, var(--color-2) 87%, var(--color-4) 91%, transparent 91%),
                linear-gradient(to bottom, var(--color-1) 37.5%, transparent 37.5%),
                linear-gradient(to right, transparent 14%, var(--color-2) 14%, var(--color-4) 20%, transparent 20%),
                linear-gradient(to bottom, var(--color-1) 40%, transparent 40%),
                linear-gradient(to right, transparent 10%, var(--color-2) 10%, var(--color-4) 13%, transparent 13%),
                linear-gradient(to right, transparent 21%, var(--color-2) 21%, #1a1a1a 25%, transparent 25%),
                linear-gradient(to right, transparent 58%, var(--color-2) 58%, var(--color-4) 64%, transparent 64%),
                linear-gradient(to right, transparent 92%, var(--color-2) 92%, var(--color-4) 95%, transparent 95%),
                linear-gradient(to bottom, var(--color-1) 48%, transparent 48%),
                linear-gradient(to right, transparent 96%, var(--color-2) 96%, #1a1a1a 99%, transparent 99%),
                linear-gradient(to bottom, transparent 68.5%, transparent 76%, var(--color-1) 76%, var(--color-1) 77.5%, transparent 77.5%, transparent 86%, var(--color-1) 86%, var(--color-1) 87.5%, transparent 87.5%),
                linear-gradient(to right, transparent 35%, var(--color-2) 35%, var(--color-4) 41%, transparent 41%),
                linear-gradient(to bottom, var(--color-1) 68%, transparent 68%),
                linear-gradient(to right, transparent 78%, var(--color-3) 78%, var(--color-3) 80%, transparent 80%, transparent 82%, var(--color-3) 82%, var(--color-3) 83%, transparent 83%),
                linear-gradient(to right, transparent 66%, var(--color-2) 66%, var(--color-4) 85%, transparent 85%);
            background-size: 300px 150px;
            background-position: center bottom;
        }

        /* 怪物手电筒发光动画 */
        .monster-bg::before {
            content: "";
            width: 100%; height: 100%;
            position: absolute; inset: 0;
            background-color: #111;
            background-image: linear-gradient(to top, #d2b48c 5%, #111 6%, #111 7%, transparent 7%),
                linear-gradient(to bottom, #111 30%, transparent 30%),
                linear-gradient(to right, #b22222, #871a1a 5%, transparent 5%),
                linear-gradient(to right, transparent 6%, #ff6347 6%, #ff3814 9%, transparent 9%),
                linear-gradient(to right, transparent 27%, #556b2f 27%, #39481f 34%, transparent 34%),
                linear-gradient(to right, transparent 51%, #fa8072 51%, #f85441 57%, transparent 57%),
                linear-gradient(to bottom, #111 35%, transparent 35%),
                linear-gradient(to right, transparent 42%, #008080 42%, #004d4d 44%, transparent 44%),
                linear-gradient(to right, transparent 45%, #008080 45%, #004d4d 47%, transparent 47%),
                linear-gradient(to right, transparent 48%, #008080 48%, #004d4d 50%, transparent 50%),
                linear-gradient(to right, transparent 87%, #789 87%, #4f5d6a 91%, transparent 91%),
                linear-gradient(to bottom, #111 37.5%, transparent 37.5%),
                linear-gradient(to right, transparent 14%, #bdb76b 14%, #989244 20%, transparent 20%),
                linear-gradient(to bottom, #111 40%, transparent 40%),
                linear-gradient(to right, transparent 10%, #808000 10%, #4d4d00 13%, transparent 13%),
                linear-gradient(to right, transparent 21%, #8b4513 21%, #5e2f0d 25%, transparent 25%),
                linear-gradient(to right, transparent 58%, #8b4513 58%, #5e2f0d 64%, transparent 64%),
                linear-gradient(to right, transparent 92%, #2f4f4f 92%, #1c2f2f 95%, transparent 95%),
                linear-gradient(to bottom, #111 48%, transparent 48%),
                linear-gradient(to right, transparent 96%, #2f4f4f 96%, #1c2f2f 99%, transparent 99%),
                linear-gradient(to bottom, transparent 68.5%, transparent 76%, #111 76%, #111 77.5%, transparent 77.5%, transparent 86%, #111 86%, #111 87.5%, transparent 87.5%),
                linear-gradient(to right, transparent 35%, #cd5c5c 35%, #bc3a3a 41%, transparent 41%),
                linear-gradient(to bottom, #111 68%, transparent 68%),
                linear-gradient(to right, transparent 78%, #bc8f8f 78%, #bc8f8f 80%, transparent 80%, transparent 82%, #bc8f8f 82%, #bc8f8f 83%, transparent 83%),
                linear-gradient(to right, transparent 66%, #a52a2a 66%, #7c2020 85%, transparent 85%);
            background-size: 300px 150px;
            background-position: center bottom;
            clip-path: circle(150px at center center);
            animation: flashlight 20s ease infinite;
        }

        /* 怪物眼睛动画 */
        .monster-bg::after {
            content: "";
            width: 25px; height: 10px;
            position: absolute;
            left: calc(50% + 59px);
            bottom: 100px;
            background-repeat: no-repeat;
            background-image: radial-gradient(circle, #fff 50%, transparent 50%),
                radial-gradient(circle, #fff 50%, transparent 50%);
            background-size: 10px 10px;
            background-position: left center, right center;
            animation: eyes 20s infinite;
        }

        @keyframes flashlight {
            0% { clip-path: circle(150px at -25% 10%); }
            38% { clip-path: circle(150px at 60% 20%); }
            39% { opacity: 1; clip-path: circle(150px at 60% 86%); }
            40% { opacity: 0; clip-path: circle(150px at 60% 86%); }
            41% { opacity: 1; clip-path: circle(150px at 60% 86%); }
            42% { opacity: 0; clip-path: circle(150px at 60% 86%); }
            54% { opacity: 0; clip-path: circle(150px at 60% 86%); }
            55% { opacity: 1; clip-path: circle(150px at 60% 86%); }
            59% { opacity: 1; clip-path: circle(150px at 60% 86%); }
            64% { clip-path: circle(150px at 45% 78%); }
            68% { clip-path: circle(150px at 85% 89%); }
            72% { clip-path: circle(150px at 60% 86%); }
            74% { clip-path: circle(150px at 60% 86%); }
            100% { clip-path: circle(150px at 150% 50%); }
        }

        @keyframes eyes {
            0%, 38% { opacity: 0; }
            39%, 41% { opacity: 1; transform: scaleY(1); }
            40% { transform: scaleY(0); filter: none; background-image: radial-gradient(circle, #fff 50%, transparent 50%), radial-gradient(circle, #fff 50%, transparent 50%); }
            41% { transform: scaleY(1); background-image: radial-gradient(circle, #ff0000 50%, transparent 50%), radial-gradient(circle, #ff0000 50%, transparent 50%); filter: drop-shadow(0 0 4px #ff8686); }
            42%, 100% { opacity: 0; }
        }

        /* 🔽 逻辑控制：仅在收缩（未展开）时显示怪物背景 */
        .bottom-box.shrink .monster-bg {
            display: block;
        }
        /* 收缩时隐藏空状态和文件树 */
        .bottom-box.shrink #emptyState,
        .bottom-box.shrink .file-tree-accordion {
            display: none;
        }

        /* ================= 树形菜单组件 ================= */
        .file-tree-accordion {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            position: relative; z-index: 1;
        }
        .file-tree-accordion.open { max-height: 1500px; }
        .file-tree-content { padding-top: 10px; width: 100%; }

        #emptyState { position: relative; z-index: 1; }

        .tree-container { width: 100%; padding: 4px; background: transparent; border: none; box-sizing: border-box; }
        ul { list-style: none; padding: 0; margin: 0; }
        ul ul { margin-left: 11px; padding-left: 11px; border-left: 1px solid #4a4d52; }
        .tree-item { position: relative; margin-top: 4px; }
        ul ul .tree-item::before {
            content: ""; position: absolute; left: -11px; top: 14px;
            width: 11px; height: 1px; background-color: #4a4d52;
        }
        .tree-label, .file-item {
            display: flex; align-items: center; gap: 8px; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 14px;
            color: #c9d1d9; transition: background-color 0.2s; user-select: none;
            text-decoration: none; height: 28px;
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        .tree-label:hover, .file-item:hover { background-color: rgba(255, 255, 255, 0.05); }
        .is-selected { background-color: rgba(255, 255, 255, 0.05); color: #ffffff; font-weight: 500; }
        .icon { width: 16px; height: 16px; color: #8b949e; flex-shrink: 0; }
        .folder-open-icon { display: none; }
        .folder-closed-icon { display: block; }
        .tree-toggle:checked ~ .tree-label .folder-open-icon { display: block; color: #ffffff; }
        .tree-toggle:checked ~ .tree-label .folder-closed-icon { display: none; }
        .tree-toggle { display: none; }
        .tree-children-wrapper {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
        }
        .tree-children { overflow: hidden; }
        .tree-toggle:checked ~ .tree-children-wrapper { grid-template-rows: 1fr; }

        /* 手机端适配 */
        @media (max-width: 600px) {
            body { padding: 3vh 3vw; overflow-y: auto; }
            .left-panel-wrapper { height: 100vh; margin-top: -6px; }
            .top-box { min-height: 30px; padding: 12px 14px; }
            .bottom-box.shrink { width: 100% !important; align-self: stretch !important; }
            .top-btn { font-size: 12px; padding: 4px 10px; }
            .tree-container { padding: 0; }
        }
    </style>
</head>
<body>
    <!-- 双面板布局 -->
    <div class="left-panel-wrapper">
        <!-- 上半部分（蜂巢背景） -->
        <div class="box top-box">
            <button class="top-btn" id="fileToggleBtn" onclick="toggleFileTree()">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                文件
            </button>
            <button class="top-btn" id="createNewBtn">新键作品</button>
        </div>

        <!-- 下半部分（收缩时触发怪物动画） -->
        <div class="box bottom-box" id="bottomBox">
            <!-- 🔽 怪物背景动画层（仅当 width 收缩为 1/3 时可见） -->
            <div class="monster-bg"></div>

            <div id="emptyState" class="empty-state">点击上方“文件”展开目录</div>

            <!-- 树形菜单 -->
            <div id="fileTreeAccordion" class="file-tree-accordion">
                <div class="file-tree-content">
                    <div class="tree-container">
                        <ul>
                            <li class="tree-item">
                                <input type="checkbox" class="tree-toggle" id="t1" checked>
                                <label for="t1" class="tree-label is-selected">
                                    <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                    <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                    src
                                </label>
                                <div class="tree-children-wrapper">
                                    <ul class="tree-children">
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-1">
                                            <label for="t1-1" class="tree-label">
                                                <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                app
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>layout.tsx</span></li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>page.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-2">
                                            <label for="t1-2" class="tree-label">
                                                <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                components
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item">
                                                        <input type="checkbox" class="tree-toggle" id="t1-2-1">
                                                        <label for="t1-2-1" class="tree-label">
                                                            <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                            <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                            ui
                                                        </label>
                                                        <div class="tree-children-wrapper">
                                                            <ul class="tree-children">
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>button.tsx</span></li>
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>card.tsx</span></li>
                                                            </ul>
                                                        </div>
                                                    </li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>header.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 切换文件树展开/收起
        function toggleFileTree() {
            const bottomBox = document.getElementById('bottomBox');
            const accordion = document.getElementById('fileTreeAccordion');
            const emptyState = document.getElementById('emptyState');

            // 如果当前是收缩状态（有怪物），点击文件时先取消收缩
            if (bottomBox.classList.contains('shrink')) {
                bottomBox.classList.remove('shrink');
                // 让空状态和文件树正常出现
                emptyState.style.display = 'block';
            }

            const isOpen = accordion.classList.toggle('open');
            if (isOpen) {
                emptyState.style.display = 'none';
            } else {
                setTimeout(() => { emptyState.style.display = 'block'; }, 400);
            }
        }

        // 点击新键作品：触发宽度收缩，同时显示怪物背景（隐藏文件树）
        document.getElementById('createNewBtn').addEventListener('click', function() {
            const bottomBox = document.getElementById('bottomBox');
            const accordion = document.getElementById('fileTreeAccordion');
            const emptyState = document.getElementById('emptyState');

            // 如果文件树是展开的，先把文件树收回去
            if (accordion.classList.contains('open')) {
                accordion.classList.remove('open');
                // 文件树收起后，空状态应该隐藏，因为它已经被收缩状态覆盖了
            }

            // 强制触发收缩状态（此时 .shrink 生效，怪物显示，文件和空状态被 CSS 隐藏）
            bottomBox.classList.toggle('shrink');
        });
    </script>
</body>
</html>
