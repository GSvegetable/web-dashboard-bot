<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 仓库页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000000; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }

        .top-image-wrapper { position: relative; width: 100vw; height: 100vh; flex-shrink: 0; z-index: 1; display: flex; justify-content: center; align-items: center; }
        .top-image { position: absolute; inset: 0; width: 100%; height: 100%; background-image: url("{{ url_for('static', filename='IMG_20260804_070056.png') }}"); background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 0; }

        /* 顶部悬浮按钮 */
        .top-actions { position: fixed; top: 20px; right: 24px; z-index: 9999; display: flex; align-items: center; gap: 8px; width: 280px; }
        .top-btn { flex: 1; min-width: 50px; text-align: center; padding: 8px 6px; border-radius: 30px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2); color: #ffffff; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; border: none; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); white-space: nowrap; }
        .top-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.15); }

        @media (max-width: 600px) {
            .top-actions { top: 16px; right: 16px; gap: 4px; width: 200px; }
            .top-btn { font-size: 11px; padding: 4px 6px; min-width: auto; }
        }
    </style>
</head>
<body>
    <!-- 仅保留第一张大图 -->
    <div class="top-image-wrapper">
        <div class="top-image"></div>
    </div>

    <!-- 顶部固定悬浮按钮 -->
    <div class="top-actions">
        <a href="https://t.me/gsyxyc" class="top-btn" target="_blank">联系开发者</a>
        <a href="javascript:void(0)" onclick="toggleFullScreen()" class="top-btn">全屏显示</a>
        <button class="top-btn" id="loginBtn" onclick="openLoginModal()">Log in</button>
    </div>

    <!-- 已删除“我的仓库”、“返回首页”、“新建项目”等文字和按钮 -->

    <script>
        function toggleFullScreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } else { if (document.exitFullscreen) { document.exitFullscreen(); } }
        }

        // 为了兼容性保留空函数
        function openLoginModal() { alert("登录功能请前往首页 Log in 弹窗操作。"); }
        function closeLoginModal() {}
    </script>
</body>
</html>
