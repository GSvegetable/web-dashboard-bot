<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查看仓库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            padding: 5vh 3vw;
            gap: 2vw;
            box-sizing: border-box;
        }

        /* 双面板布局容器 */
        .panel {
            height: 100%;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            padding: 20px;
            overflow-y: auto;
        }

        /* ================= 左侧面板：Uiverse 原版浅色卡片 ================= */
        .left-panel {
            flex: 1;
            max-width: 40%;
            min-width: 220px;
            /* ✅ 精准复刻 Uiverse 截图的浅色外观 */
            background-color: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        /* ================= 右侧面板：保持你原有的深色外观 ================= */
        .right-panel {
            flex: 2;
            max-width: 60%;
            background-color: #161b22;
            border: 1px solid #30363d;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8b949e;
            font-size: 14px;
        }

        /* ================= 精确复刻 Uiverse 的纯 CSS 折叠树 ================= */
        .tree {
            list-style: none;
            padding: 0;
            margin: 0;
            color: #555555;
            font-size: 14px;
        }
        .tree-item {
            position: relative;
            margin-bottom: 4px;
        }
        .tree-item::before {
            content: "";
            position: absolute;
            left: -14px;
            top: 14px;
            width: 1px;
            height: 18px;
            background-color: #e4e4e7;
        }
        .tree-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            color: #555555;
            transition: background-color 0.2s, color 0.2s;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            height: 36px;
            font-weight: 500;
        }
        .tree-label:hover {
            background-color: #f4f4f5;
            color: #000000;
        }
        /* 展开时的颜色高亮 */
        .tree-toggle[open] .tree-label {
            color: #000000;
        }

        .tree-toggle {
            list-style: none;
        }
        .tree-toggle summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .tree-toggle summary::-webkit-details-marker {
            display: none;
        }
        .tree-toggle summary::marker {
            display: none;
            content: "";
        }
        
        .folder-open-icon { display: none; }
        .folder-closed-icon { display: block; }
        .tree-toggle[open] .folder-open-icon { display: block; }
        .tree-toggle[open] .folder-closed-icon { display: none; }

        .tree-children-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
            padding-left: 20px;
        }
        .tree-children {
            overflow: hidden;
        }
        .tree-toggle[open] + .tree-children-wrapper {
            grid-template-rows: 1fr;
        }
        /* 文件夹箭头图标 */
        .folder-icon {
            width: 16px;
            height: 16px;
            color: #777777;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 手机端小屏幕自动上下排列 */
        @media (max-width: 600px) {
            body {
                flex-direction: column;
                padding: 3vh 3vw;
                gap: 3vh;
                overflow-y: auto;
            }
            .left-panel, .right-panel {
                max-width: 100%;
                width: 100%;
                flex: none;
                height: 50vh;
            }
            .left-panel { min-height: 200px; }
        }
    </style>
</head>
<body>
    <!-- 左侧面板（精确复刻截图浅色外观） -->
    <div class="panel left-panel">
        <ul class="tree">
            <li class="tree-item">
                <details class="tree-toggle" open>
                    <summary class="tree-label">
                        <span class="folder-closed-icon folder-icon">📁</span>
                        <span class="folder-open-icon folder-icon">📂</span>
                        src
                    </summary>
                    <div class="tree-children-wrapper">
                        <ul class="tree-children">
                            <li class="tree-item">
                                <details class="tree-toggle">
                                    <summary class="tree-label">
                                        <span class="folder-closed-icon folder-icon">📁</span>
                                        <span class="folder-open-icon folder-icon">📂</span>
                                        app
                                    </summary>
                                    <div class="tree-children-wrapper">
                                        <ul class="tree-children">
                                            <li class="tree-item"><span class="tree-label">components</span></li>
                                            <li class="tree-item"><span class="tree-label">Button.jsx</span></li>
                                            <li class="tree-item"><span class="tree-label">Header.jsx</span></li>
                                        </ul>
                                    </div>
                                </details>
                            </li>
                            <li class="tree-item"><span class="tree-label">Button.jsx</span></li>
                            <li class="tree-item"><span class="tree-label">Header.jsx</span></li>
                            <li class="tree-item"><span class="tree-label">utils.js</span></li>
                        </ul>
                    </div>
                </details>
            </li>
            <li class="tree-item">
                <details class="tree-toggle">
                    <summary class="tree-label">
                        <span class="folder-closed-icon folder-icon">📁</span>
                        <span class="folder-open-icon folder-icon">📂</span>
                        public
                    </summary>
                    <div class="tree-children-wrapper">
                        <ul class="tree-children">
                            <li class="tree-item"><span class="tree-label">index.html</span></li>
                            <li class="tree-item"><span class="tree-label">favicon.ico</span></li>
                        </ul>
                    </div>
                </details>
            </li>
        </ul>
    </div>

    <!-- 右侧面板（保留深色区域） -->
    <div class="panel right-panel">
        右侧面板预留区域
    </div>
</body>
</html>
