<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查看仓库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            padding: 5vh 3vw; /* 上下 5%，左右 3% 的呼吸留白 */
            gap: 2vw; /* 左右面板之间的间距 */
            box-sizing: border-box;
        }

        /* 双面板布局 */
        .panel {
            height: 100%;
            background-color: #161b22;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #30363d;
            padding: 20px;
            overflow-y: auto;
        }

        /* 左侧面板：文件夹树 */
        .left-panel {
            flex: 1;
            max-width: 35%;
            min-width: 220px;
            /* 去除默认滚动条样式 */
            scrollbar-width: thin;
            scrollbar-color: #30363d transparent;
        }
        .left-panel::-webkit-scrollbar { width: 6px; }
        .left-panel::-webkit-scrollbar-thumb { background-color: #30363d; border-radius: 10px; }

        /* 右侧面板 */
        .right-panel {
            flex: 2;
            max-width: 65%;
        }

        /* ================= Uiverse 纯 CSS 折叠树组件 ================= */
        .tree {
            list-style: none;
            padding: 0;
            margin: 0;
            color: #cfcfcf;
            background: transparent;
            font-size: 14px;
        }
        .tree-item {
            position: relative;
            margin-bottom: 4px;
        }
        .tree-item::before {
            content: "";
            position: absolute;
            left: -14px;
            top: 14px;
            width: 1px;
            height: 18px;
            background-color: #444;
        }
        .tree-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            color: #b0b0b0;
            transition: background-color 0.2s, color 0.2s;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
        }
        .tree-label:hover {
            background-color: #2a2a2a;
            color: #ffffff;
        }
        /* 折叠/展开控制器 */
        .tree-toggle {
            list-style: none;
        }
        .tree-toggle summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .tree-toggle summary::-webkit-details-marker {
            display: none;
        }
        .tree-toggle summary::marker {
            display: none;
            content: "";
        }
        
        .folder-open-icon { display: none; }
        .folder-closed-icon { display: block; }
        .tree-toggle[open] .folder-open-icon { display: block; }
        .tree-toggle[open] .folder-closed-icon { display: none; }

        .tree-children-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
            padding-left: 20px;
        }
        .tree-children {
            overflow: hidden;
        }
        .tree-toggle[open] + .tree-children-wrapper {
            grid-template-rows: 1fr;
        }
        .tree-toggle[open] .tree-label {
            color: #ffffff;
        }
        /* ========================================================= */

        /* 手机端小屏幕适配 */
        @media (max-width: 600px) {
            body {
                flex-direction: column;
                padding: 3vh 3vw;
                gap: 3vh;
                overflow-y: auto;
            }
            .left-panel, .right-panel {
                max-width: 100%;
                width: 100%;
                flex: none;
                height: 50vh;
                border-radius: 18px;
            }
            .left-panel { min-height: 200px; }
        }
    </style>
</head>
<body>
    <!-- 左侧面板（原版 Uiverse 组件） -->
    <div class="panel left-panel">
        <ul class="tree">
            <li class="tree-item">
                <details class="tree-toggle" open>
                    <summary class="tree-label">
                        <span class="folder-closed-icon">📁</span>
                        <span class="folder-open-icon">📂</span>
                        src
                    </summary>
                    <div class="tree-children-wrapper">
                        <ul class="tree-children">
                            <li class="tree-item">
                                <details class="tree-toggle">
                                    <summary class="tree-label">app</summary>
                                    <div class="tree-children-wrapper">
                                        <ul class="tree-children">
                                            <li class="tree-item"><span class="tree-label">components</span></li>
                                            <li class="tree-item"><span class="tree-label">Button.jsx</span></li>
                                            <li class="tree-item"><span class="tree-label">Header.jsx</span></li>
                                        </ul>
                                    </div>
                                </details>
                            </li>
                            <li class="tree-item"><span class="tree-label">Button.jsx</span></li>
                            <li class="tree-item"><span class="tree-label">Header.jsx</span></li>
                            <li class="tree-item"><span class="tree-label">utils.js</span></li>
                        </ul>
                    </div>
                </details>
            </li>
            <li class="tree-item">
                <details class="tree-toggle">
                    <summary class="tree-label">
                        <span class="folder-closed-icon">📁</span>
                        <span class="folder-open-icon">📂</span>
                        public
                    </summary>
                    <div class="tree-children-wrapper">
                        <ul class="tree-children">
                            <li class="tree-item"><span class="tree-label">index.html</span></li>
                            <li class="tree-item"><span class="tree-label">favicon.ico</span></li>
                        </ul>
                    </div>
                </details>
            </li>
        </ul>
    </div>

    <!-- 右侧面板（保留之前的占位） -->
    <div class="panel right-panel">
        <!-- 右侧留白区域，将来可以放更多内容 -->
        <div style="color: #8b949e; font-size: 14px; text-align: center; margin-top: 40%;">
            右侧面板预留区域
        </div>
    </div>
</body>
</html>
