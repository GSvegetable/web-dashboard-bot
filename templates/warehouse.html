<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查看仓库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            padding: 5vh 3vw;
            box-sizing: border-box;
        }

        /* ================= 左侧双面板容器 ================= */
        .left-panel-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            margin-top: -12px;
        }

        .box {
            border-radius: 24px;
            width: 100%;
            padding: 16px 20px;
            box-sizing: border-box;
        }

        /* 上方盒子：绝对固定，绝不随下方变化 */
        .top-box {
            flex: none;
            width: 100%;
            min-height: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            
            --s: 200px;
            --c1: #1d1d1d;
            --c2: #4e4f51;
            --c3: #3c3c3c;
            background: 
                repeating-conic-gradient(
                    from 30deg,
                    #0000 0 120deg,
                    var(--c3) 0 180deg
                ) calc(0.5 * var(--s)) calc(0.5 * var(--s) * 0.577),
                repeating-conic-gradient(
                    from 30deg,
                    var(--c1) 0 60deg,
                    var(--c2) 0 120deg,
                    var(--c3) 0 180deg
                );
            background-size: var(--s) calc(var(--s) * 0.577);
        }

        .top-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 8px;
            padding: 6px 14px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); }
        .top-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

        /* 下方盒子：高度 100% 撑开，宽度负责收缩 */
        .bottom-box {
            flex: 20;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: hidden;
            padding: 16px;
            background-color: #161b22;
            border: 1px solid #30363d;
            width: 100%;
            /* 高度由 flex 父容器撑开 */
            height: 100%;
            
            /* 长边收缩动画 */
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), flex 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 🔽 收缩至 1/3，靠左固定（高度绝不改变） */
        .bottom-box.shrink {
            flex: 0 0 33.333% !important; /* 强制锁定宽度为 1/3，高度撑满 */
            width: 33.333% !important;   /* 兼容性兜底 */
            align-self: flex-start !important; /* 靠左不留空隙 */
        }

        .empty-state {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #8b949e; font-size: 14px; pointer-events: none; transition: opacity 0.3s;
        }

        /* 树形菜单 */
        .file-tree-accordion {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }
        .file-tree-accordion.open { max-height: 1500px; }
        .file-tree-content { padding-top: 10px; width: 100%; }

        .tree-container { width: 100%; padding: 4px; background: transparent; border: none; box-sizing: border-box; }
        ul { list-style: none; padding: 0; margin: 0; }
        ul ul { margin-left: 11px; padding-left: 11px; border-left: 1px solid #4a4d52; }
        .tree-item { position: relative; margin-top: 4px; }
        ul ul .tree-item::before {
            content: ""; position: absolute; left: -11px; top: 14px;
            width: 11px; height: 1px; background-color: #4a4d52;
        }
        .tree-label, .file-item {
            display: flex; align-items: center; gap: 8px; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 14px;
            color: #c9d1d9; transition: background-color 0.2s; user-select: none;
            text-decoration: none; height: 28px;
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        .tree-label:hover, .file-item:hover { background-color: rgba(255, 255, 255, 0.05); }
        .is-selected { background-color: rgba(255, 255, 255, 0.05); color: #ffffff; font-weight: 500; }
        .icon { width: 16px; height: 16px; color: #8b949e; flex-shrink: 0; }
        .folder-open-icon { display: none; }
        .folder-closed-icon { display: block; }
        .tree-toggle:checked ~ .tree-label .folder-open-icon { display: block; color: #ffffff; }
        .tree-toggle:checked ~ .tree-label .folder-closed-icon { display: none; }
        .tree-toggle { display: none; }
        .tree-children-wrapper {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
        }
        .tree-children { overflow: hidden; }
        .tree-toggle:checked ~ .tree-children-wrapper { grid-template-rows: 1fr; }

        @media (max-width: 600px) {
            body { padding: 3vh 3vw; overflow-y: auto; }
            .left-panel-wrapper { height: 100vh; margin-top: -6px; }
            .top-box { min-height: 30px; padding: 12px 14px; }
            .bottom-box.shrink { width: 100%; flex: auto; align-self: stretch; }
            .top-btn { font-size: 12px; padding: 4px 10px; }
            .tree-container { padding: 0; }
        }
    </style>
</head>
<body>
    <!-- 双面板结构 -->
    <div class="left-panel-wrapper">
        <!-- 上半部分（绝对锚定，蜂巢背景） -->
        <div class="box top-box">
            <button class="top-btn" id="fileToggleBtn" onclick="toggleFileTree()">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                文件
            </button>
            <button class="top-btn" id="createNewBtn">新键作品</button>
        </div>

        <!-- 下半部分（点击后宽度只缩为 1/3，高度绝对不动） -->
        <div class="box bottom-box" id="bottomBox">
            <div id="emptyState" class="empty-state">点击上方“文件”展开目录</div>

            <div id="fileTreeAccordion" class="file-tree-accordion">
                <div class="file-tree-content">
                    <div class="tree-container">
                        <ul>
                            <li class="tree-item">
                                <input type="checkbox" class="tree-toggle" id="t1" checked>
                                <label for="t1" class="tree-label is-selected">
                                    <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                    <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                    src
                                </label>
                                <div class="tree-children-wrapper">
                                    <ul class="tree-children">
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-1">
                                            <label for="t1-1" class="tree-label">
                                                <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                app
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>layout.tsx</span></li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>page.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-2">
                                            <label for="t1-2" class="tree-label">
                                                <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                components
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item">
                                                        <input type="checkbox" class="tree-toggle" id="t1-2-1">
                                                        <label for="t1-2-1" class="tree-label">
                                                            <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                            <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                            ui
                                                        </label>
                                                        <div class="tree-children-wrapper">
                                                            <ul class="tree-children">
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>button.tsx</span></li>
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>card.tsx</span></li>
                                                            </ul>
                                                        </div>
                                                    </li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>header.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleFileTree() {
            const accordion = document.getElementById('fileTreeAccordion');
            const emptyState = document.getElementById('emptyState');
            const isOpen = accordion.classList.toggle('open');
            if (isOpen) {
                emptyState.style.display = 'none';
            } else {
                setTimeout(() => { emptyState.style.display = 'block'; }, 400);
            }
        }

        // ✅ 精准控制：下方盒子宽度左缩成 1/3，不干涉文件树
        document.getElementById('createNewBtn').addEventListener('click', function() {
            const bottomBox = document.getElementById('bottomBox');
            bottomBox.classList.toggle('shrink');
        });
    </script>
</body>
</html>
