<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查看仓库</title>
    <!-- 引入 GSAP 及其滚动触发插件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            padding: 5vh 3vw;
            box-sizing: border-box;
        }

        /* 主容器 */
        .left-panel-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            margin-top: -12px;
        }

        .box {
            border-radius: 24px;
            width: 100%;
            padding: 14px 20px;
            box-sizing: border-box;
        }

        /* ================= 上方细长条（蜂巢背景） ================= */
        .top-box {
            flex: 0 0 auto;
            width: 100%;
            min-height: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            
            --s: 200px;
            --c1: #1d1d1d;
            --c2: #4e4f51;
            --c3: #3c3c3c;
            background: 
                repeating-conic-gradient(
                    from 30deg,
                    #0000 0 120deg,
                    var(--c3) 0 180deg
                ) calc(0.5 * var(--s)) calc(0.5 * var(--s) * 0.577),
                repeating-conic-gradient(
                    from 30deg,
                    var(--c1) 0 60deg,
                    var(--c2) 0 120deg,
                    var(--c3) 0 180deg
                );
            background-size: var(--s) calc(var(--s) * 0.577);
        }

        /* 玻璃质感按钮 */
        .top-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 8px;
            padding: 6px 14px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); }
        .top-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

        /* ================= 下方主盒子 ================= */
        .bottom-box {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: hidden;
            padding: 16px;
            background-color: #161b22;
            border: 1px solid #30363d;
            height: 100%;
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 🔽 收缩至 1/3 */
        .bottom-box.shrink {
            width: 33.33% !important;
            align-self: flex-start !important;
        }

        /* 空状态提示 */
        .empty-state {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #8b949e;
            font-size: 14px;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* 树形菜单 */
        .file-tree-accordion {
            max-height: 0; 
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }
        .file-tree-accordion.open { max-height: 1500px; }
        .file-tree-content { padding-top: 10px; width: 100%; }

        .tree-container { width: 100%; padding: 4px; background: transparent; border: none; box-sizing: border-box; }
        ul { list-style: none; padding: 0; margin: 0; }
        ul ul { margin-left: 11px; padding-left: 11px; border-left: 1px solid #4a4d52; }
        .tree-item { position: relative; margin-top: 4px; }
        ul ul .tree-item::before {
            content: ""; position: absolute; left: -11px; top: 14px;
            width: 11px; height: 1px; background-color: #4a4d52;
        }
        .tree-label, .file-item {
            display: flex; align-items: center; gap: 8px; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 14px;
            color: #c9d1d9; transition: background-color 0.2s; user-select: none;
            text-decoration: none; height: 28px;
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        .tree-label:hover, .file-item:hover { background-color: rgba(255, 255, 255, 0.05); }
        .is-selected { background-color: rgba(255, 255, 255, 0.05); color: #ffffff; font-weight: 500; }
        .icon { width: 16px; height: 16px; color: #8b949e; flex-shrink: 0; }
        .folder-open-icon { display: none; }
        .folder-closed-icon { display: block; }
        .tree-toggle:checked ~ .tree-label .folder-open-icon { display: block; color: #ffffff; }
        .tree-toggle:checked ~ .tree-label .folder-closed-icon { display: none; }
        .tree-toggle { display: none; }
        .tree-children-wrapper {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
        }
        .tree-children { overflow: hidden; }
        .tree-toggle:checked ~ .tree-children-wrapper { grid-template-rows: 1fr; }

        /* =================================================================
           核心新增：改造为深色玻璃质感的登录表单
           ================================================================= */
        .login-form-container {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%; height: 100%;
            padding: 10px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out, transform 0.4s ease-in-out;
            transform: scale(0.96);
            z-index: 10;
            pointer-events: none;
        }
        /* 当处于收缩模式时，表单淡入 */
        .bottom-box.shrink .login-form-container {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            pointer-events: auto;
        }

        /* 表单本身（深色玻璃质感） */
        .form_container {
            width: 100%;
            height: fit-content;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px; /* 缩小间距以适应窄屏 */
            padding: 24px 16px; /* 减小 padding 适应 1/3 宽度 */
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        /* 调整输入框与按钮的宽度，防止溢出 */
        .input_container, .sign-in_btn, .sign-in_ggl, .sign-in_apl {
            width: 100%;
        }

        .logo_container {
            box-sizing: border-box;
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        .title_container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
        }

        .title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.7rem;
            max-width: 90%;
            text-align: center;
            line-height: 1.2rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .input_container {
            height: fit-content;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .icon {
            width: 18px;
            position: absolute;
            z-index: 2;
            left: 10px;
            bottom: 10px;
            /* 改为浅灰色图标 */
            stroke: rgba(255, 255, 255, 0.5); 
        }
        .icon path { stroke: rgba(255, 255, 255, 0.5); }

        .input_label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        .input_field {
            width: 100%;
            height: 36px;
            padding: 0 0 0 36px;
            border-radius: 8px;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.15, 0.83, 0.66, 1);
        }
        .input_field:focus {
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sign-in_btn {
            width: 100%;
            height: 38px;
            border: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            outline: none;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sign-in_btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.15); }

        .sign-in_ggl {
            width: 100%;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            outline: none;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
        }
        .sign-in_ggl:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.1); }
        .sign-in_ggl svg { width: 18px; height: 18px; filter: drop-shadow(0 0 2px rgba(0,0,0,0.2)); }

        .sign-in_apl {
            width: 100%;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            outline: none;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
        }
        .sign-in_apl:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.1); }

        .separator {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
        .separator .line {
            display: block;
            width: 100%;
            height: 1px;
            border: 0;
            background-color: rgba(255, 255, 255, 0.06);
        }

        .note {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: underline;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            body { padding: 3vh 3vw; overflow-y: auto; }
            .left-panel-wrapper { height: 100vh; margin-top: -6px; }
            .top-box { min-height: 30px; padding: 12px 14px; }
            .bottom-box.shrink { width: 100% !important; align-self: stretch !important; }
            .top-btn { font-size: 12px; padding: 4px 10px; }
            .tree-container { padding: 0; }
        }
    </style>
</head>
<body>
    <!-- 双面板布局 -->
    <div class="left-panel-wrapper">
        <!-- 上方细长条 -->
        <div class="box top-box">
            <button class="top-btn" id="fileToggleBtn" onclick="toggleFileTree()">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                文件
            </button>
            <button class="top-btn" id="createNewBtn">新键作品</button>
        </div>

        <!-- 下方主盒子 -->
        <div class="box bottom-box" id="bottomBox">
            <!-- 状态1：空状态提示 -->
            <div id="emptyState" class="empty-state">点击上方“文件”展开目录</div>

            <!-- 状态2：树形菜单 -->
            <div id="fileTreeAccordion" class="file-tree-accordion">
                <div class="file-tree-content">
                    <div class="tree-container">
                        <ul>
                            <li class="tree-item">
                                <input type="checkbox" class="tree-toggle" id="t1" checked>
                                <label for="t1" class="tree-label is-selected">
                                    <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                    <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                    src
                                </label>
                                <div class="tree-children-wrapper">
                                    <ul class="tree-children">
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-1">
                                            <label for="t1-1" class="tree-label">
                                                <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                app
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>layout.tsx</span></li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>page.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-2">
                                            <label for="t1-2" class="tree-label">
                                                <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                components
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item">
                                                        <input type="checkbox" class="tree-toggle" id="t1-2-1">
                                                        <label for="t1-2-1" class="tree-label">
                                                            <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                            <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                            ui
                                                        </label>
                                                        <div class="tree-children-wrapper">
                                                            <ul class="tree-children">
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>button.tsx</span></li>
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>card.tsx</span></li>
                                                            </ul>
                                                        </div>
                                                    </li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>header.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 状态3：深色玻璃登录表单（新组件） -->
            <div class="login-form-container" id="loginFormContainer">
                <form class="form_container">
                    <div class="logo_container"></div>
                    <div class="title_container">
                        <p class="title">Login to your Account</p>
                        <span class="subtitle">Get started with our app, just create an account and enjoy the experience.</span>
                    </div>
                    <div class="input_container">
                        <label class="input_label" for="email_field">Email</label>
                        <svg viewBox="0 0 24 24" height="20" width="20" xmlns="http://www.w3.org/2000/svg" class="icon">
                            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="1.5" d="M7 8.5L9.94202 10.2394C11.6572 11.2535 12.3428 11.2535 14.058 10.2394L17 8.5"></path>
                            <path stroke-linejoin="round" stroke-width="1.5" d="M2.01577 13.4756C2.08114 16.5412 2.11383 18.0739 3.24496 19.2094C4.37608 20.3448 5.95033 20.3843 9.09883 20.4634C11.0393 20.5122 12.9607 20.5122 14.9012 20.4634C18.0497 20.3843 19.6239 20.3448 20.7551 19.2094C21.8862 18.0739 21.9189 16.5412 21.9842 13.4756C22.0053 12.4899 22.0053 11.5101 21.9842 10.5244C21.9189 7.45886 21.8862 5.92609 20.7551 4.79066C19.6239 3.65523 18.0497 3.61568 14.9012 3.53657C12.9607 3.48781 11.0393 3.48781 9.09882 3.53656C5.95033 3.61566 4.37608 3.65521 3.24495 4.79065C2.11382 5.92608 2.08114 7.45885 2.01576 10.5244C1.99474 11.5101 1.99475 12.4899 2.01577 13.4756Z"></path>
                        </svg>
                        <input placeholder="name@mail.com" type="text" class="input_field" id="email_field">
                    </div>
                    <div class="input_container">
                        <label class="input_label" for="password_field">Password</label>
                        <svg viewBox="0 0 24 24" height="20" width="20" xmlns="http://www.w3.org/2000/svg" class="icon">

        // 切换文件树展开/收起
        function toggleFileTree() {
            const bottomBox = document.getElementById('bottomBox');
            const accordion = document.getElementById('fileTreeAccordion');
            const emptyState = document.getElementById('emptyState');
            const loginForm = document.getElementById('loginFormContainer');

            // 如果当前是收缩模式（显示登录表单），先取消收缩
            if (bottomBox.classList.contains('shrink')) {
                bottomBox.classList.remove('shrink');
                // 隐藏登录表单，显示空状态
                setTimeout(() => {
                    if (!accordion.classList.contains('open')) {
                        emptyState.style.display = 'block';
                    }
                }, 400); 
                return;
            }

            // 正常切换树形菜单
            const isOpen = accordion.classList.toggle('open');
            if (isOpen) {
                emptyState.style.display = 'none';
            } else {
                setTimeout(() => { emptyState.style.display = 'block'; }, 400);
            }
        }
