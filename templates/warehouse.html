<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查看仓库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            padding: 5vh 3vw;
            gap: 2vw;
            box-sizing: border-box;
        }

        /* 双面板布局容器 */
        .panel {
            height: 100%;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            padding: 20px;
            overflow-y: auto;
        }

        /* ================= 左侧面板：精确复刻 Uiverse 暗黑树形菜单 ================= */
        .left-panel {
            flex: 1;
            max-width: 35%;
            min-width: 220px;
            /* 精准复刻 Uiverse 截图的暗色外观 */
            background-color: #09090b; /* 纯黑灰背景 */
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 12px 8px;
        }

        /* ================= 右侧面板：保持之前的深空灰 ================= */
        .right-panel {
            flex: 2;
            max-width: 65%;
            background-color: #161b22;
            border: 1px solid #30363d;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8b949e;
            font-size: 14px;
        }

        /* ================= 完美复刻截图动画与结构的纯 CSS 树 ================= */
        .tree {
            list-style: none;
            padding: 0;
            margin: 0;
            color: #a1a1aa;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .tree-item {
            position: relative;
        }

        .tree-toggle {
            list-style: none;
        }
        .tree-toggle summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            outline: none;
            user-select: none;
        }
        .tree-toggle summary::-webkit-details-marker {
            display: none;
        }
        .tree-toggle summary::marker {
            display: none;
            content: "";
        }

        /* 树形层级标签 */
        .tree-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            color: #a1a1aa;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s;
            width: 100%;
        }
        .tree-label:hover {
            background-color: #27272a; /* 悬停时的深灰块 */
            color: #fafafa;
        }
        /* 展开状态保持高亮文字 */
        .tree-toggle[open] > .tree-label {
            color: #fafafa;
        }

        /* 图标标准化 */
        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .icon-wrapper svg {
            width: 100%; height: 100%;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .folder-open-icon { display: none; }
        .folder-closed-icon { display: block; }
        .tree-toggle[open] .folder-open-icon { display: block; }
        .tree-toggle[open] .folder-closed-icon { display: none; }

        /* 丝滑网格折叠/展开动画 */
        .tree-children-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            padding-left: 20px; /* 子级缩进 */
        }
        .tree-children {
            overflow: hidden;
        }
        .tree-toggle[open] + .tree-children-wrapper {
            grid-template-rows: 1fr;
        }

        /* 手机端小屏幕适配 */
        @media (max-width: 600px) {
            body {
                flex-direction: column;
                padding: 3vh 3vw;
                gap: 3vh;
                overflow-y: auto;
            }
            .left-panel, .right-panel {
                max-width: 100%;
                width: 100%;
                flex: none;
                height: 50vh;
                border-radius: 18px;
            }
            .left-panel { min-height: 200px; }
        }
    </style>
</head>
<body>
    <!-- 左侧面板（精准的父子层级、暗色线框、平滑动画） -->
    <div class="panel left-panel">
        <ul class="tree">
            <li class="tree-item">
                <details class="tree-toggle">
                    <summary class="tree-label">
                        <span class="icon-wrapper folder-closed-icon">
                            <!-- 文件夹闭合图标 -->
                            <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
                        </span>
                        <span class="icon-wrapper folder-open-icon">
                            <!-- 文件夹打开图标 -->
                            <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg>
                        </span>
                        src
                    </summary>
                    <div class="tree-children-wrapper">
                        <ul class="tree-children">
                            <li class="tree-item">
                                <details class="tree-toggle">
                                    <summary class="tree-label">
                                        <span class="icon-wrapper folder-closed-icon">
                                            <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
                                        </span>
                                        <span class="icon-wrapper folder-open-icon">
                                            <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg>
                                        </span>
                                        app
                                    </summary>
                                    <div class="tree-children-wrapper">
                                        <ul class="tree-children">
                                            <li class="tree-item">
                                                <span class="tree-label">
                                                    <span class="icon-wrapper">
                                                        <!-- 文件图标 -->
                                                        <svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                                                    </span>
                                                    layout.tsx
                                                </span>
                                            </li>
                                            <li class="tree-item">
                                                <span class="tree-label">
                                                    <span class="icon-wrapper">
                                                        <svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                                                    </span>
                                                    page.tsx
                                                </span>
                                            </li>
                                        </ul>
                                    </div>
                                </details>
                            </li>
                            <li class="tree-item">
                                <details class="tree-toggle">
                                    <summary class="tree-label">
                                        <span class="icon-wrapper folder-closed-icon">
                                            <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
                                        </span>
                                        <span class="icon-wrapper folder-open-icon">
                                            <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg>
                                        </span>
                                        components
                                    </summary>
                                    <div class="tree-children-wrapper">
                                        <ul class="tree-children">
                                            <li class="tree-item"><span class="tree-label">
                                                <span class="icon-wrapper">
                                                    <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
                                                </span> ui
                                            </span></li>
                                            <li class="tree-item"><span class="tree-label">
                                                <span class="icon-wrapper">
                                                    <svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                                                </span> header.tsx
                                            </span></li>
                                            <li class="tree-item"><span class="tree-label">
                                                <span class="icon-wrapper">
                                                    <svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                                                </span> footer.tsx
                                            </span></li>
                                        </ul>
                                    </div>
                                </details>
                            </li>
                            <li class="tree-item">
                                <details class="tree-toggle">
                                    <summary class="tree-label">
                                        <span class="icon-wrapper folder-closed-icon">
                                            <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
                                        </span>
                                        <span class="icon-wrapper folder-open-icon">
                                            <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg>
                                        </span>
                                        lib
                                    </summary>
                                    <div class="tree-children-wrapper">
                                        <ul class="tree-children">
                                            <li class="tree-item"><span class="tree-label">
                                                <span class="icon-wrapper">
                                                    <svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                                                </span> utils.ts
                                            </span></li>
                                        </ul>
                                    </div>
                                </details>
                            </li>
                        </ul>
                    </div>
                </details>
            </li>
        </ul>
    </div>

    <!-- 右侧面板 -->
    <div class="panel right-panel">
        右侧面板预留区域
    </div>
</body>
</html>
