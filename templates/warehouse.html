<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查看仓库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            padding: 5vh 3vw;
            gap: 2vw;
            box-sizing: border-box;
        }

        /* 双面板布局容器 */
        .panel {
            height: 100%;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            padding: 20px;
            overflow-y: auto;
        }

        /* 左侧面板（白底组件包裹层） */
        .left-panel {
            flex: 1;
            max-width: 40%;
            min-width: 220px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
        }

        /* 右侧面板（保留深色留空） */
        .right-panel {
            flex: 2;
            max-width: 60%;
            background-color: #161b22;
            border: 1px solid #30363d;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8b949e;
            font-size: 14px;
        }

        /* ==========================================================
           ⚠️ 以下为 Uiverse 作者 ashif_6672 的原生 CSS，未作任何修改。
           ========================================================== */
        .tree-container {
            width: 100%;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            padding: 24px;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul ul {
            margin-left: 11px;
            padding-left: 11px;
            border-left: 1px solid #e4e4e7;
        }

        .tree-item {
            position: relative;
            margin-top: 4px;
        }

        ul ul .tree-item::before {
            content: "";
            position: absolute;
            left: -11px;
            top: 14px;
            width: 11px;
            height: 1px;
            background-color: #e4e4e7;
        }

        .tree-label,
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #09090b;
            transition: background-color 0.2s;
            user-select: none;
            text-decoration: none;
            height: 28px;
        }

        .tree-label:hover,
        .file-item:hover {
            background-color: #f4f4f5;
        }

        .is-selected {
            background-color: #f4f4f5;
            color: #09090b;
            font-weight: 500;
        }

        .icon {
            width: 16px;
            height: 16px;
            color: #71717a;
            flex-shrink: 0;
        }

        .folder-open-icon { display: none; }
        .folder-closed-icon { display: block; }

        .tree-toggle:checked ~ .tree-label .folder-open-icon {
            display: block;
            color: #09090b;
        }
        .tree-toggle:checked ~ .tree-label .folder-closed-icon { display: none; }

        .tree-toggle { display: none; }

        .tree-children-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
        }

        .tree-children { overflow: hidden; }

        /* 展开状态 */
        .tree-toggle:checked ~ .tree-children-wrapper {
            grid-template-rows: 1fr;
        }
        /* ========================================================== */

        @media (max-width: 600px) {
            body {
                flex-direction: column;
                padding: 3vh 3vw;
                gap: 3vh;
                overflow-y: auto;
            }
            .left-panel, .right-panel {
                max-width: 100%;
                width: 100%;
                flex: none;
                height: 50vh;
                border-radius: 18px;
            }
            .left-panel { min-height: 200px; }
        }
    </style>
</head>
<body>
    <!-- 左侧面板：Uiverse 原生浅色组件 -->

                                                </ul>
                                            </div>
