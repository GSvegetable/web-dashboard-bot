<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查看仓库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            background-color: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            padding: 5vh 3vw;
            box-sizing: border-box;
            justify-content: flex-start;
            gap: 2vw;
        }

        /* ================= 左侧面板 ================= */
        .left-panel-wrapper {
            flex: 1.5; /* 调整比例，给右侧留空间 */
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 24px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .top-box {
            flex: 1;
            min-height: 30px;
            display: flex;
            align-items: center;
            padding: 12px 16px;
        }

        .bottom-box {
            flex: 15;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: hidden;
            padding: 16px;
        }

        .file-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .file-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.1); }
        .file-btn .icon { width: 14px; height: 14px; stroke: currentColor; fill: none; }

        .empty-state {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #8b949e;
            font-size: 14px;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .file-tree-accordion {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }
        .file-tree-accordion.open { max-height: 1500px; }
        .file-tree-content { padding-top: 10px; width: 100%; }

        /* 树形菜单透明融合 */
        .tree-container {
            width: 100%; padding: 4px;
            background: transparent; border: none; box-shadow: none;
            box-sizing: border-box;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        ul ul { margin-left: 11px; padding-left: 11px; border-left: 1px solid #4a4d52; }
        .tree-item { position: relative; margin-top: 4px; }
        ul ul .tree-item::before {
            content: ""; position: absolute; left: -11px; top: 14px;
            width: 11px; height: 1px; background-color: #4a4d52;
        }
        .tree-label, .file-item {
            display: flex; align-items: center; gap: 8px; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 14px;
            color: #c9d1d9; transition: background-color 0.2s; user-select: none;
            text-decoration: none; height: 28px;
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        .tree-label:hover, .file-item:hover { background-color: rgba(255, 255, 255, 0.05); }
        .is-selected { background-color: rgba(255, 255, 255, 0.05); color: #ffffff; font-weight: 500; }
        .icon { width: 16px; height: 16px; color: #8b949e; flex-shrink: 0; }
        .folder-open-icon { display: none; }
        .folder-closed-icon { display: block; }
        .tree-toggle:checked ~ .tree-label .folder-open-icon { display: block; color: #ffffff; }
        .tree-toggle:checked ~ .tree-label .folder-closed-icon { display: none; }
        .tree-toggle { display: none; }
        .tree-children-wrapper {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
        }
        .tree-children { overflow: hidden; }
        .tree-toggle:checked ~ .tree-children-wrapper { grid-template-rows: 1fr; }


        /* ================= 右侧面板（加入新的社交图标组件） ================= */
        .right-panel {
            flex: 1;
            height: 100%;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ========== Uiverse 社交图标组件 (颜色和图标已替换) ========== */
        .example-1 {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .example-1 .icon-content {
            margin: 0 10px;
            position: relative;
        }
        .example-1 .icon-content .tooltip {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #000;
            color: #fff;
            padding: 6px 10px;
            border-radius: 5px;
            opacity: 0;
            visibility: hidden;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .example-1 .icon-content:hover .tooltip {
            opacity: 1;
            visibility: visible;
            top: -50px;
        }
        .example-1 .icon-content .link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: #4d4d4d;
            background-color: #fff;
            transition: all 0.3s ease-in-out;
        }
        .example-1 .icon-content .link:hover {
            box-shadow: 3px 2px 45px 0px rgb(0 0 0 / 12%);
        }
        .example-1 .icon-content .link svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* --- 自定义新图标悬停颜色 --- */
        .example-1 .icon-content .link[data-social="github"]:hover {
            color: #2b3137; /* GitHub 黑灰 */
        }
        .example-1 .icon-content .link[data-social="youtube"]:hover {
            color: #ff0000; /* YouTube 红 */
        }
        .example-1 .icon-content .link[data-social="discord"]:hover {
            color: #5865f2; /* Discord 蓝紫 */
        }
        .example-1 .icon-content .link[data-social="x"]:hover {
            color: #000000; /* X (Twitter) 黑 */
        }

        @media (max-width: 600px) {
            body { flex-direction: column; padding: 3vh 3vw; overflow-y: auto; }
            .left-panel-wrapper, .right-panel { max-width: 100%; width: 100%; flex: none; height: auto; }
            .left-panel-wrapper { height: 60vh; }
            .right-panel { height: 30vh; padding: 10px; }
            .example-1 { gap: 0; }
            .example-1 .icon-content { margin: 0 5px; }
            .example-1 .icon-content .link { width: 40px; height: 40px; }
            .example-1 .icon-content .link svg { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>
    <!-- 左侧面板 -->
    <div class="left-panel-wrapper">
        <div class="box top-box">
            <button class="file-btn" id="fileToggleBtn" onclick="toggleFileTree()">
                <svg class="icon" viewBox="0 0 24 24" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                文件
            </button>
        </div>

        <div class="box bottom-box">
            <div id="emptyState" class="empty-state">点击上方“文件”展开目录</div>
            <div id="fileTreeAccordion" class="file-tree-accordion">
                <div class="file-tree-content">
                    <div class="tree-container">
                        <ul>
                            <li class="tree-item">
                                <input type="checkbox" class="tree-toggle" id="t1" checked>
                                <label for="t1" class="tree-label is-selected">
                                    <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                    <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                    src
                                </label>
                                <div class="tree-children-wrapper">
                                    <ul class="tree-children">
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-1">
                                            <label for="t1-1" class="tree-label">
                                                <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                app
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>layout.tsx</span></li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>page.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                        <li class="tree-item">
                                            <input type="checkbox" class="tree-toggle" id="t1-2">
                                            <label for="t1-2" class="tree-label">
                                                <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                components
                                            </label>
                                            <div class="tree-children-wrapper">
                                                <ul class="tree-children">
                                                    <li class="tree-item">
                                                        <input type="checkbox" class="tree-toggle" id="t1-2-1">
                                                        <label for="t1-2-1" class="tree-label">
                                                            <span class="icon folder-closed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg></span>
                                                            <span class="icon folder-open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M2 10h20"/></svg></span>
                                                            ui
                                                        </label>
                                                        <div class="tree-children-wrapper">
                                                            <ul class="tree-children">
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>button.tsx</span></li>
                                                                <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>card.tsx</span></li>
                                                            </ul>
                                                        </div>
                                                    </li>
                                                    <li class="tree-item"><span class="file-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>header.tsx</span></li>
                                                </ul>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧面板（替换成你找的这个新组件） -->
    <div class="right-panel">
        <div class="example-1">
            <!-- 1. GitHub -->
            <div class="icon-content">
                <a href="#" class="link" data-social="github">
                    <svg viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.082-.729.082-.729 1.205.084 1.838 1.237 1.838 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
                </a>
                <div class="tooltip">GitHub</div>
            </div>

            <!-- 2. YouTube -->
            <div class="icon-content">
                <a href="#" class="link" data-social="youtube">
                    <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                </a>
                <div class="tooltip">YouTube</div>
            </div>

            <!-- 3. Discord -->
            <div class="icon-content">
                <a href="#" class="link" data-social="discord">
                    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037 13.457 13.457 0 0 0-.585 1.267 18.343 18.343 0 0 0-5.533 0 13.08 13.08 0 0 0-.59-1.266.078.078 0 0 0-.08-.037 19.788 19.788 0 0 0-4.884 1.515.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.963 19.963 0 0 0 6.014 3.041.077.077 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.11 13.11 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.118.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.966 19.966 0 0 0 6.015-3.04.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.55-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
                </a>
                <div class="tooltip">Discord</div>
            </div>

            <!-- 4. X (Twitter) -->
            <div class="icon-content">
                <a href="#" class="link" data-social="x">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
                <div class="tooltip">X</div>
            </div>
        </div>
    </div>

    <script>
        function toggleFileTree() {
            const accordion = document.getElementById('fileTreeAccordion');
            const emptyState = document.getElementById('emptyState');
            const isOpen = accordion.classList.toggle('open');
            if (isOpen) {
                emptyState.style.display = 'none';
            } else {
                setTimeout(() => { emptyState.style.display = 'block'; }, 400);
            }
        }
    </script>
</body>
</html>
