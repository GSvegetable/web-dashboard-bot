<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>设置 - 宫水大世界</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <style>
        .bg-container { position: absolute; inset: 0; width: 100%; height: 100%; background: radial-gradient(circle, #777777 2px, transparent 2px), radial-gradient(circle, #eaeaea 10px, transparent 32px), linear-gradient(-45deg, #eaeaea 0%, transparent 49%, transparent 50%, transparent 51%, #eaeaea 100%), linear-gradient(45deg, #eaeaea 0%, transparent 49%, #777777 50%, transparent 51%, #eaeaea 100%), linear-gradient(-45deg, transparent 49%, #777777 50%, transparent 51%); background-size: 8rem 8rem; background-repeat: repeat; }
        .bg-paper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; filter: url(#void-texture); background: linear-gradient(to bottom, rgba(194, 167, 87, 0.241) 0%, rgba(162, 125, 55, 0.255) 100%); background-size: cover; }
        body { background: transparent !important; }
        .settings-content-wrapper { position: relative; z-index: 10; }

        .gh-sidebar-item {
            display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 12px; border-radius: 6px;
            color: #c9d1d9; text-decoration: none; font-size: 14px; transition: background-color 0.2s;
            background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(4px); cursor: pointer;
        }
        .gh-sidebar-item:hover { background-color: rgba(255, 255, 255, 0.05); }
        .gh-sidebar-item.active { background-color: transparent !important; font-weight: 600; }
        .gh-sidebar-item svg { width: 16px; height: 16px; flex-shrink: 0; fill: #8b949e; }
        .gh-sidebar-item:hover svg { fill: #c9d1d9; }

        .gh-divider { border: 0; border-top: 1px solid rgba(48, 54, 61, 0.6); margin: 8px 0; }
        .gh-edit-btn { background-color: rgba(33, 38, 45, 0.8); border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; padding: 5px 16px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px; backdrop-filter: blur(4px); }
        .gh-edit-btn:hover { background-color: #30363d; border-color: #8b949e; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(13, 17, 23, 0.5); }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }

        @media (max-width: 768px) { .settings-container { flex-direction: column !important; gap: 24px; } .settings-sidebar { width: 100% !important; } }
        #avatarModal .cropper-container { width: 100%; height: 100%; }
        #avatarModal .cropper-view-box { border-radius: 50%; }
        .animate-item { opacity: 0; transform: translateY(18px); animation: fadeSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.05s; } .delay-2 { animation-delay: 0.10s; } .delay-3 { animation-delay: 0.15s; } .delay-4 { animation-delay: 0.20s; } .delay-5 { animation-delay: 0.25s; } .delay-6 { animation-delay: 0.30s; } .delay-7 { animation-delay: 0.35s; } .delay-8 { animation-delay: 0.40s; }
        .perspective-800 { perspective: 800px; transform-style: preserve-3d; }
        .digit { display: inline-block; transform-style: preserve-3d; backface-visibility: hidden; transform: rotateX(0deg); opacity: 0; will-change: transform, opacity; }
        .spin-animate { animation: spinVertical 1s cubic-bezier(0.0, 0.0, 0.2, 1) forwards; }
        @keyframes spinVertical { 0% { transform: rotateX(0deg) scale(0.8); opacity: 0.2; } 100% { transform: rotateX(360deg) scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div style="position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;">
        <div class="bg-container"></div>
        <div class="bg-paper">
            <svg class="texture-filter" style="position: absolute; width: 0; height: 0;">
                <filter id="void-texture">
                    <feTurbulence seed="5" result="noise1" numOctaves="8" baseFrequency="0.015" type="fractalNoise"></feTurbulence>
                    <feTurbulence seed="2" result="noise2" numOctaves="8" baseFrequency="0.015" type="fractalNoise"></feTurbulence>
                    <feMerge result="noise"><feMergeNode in="noise1"></feMergeNode><feMergeNode in="noise2"></feMergeNode></feMerge>
                    <feGaussianBlur result="blur" stdDeviation="0" in="noise"></feGaussianBlur>
                    <feSpecularLighting result="specular" lighting-color="#ffffff" specularExponent="20" specularConstant="1" surfaceScale="3" in="blur">
                        <feDistantLight elevation="45" azimuth="90"></feDistantLight>
                    </feSpecularLighting>
                    <feComposite result="lit" operator="over" in2="SourceGraphic" in="specular"></feComposite>
                    <feBlend mode="screen" in2="lit" in="SourceGraphic"></feBlend>
                </filter>
            </svg>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-6 sm:p-8 flex settings-container gap-12 animate-item settings-content-wrapper">
        <!-- 左侧导航 -->
        <aside class="w-64 flex-shrink-0 settings-sidebar animate-item delay-1">
            <div class="flex items-center gap-3 pb-4 mb-2 border-b border-[#30363d]">
                <div class="w-10 h-10 rounded-full bg-[#afb8c1] flex items-center justify-center flex-shrink-0 text-[#0d1117] font-bold text-lg">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <div>
                    <div class="text-sm font-semibold text-[#f0f6fc]">GSvegetable (GSvegetable)</div>
                    <div class="text-xs text-[#8b949e]">你的个人账号</div>
                </div>
            </div>

            <nav class="flex flex-col gap-1" id="sidebarNav">
                <!-- 顺序：个人资料、星星、AI、无障碍设置、通知、音乐、邮箱、密码和身份验证、会话、SSH和GPG密钥、凭据、组织、企业、审核、仓库、Codespaces、软件包 -->
                <div class="gh-sidebar-item" data-target="profile"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 2a2.5 2.5 0 110 5 2.5 2.5 0 010-5zm0 12c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>个人资料</div>
                <div class="gh-sidebar-item" data-target="stars"><svg viewBox="0 0 16 16"><path d="M8 .5a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.624a.75.75 0 0 1 .416-1.279l4.21-.611L7.327.918A.75.75 0 0 1 8 .5z"/></svg>星星</div>
                <!-- 第三项改为 AI -->
                <div class="gh-sidebar-item" data-target="ai"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 2a3 3 0 110 6 3 3 0 010-6zm0 12c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>AI</div>
                <div class="gh-sidebar-item" data-target="accessibility"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zM6.5 12.5v-9l5 4.5-5 4.5z"/></svg>无障碍设置</div>
                <div class="gh-sidebar-item" data-target="notifications"><svg viewBox="0 0 16 16"><path d="M8 16a8 8 0 100-16 8 8 0 000 16zM4.75 10.5v-5h1v5h-1zm2.5-4.5h1v5h-1V6zm2.5 2h1v3h-1V8z"/></svg>通知</div>
                <!-- 第六项改为音乐 -->
                <div class="gh-sidebar-item" data-target="music"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 2a3 3 0 110 6 3 3 0 010-6zm0 12c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>音乐</div>
                <div class="gh-sidebar-item" data-target="email"><svg viewBox="0 0 16 16"><path d="M1.5 5h13v9H1.5V5zM0 4.5A1.5 1.5 0 011.5 3h13A1.5 1.5 0 0116 4.5v10a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 010 14.5v-10zM4 1.5h8V.5a.5.5 0 00-.5-.5h-7a.5.5 0 00-.5.5v1z"/></svg>邮箱</div>
                <div class="gh-sidebar-item" data-target="password"><svg viewBox="0 0 16 16"><path d="M11.5 4h-.5V2.5A2.5 2.5 0 008.5 0h-1A2.5 2.5 0 005 2.5V4h-.5A1.5 1.5 0 003 5.5v9A1.5 1.5 0 004.5 16h7a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0011.5 4zM7 2.5A1.5 1.5 0 018.5 1h1A1.5 1.5 0 0111 2.5V4H7V2.5z"/></svg>密码和身份验证</div>
                <div class="gh-sidebar-item" data-target="sessions"><svg viewBox="0 0 16 16"><path d="M8 1a4.5 4.5 0 00-4.5 4.5c0 1.86.98 3.5 2.42 4.47A7.5 7.5 0 00.5 17h15a7.5 7.5 0 00-5.42-7.03c1.44-.97 2.42-2.61 2.42-4.47A4.5 4.5 0 008 1z"/></svg>会话</div>
                <div class="gh-sidebar-item" data-target="keys"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zM6.5 12.5v-9l5 4.5-5 4.5z"/></svg>SSH 和 GPG 密钥</div>
                <div class="gh-sidebar-item" data-target="credentials"><svg viewBox="0 0 16 16"><path d="M8 16a8 8 0 100-16 8 8 0 000 16zM4.75 10.5v-5h1v5h-1zm2.5-4.5h1v5h-1V6zm2.5 2h1v3h-1V8z"/></svg>凭据</div>
                <div class="gh-sidebar-item" data-target="organizations"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 2a3 3 0 110 6 3 3 0 010-6zm0 12c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>组织</div>
                <div class="gh-sidebar-item" data-target="enterprises"><svg viewBox="0 0 16 16"><path d="M1.5 5h13v9H1.5V5zM0 4.5A1.5 1.5 0 011.5 3h13A1.5 1.5 0 0116 4.5v10a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 010 14.5v-10zM4 1.5h8V.5a.5.5 0 00-.5-.5h-7a.5.5 0 00-.5.5v1z"/></svg>企业</div>
                <div class="gh-sidebar-item" data-target="moderation"><svg viewBox="0 0 16 16"><path d="M11.5 4h-.5V2.5A2.5 2.5 0 008.5 0h-1A2.5 2.5 0 005 2.5V4h-.5A1.5 1.5 0 003 5.5v9A1.5 1.5 0 004.5 16h7a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0011.5 4zM7 2.5A1.5 1.5 0 018.5 1h1A1.5 1.5 0 0111 2.5V4H7V2.5z"/></svg>审核</div>
                <div class="gh-sidebar-item" data-target="repositories"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 2a3 3 0 110 6 3 3 0 010-6zm0 12c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>仓库</div>
                <div class="gh-sidebar-item" data-target="codespaces"><svg viewBox="0 0 16 16"><path d="M1.5 5h13v9H1.5V5zM0 4.5A1.5 1.5 0 011.5 3h13A1.5 1.5 0 0116 4.5v10a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 010 14.5v-10zM4 1.5h8V.5a.5.5 0 00-.5-.5h-7a.5.5 0 00-.5.5v1z"/></svg>Codespaces</div>
                <div class="gh-sidebar-item" data-target="packages"><svg viewBox="0 0 16 16"><path d="M11.5 4h-.5V2.5A2.5 2.5 0 008.5 0h-1A2.5 2.5 0 005 2.5V4h-.5A1.5 1.5 0 003 5.5v9A1.5 1.5 0 004.5 16h7a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0011.5 4zM7 2.5A1.5 1.5 0 018.5 1h1A1.5 1.5 0 0111 2.5V4H7V2.5z"/></svg>软件包</div>
            </nav>
        </aside>

        <!-- 右侧内容 -->
        <main class="flex-1 min-w-0">
            <!-- 个人资料面板 -->
            <div id="panel-profile" class="panel-content animate-item delay-1">
                {% include 'settings/gerenziliao.html' %}
            </div>
            <!-- 星星面板 -->
            <div id="panel-stars" class="panel-content hidden animate-item delay-1">
                {% include 'settings/xingxing.html' %}
            </div>
            <!-- AI面板（深度思考、沙盒模式等） -->
            <div id="panel-ai" class="panel-content hidden animate-item delay-1">
                <!-- 这里直接放置 AI 配置的 UI 内容，如深度思考、沙盒模式开关等。 -->
                <!-- 为完整起见，这里写一个内嵌的表单，可复用 agent_settings_panel.html 的样式 -->
                <h1 class="text-2xl font-semibold text-[#f0f6fc] mb-1">AI 设置</h1>
                <div class="mt-6 flex flex-col gap-6">
                    <div class="animate-item delay-2 w-full">
                        <div class="relative w-full mt-4">
                            <div class="absolute inset-0 rounded-lg bg-[rgba(255,255,255,0.08)] backdrop-blur-md z-0 pointer-events-none"></div>
                            <div class="relative z-10 bg-transparent border border-[rgba(255,255,255,0.3)] rounded-lg">
                                <label class="absolute -top-[11px] left-3 px-1.5 py-0.5 bg-[rgba(0,0,0,0.7)] backdrop-blur-sm rounded-md text-xs font-medium text-[#c9d1d9] z-20 leading-none">深度思考</label>
                                <div class="px-4 py-4 flex items-center justify-between">
                                    <span class="text-sm text-[#c9d1d9]">开启深度思考模式</span>
                                    <input type="checkbox" checked class="w-4 h-4">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="animate-item delay-3 w-full">
                        <div class="relative w-full mt-4">
                            <div class="absolute inset-0 rounded-lg bg-[rgba(255,255,255,0.08)] backdrop-blur-md z-0 pointer-events-none"></div>
                            <div class="relative z-10 bg-transparent border border-[rgba(255,255,255,0.3)] rounded-lg">
                                <label class="absolute -top-[11px] left-3 px-1.5 py-0.5 bg-[rgba(0,0,0,0.7)] backdrop-blur-sm rounded-md text-xs font-medium text-[#c9d1d9] z-20 leading-none">沙盒模式</label>
                                <div class="px-4 py-4 flex items-center justify-between">
                                    <span class="text-sm text-[#c9d1d9]">启用激进沙盒模式</span>
                                    <input type="checkbox" class="w-4 h-4">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 后续可根据需要扩展更多 AI 设置 -->
                </div>
            </div>
            <!-- 音乐面板 -->
            <div id="panel-music" class="panel-content hidden animate-item delay-1">
                <h1 class="text-2xl font-semibold text-[#f0f6fc] mb-1">音乐</h1>
                <!-- 内嵌音乐播放器 UI，复用 music_card.html 的音频逻辑 -->
                <div class="mt-6">
                    <audio id="bg-audio" src="{{ url_for('static', filename='5_6311840232614403295.mp3') }}" preload="auto" loop></audio>
                    <div class="bg-[#161b22] border border-[#30363d] rounded-lg p-6 flex flex-col items-center gap-4">
                        <img src="{{ url_for('static', filename='mmexport1785973035076.jpg') }}" class="w-32 h-32 rounded-lg object-cover" />
                        <div class="text-center">
                            <div class="text-lg font-semibold text-[#f0f6fc]">你的名字</div>
                            <div class="text-sm text-[#8b949e]">纯音乐</div>
                        </div>
                        <div class="flex items-center gap-4">
                            <button id="play-pause-btn" class="gh-edit-btn">播放</button>
                        </div>
                        <div class="w-full">
                            <input type="range" id="music-progress" value="0" min="0" max="100" class="w-full">
                        </div>
                        <div class="flex justify-between w-full text-xs text-[#8b949e]">
                            <span id="music-current-time">0:00</span>
                            <span id="music-total-time">0:00</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 其他菜单的空状态占位 -->
            <div id="panel-empty" class="panel-content hidden animate-item delay-1 flex items-center justify-center h-64 text-gray-400 text-lg flex-col">
                <span class="text-4xl mb-2">🚧</span>
                <span>此页面正在建设中，敬请期待...</span>
            </div>
        </main>
    </div>

    <!-- 头像裁剪弹窗（保留原功能，略） -->

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 侧边栏切换逻辑
            const menuItems = document.querySelectorAll('#sidebarNav .gh-sidebar-item');
            const panels = {
                profile: document.getElementById('panel-profile'),
                stars: document.getElementById('panel-stars'),
                ai: document.getElementById('panel-ai'),
                music: document.getElementById('panel-music')
            };
            const emptyPanel = document.getElementById('panel-empty');

            menuItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = this.dataset.target;
                    if (!target) return;

                    menuItems.forEach(m => m.classList.remove('active'));
                    this.classList.add('active');

                    document.querySelectorAll('.panel-content').forEach(p => p.classList.add('hidden'));

                    if (panels[target]) {
                        panels[target].classList.remove('hidden');
                    } else {
                        emptyPanel.classList.remove('hidden');
                    }
                });
            });

            // 音乐播放器逻辑
            const audio = document.getElementById('bg-audio');
            const playBtn = document.getElementById('play-pause-btn');
            const progress = document.getElementById('music-progress');
            const currentTimeEl = document.getElementById('music-current-time');
            const totalTimeEl = document.getElementById('music-total-time');
            if (audio && playBtn) {
                function formatTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = Math.floor(seconds % 60);
                    return m + ':' + (s < 10 ? '0' : '') + s;
                }
                audio.addEventListener('loadedmetadata', () => {
                    totalTimeEl.textContent = formatTime(audio.duration);
                });
                audio.addEventListener('timeupdate', () => {
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    progress.value = (audio.currentTime / audio.duration) * 100;
                });
                playBtn.addEventListener('click', () => {
                    if (audio.paused) {
                        audio.play();
                        playBtn.textContent = '暂停';
                    } else {
                        audio.pause();
                        playBtn.textContent = '播放';
                    }
                });
                progress.addEventListener('input', () => {
                    audio.currentTime = (progress.value / 100) * audio.duration;
                });
            }
        });
    </script>
</body>
</html>
