<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>设置 - 宫水大世界</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <style>
        /* ==========================================
           背景纹理（与之前保持一致）
           ========================================== */
        .bg-container {
            position: absolute; inset: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #777777 2px, transparent 2px),
              radial-gradient(circle, #eaeaea 10px, transparent 32px),
              linear-gradient(-45deg, #eaeaea 0%, transparent 49%, transparent 50%, transparent 51%, #eaeaea 100%),
              linear-gradient(45deg, #eaeaea 0%, transparent 49%, #777777 50%, transparent 51%, #eaeaea 100%),
              linear-gradient(-45deg, transparent 49%, #777777 50%, transparent 51%);
            background-size: 8rem 8rem; background-repeat: repeat;
        }
        .bg-paper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            filter: url(#void-texture);
            background: linear-gradient(to bottom, rgba(194, 167, 87, 0.241) 0%, rgba(162, 125, 55, 0.255) 100%);
            background-size: cover;
        }
        body { background: transparent !important; }
        .settings-content-wrapper { position: relative; z-index: 10; }

        /* 毛玻璃偏移层（复用） */
        .glass-offset-layer {
            position: absolute; inset: 0; border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(14px) contrast(1.2) saturate(150%);
            -webkit-backdrop-filter: blur(14px) contrast(1.2) saturate(150%);
            transform: translate(4px, 4px) scale(0.98);
            z-index: 0; pointer-events: none;
        }

        /* 导航、菜单按钮、卡片、动画（保留原有样式） */
        .gh-sidebar-item {
            display: flex; align-items: center; gap: 12px;
            width: 100%; padding: 6px 12px; border-radius: 6px;
            color: #c9d1d9; text-decoration: none; font-size: 14px;
            transition: background-color 0.2s; cursor: pointer;
            background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(4px);
        }
        .gh-sidebar-item:hover { background-color: rgba(255, 255, 255, 0.05); }
        .gh-sidebar-item.active { background-color: rgba(255, 255, 255, 0.08); font-weight: 600; }
        .gh-sidebar-item svg { width: 16px; height: 16px; flex-shrink: 0; fill: #8b949e; }
        .gh-sidebar-item:hover svg { fill: #c9d1d9; }

        .gh-divider { border: 0; border-top: 1px solid rgba(48, 54, 61, 0.6); margin: 8px 0; }
        .gh-edit-btn { background-color: rgba(33, 38, 45, 0.8); border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; padding: 5px 16px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px; backdrop-filter: blur(4px); }
        .gh-edit-btn:hover { background-color: #30363d; border-color: #8b949e; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(13, 17, 23, 0.5); }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }

        @media (max-width: 768px) {
            .settings-container { flex-direction: column !important; gap: 24px; }
            .settings-sidebar { width: 100% !important; }
            .settings-grid { grid-template-columns: 1fr !important; }
        }

        #avatarModal .cropper-container { width: 100%; height: 100%; }
        #avatarModal .cropper-view-box { border-radius: 50%; }

        .animate-item { opacity: 0; transform: translateY(18px); animation: fadeSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.05s; } .delay-2 { animation-delay: 0.10s; } .delay-3 { animation-delay: 0.15s; } .delay-4 { animation-delay: 0.20s; } .delay-5 { animation-delay: 0.25s; } .delay-6 { animation-delay: 0.30s; } .delay-7 { animation-delay: 0.35s; } .delay-8 { animation-delay: 0.40s; }

        .perspective-800 { perspective: 800px; transform-style: preserve-3d; }
        .digit { display: inline-block; transform-style: preserve-3d; backface-visibility: hidden; transform: rotateX(0deg); opacity: 0; }
        .spin-animate { animation: spinVertical 1s cubic-bezier(0.0, 0.0, 0.2, 1) forwards; }
        @keyframes spinVertical { 0% { transform: rotateX(0deg) scale(0.8); opacity: 0.2; } 100% { transform: rotateX(360deg) scale(1); opacity: 1; } }

        .gh-note { display: block; font-size: 12px; color: rgba(255, 255, 255, 0.65); margin-top: 4px; }
    </style>
</head>
<body>
    
    <!-- 纹理背景 -->
    <div style="position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;">
        <div class="bg-container"></div>
        <div class="bg-paper">
            <span class="orbit-overlay"></span>
            <svg class="texture-filter" style="position: absolute; width: 0; height: 0;">
                <filter id="void-texture">
                    <feTurbulence seed="5" result="noise1" numOctaves="8" baseFrequency="0.015" type="fractalNoise"></feTurbulence>
                    <feTurbulence seed="2" result="noise2" numOctaves="8" baseFrequency="0.015" type="fractalNoise"></feTurbulence>
                    <feMerge result="noise"><feMergeNode in="noise1"></feMergeNode><feMergeNode in="noise1"></feMergeNode><feMergeNode in="noise2"></feMergeNode></feMerge>
                    <feGaussianBlur result="blur" stdDeviation="0" in="noise"></feGaussianBlur>
                    <feSpecularLighting result="specular" lighting-color="#ffffff" specularExponent="20" specularConstant="1" surfaceScale="3" in="blur">
                        <feDistantLight elevation="45" azimuth="90"></feDistantLight>
                    </feSpecularLighting>
                    <feComposite result="lit" operator="over" in2="SourceGraphic" in="specular"></feComposite>
                    <feBlend mode="screen" in2="lit" in="SourceGraphic"></feBlend>
                </filter>
            </svg>
        </div>
    </div>

    <!-- 设置内容 -->
    <div class="max-w-7xl mx-auto p-6 sm:p-8 flex settings-container gap-12 animate-item settings-content-wrapper">
        
        <!-- 左侧导航 -->
        <aside class="w-64 flex-shrink-0 settings-sidebar animate-item delay-1">
            <div class="flex items-center gap-3 pb-4 mb-2 border-b border-[#30363d]">
                <div class="w-10 h-10 rounded-full bg-[#afb8c1] flex items-center justify-center flex-shrink-0 text-[#0d1117] font-bold text-lg">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <div>
                    <div class="text-sm font-semibold text-[#f0f6fc]">GSvegetable (GSvegetable)</div>
                    <div class="text-xs text-[#8b949e]">你的个人账号</div>
                </div>
            </div>

            <nav class="flex flex-col gap-1" id="sidebarNav">
                <a href="#" class="gh-sidebar-item active" data-target="profile">
                    <svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 2a2.5 2.5 0 110 5 2.5 2.5 0 010-5zm0 12c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                    个人资料
                </a>
                <a href="#" class="gh-sidebar-item" data-target="stars">
                    <svg viewBox="0 0 16 16"><path d="M8 .5a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.624a.75.75 0 0 1 .416-1.279l4.21-.611L7.327.918A.75.75 0 0 1 8 .5z"/></svg>
                    星星
                </a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M0 8a8 8 0 1016 0A8 8 0 000 8zm8 6.5c-3.58 0-6.5-2.92-6.5-6.5S4.42 1.5 8 1.5 14.5 4.42 14.5 8 11.58 14.5 8 14.5zM7 4h2v6H7V4zm0 7h2v2H7v-2z"/></svg>外观</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zM6.5 12.5v-9l5 4.5-5 4.5z"/></svg>无障碍设置</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M8 16a8 8 0 100-16 8 8 0 000 16zM4.75 10.5v-5h1v5h-1zm2.5-4.5h1v5h-1V6zm2.5 2h1v3h-1V8z"/></svg>通知</a>
                <hr class="gh-divider">
                <div class="text-xs font-semibold text-[#8b949e] px-2 py-1 mt-1">Access</div>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 2a3 3 0 110 6 3 3 0 010-6zm0 12c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>账单与许可</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M1.5 5h13v9H1.5V5zM0 4.5A1.5 1.5 0 011.5 3h13A1.5 1.5 0 0116 4.5v10a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 010 14.5v-10zM4 1.5h8V.5a.5.5 0 00-.5-.5h-7a.5.5 0 00-.5.5v1z"/></svg>邮箱</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M11.5 4h-.5V2.5A2.5 2.5 0 008.5 0h-1A2.5 2.5 0 005 2.5V4h-.5A1.5 1.5 0 003 5.5v9A1.5 1.5 0 004.5 16h7a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0011.5 4zM7 2.5A1.5 1.5 0 018.5 1h1A1.5 1.5 0 0111 2.5V4H7V2.5z"/></svg>密码和身份验证</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M8 1a4.5 4.5 0 00-4.5 4.5c0 1.86.98 3.5 2.42 4.47A7.5 7.5 0 00.5 17h15a7.5 7.5 0 00-5.42-7.03c1.44-.97 2.42-2.61 2.42-4.47A4.5 4.5 0 008 1z"/></svg>会话</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zM6.5 12.5v-9l5 4.5-5 4.5z"/></svg>SSH 和 GPG 密钥</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M8 16a8 8 0 100-16 8 8 0 000 16zM4.75 10.5v-5h1v5h-1zm2.5-4.5h1v5h-1V6zm2.5 2h1v3h-1V8z"/></svg>凭据</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 2a3 3 0 110 6 3 3 0 010-6zm0 12c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>组织</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M1.5 5h13v9H1.5V5zM0 4.5A1.5 1.5 0 011.5 3h13A1.5 1.5 0 0116 4.5v10a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 010 14.5v-10zM4 1.5h8V.5a.5.5 0 00-.5-.5h-7a.5.5 0 00-.5.5v1z"/></svg>企业</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M11.5 4h-.5V2.5A2.5 2.5 0 008.5 0h-1A2.5 2.5 0 005 2.5V4h-.5A1.5 1.5 0 003 5.5v9A1.5 1.5 0 004.5 16h7a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0011.5 4zM7 2.5A1.5 1.5 0 018.5 1h1A1.5 1.5 0 0111 2.5V4H7V2.5z"/></svg>审核</a>
                <hr class="gh-divider">
                <div class="text-xs font-semibold text-[#8b949e] px-2 py-1 mt-1">代码，规划和自动化</div>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 2a3 3 0 110 6 3 3 0 010-6zm0 12c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>仓库</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M1.5 5h13v9H1.5V5zM0 4.5A1.5 1.5 0 011.5 3h13A1.5 1.5 0 0116 4.5v10a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 010 14.5v-10zM4 1.5h8V.5a.5.5 0 00-.5-.5h-7a.5.5 0 00-.5.5v1z"/></svg>Codespaces</a>
                <a href="#" class="gh-sidebar-item"><svg viewBox="0 0 16 16"><path d="M11.5 4h-.5V2.5A2.5 2.5 0 008.5 0h-1A2.5 2.5 0 005 2.5V4h-.5A1.5 1.5 0 003 5.5v9A1.5 1.5 0 004.5 16h7a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0011.5 4zM7 2.5A1.5 1.5 0 018.5 1h1A1.5 1.5 0 0111 2.5V4H7V2.5z"/></svg>软件包</a>
            </nav>
        </aside>

        <!-- 右侧：通过子文件引入 -->
        <main class="flex-1 min-w-0">
            <div id="panel-profile" class="panel-content animate-item delay-1">
                {% include 'settings/gerenziliao.html' %}
            </div>
            <div id="panel-stars" class="panel-content hidden animate-item delay-1">
                {% include 'settings/xingxing.html' %}
            </div>
        </main>
    </div>

    <!-- 头像裁剪弹窗 -->
    <div id="avatarModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center">
        <div class="bg-[#161b22] border border-[#30363d] rounded-lg p-6 w-full max-w-lg shadow-2xl">
            <h3 class="text-lg font-semibold text-white mb-4">编辑头像</h3>
            <div class="w-full h-[300px] bg-black/50 rounded-lg overflow-hidden flex items-center justify-center relative">
                <img id="avatarCropperImg" src="" class="max-w-full max-h-full block">
            </div>
            <div class="flex justify-end gap-3 mt-4">
                <button id="cancelCropBtn" class="gh-edit-btn">取消</button>
                <button id="confirmCropBtn" class="gh-edit-btn bg-[#238636] border-[#2ea043] hover:bg-[#2ea043] text-white">确定上传</button>
            </div>
        </div>
    </div>

    <!-- 3D 星星卡片 CSS -->
    <style>
        #starToggleCard3D {
            width: 180px; height: 56px; padding: 0 14px;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 16px;
            position: relative; transform-style: preserve-3d; backface-visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2); cursor: pointer;
            display: flex; align-items: center; gap: 12px; flex-shrink: 0;
        }
        #starToggleCard3D.is-active { transform: translateZ(10px) rotateX(8deg) rotateY(12deg); }
        #starToggleCard3D .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px;
            flex-shrink: 0; transform-style: preserve-3d; backface-visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #starToggleCard3D.is-active .avatar { transform: translateZ(200px) translateX(10px) translateY(-4px); }
        #starToggleCard3D .text-box {
            flex: 1; pointer-events: none; transform-style: preserve-3d; backface-visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #starToggleCard3D.is-active .text-box { transform: translateZ(200px) translateX(20px) translateY(-4px); }
    </style>

    <!-- JS 逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 侧边栏切换
            const menuItems = document.querySelectorAll('#sidebarNav .gh-sidebar-item');
            const panels = { profile: document.getElementById('panel-profile'), stars: document.getElementById('panel-stars') };
            menuItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault(); const target = this.dataset.target;
                    if (!target || !panels[target]) return;
                    menuItems.forEach(m => m.classList.remove('active')); this.classList.add('active');
                    Object.keys(panels).forEach(key => { panels[key].classList.toggle('hidden', key !== target); });
                    if (target === 'stars') {
                        setTimeout(() => {
                            document.querySelectorAll('#stars-display .digit').forEach(el => {
                                el.classList.remove('spin-animate'); void el.offsetWidth; el.classList.add('spin-animate');
                            });
                        }, 250);
                    }
                });
            });

            // 3D 卡片
            const card3d = document.getElementById('starToggleCard3D');
            if (card3d) {
                card3d.addEventListener('click', function(e) { e.stopPropagation(); this.classList.toggle('is-active'); });
                document.addEventListener('click', function(e) {
                    if (!card3d.contains(e.target) && card3d.classList.contains('is-active')) {
                        card3d.classList.remove('is-active');
                    }
                });
            }

            // 头像裁剪
            const editBtn = document.getElementById('editAvatarBtn'); const avatarInput = document.getElementById('avatarInput');
            const modal = document.getElementById('avatarModal'); const cropperImg = document.getElementById('avatarCropperImg');
            const cancelBtn = document.getElementById('cancelCropBtn'); const confirmBtn = document.getElementById('confirmCropBtn');
            const profileImg = document.getElementById('profileAvatarImg'); const placeholder = document.getElementById('avatarPlaceholder');
            let cropper = null;
            if(editBtn) editBtn.addEventListener('click', function() { avatarInput.click(); });
            if(avatarInput) avatarInput.addEventListener('change', function(e) {
                const file = this.files[0]; if (!file) return;
                const img = new Image();
                img.onload = function() {
                    if (this.naturalWidth > 2000 || this.naturalHeight > 2000) {
                        alert('图片分辨率过高，请上传 2000x2000 像素以内的图片。'); avatarInput.value = ''; return;
                    }
                    const reader = new FileReader();
                    reader.onload = function(e) { cropperImg.src = e.target.result; modal.classList.remove('hidden');
                        if (cropper) cropper.destroy(); cropper = new Cropper(cropperImg, { aspectRatio: 1, viewMode: 1, autoCropArea: 0.8, background: false }); };
                    reader.readAsDataURL(file);
                };
                img.src = URL.createObjectURL(file);
            });
            if(cancelBtn) cancelBtn.addEventListener('click', function() { modal.classList.add('hidden'); if (cropper) cropper.destroy(); avatarInput.value = ''; });
            if(confirmBtn) confirmBtn.addEventListener('click', function() {
                if (!cropper) return;
                const canvas = cropper.getCroppedCanvas({ width: 256, height: 256 });
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    if(profileImg) { profileImg.src = url; profileImg.style.display = 'block'; if(placeholder) placeholder.style.display = 'none'; }
                    modal.classList.add('hidden'); cropper.destroy(); avatarInput.value = '';
                    alert('✅ 头像已更新！（目前为前端预览，刷新页面后将恢复。永久保存需等待后续后端接口）');
                });
            });
            if(modal) modal.addEventListener('click', function(e) { if (e.target === modal && cancelBtn) cancelBtn.click(); });
        });
    </script>
</body>
</html>
