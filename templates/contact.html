<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>联系开发者 - gsbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: #000000; display: flex; justify-content: center; align-items: center;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        /* 复用你首页同款的极简毛玻璃卡片 */
        .contact-card {
            position: relative; width: 340px; padding: 32px 28px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: #e5e7eb; display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        .contact-card h2 { font-size: 1.8rem; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
        .contact-card p { font-size: 0.9rem; color: #9ca3af; text-align: center; line-height: 1.5; }

        .contact-btn {
            display: block; width: 100%; padding: 14px 0; margin-top: 4px;
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px; color: #ffffff; font-weight: 500;
            text-align: center; text-decoration: none; transition: all 0.2s;
        }
        .contact-btn:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.12); }

        .back-home-btn {
            display: block; width: 100%; padding: 14px 0;
            background: rgba(255, 255, 255, 0.15); border: none;
            border-radius: 14px; color: #ffffff; font-weight: 500;
            text-align: center; transition: all 0.2s; cursor: pointer;
        }
        .back-home-btn:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body>
    <div class="contact-card">
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500/30 to-purple-500/30 flex items-center justify-center text-3xl mb-2">
            💬
        </div>
        <h2>联系开发者</h2>
        <p>如果你在使用过程中遇到 Bug，<br>或者有好的建议和想法，欢迎随时与我沟通。</p>
        
        <!-- 直接跳转你的 Telegram -->
        <a href="https://t.me/gsyxyc" target="_blank" class="contact-btn">
            📱 打开 Telegram 联系我
        </a>
        
        <!-- 友情提示（你可以改成你的QQ等） -->
        <div style="font-size: 0.8rem; color: #6b7280; text-align: center; margin-top: -8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; width: 100%;">
            <span>💡 如果 Telegram 无法访问，<br>可以截图并说明问题到工单反馈。</span>
        </div>

        <!-- 返回首页按钮 -->
        <button onclick="window.location.href='/'" class="back-home-btn">
            ← 返回首页
        </button>
    </div>
</body>
</html>
