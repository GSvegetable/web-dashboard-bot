<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - gsbot</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 24px; color: #f0f6fc; font-weight: 600; }
        label { display: block; margin: 12px 0 4px; font-size: 14px; color: #8b949e; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #58a6ff; }
        .tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid #30363d; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #8b949e; }
        .tab.active { color: #f0f6fc; border-bottom: 2px solid #f0f6fc; font-weight: 600; }
        .row { display: flex; gap: 10px; margin-bottom: 16px; }
        .row input { flex: 1; margin-bottom: 0; }
        button { padding: 12px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 16px; cursor: pointer; }
        .full-btn { width: 100%; margin-top: 8px; }
        .verify-btn { background: #1f6feb; width: 120px; padding: 10px; font-size: 14px; border-radius: 6px; flex-shrink: 0; }
        .cf-turnstile { margin: 16px 0; display: flex; justify-content: center; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #8b949e; }
        .link a { color: #58a6ff; text-decoration: none; }
        #error-msg { background: #da3633; padding: 8px; border-radius: 6px; color: white; display: none; margin-bottom: 16px; text-align: center; }
        .hidden { display: none; }
        .guest-login-btn { display: block; text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #30363d; color: #8b949e; font-size: 14px; cursor: pointer; transition: color 0.2s; }
        .guest-login-btn:hover { color: #58a6ff; }
        .guest-login-btn a { color: #58a6ff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2>登录 gsbot</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchLogin('password')">密码登录</div>
            <div class="tab" onclick="switchLogin('code')">验证码登录</div>
        </div>
        <form method="POST" action="/login">
            <input type="hidden" id="login_type" name="login_type" value="password">
            <label>QQ 邮箱</label>
            <input type="email" name="email" placeholder="your@qq.com" required>
            
            <div id="pwd_group">
                <label>密码</label>
                <input type="password" name="password" placeholder="输入密码">
            </div>
            
            <div id="code_group" class="hidden">
                <label>验证码</label>
                <div class="row">
                    <input type="text" name="code" placeholder="输入6位验证码">
                    <button type="button" class="verify-btn" id="loginSendCodeBtn">发送验证码</button>
                </div>
            </div>
            
            <div class="cf-turnstile">
                <div class="cf-turnstile" data-sitekey="你的Cloudflare_Turnstile_SiteKey"></div>
            </div>
            
            <button type="submit" class="full-btn">登 录</button>
        </form>
        <div class="link">没有账号？<a href="/register">去注册</a></div>
        
        <div class="guest-login-btn">
            <a href="/guest_login">点击以【游客身份】直接进入后台</a>
        </div>
    </div>
    <script>
        function switchLogin(type) {
            document.getElementById('login_type').value = type;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll('.tab');
            if(type === 'password') {
                tabs[0].classList.add('active');
                document.getElementById('pwd_group').classList.remove('hidden');
                document.getElementById('code_group').classList.add('hidden');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('pwd_group').classList.add('hidden');
                document.getElementById('code_group').classList.remove('hidden');
            }
        }

        // 🔧 修复后的发验证码逻辑（加了 try-catch，确保报错时会弹窗提示）
        document.getElementById('loginSendCodeBtn').addEventListener('click', async function() {
            const email = document.querySelector('input[name="email"]').value;
            if(!email) { alert('请输入邮箱'); return; }
            const btn = this;
            const originalText = btn.innerText;
            btn.innerText = '发送中...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/send_code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email})
                });
                
                if (!res.ok) {
                    throw new Error(`服务器返回错误: ${res.status}`);
                }
                
                const data = await res.json();
                if(data.ok) {
                    alert(data.msg);
                    btn.innerText = '已发送';
                } else {
                    alert('发送失败: ' + data.msg);
                    btn.innerText = '重新发送';
                    btn.disabled = false;
                }
            } catch (e) {
                alert('系统请求异常: ' + e.message + '\n请检查 Railway 环境变量中 MAIL_PASSWORD 是否为 QQ邮箱的授权码。');
                btn.innerText = '重新发送';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
