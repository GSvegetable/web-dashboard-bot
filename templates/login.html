<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - gsbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .card {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 24px; color: #f0f6fc; font-weight: 600; }
        label { display: block; margin: 12px 0 4px; font-size: 14px; color: #8b949e; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #58a6ff; }
        button {
            width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 8px;
        }
        button:active { transform: scale(0.98); }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #8b949e; }
        .link a { color: #58a6ff; text-decoration: none; }
        #error-msg { background: #da3633; padding: 8px; border-radius: 6px; color: white; display: none; margin-bottom: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>登录 gsbot</h2>
        <div id="error-msg">邮箱或密码错误</div>
        <form method="POST" action="/login">
            <label>QQ 邮箱</label>
            <input type="email" name="email" placeholder="your@qq.com" required>
            <label>密码</label>
            <input type="password" name="password" placeholder="输入密码" required>
            <button type="submit">登 录</button>
        </form>
        <div class="link">没有账号？<a href="/register">去注册</a></div>
    </div>
    <script>
        // 检测后端传来的 Flash 错误信息，简单展示
        const errMsg = `{{ get_flashed_messages(with_categories=true) }}`;
        if (errMsg && errMsg.includes('error')) {
            document.getElementById('error-msg').style.display = 'block';
        }
    </script>
</body>
</html>
