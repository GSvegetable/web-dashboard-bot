<!-- 音乐卡片组件：深蓝到淡蓝渐变，空心描边，丝滑形变 -->
<div class="modal-overlay" id="musicModal">
    <div class="modal-box">
        <div class="music-card-glass">
            <img id="album-cover-img" src="{{ url_for('static', filename='mmexport1785973035076.jpg') }}" style="display: none;" crossorigin="anonymous">
            <audio id="bg-audio" src="{{ url_for('static', filename='5_6311840232614403295.mp3') }}" preload="auto" loop crossorigin="anonymous"></audio>
            
            <div class="music-track-info">
                <div class="album-art" id="album-art-display" style="background-image: url('{{ url_for('static', filename='mmexport1785973035076.jpg') }}'); background-size: cover; background-position: center; flex-shrink: 0;"></div>
                <div class="track-details">
                    <div class="music-track-title">你的名字</div>
                    <div class="music-artist-name">纯音乐</div>
                </div>

                <!-- ✅ 恢复成播放按钮，不再跳转！ -->
                <button id="play-pause-btn" class="play-pause-btn" onclick="toggleMusicPlay()">
                    <div class="svg-container">
                        <svg class="icon-circle" viewBox="0 0 32 32" width="32" height="32">
                            <defs><linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a" /><stop offset="100%" stop-color="#93c5fd" /></linearGradient></defs>
                            <circle cx="16" cy="16" r="14" fill="none" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round" />
                        </svg>
                        <svg class="icon-square" viewBox="0 0 32 32" width="32" height="32">
                            <rect x="2" y="2" width="28" height="28" rx="6" fill="none" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round" />
                        </svg>
                    </div>
                </button>
            </div>
            
            <div class="music-progress-area">
                <div class="music-time-row"><span id="music-current-time">0:00</span><span id="music-total-time">0:00</span></div>
                <div class="music-progress-track" id="music-progress-track">
                    <div class="music-progress-fill" id="music-progress-fill"></div>
                    <div class="music-progress-handle" id="music-progress-handle"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.music-track-info { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.album-art { width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0; }
.track-details { flex: 1; min-width: 0; overflow: hidden; }
.music-track-title { font-size: 1.1rem; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-artist-name { font-size: 0.85rem; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.play-pause-btn { appearance: none; -webkit-appearance: none; background: transparent !important; border: none !important; box-shadow: none !important; outline: none !important; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; margin-right: 4px; }
.svg-container { position: relative; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.icon-circle, .icon-square { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
.icon-circle { opacity: 1; transform: scale(1); }
.icon-square { opacity: 0; transform: scale(0.8); }
.play-pause-btn.playing .icon-circle { opacity: 0; transform: scale(0.6); }
.play-pause-btn.playing .icon-square { opacity: 1; transform: scale(1); }
.music-card-glass { position: relative; width: 320px; padding: 20px 24px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1); color: #e5e7eb; display: flex; flex-direction: column; gap: 12px; }
</style>

<script>
function toggleMusicPlay() {
    const audio = document.getElementById('bg-audio');
    const btn = document.getElementById('play-pause-btn');
    if (!audio || !btn) return;
    if (!audio.paused) {
        audio.pause();
        btn.classList.remove('playing');
    } else {
        audio.play().catch(e => console.warn('播放被浏览器拦截', e));
        btn.classList.add('playing');
    }
}
document.addEventListener("DOMContentLoaded", function() {
    const audio = document.getElementById('bg-audio');
    const progressTrack = document.getElementById('music-progress-track');
    const progressFill = document.getElementById('music-progress-fill');
    const currentTimeEl = document.getElementById('music-current-time');
    const totalTimeEl = document.getElementById('music-total-time');
    function formatTime(seconds) { const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
    if (audio) {
        audio.addEventListener('timeupdate', function() {
            if (!audio.duration) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            if (progressFill) progressFill.style.width = percent + '%';
            if (currentTimeEl) currentTimeEl.textContent = formatTime(audio.currentTime);
            if (totalTimeEl && audio.duration) totalTimeEl.textContent = formatTime(audio.duration);
        });
        audio.addEventListener('loadedmetadata', function() {
            if (totalTimeEl && audio.duration) totalTimeEl.textContent = formatTime(audio.duration);
        });
        audio.addEventListener('ended', function() {
            const btn = document.getElementById('play-pause-btn');
            if (btn) btn.classList.remove('playing');
            if (progressFill) progressFill.style.width = '0%';
            if (currentTimeEl) currentTimeEl.textContent = '0:00';
        });
        if (progressTrack) {
            progressTrack.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = x / rect.width;
                if (audio.duration) { audio.currentTime = percent * audio.duration; }
            });
        }
    }
});
</script>
