<!-- 音乐卡片组件：彻底去掉任何黑圈，单一大按钮 -->
<div class="modal-overlay" id="musicModal">
    <div class="modal-box">
        <div class="music-card-glass">
            <!-- 专辑封面图片预加载 -->
            <img id="album-cover-img" src="{{ url_for('static', filename='mmexport1785973035076.jpg') }}" style="display: none;" crossorigin="anonymous">
            
            <!-- 音频播放器 -->
            <audio id="bg-audio" src="{{ url_for('static', filename='5_6311840232614403295.mp3') }}" preload="auto" loop crossorigin="anonymous"></audio>
            
            <div class="music-track-info">
                <div class="album-art" id="album-art-display" style="background-image: url('{{ url_for('static', filename='mmexport1785973035076.jpg') }}'); background-size: cover; background-position: center;"></div>
                <div class="track-details">
                    <div class="music-track-title" id="music-title">你的名字</div>
                    <div class="music-artist-name" id="music-artist">纯音乐</div>
                </div>
            </div>
            
            <div class="music-progress-area">
                <div class="music-time-row">
                    <span id="music-current-time">0:00</span>
                    <span id="music-total-time">0:00</span>
                </div>
                <div class="music-progress-track" id="music-progress-track">
                    <div class="music-progress-fill" id="music-progress-fill"></div>
                    <div class="music-progress-handle" id="music-progress-handle"></div>
                </div>
            </div>

            <!-- ★★★ 音乐控制区：只保留唯一一个播放/暂停按钮 ★★★ -->
            <div class="music-controls">
                <button id="play-pause-btn" class="music-btn">
                    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="6,3 20,12 6,21"></polygon>
                    </svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
/* ★★★ 彻底干掉黑圈的核心 CSS ★★★ */
.music-btn {
    /* 强制去除浏览器自带的所有黑圈和高亮 */
    appearance: none; -webkit-appearance: none;
    outline: none !important;
    background: transparent !important;
    background-color: rgba(255, 255, 255, 0.12) !important;
    border: 1px solid rgba(255, 255, 255, 0.3) !important;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    /* 只保留极柔和的白光，绝对没有黑底的阴影 */
    box-shadow: 0 4px 10px rgba(255, 255, 255, 0.05), inset 0 0 10px rgba(255, 255, 255, 0.1);
    -webkit-tap-highlight-color: transparent;
}
.music-btn:hover { transform: scale(1.05); }
.music-btn:active { transform: scale(0.98); }

.music-btn .icon-play { width: 24px; height: 24px; }
.music-btn .icon-pause { width: 24px; height: 24px; }

#play-pause-btn .icon-pause { display: none; }
#play-pause-btn.playing .icon-play { display: none; }
#play-pause-btn.playing .icon-pause { display: block; }
</style>
