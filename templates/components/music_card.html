<!-- 音乐卡片组件：播放圆形，暂停圆角正方形 -->
<div class="modal-overlay" id="musicModal">
    <div class="modal-box">
        <div class="music-card-glass">
            <!-- 专辑封面图片预加载 -->
            <img id="album-cover-img" src="{{ url_for('static', filename='mmexport1785973035076.jpg') }}" style="display: none;" crossorigin="anonymous">
            
            <!-- 音频播放器 -->
            <audio id="bg-audio" src="{{ url_for('static', filename='5_6311840232614403295.mp3') }}" preload="auto" loop crossorigin="anonymous"></audio>
            
            <!-- 内容区：使用 flex 布局让按钮紧贴右侧 -->
            <div class="music-track-info" style="display: flex; align-items: center; gap: 10px;">
                <div class="album-art" id="album-art-display" style="background-image: url('{{ url_for('static', filename='mmexport1785973035076.jpg') }}'); background-size: cover; background-position: center; flex-shrink: 0;"></div>
                
                <div class="track-details" style="flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden;">
                    <div class="music-track-title" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">你的名字</div>
                    <div class="music-artist-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">纯音乐</div>
                </div>

                <!-- ★★★ 重写后的播放/暂停按钮 ★★★ -->
                <button id="play-pause-btn" class="play-pause-btn" style="margin-right: 2px; flex-shrink: 0;">
                    <!-- 播放状态：带外圆的三角形 -->
                    <svg class="icon-play" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <polygon points="10,8 16,12 10,16" fill="#ffffff" stroke="none" />
                    </svg>
                    <!-- 暂停状态：带外框的圆角矩形 -->
                    <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
                        <rect x="6" y="6" width="12" height="12" rx="3" />
                        <line x1="10" y1="8" x2="10" y2="16" stroke-linecap="round" />
                        <line x1="14" y1="8" x2="14" y2="16" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            
            <!-- 进度条区域保持不变 -->
            <div class="music-progress-area">
                <div class="music-time-row">
                    <span id="music-current-time">0:00</span>
                    <span id="music-total-time">0:00</span>
                </div>
                <div class="music-progress-track" id="music-progress-track">
                    <div class="music-progress-fill" id="music-progress-fill"></div>
                    <div class="music-progress-handle" id="music-progress-handle"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* 彻底消除按钮黑圈的核心 CSS */
.play-pause-btn {
    appearance: none; -webkit-appearance: none;
    outline: none !important; border: none;
    /* 默认是圆形（代表播放） */
    border: 2px solid #ffffff;
    border-radius: 50%;
    width: 32px; height: 32px;
    background: rgba(255, 255, 255, 0.1) !important;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05);
    -webkit-tap-highlight-color: transparent;
    padding: 0;
}
.play-pause-btn:active { transform: scale(0.92); }

/* 暂停状态：按钮自动变化为圆角正方形 */
.play-pause-btn.playing {
    border-radius: 8px; /* 圆润一点的正方形 */
    width: 26px; height: 26px;
}

/* 切换内部图标的显示与隐藏 */
.play-pause-btn .icon-play { display: block; }
.play-pause-btn .icon-pause { display: none; }
.play-pause-btn.playing .icon-play { display: none; }
.play-pause-btn.playing .icon-pause { display: block; }

.play-pause-btn svg { width: 18px; height: 18px; }
.play-pause-btn.playing svg { width: 14px; height: 14px; }
</style>
