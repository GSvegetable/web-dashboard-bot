<!-- 音乐卡片组件：纯白 SVG 图形，绝无黑底 -->
<div class="modal-overlay" id="musicModal">
    <div class="modal-box">
        <div class="music-card-glass">
            <!-- 专辑封面图片预加载 -->
            <img id="album-cover-img" src="{{ url_for('static', filename='mmexport1785973035076.jpg') }}" style="display: none;" crossorigin="anonymous">
            
            <!-- 音频播放器 -->
            <audio id="bg-audio" src="{{ url_for('static', filename='5_6311840232614403295.mp3') }}" preload="auto" loop crossorigin="anonymous"></audio>
            
            <!-- 内容区 -->
            <div class="music-track-info">
                <div class="album-art" id="album-art-display" style="background-image: url('{{ url_for('static', filename='mmexport1785973035076.jpg') }}'); background-size: cover; background-position: center; flex-shrink: 0;"></div>
                
                <div class="track-details">
                    <div class="music-track-title">你的名字</div>
                    <div class="music-artist-name">纯音乐</div>
                </div>

                <!-- ★★★ 终极绝杀：用纯白 SVG 替代，彻底断绝黑底 ★★★ -->
                <button id="play-pause-btn" class="play-pause-btn">
                    <!-- 播放状态：纯白色的正圆形 SVG -->
                    <svg class="shape-play" viewBox="0 0 32 32" width="32" height="32">
                        <circle cx="16" cy="16" r="16" fill="#FFFFFF" />
                    </svg>
                    <!-- 暂停状态：纯白色的圆角正方形 SVG -->
                    <svg class="shape-pause" viewBox="0 0 32 32" width="32" height="32">
                        <rect x="4" y="4" width="24" height="24" rx="6" fill="#FFFFFF" />
                    </svg>
                </button>
            </div>
            
            <!-- 进度条区域 -->
            <div class="music-progress-area">
                <div class="music-time-row">
                    <span id="music-current-time">0:00</span>
                    <span id="music-total-time">0:00</span>
                </div>
                <div class="music-progress-track" id="music-progress-track">
                    <div class="music-progress-fill" id="music-progress-fill"></div>
                    <div class="music-progress-handle" id="music-progress-handle"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* 外层布局 */
.music-track-info { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.album-art { width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0; }
.track-details { flex: 1; min-width: 0; overflow: hidden; }
.music-track-title { font-size: 1.1rem; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-artist-name { font-size: 0.85rem; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

/* ★★★ 完美无瑕的纯白按钮 ★★★ */
.play-pause-btn {
    appearance: none; -webkit-appearance: none;
    background: transparent !important; border: none !important;
    box-shadow: none !important; outline: none !important;
    width: 40px; height: 40px; /* 点击区域 40px */
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    -webkit-tap-highlight-color: transparent;
    margin-right: 4px; /* 距离右边缘微微间距 */
}
.play-pause-btn:active { transform: scale(0.9); }

/* 两个 SVG 的显隐切换 */
.shape-play, .shape-pause { width: 32px; height: 32px; display: none; }

/* 默认显示圆形（播放状态） */
.play-pause-btn:not(.playing) .shape-play { display: block; }
/* 显示圆角正方形（暂停状态） */
.play-pause-btn.playing .shape-pause { display: block; }
</style>
