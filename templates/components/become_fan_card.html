<!-- 订阅卡片下拉组件（绝稳定右上角固定定位） -->
<div id="becomeFanDropdown" class="hidden fixed top-[68px] right-6 z-[9999]">
    <!-- 优雅毛玻璃外壳 -->
    <div id="becomeFanCardWrapper" class="bg-black/40 backdrop-blur-xl border border-white/20 rounded-2xl shadow-[0_8px_24px_rgba(0,0,0,0.3)] p-4 pt-3 pb-4 w-[320px] md:w-[360px]">
        <div class="fan-container flex justify-center items-center w-full relative py-1">
            
            <!-- 卡片 1：微光 -->
            <div class="fan-card" style="--r:-14;">
                <div class="flex flex-col items-center justify-center gap-0">
                    <span class="text-2xl font-bold bg-gradient-to-b from-cyan-300 to-cyan-500 text-transparent bg-clip-text">¥15</span>
                    <span class="absolute bottom-2.5 text-[11px] text-gray-400/80 font-medium tracking-wide">微光</span>
                </div>
            </div>

            <!-- 卡片 2：星光 -->
            <div class="fan-card" style="--r:0;">
                <div class="flex flex-col items-center justify-center gap-0">
                    <span class="text-2xl font-bold bg-gradient-to-b from-yellow-300 to-yellow-500 text-transparent bg-clip-text">¥40</span>
                    <span class="absolute bottom-2.5 text-[11px] text-gray-400/80 font-medium tracking-wide">星光</span>
                </div>
            </div>

            <!-- 卡片 3：极光 -->
            <div class="fan-card" style="--r:14;">
                <div class="flex flex-col items-center justify-center gap-0">
                    <span class="text-2xl font-bold bg-gradient-to-b from-purple-400 to-purple-600 text-transparent bg-clip-text">¥310</span>
                    <span class="absolute bottom-2.5 text-[11px] text-gray-400/80 font-medium tracking-wide">极光</span>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
/* 卡片排列 */
.fan-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
}

/* 单张卡片 - 高颜毛玻璃 */
.fan-container .fan-card {
    position: relative;
    width: 100px;
    height: 130px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 -26px;
    transform: rotate(calc(var(--r) * 1deg));
    transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    z-index: 1;
}

/* 悬停展开 */
.fan-container:hover .fan-card,
.fan-container:focus-within .fan-card {
    transform: rotate(0deg);
    margin: 0 8px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
}

/* 手机端适配 */
@media (max-width: 600px) {
    #becomeFanDropdown {
        top: 62px;
        right: 12px;
    }
    #becomeFanCardWrapper {
        width: 270px !important;
        padding: 10px 6px 12px !important;
    }
    .fan-container .fan-card {
        width: 78px;
        height: 106px;
        margin: 0 -22px;
        border-radius: 14px;
    }
    .fan-container:hover .fan-card,
    .fan-container:focus-within .fan-card {
        margin: 0 6px;
    }
    .fan-card .text-2xl {
        font-size: 1.1rem;
    }
    .fan-card .text-[11px] {
        font-size: 10px;
        bottom: 2px !important;
    }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    window.openBecomeFanModal = function() {
        const el = document.getElementById('becomeFanDropdown');
        if (!el) return;

        // 强制切换显示/隐藏（完全不管按钮坐标，它永远在右上角固定位置）
        if (el.classList.contains('hidden')) {
            el.classList.remove('hidden');
            // 绑定点击空白处关闭
            setTimeout(() => { document.addEventListener('click', closeDropdownOutside); }, 10);
        } else {
            el.classList.add('hidden');
            document.removeEventListener('click', closeDropdownOutside);
        }
    };

    function closeDropdownOutside(e) {
        const el = document.getElementById('becomeFanDropdown');
        // 查找“开发者”按钮防止误触
        const btn = Array.from(document.querySelectorAll('.top-actions .top-btn'))
                          .find(el => el.innerText.trim() === '开发者');
        if (!el || el.classList.contains('hidden')) return;
        // 如果点击的不是卡片本身，也不是按钮，则关闭
        if (!el.contains(e.target) && !btn?.contains(e.target)) {
            el.classList.add('hidden');
            document.removeEventListener('click', closeDropdownOutside);
        }
    }
});
</script>
