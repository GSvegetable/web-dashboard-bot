<!-- 纯粹毛玻璃折叠卡片（微光 / 星光 / 极光） -->
<div class="modal-overlay" id="becomeFanModal">
    <div class="modal-box">
        <!-- 减掉顶部内边距，让卡片整体上移 -->
        <div id="becomeFanCardWrapper" class="relative overflow-hidden w-full max-w-[600px] px-6 pb-6 pt-2">
            
            <!-- 卡片交互主容器：点击这里触发展开和收起 -->
            <div id="cardStackContainer" class="relative flex justify-center items-center min-h-[170px] cursor-pointer select-none">

                <!-- 卡片 1：微光 (初始逆时针倾斜) -->
                <div class="card-item w-[110px] h-[135px] bg-[rgba(255,255,255,0.05)] border border-white/20 shadow-[0_15px_25px_rgba(0,0,0,0.25)] backdrop-blur-md rounded-xl flex flex-col items-center justify-center transition-all duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)] relative"
                     style="transform: rotate(-15deg) translateX(-10px); margin-right: -30px; z-index: 1;">
                    <span class="text-white/60 text-[10px] font-light tracking-wider mb-1">微光</span>
                    <span class="text-2xl font-bold text-white tracking-tight">15<span class="text-xs font-normal text-gray-400 ml-0.5">/月</span></span>
                </div>

                <!-- 卡片 2：星光 (初始居中) -->
                <div class="card-item w-[110px] h-[135px] bg-[rgba(255,255,255,0.05)] border border-white/20 shadow-[0_15px_25px_rgba(0,0,0,0.25)] backdrop-blur-md rounded-xl flex flex-col items-center justify-center transition-all duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)] relative"
                     style="transform: rotate(0deg); margin-right: -30px; z-index: 2;">
                    <span class="text-white/60 text-[10px] font-light tracking-wider mb-1">星光</span>
                    <span class="text-2xl font-bold text-white tracking-tight">40<span class="text-xs font-normal text-gray-400 ml-0.5">/月</span></span>
                </div>

                <!-- 卡片 3：极光 (初始顺时针倾斜) -->
                <div class="card-item w-[110px] h-[135px] bg-[rgba(255,255,255,0.05)] border border-white/20 shadow-[0_15px_25px_rgba(0,0,0,0.25)] backdrop-blur-md rounded-xl flex flex-col items-center justify-center transition-all duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)] relative"
                     style="transform: rotate(15deg) translateX(10px); z-index: 0;">
                    <span class="text-white/60 text-[10px] font-light tracking-wider mb-1">极光</span>
                    <span class="text-2xl font-bold text-white tracking-tight">310<span class="text-xs font-normal text-gray-400 ml-0.5">/月</span></span>
                </div>

            </div>

        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 点击背景层直接关闭卡片
    const modalOverlay = document.getElementById('becomeFanModal');
    if (modalOverlay) {
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                if (typeof window.closeBecomeFanModal === 'function') {
                    window.closeBecomeFanModal(e);
                }
            }
        });
    }

    // ==========================================
    // 核心交互：点击卡片组 -> 展开 / 收回
    // ==========================================
    const cardContainer = document.getElementById('cardStackContainer');
    const cardItems = cardContainer.querySelectorAll('.card-item');
    let isExpanded = false; // 当前是否展开的状态

    cardContainer.addEventListener('click', function() {
        isExpanded = !isExpanded; // 状态反转

        if (isExpanded) {
            // 1. 展开整齐排列
            cardItems[0].style.transform = 'rotate(0deg) translateX(-60px)';
            cardItems[0].style.marginRight = '0px';
            
            cardItems[1].style.transform = 'rotate(0deg) translateX(0px)';
            cardItems[1].style.marginRight = '0px';
            
            cardItems[2].style.transform = 'rotate(0deg) translateX(60px)';
        } else {
            // 2. 收回重叠排列
            cardItems[0].style.transform = 'rotate(-15deg) translateX(-10px)';
            cardItems[0].style.marginRight = '-30px';
            
            cardItems[1].style.transform = 'rotate(0deg)';
            cardItems[1].style.marginRight = '-30px';
            
            cardItems[2].style.transform = 'rotate(15deg) translateX(10px)';
        }
    });
});
</script>
