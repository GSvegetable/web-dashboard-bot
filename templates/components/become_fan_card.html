<!-- 订阅卡片下拉组件（绝对定位修正版） -->
<div id="becomeFanDropdown" class="hidden fixed z-[9999]">
    <div id="becomeFanCardWrapper" class="bg-black/60 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl p-4 pt-3 pb-4 w-[320px] md:w-[360px]">
        <div class="fan-container flex justify-center items-center w-full relative">
            
            <!-- 卡片 1：微光 -->
            <div class="fan-card" style="--r:-14;">
                <div class="flex flex-col items-center justify-center gap-0">
                    <span class="text-2xl font-bold bg-gradient-to-b from-cyan-300 to-cyan-500 text-transparent bg-clip-text">¥15</span>
                    <span class="absolute bottom-2.5 text-[11px] text-gray-400/80 font-medium tracking-wide">微光</span>
                </div>
            </div>

            <!-- 卡片 2：星光 -->
            <div class="fan-card" style="--r:0;">
                <div class="flex flex-col items-center justify-center gap-0">
                    <span class="text-2xl font-bold bg-gradient-to-b from-yellow-300 to-yellow-500 text-transparent bg-clip-text">¥40</span>
                    <span class="absolute bottom-2.5 text-[11px] text-gray-400/80 font-medium tracking-wide">星光</span>
                </div>
            </div>

            <!-- 卡片 3：极光 -->
            <div class="fan-card" style="--r:14;">
                <div class="flex flex-col items-center justify-center gap-0">
                    <span class="text-2xl font-bold bg-gradient-to-b from-purple-400 to-purple-600 text-transparent bg-clip-text">¥310</span>
                    <span class="absolute bottom-2.5 text-[11px] text-gray-400/80 font-medium tracking-wide">极光</span>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
.fan-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 10px 0;
}
.fan-container .fan-card {
    position: relative;
    width: 100px;
    height: 140px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 -32px;
    transform: rotate(calc(var(--r) * 1deg));
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    cursor: pointer;
    z-index: 1;
}
.fan-container:hover .fan-card,
.fan-container:focus-within .fan-card {
    transform: rotate(0deg);
    margin: 0 6px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
}
@media (max-width: 600px) {
    #becomeFanCardWrapper {
        width: 260px !important;
        padding: 12px 8px 14px !important;
    }
    .fan-container .fan-card {
        width: 74px;
        height: 110px;
        margin: 0 -24px;
        border-radius: 14px;
    }
    .fan-container:hover .fan-card {
        margin: 0 4px;
    }
    .fan-card .text-2xl {
        font-size: 1.1rem;
    }
    .fan-card .text-[11px] {
        font-size: 9px;
        bottom: 2px !important;
    }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 重写全局点击事件
    window.openBecomeFanModal = function() {
        const el = document.getElementById('becomeFanDropdown');
        if (!el) return;

        console.log("触发开发者卡片菜单"); // 如果你在控制台能看到这句，说明代码跑进来了！

        // 精准查找文字为“开发者”的按钮
        const btn = Array.from(document.querySelectorAll('.top-actions .top-btn'))
                          .find(el => el.innerText.trim() === '开发者');

        // 【保底安全位置】无论按钮在哪，先把卡片放在右上角靠下的位置，一定能看见
        let top = 60;
        let right = 20;

        if (btn) {
            const rect = btn.getBoundingClientRect();
            // 如果确实找到了按钮，就精确贴着它下方
            top = rect.bottom + 8;
            right = window.innerWidth - rect.right;
        }

        el.style.top = top + 'px';
        el.style.right = right + 'px';

        // 切换显示状态
        if (el.classList.contains('hidden')) {
            el.classList.remove('hidden');
            setTimeout(() => { document.addEventListener('click', closeDropdownOutside); }, 10);
        } else {
            el.classList.add('hidden');
            document.removeEventListener('click', closeDropdownOutside);
        }
    };

    function closeDropdownOutside(e) {
        const el = document.getElementById('becomeFanDropdown');
        const btn = Array.from(document.querySelectorAll('.top-actions .top-btn'))
                          .find(el => el.innerText.trim() === '开发者');
        if (!el || el.classList.contains('hidden')) return;
        if (!el.contains(e.target) && !btn.contains(e.target)) {
            el.classList.add('hidden');
            document.removeEventListener('click', closeDropdownOutside);
        }
    }
});
</script>
