<!-- 纯粹毛玻璃折叠卡片（星光 / 极光 / 极光pro） -->
<div class="modal-overlay" id="becomeFanModal">
    <div class="modal-box">
        <div id="becomeFanCardWrapper" class="relative w-full max-w-[600px] pr-6 pt-0">
            <div id="cardStackContainer" class="relative flex justify-start items-center min-h-[160px] cursor-pointer select-none pl-3 -mt-6">

                <!-- 卡片 1：星光 -->
                <div class="card-item w-[100px] h-[125px] bg-[rgba(255,255,255,0.05)] border border-white/20 shadow-[0_15px_25px_rgba(0,0,0,0.25)] backdrop-blur-md rounded-xl flex flex-col items-center justify-center"
                     style="transform: rotate(-25deg) translateX(-15px); margin-right: -45px; z-index: 1;"
                     data-plan-name="星光" data-index="0">
                    <span class="text-white/60 text-[10px] font-light tracking-wider mb-1">星光</span>
                    <span class="text-xl font-bold text-white tracking-tight">15<span class="text-xs font-normal text-gray-400 ml-0.5">/月</span></span>
                </div>

                <!-- 卡片 2：极光 -->
                <div class="card-item w-[100px] h-[125px] bg-[rgba(255,255,255,0.05)] border border-white/20 shadow-[0_15px_25px_rgba(0,0,0,0.25)] backdrop-blur-md rounded-xl flex flex-col items-center justify-center"
                     style="transform: rotate(0deg); margin-right: -45px; z-index: 2;"
                     data-plan-name="极光" data-index="1">
                    <span class="text-white/60 text-[10px] font-light tracking-wider mb-1">极光</span>
                    <span class="text-xl font-bold text-white tracking-tight">40<span class="text-xs font-normal text-gray-400 ml-0.5">/月</span></span>
                </div>

                <!-- 卡片 3：极光pro -->
                <div class="card-item w-[100px] h-[125px] bg-[rgba(255,255,255,0.05)] border border-white/20 shadow-[0_15px_25px_rgba(0,0,0,0.25)] backdrop-blur-md rounded-xl flex flex-col items-center justify-center"
                     style="transform: rotate(25deg) translateX(15px); z-index: 0;"
                     data-plan-name="极光pro" data-index="2">
                    <span class="text-white/60 text-[10px] font-light tracking-wider mb-1">极光pro</span>
                    <span class="text-xl font-bold text-white tracking-tight">310<span class="text-xs font-normal text-gray-400 ml-0.5">/月</span></span>
                </div>

            </div>
        </div>
    </div>
</div>

<style>
    /* ✨ 核心修复：只对 3 个特定属性过渡，彻底断绝外部引起的偏移 */
    .card-item {
        transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), margin-right 0.5s cubic-bezier(0.34,1.56,0.64,1), z-index 0s !important;
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const modalOverlay = document.getElementById('becomeFanModal');
    const cardContainer = document.getElementById('cardStackContainer');
    const cardItems = cardContainer.querySelectorAll('.card-item');

    // ---------- 展开并排 ----------
    function expandCards() {
        cardItems[0].style.transform = 'rotate(0deg) translateX(-24px) scale(1)';
        cardItems[0].style.marginRight = '0px';
        cardItems[0].style.zIndex = 2;
        
        cardItems[1].style.transform = 'rotate(0deg) translateX(0px) scale(1)';
        cardItems[1].style.marginRight = '0px';
        cardItems[1].style.zIndex = 2;
        
        cardItems[2].style.transform = 'rotate(0deg) translateX(24px) scale(1)';
        cardItems[2].style.marginRight = '0px';
        cardItems[2].style.zIndex = 2;
    }

    // ---------- 聚焦高亮动画（✨ 向中间靠拢效果加倍） ----------
    function focusCard(selectedIndex) {
        // 左滑 -12px，右滑 +12px（之前是 20px，效果更加显著）
        const targetOffsets = [-12, 0, 12];
        cardItems.forEach((card, idx) => {
            if (idx === selectedIndex) {
                card.style.transform = `rotate(0deg) translateX(${targetOffsets[idx]}px) scale(1.15)`;
                card.style.zIndex = 10;
            } else {
                const baseX = (idx === 0) ? -24 : (idx === 2) ? 24 : 0;
                card.style.transform = `rotate(0deg) translateX(${baseX}px) scale(0.85)`;
                card.style.zIndex = 1;
            }
        });
    }

    // ---------- 恢复并排平铺 ----------
    function unfocusCards() {
        cardItems[0].style.transform = 'rotate(0deg) translateX(-24px) scale(1)';
        cardItems[0].style.marginRight = '0px';
        cardItems[0].style.zIndex = 2;
        
        cardItems[1].style.transform = 'rotate(0deg) translateX(0px) scale(1)';
        cardItems[1].style.marginRight = '0px';
        cardItems[1].style.zIndex = 2;
        
        cardItems[2].style.transform = 'rotate(0deg) translateX(24px) scale(1)';
        cardItems[2].style.marginRight = '0px';
        cardItems[2].style.zIndex = 2;
    }

    // ---------- 折叠重叠（🛡️ 终极修复：强制清空并覆盖绝对坐标，杜绝“右移漂移”） ----------
    function collapseCards() {
        // 先把旧的内联样式彻底清空
        cardItems.forEach(card => {
            card.style.transform = '';
            card.style.marginRight = '';
            card.style.zIndex = '';
        });
        // 再重新精准绝对定位
        cardItems[0].style.transform = 'rotate(-25deg) translateX(-15px) scale(1)';
        cardItems[0].style.marginRight = '-45px';
        cardItems[0].style.zIndex = 1;
        
        cardItems[1].style.transform = 'rotate(0deg) scale(1)';
        cardItems[1].style.marginRight = '-45px';
        cardItems[1].style.zIndex = 2;
        
        cardItems[2].style.transform = 'rotate(25deg) translateX(15px) scale(1)';
        cardItems[2].style.marginRight = '-45px';
        cardItems[2].style.zIndex = 0;
    }

    window.collapseCardStack = collapseCards;
    window.unfocusCardStack = unfocusCards;

    // ---------- 核心点击逻辑 ----------
    cardItems.forEach((card) => {
        card.addEventListener('click', function(e) {
            e.stopPropagation(); 

            const planName = this.getAttribute('data-plan-name');
            const index = parseInt(this.getAttribute('data-index'));
            
            const modal = document.getElementById('planDetailModal');
            const isMenuOpen = !modal.classList.contains('hidden');

            if (!isMenuOpen) {
                expandCards();
            }

            setTimeout(() => {
                focusCard(index);
            }, 15);

            if (typeof window.openPlanModal === 'function') {
                window.openPlanModal(planName);
            }
        });
    });

    // ---------- 点击背景透明处关闭 ----------
    if (modalOverlay) {
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                if (typeof window.closePlanModal === 'function') {
                    window.closePlanModal();
                }
                if (typeof window.closeBecomeFanModal === 'function') {
                    window.closeBecomeFanModal(e);
                }
            }
        });
    }
});
</script>
