<!-- 订阅卡片下拉组件（强制屏幕顶部居中） -->
<div id="becomeFanDropdown" class="hidden fixed top-[80px] left-1/2 -translate-x-1/2 z-[99999]">
    <!-- 👇 如果你能看到红色边框，说明已经出来了！ -->
    <div id="becomeFanCardWrapper" class="bg-black/80 backdrop-blur-xl border border-red-500/80 rounded-2xl shadow-2xl p-4 pt-3 pb-4 w-[320px] md:w-[360px]">
        <div class="fan-container flex justify-center items-center w-full relative">
            
            <!-- 卡片 1：微光 -->
            <div class="fan-card" style="--r:-14;">
                <div class="flex flex-col items-center justify-center gap-0">
                    <span class="text-2xl font-bold bg-gradient-to-b from-cyan-300 to-cyan-500 text-transparent bg-clip-text">¥15</span>
                    <span class="absolute bottom-2.5 text-[11px] text-gray-400/80 font-medium tracking-wide">微光</span>
                </div>
            </div>

            <!-- 卡片 2：星光 -->
            <div class="fan-card" style="--r:0;">
                <div class="flex flex-col items-center justify-center gap-0">
                    <span class="text-2xl font-bold bg-gradient-to-b from-yellow-300 to-yellow-500 text-transparent bg-clip-text">¥40</span>
                    <span class="absolute bottom-2.5 text-[11px] text-gray-400/80 font-medium tracking-wide">星光</span>
                </div>
            </div>

            <!-- 卡片 3：极光 -->
            <div class="fan-card" style="--r:14;">
                <div class="flex flex-col items-center justify-center gap-0">
                    <span class="text-2xl font-bold bg-gradient-to-b from-purple-400 to-purple-600 text-transparent bg-clip-text">¥310</span>
                    <span class="absolute bottom-2.5 text-[11px] text-gray-400/80 font-medium tracking-wide">极光</span>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
.fan-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 8px 0;
}
.fan-container .fan-card {
    position: relative;
    width: 100px;
    height: 130px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 -32px;
    transform: rotate(calc(var(--r) * 1deg));
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    cursor: pointer;
    z-index: 1;
}
.fan-container:hover .fan-card,
.fan-container:focus-within .fan-card {
    transform: rotate(0deg);
    margin: 0 6px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
}
@media (max-width: 600px) {
    #becomeFanCardWrapper {
        width: 280px !important;
        padding: 12px 8px 14px !important;
    }
    .fan-container .fan-card {
        width: 80px;
        height: 110px;
        margin: 0 -26px;
        border-radius: 14px;
    }
    .fan-container:hover .fan-card {
        margin: 0 4px;
    }
    .fan-card .text-2xl { font-size: 1.1rem; }
    .fan-card .text-[11px] { font-size: 9px; bottom: 2px !important; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    window.openBecomeFanModal = function() {
        console.log("🚀 已点击开发者按钮");
        const el = document.getElementById('becomeFanDropdown');
        if (!el) return;
        
        if (el.classList.contains('hidden')) {
            el.classList.remove('hidden');
            // 3秒后自动隐藏调试红框（如果你看到边框，说明生效了）
            setTimeout(() => {
                const wrapper = document.getElementById('becomeFanCardWrapper');
                if(wrapper) wrapper.style.borderColor = 'rgba(255,255,255,0.2)';
            }, 5000);

            setTimeout(() => { document.addEventListener('click', closeDropdownOutside); }, 10);
        } else {
            el.classList.add('hidden');
            document.removeEventListener('click', closeDropdownOutside);
        }
    };

    function closeDropdownOutside(e) {
        const el = document.getElementById('becomeFanDropdown');
        const btn = Array.from(document.querySelectorAll('.top-actions .top-btn'))
                          .find(el => el.innerText.trim() === '开发者');
        if (!el || el.classList.contains('hidden')) return;
        if (!el.contains(e.target) && !btn?.contains(e.target)) {
            el.classList.add('hidden');
            document.removeEventListener('click', closeDropdownOutside);
        }
    }
});
</script
