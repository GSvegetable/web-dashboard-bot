<!-- 点击切换版：左侧头像 + 右侧文字，点击时两者同时向右上飞出 -->
<style>
    .cards {
        perspective: 500px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 230px; /* 宽度稍微加宽一点，放得下左右元素 */
        height: 80px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: pointer;
        display: flex; /* 内部使用 flex 辅助定位 */
        align-items: center;
        padding: 0 20px;
        box-sizing: border-box;
    }

    /* 点击开启后的底座倾斜 */
    .card.is-active {
        transform: translateZ(10px) rotateX(8deg) rotateY(12deg);
    }

    /* ✅ 头像：放在最左侧，并具备独立 3D 能力 */
    .card-avatar {
        position: relative; /* 改为相对定位，让 flex 自动排版 */
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 20px;
        font-weight: bold;
        overflow: hidden;
        backdrop-filter: blur(6px);
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        pointer-events: none;
        flex-shrink: 0;
        
        /* ✅ 关键：开启头像的独立 3D 空间，与卡片解绑 */
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .card-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* ✅ 文字：放在右侧 */
    .card_title {
        color: #fff;
        position: relative; /* 改为相对定位 */
        margin-left: auto; /* 自动推至最右侧 */
        transform: translateY(0);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        font: 700 1.5rem monospace;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        backface-visibility: hidden;
        transform-style: preserve-3d;
    }

    /* ✅ 形态一：点击后，文字和头像同时向右上方飞出 */
    .card.is-active .card_title {
        transform: translateZ(350px) translateX(40px) translateY(-10px);
    }

    .card.is-active .card-avatar {
        transform: translateZ(350px) translateX(20px) translateY(-10px);
    }
</style>

<div class="cards">
    <figure class="card" id="toggleCard">
        <!-- ✅ 左侧头像占位 -->
        <div class="card-avatar">
            <!-- 你可以把这里换成真实的 img 标签 -->
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        
        <!-- ✅ 右侧文字 -->
        <figcaption class="card_title">3D Hover</figcaption>
    </figure>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const card = document.getElementById('toggleCard');
    
    card.addEventListener('click', function(e) {
        e.stopPropagation();
        this.classList.toggle('is-active');
    });

    document.addEventListener('click', function(e) {
        if (!card.contains(e.target) && card.classList.contains('is-active')) {
            card.classList.remove('is-active');
        }
    });
});
</script>
