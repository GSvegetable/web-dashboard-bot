<!-- 最终版：卡片固定姿态，文字极限夸张飞出 -->
<style>
    .cards {
        perspective: 500px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 240px;
        height: 80px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        will-change: transform;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: pointer;
    }

    /* ✅ 卡片姿态绝对固定，丝毫不改！ */
    .card:hover {
        transform: translateZ(10px) rotateX(8deg) rotateY(12deg);
    }

    .card_title {
        color: #fff;
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        font: 700 1.5rem monospace;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        backface-visibility: hidden;
        transform-style: preserve-3d;
    }

    /* ✅ 文字疯狂向前飞出 350px，并向右平移 30px */
    .card:hover .card_title {
        transform: translateY(-50%) translateZ(350px) translateX(30px);
    }

    /* ✅ 点击按下时：文字再往右上角大幅度冲一下 */
    .card:active .card_title {
        transform: translateY(-50%) translateZ(350px) translateX(40px) translateY(-10px);
    }
</style>

<div class="cards">
    <figure class="card">
        <figcaption class="card_title">3D Hover</figcaption>
    </figure>
</div>
