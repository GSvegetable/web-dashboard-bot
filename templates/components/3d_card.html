<!-- 最终版：点击不缩回，彻底消除回弹 -->
<style>
    .cards {
        perspective: 500px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 240px;
        height: 80px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        will-change: transform;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: pointer;
    }

    .card:hover {
        transform: translateZ(10px) rotateX(8deg) rotateY(12deg);
    }

    .card_title {
        color: #fff;
        position: absolute;
        top: 50%;
        right: 20px;
        /* 默认垂直居中 */
        transform: translateY(-50%);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        font: 700 1.5rem monospace;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        backface-visibility: hidden;
        transform-style: preserve-3d;
    }

    .card:hover .card_title {
        transform: translateY(-50%) translateZ(350px) translateX(30px);
    }
</style>

<div class="cards">
    <figure class="card" id="g3d-card">
        <figcaption class="card_title" id="g3d-title">3D Hover</figcaption>
    </figure>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const card = document.getElementById('g3d-card');
    const title = document.getElementById('g3d-title');
    if (!card || !title) return;

    let isPressed = false;

    // ✅ 鼠标按下：瞬间移动到指定位置
    card.addEventListener('mousedown', function() {
        isPressed = true;
        title.style.transition = 'transform 0.05s cubic-bezier(0.34, 1.56, 0.64, 1)';
        title.style.transform = 'translateY(-50%) translateZ(350px) translateX(40px) translateY(-10px)';
    });

    // ✅ 鼠标抬起：不做任何操作，留在原地（绝不回缩！）
    card.addEventListener('mouseup', function() {
        // 保持当前位置
    });

    // ✅ 鼠标移出卡片：优雅地退回到悬停位置
    card.addEventListener('mouseleave', function() {
        if (isPressed) {
            isPressed = false;
            // 恢复正常的过渡时间，让文字退回去的时候有丝滑感
            title.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            title.style.transform = 'translateY(-50%) translateZ(350px) translateX(30px)';
        }
    });

    // ✅ 触摸屏适配（同鼠标逻辑）
    card.addEventListener('touchstart', function() {
        isPressed = true;
        title.style.transition = 'transform 0.05s cubic-bezier(0.34, 1.56, 0.64, 1)';
        title.style.transform = 'translateY(-50%) translateZ(350px) translateX(40px) translateY(-10px)';
    }, { passive: true });

    card.addEventListener('touchend', function() {
        // 保持位置
    }, { passive: true });

    card.addEventListener('touchcancel', function() {
        isPressed = false;
        title.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        title.style.transform = 'translateY(-50%) translateZ(350px) translateX(30px)';
    }, { passive: true });
});
</script>
