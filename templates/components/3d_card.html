<!-- 暴力纠正版：强制开启 3D 渲染，并大幅拉出飞出距离 -->
<style>
    .cards {
        /* 视距拉近到 200px，让 3D 翻转极其明显 */
        perspective: 200px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 240px;
        height: 80px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        position: relative;
        /* ✅ 核心修复：强制开启 3D 渲染和 GPU 加速 */
        transform-style: preserve-3d;
        backface-visibility: hidden;
        will-change: transform;
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: pointer;
    }

    /* ✅ 测试方法：鼠标放上去，卡片瞬间爆红，并且明显往右前方用力弹出 */
    .card:hover {
        transform: translateZ(20px) rotateX(20deg) rotateY(25deg);
        /* 红色边框是为了让你 100% 确认悬停动作确实生效了！ */
        border: 2px solid #ff4444; 
        box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
    }

    .card_title {
        color: #fff;
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        font: 700 1.5rem monospace;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    /* ✅ 文字向外飞出的距离直接拉到 250px，必定飞出卡片边界 */
    .card:hover .card_title {
        transform: translateY(-50%) translateZ(250px);
    }
</style>

<div class="cards">
    <figure class="card">
        <figcaption class="card_title">3D Hover</figcaption>
    </figure>
</div>
