<!-- 原版 3D 悬浮卡片（横向长方形，玻璃质感，修复文字弹出） -->
<style>
    /* From Uiverse.io by Cornerstone-04 */ 
    .cards {
        perspective: 500px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 240px;
        height: 80px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        /* ✅ 修改点 1：圆角改为 16px，更符合玻璃边缘的质感 */
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
        transition: transform .5s;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* ✅ 完全保留原版的 3D 往右前方凸出动作 */
    .card:hover {
        transform: translateZ(10px) rotateX(20deg) rotateY(20deg);
    }

    .card_title {
        color: #fff;
        position: absolute;
        top: 50%;
        right: 20px;
        /* 初始状态：垂直居中 */
        transform: translateY(-50%);
        transition: transform .5s;
        font: 700 1.5rem monospace;
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000;
    }

    /* ✅ 修改点 2：修复文字飞出错误。先垂直居中，再往外冲 */
    .card:hover .card_title {
        transform: translateY(-50%) translateZ(50px);
    }
</style>

<!-- From Uiverse.io by Cornerstone-04 --> 
<div class="cards">
    <figure class="card">
        <figcaption class="card_title">3D Hover</figcaption>
    </figure>
</div>
