<!-- 纯触屏优化版：卡片固定不动，文字点击即走，绝不回缩 -->
<style>
    .cards {
        perspective: 500px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 240px;
        height: 80px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        /* 卡片本身的过渡完全保留，但不做翻转 */
        transition: box-shadow 0.2s ease;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: pointer;
    }

    /* ✅ 底下的卡片，在平板和鼠标下都绝对不动！ */
    .card:hover,
    .card:active {
        transform: none !important;
    }

    .card_title {
        color: #fff;
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        font: 700 1.5rem monospace;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        backface-visibility: hidden;
        transform-style: preserve-3d;
    }

    /* ✅ 电脑鼠标悬停时：文字依然大幅度飞出 350px */
    .card:hover .card_title {
        transform: translateY(-50%) translateZ(350px) translateX(30px);
    }

    /* ✅ 平板/手机点击时：更改缓动曲线，消除回缩，彻底钉在右上角 */
    .card:active .card_title {
        /* 换成平直的 ease 动画，绝不回弹！ */
        transition: transform 0.2s ease;
        transform: translateY(-50%) translateZ(350px) translateX(40px) translateY(-10px);
    }
</style>

<div class="cards">
    <figure class="card">
        <figcaption class="card_title">3D Hover</figcaption>
    </figure>
</div>
