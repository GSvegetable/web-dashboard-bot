<!-- 点击切换版：点击卡片开启，点击背景关闭 -->
<style>
    .cards {
        perspective: 500px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 240px;
        height: 80px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: pointer;
    }

    /* ✅ 形态一：点击卡片后的「开启状态」 */
    .card.is-active {
        transform: translateZ(10px) rotateX(8deg) rotateY(12deg);
    }

    .card_title {
        color: #fff;
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        font: 700 1.5rem monospace;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        backface-visibility: hidden;
        transform-style: preserve-3d;
        /* 默认位置 */
        transform: translateY(-50%);
    }

    /* ✅ 形态一：点击卡片后，文字飞向右上角并停住！ */
    .card.is-active .card_title {
        transform: translateY(-50%) translateZ(350px) translateX(40px) translateY(-10px);
    }
</style>

<div class="cards">
    <figure class="card" id="toggleCard">
        <figcaption class="card_title">3D Hover</figcaption>
    </figure>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const card = document.getElementById('toggleCard');
    
    // ✅ 点击卡片：切换开启状态
    card.addEventListener('click', function(e) {
        e.stopPropagation(); // 阻止点击冒泡到 document 触发关闭
        this.classList.toggle('is-active');
    });

    // ✅ 点击页面空白处：强制关闭卡片
    document.addEventListener('click', function(e) {
        // 如果点击的不是卡片本身，并且卡片正处于开启状态，就关闭它
        if (!card.contains(e.target) && card.classList.contains('is-active')) {
            card.classList.remove('is-active');
        }
    });
});
</script>
