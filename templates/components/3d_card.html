<!-- 左上角 3D 悬浮横向卡片组件（修正方向与巨大幅度） -->
<style>
    /* ✅ 修改1：加大透视深度，让角度更夸张 */
    .card-container-3d {
        perspective: 300px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    /* 卡片本体：横着的长方形 */
    .card-3d {
        width: 260px;
        height: 80px;
        background: rgba(22, 22, 29, 0.7);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 2px solid #555555;
        border-radius: 12px;
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding-left: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        cursor: pointer;
    }

    /* ✅ 修改2：方向改为往右前方大幅旋转 + 拉出 */
    .card-3d:hover {
        /* translateZ 拉得更多，rotateY 改为负数（往右凸出），角度拉到 30度 */
        transform: translateZ(40px) rotateX(10deg) rotateY(-30deg);
    }

    /* 标题文字样式 */
    .card-3d-title {
        color: #ffffff;
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        font: 700 1.2rem monospace;
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000;
    }

    /* ✅ 修改3：文字往右前方大幅度飞出 */
    .card-3d:hover .card-3d-title {
        transform: translateZ(90px) translateY(-50%);
    }
</style>

<!-- 外层包裹容器 -->
<div class="card-container-3d">
    <figure class="card-3d">
        <figcaption class="card-3d-title">宫水大世界</figcaption>
    </figure>
</div>
