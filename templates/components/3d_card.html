<!-- 原版 3D 悬浮卡片（一字不差搬过来） -->
<style>
    /* From Uiverse.io by Cornerstone-04 */ 
    .cards {
        perspective: 500px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 200px;
        height: 250px;
        background: #16161d;
        border: 2px solid #555555;
        border-radius: 4px;
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
        transition: transform .5s;
    }

    .card:hover {
        transform: translateZ(10px) rotateX(20deg) rotateY(20deg);
    }

    .card_title {
        color: #fff;
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        transition: transform .5s;
        font: 700 1.5rem monospace;
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000;
    }

    .card:hover .card_title {
        transform: translateZ(50px);
    }
</style>

<!-- From Uiverse.io by Cornerstone-04 --> 
<div class="cards">
    <figure class="card">
        <figcaption class="card_title">3D Hover</figcaption>
    </figure>
</div>
