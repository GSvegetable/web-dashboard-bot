<!-- 原版 3D 悬浮卡片（横向长方形，玻璃质感，猛烈向外飞出） -->
<style>
    /* ✅ 核心修改1：透视从 500px 拉到 220px，让 3D 空间视角更近、爆发力更强 */
    .cards {
        perspective: 220px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 240px;
        height: 80px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        /* ✅ 圆润边缘 */
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
        transition: transform .5s;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* 保持原有的右侧翻转角度，向外拉出强度略微增加 */
    .card:hover {
        transform: translateZ(15px) rotateX(20deg) rotateY(20deg);
    }

    .card_title {
        color: #fff;
        position: absolute;
        top: 50%;
        right: 20px;
        /* 保持垂直居中 */
        transform: translateY(-50%);
        transition: transform .5s;
        font: 700 1.5rem monospace;
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000;
    }

    /* ✅ 核心修改2：文字向外飞出的力度直接拉高到 180px，远超卡片自身厚度 */
    .card:hover .card_title {
        transform: translateY(-50%) translateZ(180px);
    }
</style>

<!-- From Uiverse.io by Cornerstone-04 --> 
<div class="cards">
    <figure class="card">
        <figcaption class="card_title">3D Hover</figcaption>
    </figure>
</div>
