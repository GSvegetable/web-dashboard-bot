{% if current_user.is_authenticated %}
<style>
    .cards {
        perspective: 500px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999;
        pointer-events: auto;
    }

    .card {
        width: 230px;
        height: 80px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 16px;
        position: relative;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: pointer;
        display: flex;
        align-items: center;
        padding: 0 16px;
        box-sizing: border-box;
        gap: 14px;
    }

    .card.is-active {
        transform: translateZ(10px) rotateX(8deg) rotateY(12deg);
    }

    .card-avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 24px;
        font-weight: bold;
        overflow: hidden;
        backdrop-filter: blur(6px);
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        pointer-events: none;
        flex-shrink: 0;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .card-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .card-text-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1;
        min-width: 0;
        pointer-events: none;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ✅ 核心修改：去掉了黑色描边，改为纯白色带极轻微底部透光 */
    .card-name {
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2); 
    }

    .card-id {
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .card.is-active .card-avatar {
        transform: translateZ(350px) translateX(20px) translateY(-8px);
    }
    .card.is-active .card-text-container {
        transform: translateZ(350px) translateX(40px) translateY(-8px);
    }
</style>

<div class="cards">
    <figure class="card" id="toggleCard">
        <div class="card-avatar">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="card-text-container">
            <div class="card-name">
                {{ current_user.first_name if current_user.first_name else (current_user.email.split('@')[0] if current_user.email else '某某某') }}
            </div>
            <div class="card-id">
                {{ current_user.display_id or '000000' }}
            </div>
        </div>
    </figure>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const card = document.getElementById('toggleCard');
    card.addEventListener('click', function(e) { e.stopPropagation(); this.classList.toggle('is-active'); });
    document.addEventListener('click', function(e) {
        if (!card.contains(e.target) && card.classList.contains('is-active')) {
            card.classList.remove('is-active');
        }
    });
});
</script>
{% endif %}
