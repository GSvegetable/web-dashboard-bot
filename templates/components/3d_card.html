<!-- 左上角 3D 悬浮横向卡片组件 -->
<style>
    /* 3D 视角容器 */
    .card-container-3d {
        perspective: 500px;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 9999; /* 保证在页面最上层 */
        pointer-events: auto;
    }

    /* 卡片本体：横着的长方形 */
    .card-3d {
        width: 260px;   /* 较长 */
        height: 80px;   /* 较扁，长方形 */
        background: rgba(22, 22, 29, 0.7);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 2px solid #555555;
        border-radius: 12px;
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding-left: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        cursor: pointer;
    }

    /* ✅ 修改1：加大空间拉伸力度，调整旋转方向 */
    .card-3d:hover {
        transform: translateZ(35px) rotateX(8deg) rotateY(15deg);
    }

    /* 标题文字样式 */
    .card-3d-title {
        color: #ffffff;
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        font: 700 1.2rem monospace;
        /* 给文字加上黑色描边，保证在任何背景上都清晰 */
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000;
    }

    /* ✅ 修改2：文字向外凸出的幅度明显加大 */
    .card-3d:hover .card-3d-title {
        transform: translateZ(80px);
    }
</style>

<!-- 外层包裹容器 -->
<div class="card-container-3d">
    <figure class="card-3d">
        <figcaption class="card-3d-title">宫水大世界</figcaption>
    </figure>
</div>
