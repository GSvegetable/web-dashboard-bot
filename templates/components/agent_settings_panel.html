                        </span>
                    </button>

                        <div class="model-option text-[13px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-4 py-2 cursor-pointer transition" data-model="deepseek-v4-pro">烧钱版</div>
                    </div>
                </div>

                <!-- 选项 2：深度思考（独占一行，拨动开关） -->
                <button class="think-toggle flex items-center justify-between w-full py-3 px-4 text-sm bg-[rgba(255,255,255,0.05)] border border-white/5 text-white/80 hover:bg-[rgba(255,255,255,0.1)] rounded-xl transition active:scale-95" data-mode="discussion">
                    <span>深度思考</span>
                    <span class="think-label text-[11px] px-3 py-1 bg-black/40 rounded-full border border-white/10">关闭</span>
                </button>

                <!-- 选项 3：联网搜索（独占一行，拨动开关） -->
                <button class="search-toggle flex items-center justify-between w-full py-3 px-4 text-sm bg-[rgba(255,255,255,0.05)] border border-white/5 text-white/80 hover:bg-[rgba(255,255,255,0.1)] rounded-xl transition active:scale-95" data-mode="discussion">
                    <span>联网搜索</span>
                    <span class="search-label text-[11px] px-3 py-1 bg-black/40 rounded-full border border-white/10">关闭</span>
                </button>

                <!-- 选项 4：思考强度（独占一行，下拉选项） -->
                <div class="relative block strength-selector w-full" data-mode="discussion">
                    <button class="strength-trigger flex items-center justify-between w-full py-3 px-4 text-sm bg-[rgba(255,255,255,0.05)] border border-white/5 text-white/80 hover:bg-[rgba(255,255,255,0.1)] rounded-xl transition active:scale-95">
                        <span>思考强度</span>
                        <span class="strength-label text-[11px] px-3 py-1 bg-black/40 rounded-full border border-white/10 flex items-center gap-1">
                            low
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
                        </span>
                    </button>
                    <div class="strength-menu hidden absolute top-full left-0 mt-2 w-full bg-black/80 backdrop-blur-md border border-white/10 rounded-xl p-2 z-50 shadow-xl">
                        <div class="strength-option text-[13px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-4 py-2 cursor-pointer transition" data-strength="low">低 (low)</div>
                        <div class="strength-option text-[13px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-4 py-2 cursor-pointer transition" data-strength="high">高 (high)</div>
                        <div class="strength-option text-[13px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-4 py-2 cursor-pointer transition" data-strength="max">极 (max)</div>
                    </div>
                </div>
            </div>

            <!-- 分类二：代理人模式设置（结构完全相同） -->
            <div class="bg-black/20 rounded-2xl p-6 border border-white/5 flex flex-col gap-4 w-full">
                
                <!-- 选项 1：模型切换 -->
                <div class="relative block model-selector w-full" data-mode="agent">
                    <button class="model-trigger flex items-center justify-between w-full py-3 px-4 text-sm bg-[rgba(255,255,255,0.05)] border border-white/5 text-white/80 hover:bg-[rgba(255,255,255,0.1)] rounded-xl transition active:scale-95">
                        <span>模型选择</span>
                        <span class="model-label text-[11px] px-3 py-1 bg-black/40 rounded-full border border-white/10 flex items-center gap-1">
                            deepseek-v4-flash
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
                        </span>
                    </button>
                    <div class="model-menu hidden absolute top-full left-0 mt-2 w-full bg-black/80 backdrop-blur-md border border-white/10 rounded-xl p-2 z-50 shadow-xl">
                        <div class="model-option text-[13px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-4 py-2 cursor-pointer transition" data-model="deepseek-v4-flash">省钱版</div>
                        <div class="model-option text-[13px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-4 py-2 cursor-pointer transition" data-model="deepseek-v4-pro">烧钱版</div>
                    </div>
                </div>

                <!-- 选项 2：深度思考 -->
                <button class="think-toggle flex items-center justify-between w-full py-3 px-4 text-sm bg-[rgba(255,255,255,0.05)] border border-white/5 text-white/80 hover:bg-[rgba(255,255,255,0.1)] rounded-xl transition active:scale-95" data-mode="agent">
                    <span>深度思考</span>
                    <span class="think-label text-[11px] px-3 py-1 bg-black/40 rounded-full border border-white/10">关闭</span>
                </button>

                <!-- 选项 3：联网搜索 -->
                <button class="search-toggle flex items-center justify-between w-full py-3 px-4 text-sm bg-[rgba(255,255,255,0.05)] border border-white/5 text-white/80 hover:bg-[rgba(255,255,255,0.1)] rounded-xl transition active:scale-95" data-mode="agent">
                    <span>联网搜索</span>
                    <span class="search-label text-[11px] px-3 py-1 bg-black/40 rounded-full border border-white/10">关闭</span>
                </button>

                <!-- 选项 4：思考强度 -->
                <div class="relative block strength-selector w-full" data-mode="agent">
                    <button class="strength-trigger flex items-center justify-between w-full py-3 px-4 text-sm bg-[rgba(255,255,255,0.05)] border border-white/5 text-white/80 hover:bg-[rgba(255,255,255,0.1)] rounded-xl transition active:scale-95">
                        <span>思考强度</span>
                        <span class="strength-label text-[11px] px-3 py-1 bg-black/40 rounded-full border border-white/10 flex items-center gap-1">
                            low
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
                        </span>
                    </button>
                    <div class="strength-menu hidden absolute top-full left-0 mt-2 w-full bg-black/80 backdrop-blur-md border border-white/10 rounded-xl p-2 z-50 shadow-xl">
                        <div class="strength-option text-[13px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-4 py-2 cursor-pointer transition" data-strength="low">低 (low)</div>
                        <div class="strength-option text-[13px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-4 py-2 cursor-pointer transition" data-strength="high">高 (high)</div>
                        <div class="strength-option text-[13px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-4 py-2 cursor-pointer transition" data-strength="max">极 (max)</div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- 控制面板的 JS 逻辑（已适配新 UI 结构） -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('agentSettingsPanel');
    const configKey = 'gsbot_agent_config';

    // 1. 默认配置
    const defaultConfig = {
        discussion: { model: 'deepseek-v4-flash', think: false, search: false, strength: 'low' },
        agent: { model: 'deepseek-v4-flash', think: false, search: false, strength: 'low' }
    };

    // 2. 获取/初始化配置
    let config = JSON.parse(localStorage.getItem(configKey));
    if (!config) {
        config = defaultConfig;
        localStorage.setItem(configKey, JSON.stringify(config));
    }

    // 3. 渲染配置到 UI
    function renderUI() {
        document.querySelectorAll('.model-selector').forEach(el => {
            const mode = el.dataset.mode;
            el.querySelector('.model-label').innerText = config[mode].model;
            // 如果是 Pro，强制关闭搜索按钮、切换强度并禁用 low
            if (config[mode].model === 'deepseek-v4-pro') {
                const searchBtn = el.closest('.bg-black/20').querySelector('.search-toggle');
                // 如果是 Pro 模型，搜索强制关闭
                config[mode].search = false;
                searchBtn.querySelector('.search-label').innerText = '不支持';
                searchBtn.classList.add('opacity-50', 'cursor-not-allowed');

                // Pro 模型不能选 low，自动切到 high
                if (config[mode].strength === 'low') {
                    config[mode].strength = 'high';
                }
                // 更新强度显示
                const strengthLabel = el.closest('.bg-black/20').querySelector('.strength-label');
                strengthLabel.innerText = config[mode].strength;
            } else {
                // 如果是 Flash 模型，恢复搜索按钮
                const searchBtn = el.closest('.bg-black/20').querySelector('.search-toggle');
                searchBtn.querySelector('.search-label').innerText = config[mode].search ? '开启' : '关闭';
                searchBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        document.querySelectorAll('.think-toggle').forEach(btn => {
            const mode = btn.dataset.mode;
            const isOn = config[mode].think;
            btn.querySelector('.think-label').innerText = isOn ? '开启' : '关闭';
        });

        document.querySelectorAll('.search-toggle').forEach(btn => {
            const mode = btn.dataset.mode;
            const isOn = config[mode].search;
            if (config[mode].model !== 'deepseek-v4-pro') {
                btn.querySelector('.search-label').innerText = isOn ? '开启' : '关闭';
            }
        });
        localStorage.setItem(configKey, JSON.stringify(config));
    }
    renderUI();

    // 4. 触发下拉菜单
    document.querySelectorAll('.model-trigger, .strength-trigger').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const parent = this.closest('.relative');
            const menu = parent.querySelector('.model-menu, .strength-menu');
            document.querySelectorAll('.model-menu, .strength-menu').forEach(m => { if (m !== menu) m.classList.add('hidden'); });
            menu.classList.toggle('hidden');
        });
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.relative')) {
            document.querySelectorAll('.model-menu, .strength-menu').forEach(m => m.classList.add('hidden'));
        }
    });

    // 5. 选项点击更新配置
    document.querySelectorAll('.model-option').forEach(opt => {
        opt.addEventListener('click', function() {
            const mode = this.closest('.model-selector').dataset.mode;
            const model = this.dataset.model;
            config[mode].model = model;
            renderUI();
            document.querySelectorAll('.model-menu').forEach(m => m.classList.add('hidden'));
            updateBackendConfig();
        });
    });

    document.querySelectorAll('.strength-option').forEach(opt => {
        opt.addEventListener('click', function() {
            const mode = this.closest('.strength-selector').dataset.mode;
            const strength = this.dataset.strength;
            config[mode].strength = strength;
            renderUI();
            document.querySelectorAll('.strength-menu').forEach(m => m.classList.add('hidden'));
            updateBackendConfig();
        });
    });

    // 6. 开关切换
    document.querySelectorAll('.think-toggle').forEach(btn => {
        btn.addEventListener('click', function() {
            const mode = this.dataset.mode;
            config[mode].think = !config[mode].think;
            renderUI();
            updateBackendConfig();
        });
    });

    document.querySelectorAll('.search-toggle').forEach(btn => {
        btn.addEventListener('click', function() {
            const mode = this.dataset.mode;
            if (config[mode].model === 'deepseek-v4-pro') return; // pro 不支持联网
            config[mode].search = !config[mode].search;
            renderUI();
            updateBackendConfig();
        });
    });

    // 7. 通知后端配置已变
    function updateBackendConfig() {
        window.currentAgentConfig = config;
        console.log("Agent 配置已更新:", config);
    }
    updateBackendConfig(); // 初始化时同步一次
});

// 打开/关闭面板
window.openAgentSettings = function() {
    const panel = document.getElementById('agentSettingsPanel');
    panel.classList.remove('translate-y-full');
};
window.closeAgentSettings = function() {
    const panel = document.getElementById('agentSettingsPanel');
    panel.classList.add('translate-y-full');
};
</script>
