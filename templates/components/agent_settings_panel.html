<!-- ⚡ 纯原版 CSS 动画逻辑（无任何参数改动，精准还原 Uiverse 效果） -->
<style>

        display: flex;
        position: relative;
        background: var(--bg);
        border-radius: 1rem;
        backdrop-filter: blur(12px);

    }
    .glass-radio-group-3 label:hover { color: white; }
    .glass-radio-group-3 input:checked + label { color: #fff; }

        position: absolute; top: 0; bottom: 0;

        border-radius: 1rem; z-index: 1;
        transition: transform 0.5s cubic-bezier(0.37, 1.95, 0.66, 0.56), background 0.4s ease-in-out, box-shadow 0.4s ease-in-out;

    #strength-flash-max:checked ~ .glass-glider-3,
    #strength-pro-max:checked ~ .glass-glider-3 { transform: translateX(200%); background: linear-gradient(135deg, #d0e7ff55, #a0d8ff); box-shadow: 0 0 18px rgba(160, 216, 255, 0.5), 0 0 10px rgba(200, 240, 255, 0.4) inset; }

    .glass-glider-2 {
        position: absolute; top: 0; bottom: 0;

    /* 2选项滑块状态 */
    #think-flash-off:checked ~ .glass-glider-2,
    #search-flash-off:checked ~ .glass-glider-2,
    #think-pro-off:checked ~ .glass-glider-2,
    #search-pro-off:checked ~ .glass-glider-2 { transform: translateX(0%); background: linear-gradient(135deg, #c0c0c055, #e0e0e0); box-shadow: 0 0 18px rgba(192, 192, 192, 0.5), 0 0 10px rgba(255, 255, 255, 0.4) inset; }

<!-- 🎯 弹出动画和关闭控制逻辑 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('agentSettingsPanel');
    const content = document.getElementById('settingsModalContent');

    window.openAgentSettings = function() {
        panel.classList.remove('hidden');
        requestAnimationFrame(() => {
            content.classList.remove('opacity-0', '-translate-y-[120%]');
            content.classList.add('opacity-100', 'translate-y-0');
        });
    };

    window.closeAgentSettings = function() {
        content.classList.remove('opacity-100', 'translate-y-0');
        content.classList.add('opacity-0', '-translate-y-[120%]');
        setTimeout(() => {
            panel.classList.add('hidden');
        }, 500);
    };
});
</script>
