<!-- Agent 独立配置面板（物理层面强制默认选中、映射逻辑直白不迷路） -->
<div id="agentSettingsPanel" class="fixed inset-0 z-[9999] hidden pointer-events-none flex items-center justify-center">
    <div class="absolute inset-0 bg-transparent pointer-events-auto" onclick="closeAgentSettings()"></div>

                            <input type="radio" name="think-flash" id="think-flash-on" />

                        <div class="glass-radio-group-2 flex-shrink-0 w-[138px]">
                            <!-- ✅ 物理默认选择：关闭 -->
                            <input type="radio" name="search-flash" id="search-flash-off" checked />
                            <label for="search-flash-off">关闭</label>
                            <input type="radio" name="search-flash" id="search-flash-on" />
                            <label for="search-flash-on">开启</label>
                            <div class="glass-glider-2"></div>
                        </div>
                    </div>
                    <div class="flex flex-row items-center justify-between w-full">
                        <span class="text-base font-medium text-white/80 flex-shrink-0 whitespace-nowrap">思考强度</span>
                        <div class="glass-radio-group-3 flex-shrink-0 w-[198px]">
                            <!-- ✅ 物理默认选择：低 -->
                            <input type="radio" name="strength-flash" id="strength-flash-low" checked />
                            <label for="strength-flash-low">低</label>
                            <input type="radio" name="strength-flash" id="strength-flash-mid" />
                            <label for="strength-flash-mid">高</label>
                            <input type="radio" name="strength-flash" id="strength-flash-max" />
                            <label for="strength-flash-max">最高</label>
                            <div class="glass-glider-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分类二：烧钱模型 -->
            <div class="w-full">
                <div class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md mb-5 whitespace-nowrap">gs-v2-pro</div>
                <div class="flex flex-col gap-4">
                    <div class="flex flex-row items-center justify-between w-full">
                        <span class="text-base font-medium text-white/80 flex-shrink-0 whitespace-nowrap">深度思考</span>
                        <div class="glass-radio-group-2 flex-shrink-0 w-[138px]">
                            <!-- ✅ 物理默认选择：关闭 -->
                            <input type="radio" name="think-pro" id="think-pro-off" checked />
                            <label for="think-pro-off">关闭</label>
                            <input type="radio" name="think-pro" id="think-pro-on" />
                            <label for="think-pro-on">开启</label>
                            <div class="glass-glider-2"></div>
                        </div>
                    </div>
                    <div class="flex flex-row items-center justify-between w-full">
                        <span class="text-base font-medium text-white/80 flex-shrink-0 whitespace-nowrap">联网搜索</span>
                        <div class="glass-radio-group-2 flex-shrink-0 w-[138px]">
                            <!-- ✅ 物理默认选择：关闭 -->
                            <input type="radio" name="search-pro" id="search-pro-off" checked />
                            <label for="search-pro-off">关闭</label>
                            <input type="radio" name="search-pro" id="search-pro-on" />
                            <label for="search-pro-on">开启</label>
                            <div class="glass-glider-2"></div>
                        </div>
                    </div>
                    <div class="flex flex-row items-center justify-between w-full">
                        <span class="text-base font-medium text-white/80 flex-shrink-0 whitespace-nowrap">思考强度</span>
                        <div class="glass-radio-group-2 flex-shrink-0 w-[138px]">
                            <!-- ✅ Pro 初始只能选 高 或 最高，物理默认选择：高 -->
                            <input type="radio" name="strength-pro" id="strength-pro-high" checked />
                            <label for="strength-pro-high">高</label>
                            <input type="radio" name="strength-pro" id="strength-pro-max" />
                            <label for="strength-pro-max">最高</label>
                            <div class="glass-glider-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* --- 3选项样式 --- */
    .glass-radio-group-3 {
        --bg: rgba(255, 255, 255, 0.06); --text: #e5e5e5;
        display: flex; position: relative; background: var(--bg); border-radius: 1rem;
        backdrop-filter: blur(12px);
        box-shadow: inset 1px 1px 4px rgba(255, 255, 255, 0.2), inset -1px -1px 6px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.15);
        overflow: hidden; flex-shrink: 0;
    }
    .glass-radio-group-3 input { display: none; }
    .glass-radio-group-3 label {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 0.6rem 0; font-size: 13px; cursor: pointer;
        font-weight: 600; letter-spacing: 0.3px; color: var(--text);
        position: relative; z-index: 2; transition: color 0.3s ease-in-out;
    }
    .glass-radio-group-3 label:hover { color: white; }
    .glass-radio-group-3 input:checked + label { color: #fff; }
    .glass-glider-3 {
        position: absolute; top: 0; bottom: 0; width: calc(100% / 3);
        border-radius: 1rem; z-index: 1;
        transition: transform 0.5s cubic-bezier(0.37, 1.95, 0.66, 0.56), background 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
    }
    /* 低：银色 */
    #strength-flash-low:checked ~ .glass-glider-3 { transform: translateX(0%); background: linear-gradient(135deg, #c0c0c055, #e0e0e0); box-shadow: 0 0 18px rgba(192, 192, 192, 0.5), 0 0 10px rgba(255, 255, 255, 0.4) inset; }
    /* 高：蓝色 */
    #strength-flash-mid:checked ~ .glass-glider-3 { transform: translateX(100%); background: linear-gradient(135deg, #d0e7ff55, #a0d8ff); box-shadow: 0 0 18px rgba(160, 216, 255, 0.5), 0 0 10px rgba(200, 240, 255, 0.4) inset; }
    /* 最高：金色 */
    #strength-flash-max:checked ~ .glass-glider-3 { transform: translateX(200%); background: linear-gradient(135deg, #ffd70055, #ffcc00); box-shadow: 0 0 18px rgba(255, 215, 0, 0.5), 0 0 10px rgba(255, 235, 150, 0.4) inset; }

    /* --- 2选项样式 --- */
    .glass-radio-group-2 {
        --bg: rgba(255, 255, 255, 0.06); --text: #e5e5e5;
        display: flex; position: relative; background: var(--bg); border-radius: 1rem;
        backdrop-filter: blur(12px);
        box-shadow: inset 1px 1px 4px rgba(255, 255, 255, 0.2), inset -1px -1px 6px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.15);
        overflow: hidden; flex-shrink: 0;
    }
    .glass-radio-group-2 input { display: none; }
    .glass-radio-group-2 label {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 0.6rem 0; font-size: 13px; cursor: pointer;
        font-weight: 600; letter-spacing: 0.3px; color: var(--text);
        position: relative; z-index: 2; transition: color 0.3s ease-in-out;
    }
    .glass-radio-group-2 label:hover { color: white; }
    .glass-radio-group-2 input:checked + label { color: #fff; }
    .glass-glider-2 {
        position: absolute; top: 0; bottom: 0; width: 50%;
        border-radius: 1rem; z-index: 1;
        transition: transform 0.5s cubic-bezier(0.37, 1.95, 0.66, 0.56), background 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
    }

    /* 所有的“关闭”：银灰色 */
    #think-flash-off:checked ~ .glass-glider-2,
    #search-flash-off:checked ~ .glass-glider-2,
    #think-pro-off:checked ~ .glass-glider-2,
    #search-pro-off:checked ~ .glass-glider-2 {
        transform: translateX(0%);
        background: linear-gradient(135deg, #c0c0c055, #e0e0e0);
        box-shadow: 0 0 18px rgba(192, 192, 192, 0.5), 0 0 10px rgba(255, 255, 255, 0.4) inset;
    }

    /* 所有的“开启”：金色 */
    #think-flash-on:checked ~ .glass-glider-2,
    #search-flash-on:checked ~ .glass-glider-2,
    #think-pro-on:checked ~ .glass-glider-2,
    #search-pro-on:checked ~ .glass-glider-2 {
        transform: translateX(100%);
        background: linear-gradient(135deg, #ffd70055, #ffcc00);
        box-shadow: 0 0 18px rgba(255, 215, 0, 0.5), 0 0 10px rgba(255, 235, 150, 0.4) inset;
    }

    /* Pro 的“高”：蓝色 */
    #strength-pro-high:checked ~ .glass-glider-2 {
        transform: translateX(0%);
        background: linear-gradient(135deg, #d0e7ff55, #a0d8ff);
        box-shadow: 0 0 18px rgba(160, 216, 255, 0.5), 0 0 10px rgba(200, 240, 255, 0.4) inset;
    }

    /* Pro 的“最高”：金色 */
    #strength-pro-max:checked ~ .glass-glider-2 {
        transform: translateX(100%);
        background: linear-gradient(135deg, #ffd70055, #ffcc00);
        box-shadow: 0 0 18px rgba(255, 215, 0, 0.5), 0 0 10px rgba(255, 235, 150, 0.4) inset;
    }
</style>

<!-- 🎯 绝对直白的默认状态同步逻辑 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('agentSettingsPanel');
    const configKey = 'gsbot_agent_config';

    // 1. 根据页面物理 checked 状态提取默认配置
    function getCurrentConfig() {
        return {
            discussion: { 
                model: 'deepseek-v4-flash', 
                think: document.getElementById('think-flash-on')?.checked || false, 
                search: document.getElementById('search-flash-on')?.checked || false, 
                strength: document.getElementById('strength-flash-low')?.checked ? 'low' : document.getElementById('strength-flash-mid')?.checked ? 'mid' : 'max'
            },
            agent: { 
                model: 'deepseek-v4-flash', 
                think: document.getElementById('think-pro-on')?.checked || false, 
                search: document.getElementById('search-pro-on')?.checked || false, 
                strength: document.getElementById('strength-pro-high')?.checked ? 'high' : 'max'
            }
        };
    }

    // 2. 同步最新配置到 localStorage
    function syncConfigToStorage() {
        const current = getCurrentConfig();
        localStorage.setItem(configKey, JSON.stringify(current));
        window.currentAgentConfig = current;
        console.log("Agent 配置同步:", current);
    }
    
    // 第一次加载时，不管 localStorage 里有什么，强制用物理层选中的状态刷新一遍
    syncConfigToStorage();

    // 3. 交互监听：每点一个选项，触发保存
    document.querySelectorAll('input[type="radio"]').forEach(input => {
        input.addEventListener('change', function() {
            syncConfigToStorage();
        });
    });

    // 4. 原有的下拉菜单展开交互
    document.querySelectorAll('.model-trigger, .strength-trigger').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const parent = this.closest('.relative');
            const menu = parent.querySelector('.model-menu, .strength-menu');
            document.querySelectorAll('.model-menu, .strength-menu').forEach(m => { if (m !== menu) m.classList.add('hidden'); });
            menu.classList.toggle('hidden');
        });
    });
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.relative')) {
            document.querySelectorAll('.model-menu, .strength-menu').forEach(m => m.classList.add('hidden'));
        }
    });

    // 5. 弹窗动画
    window.openAgentSettings = function() {
        panel.classList.remove('hidden');
        requestAnimationFrame(() => {
            document.getElementById('settingsModalContent').classList.remove('opacity-0', '-translate-y-[120%]');
            document.getElementById('settingsModalContent').classList.add('opacity-100', 'translate-y-0');
        });
    };
    window.closeAgentSettings = function() {
        document.getElementById('settingsModalContent').classList.remove('opacity-100', 'translate-y-0');
        document.getElementById('settingsModalContent').classList.add('opacity-0', '-translate-y-[120%]');
        setTimeout(() => { panel.classList.add('hidden'); }, 500);
    };
});
</script>
