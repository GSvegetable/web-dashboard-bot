<!-- Agent 独立配置面板（从底部弹起、不虚化） -->
<div id="agentSettingsPanel" class="fixed bottom-0 left-0 w-full z-[9999] pointer-events-none transition-transform duration-500 translate-y-full">
    <div class="relative w-full bg-white/10 backdrop-blur-md border-t border-white/20 rounded-t-3xl shadow-[0_-20px_40px_rgba(0,0,0,0.6)] p-6 pb-10 pointer-events-auto max-h-[90vh] overflow-y-auto">
        
        <!-- 左上角关闭按钮 -->
        <button onclick="closeAgentSettings()" class="absolute top-4 left-4 w-8 h-8 rounded-full bg-black/30 hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white transition border border-white/5">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <div class="mt-8 mb-4 text-center">
            <h2 class="text-white text-xl font-bold tracking-wide">⚙️ Agent 配置</h2>
        </div>

        <!-- 两个大标题分类 -->
        <div class="flex flex-col gap-6 mt-6">

            <!-- 分类一：讨论模式（省钱模型设置） -->
            <div class="bg-black/20 rounded-2xl p-4 border border-white/5">
                <div class="text-white font-medium text-sm mb-3 flex items-center gap-2">
                    <span class="text-[#F5E6CF]">💬</span> 讨论模式
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <!-- 1. 模型切换 -->
                    <div class="relative inline-block model-selector" data-mode="discussion">
                        <button class="model-trigger flex items-center gap-1 px-3 py-1.5 text-[11px] bg-[rgba(255,255,255,0.08)] border border-white/20 text-white/80 hover:bg-[rgba(255,255,255,0.15)] rounded-full transition active:scale-95 whitespace-nowrap">
                            <span class="model-label">deepseek-v4-flash</span>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                        <div class="model-menu hidden absolute bottom-full left-0 mb-1 bg-black/80 backdrop-blur-md border border-white/10 rounded-xl p-1 min-w-[150px] z-50 shadow-xl">
                            <div class="model-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-model="deepseek-v4-flash">🟢 省钱版</div>
                            <div class="model-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-model="deepseek-v4-pro">🔴 烧钱版</div>
                        </div>
                    </div>

                    <!-- 2. 深度思考 (开关) -->
                    <button class="think-toggle flex items-center gap-1 px-3 py-1.5 text-[11px] bg-[rgba(255,255,255,0.08)] border border-white/20 text-white/80 hover:bg-[rgba(255,255,255,0.15)] rounded-full transition active:scale-95" data-mode="discussion">
                        <span class="think-icon">🧠</span> <span class="think-label">关闭</span>
                    </button>

                    <!-- 3. 联网搜索 (开关) -->
                    <button class="search-toggle flex items-center gap-1 px-3 py-1.5 text-[11px] bg-[rgba(255,255,255,0.08)] border border-white/20 text-white/80 hover:bg-[rgba(255,255,255,0.15)] rounded-full transition active:scale-95" data-mode="discussion">
                        <span class="search-icon">🌐</span> <span class="search-label">关闭</span>
                    </button>

                    <!-- 4. 思考强度 -->
                    <div class="relative inline-block strength-selector" data-mode="discussion">
                        <button class="strength-trigger flex items-center gap-1 px-3 py-1.5 text-[11px] bg-[rgba(255,255,255,0.08)] border border-white/20 text-white/80 hover:bg-[rgba(255,255,255,0.15)] rounded-full transition active:scale-95 whitespace-nowrap">
                            <span class="strength-label">强度 low</span>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                        <div class="strength-menu hidden absolute bottom-full left-0 mb-1 bg-black/80 backdrop-blur-md border border-white/10 rounded-xl p-1 min-w-[100px] z-50 shadow-xl">
                            <div class="strength-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-strength="low">低 (low)</div>
                            <div class="strength-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-strength="high">高 (high)</div>
                            <div class="strength-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-strength="max">极 (max)</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分类二：代理人模式（烧钱模型设置） -->
            <div class="bg-black/20 rounded-2xl p-4 border border-white/5">
                <div class="text-white font-medium text-sm mb-3 flex items-center gap-2">
                    <span class="text-[#F5E6CF]">🤖</span> 代理人模式
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <!-- 1. 模型切换 -->
                    <div class="relative inline-block model-selector" data-mode="agent">
                        <button class="model-trigger flex items-center gap-1 px-3 py-1.5 text-[11px] bg-[rgba(255,255,255,0.08)] border border-white/20 text-white/80 hover:bg-[rgba(255,255,255,0.15)] rounded-full transition active:scale-95 whitespace-nowrap">
                            <span class="model-label">deepseek-v4-flash</span>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                        <div class="model-menu hidden absolute bottom-full left-0 mb-1 bg-black/80 backdrop-blur-md border border-white/10 rounded-xl p-1 min-w-[150px] z-50 shadow-xl">
                            <div class="model-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-model="deepseek-v4-flash">🟢 省钱版</div>
                            <div class="model-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-model="deepseek-v4-pro">🔴 烧钱版</div>
                        </div>
                    </div>

                    <!-- 2. 深度思考 (开关) -->
                    <button class="think-toggle flex items-center gap-1 px-3 py-1.5 text-[11px] bg-[rgba(255,255,255,0.08)] border border-white/20 text-white/80 hover:bg-[rgba(255,255,255,0.15)] rounded-full transition active:scale-95" data-mode="agent">
                        <span class="think-icon">🧠</span> <span class="think-label">关闭</span>
                    </button>

                    <!-- 3. 联网搜索 (开关) -->
                    <button class="search-toggle flex items-center gap-1 px-3 py-1.5 text-[11px] bg-[rgba(255,255,255,0.08)] border border-white/20 text-white/80 hover:bg-[rgba(255,255,255,0.15)] rounded-full transition active:scale-95" data-mode="agent">
                        <span class="search-icon">🌐</span> <span class="search-label">关闭</span>
                    </button>

                    <!-- 4. 思考强度 -->
                    <div class="relative inline-block strength-selector" data-mode="agent">
                        <button class="strength-trigger flex items-center gap-1 px-3 py-1.5 text-[11px] bg-[rgba(255,255,255,0.08)] border border-white/20 text-white/80 hover:bg-[rgba(255,255,255,0.15)] rounded-full transition active:scale-95 whitespace-nowrap">
                            <span class="strength-label">强度 low</span>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                        <div class="strength-menu hidden absolute bottom-full left-0 mb-1 bg-black/80 backdrop-blur-md border border-white/10 rounded-xl p-1 min-w-[100px] z-50 shadow-xl">
                            <div class="strength-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-strength="low">低 (low)</div>
                            <div class="strength-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-strength="high">高 (high)</div>
                            <div class="strength-option text-[11px] text-white/70 hover:text-white hover:bg-white/10 rounded-lg px-3 py-1.5 cursor-pointer transition" data-strength="max">极 (max)</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- 控制面板的 JS 逻辑 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('agentSettingsPanel');
    const configKey = 'gsbot_agent_config';

    // 1. 默认配置
    const defaultConfig = {
        discussion: { model: 'deepseek-v4-flash', think: false, search: false, strength: 'low' },
        agent: { model: 'deepseek-v4-flash', think: false, search: false, strength: 'low' }
    };

    // 2. 获取/初始化配置
    let config = JSON.parse(localStorage.getItem(configKey));
    if (!config) {
        config = defaultConfig;
        localStorage.setItem(configKey, JSON.stringify(config));
    }

    // 3. 渲染配置到 UI
    function renderUI() {
        document.querySelectorAll('.model-selector').forEach(el => {
            const mode = el.dataset.mode;
            el.querySelector('.model-label').innerText = config[mode].model;
            // 如果是 Pro，强制关闭搜索按钮、切换强度并禁用 low
            if (config[mode].model === 'deepseek-v4-pro') {
                const searchBtn = el.closest('.bg-black/20').querySelector('.search-toggle');
                // 如果是 Pro 模型，搜索强制关闭
                config[mode].search = false;
                searchBtn.querySelector('.search-label').innerText = '不支持';
                searchBtn.classList.add('opacity-50', 'cursor-not-allowed');

                // Pro 模型不能选 low，自动切到 high
                if (config[mode].strength === 'low') {
                    config[mode].strength = 'high';
                }
                // 更新强度显示
                const strengthLabel = el.closest('.bg-black/20').querySelector('.strength-label');
                strengthLabel.innerText = `强度 ${config[mode].strength}`;
            } else {
                // 如果是 Flash 模型，恢复搜索按钮
                const searchBtn = el.closest('.bg-black/20').querySelector('.search-toggle');
                searchBtn.querySelector('.search-label').innerText = config[mode].search ? '开启' : '关闭';
                searchBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        document.querySelectorAll('.think-toggle').forEach(btn => {
            const mode = btn.dataset.mode;
            const isOn = config[mode].think;
            btn.querySelector('.think-label').innerText = isOn ? '开启' : '关闭';
        });

        document.querySelectorAll('.search-toggle').forEach(btn => {
            const mode = btn.dataset.mode;
            const isOn = config[mode].search;
            if (config[mode].model !== 'deepseek-v4-pro') {
                btn.querySelector('.search-label').innerText = isOn ? '开启' : '关闭';
            }
        });
        localStorage.setItem(configKey, JSON.stringify(config));
    }
    renderUI();

    // 4. 触发下拉菜单
    document.querySelectorAll('.model-trigger, .strength-trigger').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const parent = this.closest('.relative');
            const menu = parent.querySelector('.model-menu, .strength-menu');
            document.querySelectorAll('.model-menu, .strength-menu').forEach(m => { if (m !== menu) m.classList.add('hidden'); });
            menu.classList.toggle('hidden');
        });
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.relative')) {
            document.querySelectorAll('.model-menu, .strength-menu').forEach(m => m.classList.add('hidden'));
        }
    });

    // 5. 选项点击更新配置
    document.querySelectorAll('.model-option').forEach(opt => {
        opt.addEventListener('click', function() {
            const mode = this.closest('.model-selector').dataset.mode;
            const model = this.dataset.model;
            config[mode].model = model;
            renderUI();
            document.querySelectorAll('.model-menu').forEach(m => m.classList.add('hidden'));
            updateBackendConfig();
        });
    });

    document.querySelectorAll('.strength-option').forEach(opt => {
        opt.addEventListener('click', function() {
            const mode = this.closest('.strength-selector').dataset.mode;
            const strength = this.dataset.strength;
            config[mode].strength = strength;
            renderUI();
            document.querySelectorAll('.strength-menu').forEach(m => m.classList.add('hidden'));
            updateBackendConfig();
        });
    });

    // 6. 开关切换
    document.querySelectorAll('.think-toggle').forEach(btn => {
        btn.addEventListener('click', function() {
            const mode = this.dataset.mode;
            config[mode].think = !config[mode].think;
            renderUI();
            updateBackendConfig();
        });
    });

    document.querySelectorAll('.search-toggle').forEach(btn => {
        btn.addEventListener('click', function() {
            const mode = this.dataset.mode;
            if (config[mode].model === 'deepseek-v4-pro') return; // pro 不支持联网
            config[mode].search = !config[mode].search;
            renderUI();
            updateBackendConfig();
        });
    });

    // 7. 通知后端配置已变
    function updateBackendConfig() {
        // 这里我们只是把最新配置挂载到 window 上，或者触发事件，供主面板读取
        window.currentAgentConfig = config;
        console.log("Agent 配置已更新:", config);
    }
    updateBackendConfig(); // 初始化时同步一次
});

// 打开/关闭面板
window.openAgentSettings = function() {
    const panel = document.getElementById('agentSettingsPanel');
    panel.classList.remove('translate-y-full');
};
window.closeAgentSettings = function() {
    const panel = document.getElementById('agentSettingsPanel');
    panel.classList.add('translate-y-full');
};
  </script>
