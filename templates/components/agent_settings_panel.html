<!-- Agent 独立配置面板（极简标题版） -->
<!-- 遮罩层：点击外部即可关闭 -->
<div id="agentSettingsPanel" class="fixed inset-0 z-[9999] hidden pointer-events-none">
    <div class="absolute inset-0 bg-transparent pointer-events-auto" onclick="closeAgentSettings()"></div>
    
    <!-- 主体弹窗：宽度与聊天面板对齐 -->
    <div class="relative w-[480px] max-w-[95%] bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.6)] p-8 pb-10 pointer-events-auto max-h-[85vh] overflow-y-auto flex flex-col gap-8 mx-auto mt-auto mb-0 translate-y-full transition-transform duration-500" id="settingsModalContent">
        
        <!-- 左上角：配置中心 -->
        <div class="flex justify-between items-start">
            <h1 class="text-white text-xl font-bold tracking-wide">配置中心</h1>
            <!-- 保留左上角的关闭 X 按钮 -->
            <button onclick="closeAgentSettings()" class="text-gray-400 hover:text-white transition">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <!-- 两大分类大标题 -->
        <div class="flex flex-col gap-8 mt-2">

            <!-- 分类一：省钱模型 -->
            <div class="w-full">
                <div class="text-5xl font-extrabold text-white tracking-tight drop-shadow-md mb-5">deepseek-v4-flash</div>
                
                <!-- 子标题预留位（等你设计开关） -->
                <div class="flex flex-col gap-4 pl-2 border-l-2 border-white/10">
                    <div class="text-base font-medium text-white/80">深度思考</div>
                    <div class="text-base font-medium text-white/80">联网搜索</div>
                    <div class="text-base font-medium text-white/80">思考强度</div>
                </div>
            </div>

            <!-- 分类二：烧钱模型 -->
            <div class="w-full">
                <div class="text-5xl font-extrabold text-white tracking-tight drop-shadow-md mb-5">deepseek-v4-pro</div>
                
                <!-- 子标题预留位（等你设计开关） -->
                <div class="flex flex-col gap-4 pl-2 border-l-2 border-white/10">
                    <div class="text-base font-medium text-white/80">深度思考</div>
                    <div class="text-base font-medium text-white/80">联网搜索</div>
                    <div class="text-base font-medium text-white/80">思考强度</div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- 简单的 JS 控制逻辑 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('agentSettingsPanel');
    const content = document.getElementById('settingsModalContent');

    // 打开面板
    window.openAgentSettings = function() {
        panel.classList.remove('hidden');
        // 触发从底部上浮的动画
        setTimeout(() => {
            content.classList.remove('translate-y-full');
        }, 10);
    };

    // 关闭面板
    window.closeAgentSettings = function() {
        // 先执行下沉动画
        content.classList.add('translate-y-full');
        setTimeout(() => {
            panel.classList.add('hidden');
        }, 500); // 等待动画结束再隐藏
    };
});
</script>
