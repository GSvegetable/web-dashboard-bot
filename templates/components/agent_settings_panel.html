<!-- Agent 独立配置面板（纯直降动画、居中、去叉号） -->
<div id="agentSettingsPanel" class="fixed inset-0 z-[9999] hidden pointer-events-none flex items-center justify-center">
    <!-- 遮罩层：透明背景，点击任何外部区域直接关闭 -->
    <div class="absolute inset-0 bg-transparent pointer-events-auto" onclick="closeAgentSettings()"></div>
    
    <!-- 主体弹窗：从顶部正上方飞速滑落至正中间 -->
    <div id="settingsModalContent" class="relative w-[480px] max-w-[95%] bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.6)] p-8 pb-10 pointer-events-auto max-h-[85vh] overflow-y-auto flex flex-col gap-8 transition-[transform,opacity] duration-500 ease-[cubic-bezier(0.25, 0.46, 0.45, 0.94)] will-change-transform opacity-0 -translate-y-[120%]">
        
        <!-- 左上角：配置中心 -->
        <div class="flex justify-between items-start">
            <h1 class="text-white text-xl font-bold tracking-wide">配置中心</h1>
            <!-- 去掉了叉号，只能点击外部关闭 -->
        </div>

        <!-- 两大分类大标题 -->
        <div class="flex flex-col gap-8 mt-2">

            <!-- 分类一：省钱模型 -->
            <div class="w-full">
                <div class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md mb-5 whitespace-nowrap">deepseek-v4-flash</div>
                
                <!-- 子标题 -->
                <div class="flex flex-col gap-4 pl-2 border-l-2 border-white/10">
                    <div class="text-base font-medium text-white/80">深度思考</div>
                    <div class="text-base font-medium text-white/80">联网搜索</div>
                    <div class="text-base font-medium text-white/80">思考强度</div>
                </div>
            </div>

            <!-- 分类二：烧钱模型 -->
            <div class="w-full">
                <div class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md mb-5 whitespace-nowrap">deepseek-v4-pro</div>
                
                <!-- 子标题 -->
                <div class="flex flex-col gap-4 pl-2 border-l-2 border-white/10">
                    <div class="text-base font-medium text-white/80">深度思考</div>
                    <div class="text-base font-medium text-white/80">联网搜索</div>
                    <div class="text-base font-medium text-white/80">思考强度</div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- 丝滑动画 JS 逻辑 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('agentSettingsPanel');
    const content = document.getElementById('settingsModalContent');

    // 打开面板：从上落到正中
    window.openAgentSettings = function() {
        panel.classList.remove('hidden');
        // 使用 requestAnimationFrame 强制浏览器在渲染前准备，绝不卡顿
        requestAnimationFrame(() => {
            content.classList.remove('opacity-0', '-translate-y-[120%]');
            content.classList.add('opacity-100', 'translate-y-0');
        });
    };

    // 关闭面板：收回顶部
    window.closeAgentSettings = function() {
        content.classList.remove('opacity-100', 'translate-y-0');
        content.classList.add('opacity-0', '-translate-y-[120%]');
        setTimeout(() => {
            panel.classList.add('hidden');
        }, 500); // 等待 500ms，等整个下落动画彻底播完再隐藏
    };
});
</script>
