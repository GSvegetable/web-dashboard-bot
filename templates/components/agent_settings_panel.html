    .glass-radio-group-2 {
        --bg: rgba(255, 255, 255, 0.06); --text: #e5e5e5;
        display: flex; position: relative; background: var(--bg); border-radius: 1rem;

<!-- 🎯 弹出动画与同步底层状态的 JS -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('agentSettingsPanel');
    const content = document.getElementById('settingsModalContent');

    window.openAgentSettings = function() {
        panel.classList.remove('hidden');
        requestAnimationFrame(() => {
            content.classList.remove('opacity-0', '-translate-y-[120%]');
            content.classList.add('opacity-100', 'translate-y-0');
        });
    };
    window.closeAgentSettings = function() {
        content.classList.remove('opacity-100', 'translate-y-0');
        content.classList.add('opacity-0', '-translate-y-[120%]');
        setTimeout(() => { panel.classList.add('hidden'); }, 500);
    };

    // ==========================================================
    // ✅ 核心修复：加载配置并同步底层 input 的 checked 状态
    // ==========================================================
    const configKey = 'gsbot_agent_config';
    let config = JSON.parse(localStorage.getItem(configKey));

    // 如果从未保存过，定义绝对默认值
    if (!config) {
        config = {
            discussion: { model: 'deepseek-v4-flash', think: false, search: false, strength: 'low' },
            agent: { model: 'deepseek-v4-flash', think: false, search: false, strength: 'high' } // pro 默认 high
        };
        localStorage.setItem(configKey, JSON.stringify(config));
    }

    // 渲染函数：更新文字 + 强制勾选对应的 input
    function renderUI() {
        // 1. 同步 深度思考 和 联网搜索 (2选项开关)
        document.querySelectorAll('.think-toggle, .search-toggle').forEach(btn => {
            const modeKey = (btn.classList.contains('think-toggle')) ? 'think' : 'search';
            const mode = btn.dataset.mode;
            const isOn = config[mode] && config[mode][modeKey];
            btn.querySelector('.think-label, .search-label').innerText = isOn ? '开启' : '关闭';
            
            // 强行勾选正确的 input
            const offRadio = btn.parentElement.querySelector('input[id$="-off"]');
            const onRadio = btn.parentElement.querySelector('input[id$="-on"]');
            if (offRadio && onRadio) {
                offRadio.checked = !isOn;
                onRadio.checked = isOn;
            }
        });

        // 2. 同步 思考强度 (2选或3选开关)
        document.querySelectorAll('.strength-selector').forEach(el => {
            const mode = el.dataset.mode;
            const val = config[mode] && config[mode].strength;
            if (val) {
                el.querySelector('.strength-label').innerText = val;
                const targetId = `strength-${mode}-${val}`;
                const targetRadio = document.getElementById(targetId);
                if (targetRadio) targetRadio.checked = true;
            }
        });
    }

    renderUI();

    // 每次点击选项时保存配置的联动逻辑
    // (原有的监听器逻辑不变，这里保留，略过... 实际已包含在之前的逻辑里)
});
</script>
