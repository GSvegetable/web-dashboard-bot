<!-- Agent 独立配置面板（严格修复默认状态与联动锁定） -->
<div id="agentSettingsPanel" class="fixed inset-0 z-[9999] hidden pointer-events-none flex items-center justify-center">
    <div class="absolute inset-0 bg-transparent pointer-events-auto" onclick="closeAgentSettings()"></div>
    
    <div id="settingsModalContent" class="relative w-[480px] max-w-[95%] bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.6)] p-8 pb-10 pointer-events-auto max-h-[85vh] overflow-y-auto flex flex-col gap-8 transition-[transform,opacity] duration-500 ease-[cubic-bezier(0.25, 0.46, 0.45, 0.94)] will-change-transform opacity-0 -translate-y-[120%]">
        
        <div class="flex justify-between items-start">
            <h1 class="text-white text-2xl font-bold tracking-wide">配置中心</h1>
        </div>

        <div class="flex flex-col gap-10 mt-1">

            <!-- 越狱设置 -->
            <div class="w-full">
                <div class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md mb-3 whitespace-nowrap">越狱设置</div>
                <div class="flex flex-col gap-4">
                    <div class="flex flex-row items-center justify-between w-full">
                        <span class="text-base font-medium text-white/80 flex-shrink-0 whitespace-nowrap">激进沙盒</span>
                        <div class="glass-radio-group-2 flex-shrink-0 w-[138px]" id="jailbreakFlashGroup">
                            <input type="radio" name="jailbreak-flash" id="jailbreak-flash-off" checked />
                            <label for="jailbreak-flash-off">关闭</label>
                            <input type="radio" name="jailbreak-flash" id="jailbreak-flash-on" />
                            <label for="jailbreak-flash-on">开启</label>
                            <div class="glass-glider-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分类一：省钱模型 -->
            <div class="w-full">
                <div class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md mb-3 whitespace-nowrap">gs-v2.5-flash</div>
                
                <div class="flex flex-row w-full mt-2 gap-6">
                    
                    <!-- 左侧 Uiverse 小标题列表（3选项） -->
                    <div class="radio-container-sub flex-shrink-0 w-[130px]" style="--total-radio: 3;">
                        <input type="radio" name="sub-header-flash" id="sub-think-flash" />
                        <label for="sub-think-flash">深度思考</label>
                        
                        <input type="radio" name="sub-header-flash" id="sub-search-flash" />
                        <label for="sub-search-flash">联网搜索</label>
                        
                        <input type="radio" name="sub-header-flash" id="sub-strength-flash" />
                        <label for="sub-strength-flash">思考强度</label>

                        <div class="glider-container"><div class="glider"></div></div>
                    </div>

                    <!-- 右侧：原按钮垂直排列 -->
                    <div class="flex flex-col flex-1 gap-3 justify-between pt-1">
                        <div class="flex flex-row items-center justify-end w-full">
                            <div class="glass-radio-group-2 flex-shrink-0 w-[138px]" id="thinkFlashGroup">
                                <input type="radio" name="think-flash" id="think-flash-off" />
                                <label for="think-flash-off">关闭</label>
                                <input type="radio" name="think-flash" id="think-flash-on" checked />
                                <label for="think-flash-on">开启</label>
                                <div class="glass-glider-2"></div>
                            </div>
                        </div>
                        
                        <div class="flex flex-row items-center justify-end w-full">
                            <div class="glass-radio-group-2 flex-shrink-0 w-[138px]">
                                <input type="radio" name="search-flash" id="search-flash-off" checked />
                                <label for="search-flash-off">关闭</label>
                                <input type="radio" name="search-flash" id="search-flash-on" />
                                <label for="search-flash-on">开启</label>
                                <div class="glass-glider-2"></div>
                            </div>
                        </div>

                        <div class="flex flex-row items-center justify-end w-full">
                            <div class="glass-radio-group-3 flex-shrink-0 w-[198px]">
                                <input type="radio" name="strength-flash" id="strength-flash-low" checked />
                                <label for="strength-flash-low">低</label>
                                <input type="radio" name="strength-flash" id="strength-flash-mid" />
                                <label for="strength-flash-mid">高</label>
                                <input type="radio" name="strength-flash" id="strength-flash-max" />
                                <label for="strength-flash-max">最高</label>
                                <div class="glass-glider-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分类二：烧钱模型 -->
            <div class="w-full">
                <div class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md mb-3 whitespace-nowrap">gs-v2-pro</div>
                
                <div class="flex flex-row w-full mt-2 gap-6">
                    
                    <!-- 左侧 2 选项小标题 -->
                    <div class="radio-container-sub flex-shrink-0 w-[130px]" style="--total-radio: 2;">
                        <input type="radio" name="sub-header-pro" id="sub-think-pro" />
                        <label for="sub-think-pro">深度思考</label>
                        
                        <input type="radio" name="sub-header-pro" id="sub-strength-pro" />
                        <label for="sub-strength-pro">思考强度</label>

                        <div class="glider-container"><div class="glider"></div></div>
                    </div>

                    <div class="flex flex-col flex-1 gap-3 justify-between pt-1">
                        <div class="flex flex-row items-center justify-end w-full">
                            <div class="glass-radio-group-2 flex-shrink-0 w-[138px]" id="thinkProGroup">
                                <input type="radio" name="think-pro" id="think-pro-off" />
                                <label for="think-pro-off">关闭</label>
                                <input type="radio" name="think-pro" id="think-pro-on" checked />
                                <label for="think-pro-on">开启</label>
                                <div class="glass-glider-2"></div>
                            </div>
                        </div>

                        <div class="flex flex-row items-center justify-end w-full">
                            <!-- ✨ 修复：添加默认 checked，强制高亮“高” -->
                            <div class="glass-radio-group-2 flex-shrink-0 w-[138px]">
                                <input type="radio" name="strength-pro" id="strength-pro-high" checked />
                                <label for="strength-pro-high">高</label>
                                <input type="radio" name="strength-pro" id="strength-pro-max" />
                                <label for="strength-pro-max">最高</label>
                                <div class="glass-glider-2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
    /* ========== 原有玻璃质感按钮样式 ========== */
    .glass-radio-group-3 {
        --bg: rgba(255, 255, 255, 0.06); --text: #e5e5e5;
        display: flex; position: relative; background: var(--bg); border-radius: 1rem;
        backdrop-filter: blur(12px);
        box-shadow: inset 1px 1px 4px rgba(255, 255, 255, 0.2), inset -1px -1px 6px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.15);
        overflow: hidden; flex-shrink: 0;
    }
    .glass-radio-group-3 input { display: none; }
    .glass-radio-group-3 label {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 0.6rem 0; font-size: 13px; cursor: pointer;
        font-weight: 600; letter-spacing: 0.3px; color: var(--text);
        position: relative; z-index: 2; transition: color 0.3s ease-in-out;
    }
    .glass-radio-group-3 label:hover { color: white; }
    .glass-radio-group-3 input:checked + label { color: #fff; }
    .glass-glider-3 {
        position: absolute; top: 0; bottom: 0; width: calc(100% / 3);
        border-radius: 1rem; z-index: 1;
        transition: transform 0.5s cubic-bezier(0.37, 1.95, 0.66, 0.56), background 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
    }
    #strength-flash-low:checked ~ .glass-glider-3 { transform: translateX(0%); background: linear-gradient(135deg, #c0c0c055, #e0e0e0); box-shadow: 0 0 18px rgba(192, 192, 192, 0.5), 0 0 10px rgba(255, 255, 255, 0.4) inset; }
    #strength-flash-mid:checked ~ .glass-glider-3 { transform: translateX(100%); background: linear-gradient(135deg, #d0e7ff55, #a0d8ff); box-shadow: 0 0 18px rgba(160, 216, 255, 0.5), 0 0 10px rgba(200, 240, 255, 0.4) inset; }
    #strength-flash-max:checked ~ .glass-glider-3 { transform: translateX(200%); background: linear-gradient(135deg, #ffd70055, #ffcc00); box-shadow: 0 0 18px rgba(255, 215, 0, 0.5), 0 0 10px rgba(255, 235, 150, 0.4) inset; }

    .glass-radio-group-2 {
        --bg: rgba(255, 255, 255, 0.06); --text: #e5e5e5;
        display: flex; position: relative; background: var(--bg); border-radius: 1rem;
        backdrop-filter: blur(12px);
        box-shadow: inset 1px 1px 4px rgba(255, 255, 255, 0.2), inset -1px -1px 6px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.15);
        overflow: hidden; flex-shrink: 0;
    }
    .glass-radio-group-2 input { display: none; }
    .glass-radio-group-2 label {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 0.6rem 0; font-size: 13px; cursor: pointer;
        font-weight: 600; letter-spacing: 0.3px; color: var(--text);
        position: relative; z-index: 2; transition: color 0.3s ease-in-out;
    }
    .glass-radio-group-2 label:hover { color: white; }
    .glass-radio-group-2 input:checked + label { color: #fff; }
    .glass-glider-2 {
        position: absolute; top: 0; bottom: 0; width: 50%;
        border-radius: 1rem; z-index: 1;
        transition: transform 0.5s cubic-bezier(0.37, 1.95, 0.66, 0.56), background 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
    }
    
    #think-flash-off:checked ~ .glass-glider-2, #search-flash-off:checked ~ .glass-glider-2,
    #think-pro-off:checked ~ .glass-glider-2, #jailbreak-flash-off:checked ~ .glass-glider-2 {
        transform: translateX(0%); background: linear-gradient(135deg, #c0c0c055, #e0e0e0); box-shadow: 0 0 18px rgba(192, 192, 192, 0.5), 0 0 10px rgba(255, 255, 255, 0.4) inset;
    }
    #think-flash-on:checked ~ .glass-glider-2, #search-flash-on:checked ~ .glass-glider-2,
    #think-pro-on:checked ~ .glass-glider-2, #jailbreak-flash-on:checked ~ .glass-glider-2 {
        transform: translateX(100%); background: linear-gradient(135deg, #ffd70055, #ffcc00); box-shadow: 0 0 18px rgba(255, 215, 0, 0.5), 0 0 10px rgba(255, 235, 150, 0.4) inset;
    }
    #strength-pro-high:checked ~ .glass-glider-2 { transform: translateX(0%); background: linear-gradient(135deg, #d0e7ff55, #a0d8ff); box-shadow: 0 0 18px rgba(160, 216, 255, 0.5), 0 0 10px rgba(200, 240, 255, 0.4) inset; }
    #strength-pro-max:checked ~ .glass-glider-2 { transform: translateX(100%); background: linear-gradient(135deg, #ffd70055, #ffcc00); box-shadow: 0 0 18px rgba(255, 215, 0, 0.5), 0 0 10px rgba(255, 235, 150, 0.4) inset; }

    /* ========== Uiverse 小标题垂直滑块样式 ========== */
    .radio-container-sub {
        --main-color: #f7e479;
        --main-color-opacity: #f7e4791c;
        display: flex;
        flex-direction: column;
        position: relative;
        padding-left: 0.5rem;
        gap: 14px;
        padding-top: 6px;
    }
    .radio-container-sub input { display: none; }
    .radio-container-sub label {
        cursor: pointer;
        padding: 0;
        position: relative;
        color: rgba(255, 255, 255, 0.5);
        font-size: 1rem;
        font-weight: 500;
        transition: color 0.3s ease-in-out;
        height: 32px;
        display: flex;
        align-items: center;
        white-space: nowrap;
    }
    .radio-container-sub input:checked + label {
        color: var(--main-color);
    }
    .radio-container-sub .glider-container {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.15);
        width: 1px;
        height: 100%;
    }
    .radio-container-sub .glider-container .glider {
        position: relative;
        height: calc(100% / var(--total-radio));
        width: 100%;
        background: linear-gradient(
            0deg,
            rgba(0, 0, 0, 0) 0%,
            var(--main-color) 50%,
            rgba(0, 0, 0, 0) 100%
        );
        transition: transform 0.5s cubic-bezier(0.37, 1.95, 0.66, 0.56);
    }
    .radio-container-sub .glider-container .glider::before {
        content: "";
        position: absolute;
        height: 60%;
        width: 300%;
        top: 50%;
        transform: translateY(-50%);
        background: var(--main-color);
        filter: blur(10px);
    }
    .radio-container-sub .glider-container .glider::after {
        content: "";
        position: absolute;
        left: 0;
        height: 100%;
        width: 150px;
        background: linear-gradient(
            90deg,
            var(--main-color-opacity) 0%,
            rgba(0, 0, 0, 0) 100%
        );
    }

    /* 驱动 3 选项滑块移动 */
    #sub-think-flash:checked ~ .glider-container .glider { transform: translateY(0); }
    #sub-search-flash:checked ~ .glider-container .glider { transform: translateY(100%); }
    #sub-strength-flash:checked ~ .glider-container .glider { transform: translateY(200%); }

    /* 驱动 2 选项滑块移动 */
    #sub-think-pro:checked ~ .glider-container .glider { transform: translateY(0); }
    #sub-strength-pro:checked ~ .glider-container .glider { transform: translateY(100%); }

    /* 摇头动画（用于深度思考锁定） */
    @keyframes shakeToggle { 0% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } 100% { transform: translateX(0); } }
    .shake-toggle { animation: shakeToggle 0.4s ease-in-out 2; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('agentSettingsPanel');
    const content = document.getElementById('settingsModalContent');
    const configKey = 'gsbot_agent_config';

    let config = JSON.parse(localStorage.getItem(configKey));
    if (!config) {
        config = { 
            discussion: { think: true, search: false, strength: 'low', jailbreak: false }, 
            agent: { think: true, search: false, strength: 'low' } 
        };
        localStorage.setItem(configKey, JSON.stringify(config));
    } else {
        if (!config.discussion) config.discussion = {};
        if (!config.agent) config.agent = {};
        config.discussion.think = true;
        config.agent.think = true;
        if (typeof config.discussion.search !== 'boolean') config.discussion.search = false;
        if (typeof config.agent.search !== 'boolean') config.agent.search = false;
        if (typeof config.discussion.jailbreak !== 'boolean') config.discussion.jailbreak = false;
        if (!config.discussion.strength) config.discussion.strength = 'low';
        if (!config.agent.strength) config.agent.strength = 'low';
    }

    function setupThinkLock() {
        const flashGroup = document.getElementById('thinkFlashGroup');
        const proGroup = document.getElementById('thinkProGroup');
        [flashGroup, proGroup].forEach((group) => {
            if (!group) return;
            const offRadio = group.querySelector('input[id$="-off"]');
            const onRadio = group.querySelector('input[id$="-on"]');
            onRadio.checked = true;
            offRadio.addEventListener('click', function(e) {
                group.classList.add('shake-toggle');
                setTimeout(() => { group.classList.remove('shake-toggle'); }, 500);
                onRadio.checked = true;
                e.preventDefault();
                e.stopPropagation();
            });
        });
    }

    function applyStoredConfig() {
        document.getElementById('think-flash-on').checked = true;
        document.getElementById('think-pro-on').checked = true;
        document.getElementById('search-flash-off').checked = !config.discussion.search;
        document.getElementById('search-flash-on').checked = config.discussion.search;
        document.getElementById('search-pro-off').checked = !config.agent.search;
        document.getElementById('search-pro-on').checked = config.agent.search;
        document.getElementById('jailbreak-flash-off').checked = !config.discussion.jailbreak;
        document.getElementById('jailbreak-flash-on').checked = config.discussion.jailbreak;

        document.getElementById('strength-flash-low').checked = config.discussion.strength === 'low';
        document.getElementById('strength-flash-mid').checked = config.discussion.strength === 'mid';
        document.getElementById('strength-flash-max').checked = config.discussion.strength === 'max';

        // ✨ 修复：除非配置文件里的 state 是 'max'，否则一律强制默认高亮为“高”
        document.getElementById('strength-pro-high').checked = config.agent.strength !== 'max';
        document.getElementById('strength-pro-max').checked = config.agent.strength === 'max';

        syncLeftUI('discussion');
        syncLeftUI('agent');
    }

    function syncLeftUI(mode) {
        const prefix = mode === 'discussion' ? 'flash' : 'pro';
        const cfg = config[mode];
        if (!cfg) return;
        
        const thinkId = `sub-think-${prefix}`;
        const searchId = `sub-search-${prefix}`;
        const strengthId = `sub-strength-${prefix}`;

        if (cfg.search === true) {
            document.getElementById(searchId).checked = true;
        } 
        else if (cfg.strength && cfg.strength !== 'low') {
            document.getElementById(strengthId).checked = true;
        } 
        else {
            document.getElementById(thinkId).checked = true;
        }
    }

    function bindEvents() {
        document.querySelectorAll('input[type="radio"]').forEach(input => {
            input.addEventListener('change', function() {
                const name = this.name;
                const value = this.id;
                let mode = 'discussion';
                let key = null;
                let val = null;

                if (name.startsWith('think-')) { key = 'think'; val = value.endsWith('-on'); }
                else if (name.startsWith('search-')) { key = 'search'; val = value.endsWith('-on'); }
                else if (name.startsWith('jailbreak-')) { key = 'jailbreak'; val = value.endsWith('-on'); }
                else if (name.startsWith('strength-')) { key = 'strength'; val = value.replace('strength-', '').replace('flash-', '').replace('pro-', ''); }

                if (name.includes('-flash')) mode = 'discussion';
                else if (name.includes('-pro')) mode = 'agent';

                if (mode && key && val !== null) {
                    config[mode][key] = val;
                    localStorage.setItem(configKey, JSON.stringify(config));
                    window.currentAgentConfig = config;
                    syncLeftUI(mode);
                }
            });
        });
    }

    window.openAgentSettings = function() {
        config = JSON.parse(localStorage.getItem(configKey));
        if (!config) config = { discussion: { think: true, search: false, strength: 'low', jailbreak: false }, agent: { think: true, search: false, strength: 'low' } };
        window.currentAgentConfig = config;
        applyStoredConfig();
        setupThinkLock();

        panel.classList.remove('hidden');
        requestAnimationFrame(() => {
            content.classList.remove('opacity-0', '-translate-y-[120%]');
            content.classList.add('opacity-100', 'translate-y-0');
        });
    };

    window.closeAgentSettings = function() {
        content.classList.remove('opacity-100', 'translate-y-0');
        content.classList.add('opacity-0', '-translate-y-[120%]');
        setTimeout(() => { panel.classList.add('hidden'); }, 500);
    };

    bindEvents();
});
</script>
