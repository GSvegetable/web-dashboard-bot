                        </div>
                    </div>
                    <!-- 右侧：权益列表 -->
                    <div class="flex-1 border-t sm:border-t-0 sm:border-l border-white/10 pt-4 sm:pt-0 sm:pl-6">
                        <ul class="grid grid-cols-1 gap-y-2 text-xs text-gray-300">
                            <li class="flex items-start gap-2">
                                <span class="text-blue-400 mt-[1px]">•</span> 每月15元基础对话额度
                            </li>
                            <li class="flex items-start gap-2">
                                <span class="text-blue-400 mt-[1px]">•</span> 标准接口响应速率
                            </li>
                            <li class="flex items-start gap-2">
                                <span class="text-blue-400 mt-[1px]">•</span> 7天日志历史记录
                            </li>
                            <li class="flex items-start gap-2">

                            </li>
                        </ul>
                    </div>
                </div>

                <!-- 方案二：40元/月 -->
                <div class="flex flex-col sm:flex-row gap-6 p-5 bg-white/5 border border-white/10 rounded-2xl backdrop-blur-sm hover:bg-white/10 transition duration-200 relative ring-1 ring-purple-500/30">
                    <div class="absolute -top-2 right-5 bg-purple-500/20 text-purple-300 text-[9px] px-2 py-0.5 rounded-full border border-purple-500/30">推荐</div>
                    
                    <!-- 左侧：名称和价格 -->
                    <div class="sm:w-[120px] flex flex-col justify-between flex-shrink-0">
                        <div>
                            <h3 class="text-purple-400 font-semibold text-lg">专业版</h3>
                            <p class="text-gray-400 text-[10px] leading-snug mt-1">适用于专业开发<br>和高级工作负载。</p>

                        <div class="mt-2 sm:mt-0">

                        </div>
                    </div>
                    <!-- 右侧：权益列表 -->
                    <div class="flex-1 border-t sm:border-t-0 sm:border-l border-white/10 pt-4 sm:pt-0 sm:pl-6">
                        <ul class="grid grid-cols-1 gap-y-2 text-xs text-gray-300">

                            <li class="flex items-start gap-2">

                            <li class="flex items-start gap-2">

                </div>

            </div>

            <!-- 底部联合行动按钮 -->
            <div class="mt-6 w-full">
                <button class="w-full py-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-white text-sm font-medium transition active:scale-95">
                    立即订阅
                </button>
            </div>

        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 打开卡片的方法
    window.openSubscribeModal = function() {
        // 如果音乐卡片开着，先关掉它
        const musicModal = document.getElementById('musicModal');
        if (musicModal && musicModal.classList.contains('active')) window.closeMusicModal();
        
        const modal = document.getElementById('subscribeModal');
        if (!modal) return;
        modal.classList.add('active');
        
        // 入场动画（GSAP）
        const wrapper = document.getElementById('subscribeCardWrapper');
        if (typeof gsap !== 'undefined' && wrapper) {
            gsap.fromTo(wrapper, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" });
        }
    };

    // 关闭卡片的方法
    window.closeSubscribeModal = function() {
        const modal = document.getElementById('subscribeModal');
        if (!modal) return;
        
        const wrapper = document.getElementById('subscribeCardWrapper');
        if (typeof gsap !== 'undefined' && wrapper) {
            gsap.to(wrapper, { 
                y: 30, opacity: 0, duration: 0.2, ease: "power1.in",
                onComplete: () => { modal.classList.remove('active'); }
            });
        } else {
            modal.classList.remove('active');
        }
    };

    // 阻止点击模态框背景层时关闭卡片（可以点背景关闭，类似于 auth_card 的逻辑，但此处按你习惯保留关闭能力）
    // 如果点击的是 modal-box 内部，不触发关闭。
    const modalBox = document.querySelector('#subscribeModal .modal-box');
    if (modalBox) {
        modalBox.addEventListener('click', function(e) {
            e.stopPropagation();
        });
    }
    const modalOverlay = document.getElementById('subscribeModal');
    if (modalOverlay) {
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                closeSubscribeModal();
            }
        });
    }
});
</script>
