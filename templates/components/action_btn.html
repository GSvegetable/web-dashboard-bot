<!-- 极光炫彩渐变按钮组件（垂直布局，开发作品 + 终端） -->
<style>
  .action-flex {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 100%;
  }
  .outer-cont {
    padding: 12px 0;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    position: relative;
    background: linear-gradient(90deg, rgba(147, 150, 95, 0.8), rgba(73, 63, 54, 0.8), rgba(245, 230, 207, 0.8));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 12px;
    color: #fff;
    transition: all 0.3s ease;
    box-shadow:
      inset 0px 0px 5px rgba(255, 255, 255, 0.6),
      inset 0px 35px 30px rgba(0, 0, 0, 0.8),
      0px 5px 10px rgba(0, 0, 0, 0.7);
    text-shadow: 1px 1px 1px #000;
    pointer-events: auto !important;
    width: 100%;
  }
  .outer-cont::before {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 12px;
    filter: blur(0);
    z-index: -1;
    box-shadow: none;
    background: conic-gradient(
      rgba(0,0,0,0) 80deg,
      #93965F,
      #493F36,
      #F5E6CF,
      rgba(0,0,0,0) 280deg
    );
    transition: all 0.3s ease;
  }
  .outer-cont:hover::before {
    filter: blur(15px);
  }
  .outer-cont:active::before {
    filter: blur(5px);
    transform: translateY(1px);
  }
  .outer-cont:active {
    box-shadow:
      inset 0px 0px 5px rgba(255, 255, 255, 0.6),
      inset 0px 35px 30px rgba(0, 0, 0, 0.8);
    margin-top: 3px;
  }
</style>

<!-- 外层容器：改为垂直布局 flex-col，让按钮上下排布 -->
<div class="flex flex-col items-center gap-[14px] w-full max-w-[240px]">
  
  <!-- 按钮 1：开发作品（点击跳转工作台） -->
  <div class="outer-cont" onclick="window.location.href='/workspace'">
    <span class="action-flex font-bold">
      <span>开发作品</span>
    </span>
  </div>

  <!-- 按钮 2：终端（新加，位于开发作品正下方） -->
  <div class="outer-cont" onclick="window.location.href='/terminal'">
    <span class="action-flex font-bold">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"></polyline>
        <line x1="12" y1="19" x2="20" y2="19"></line>
      </svg>
      <span>终端</span>
    </span>
  </div>

</div>
