<style>
  .action-flex {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 100%;
  }
  .outer-cont {
    padding: 12px 0;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    position: relative;
    background: linear-gradient(90deg, rgba(147, 150, 95, 0.8), rgba(73, 63, 54, 0.8), rgba(245, 230, 207, 0.8));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 12px;
    color: #fff;
    transition: all 0.3s ease;
    box-shadow:
      inset 0px 0px 5px rgba(255, 255, 255, 0.6),
      inset 0px 35px 30px rgba(0, 0, 0, 0.8),
      0px 5px 10px rgba(0, 0, 0, 0.7);
    text-shadow: 1px 1px 1px #000;
    pointer-events: auto !important;
  }
  .outer-cont::before {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 12px;
    filter: blur(0);
    z-index: -1;
    box-shadow: none;
    background: conic-gradient(
      rgba(0,0,0,0) 80deg,
      #93965F,
      #493F36,
      #F5E6CF,
      rgba(0,0,0,0) 280deg
    );
    transition: all 0.3s ease;
  }
  .outer-cont:hover::before {
    filter: blur(15px);
  }
  .outer-cont:active::before {
    filter: blur(5px);
    transform: translateY(1px);
  }
  .outer-cont:active {
    box-shadow:
      inset 0px 0px 5px rgba(255, 255, 255, 0.6),
      inset 0px 35px 30px rgba(0, 0, 0, 0.8);
    margin-top: 3px;
  }
</style>
