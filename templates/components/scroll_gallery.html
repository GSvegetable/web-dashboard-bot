<!-- 组件：水平滑动画廊 (触发方式：向下滚动) -->
<style>
  .scroll-trigger-section {
    height: 300vh; /* 占据300%屏幕高度，为滚动留出足够空间 */
    position: relative;
  }
  
  .horizontal-gallery {
    position: sticky;
    top: 10vh; /* 距离顶部留一点空间 */
    height: 80vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 2vw;
  }

  .scroll-card {
    width: 38vw;
    height: 60vh;
    flex-shrink: 0;
    margin-right: 20px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 2rem;
    font-weight: bold;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
  }

  .scroll-card:hover {
    transform: scale(1.02);
    box-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
  }

  .scroll-card h3 { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .scroll-card p { font-size: 1rem; color: rgba(255,255,255,0.7); }

  /* 给卡片加一点不同颜色的渐变色 */
  .card-1 { background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(37, 99, 235, 0.4)); }
  .card-2 { background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(107, 33, 168, 0.4)); }
  .card-3 { background: linear-gradient(135deg, rgba(236, 72, 153, 0.4), rgba(157, 23, 77, 0.4)); }
  .card-4 { background: linear-gradient(135deg, rgba(251, 146, 60, 0.4), rgba(194, 65, 12, 0.4)); }
  .card-5 { background: linear-gradient(135deg, rgba(52, 211, 153, 0.4), rgba(6, 95, 70, 0.4)); }

  /* 手机适配 */
  @media (max-width: 768px) {
    .scroll-card { width: 70vw; height: 45vh; }
  }
</style>

<!-- 触发区域（你往下滚动，这里会触发动画） -->
<section class="scroll-trigger-section hidden md:block" id="scrollGalleryWrapper">
  <div class="horizontal-gallery" id="galleryContainer">
    
    <!-- 卡片 1 -->
    <div class="scroll-card card-1">
      <h3>卡片一</h3>
      <p>滑动交互</p>
    </div>
    <!-- 卡片 2 -->
    <div class="scroll-card card-2">
      <h3>卡片二</h3>
      <p>横向拉伸</p>
    </div>
    <!-- 卡片 3 -->
    <div class="scroll-card card-3">
      <h3>卡片三</h3>
      <p>重叠错位</p>
    </div>
    <!-- 卡片 4 -->
    <div class="scroll-card card-4">
      <h3>卡片四</h3>
      <p>全屏预览</p>
    </div>
    <!-- 卡片 5 -->
    <div class="scroll-card card-5">
      <h3>卡片五</h3>
      <p>高级滚动</p>
    </div>

  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 确保已经引入了 GSAP 和 ScrollTrigger
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
        
        let container = document.getElementById('galleryContainer');
        let cards = gsap.utils.toArray('.scroll-card');

        // 设置卡片水平滑动的总距离（总宽度 - 可视窗口宽度）
        let totalWidth = cards.length * (cards[0].offsetWidth + 20); // 20是margin
        let maxTranslateX = -(totalWidth - window.innerWidth);

        // 注册 ScrollTrigger 动画（极其丝滑的横向联动）
        gsap.to(cards, {
            x: -maxTranslateX + 'px', // 水平横向移动
            duration: 5,
            ease: "none", // 全程匀速，跟随滚动条
            scrollTrigger: {
                trigger: document.getElementById('scrollGalleryWrapper'),
                pin: true, // 将容器钉在屏幕上
                scrub: 1,  // 跟随手指/鼠标滚动的速率（数字越大，滚动越缓越丝滑）
                start: "top top", // 当容器顶部接触到浏览器顶部时开始
                end: "+=300%", // 滚动到容器高度 300% 的时候结束（和上面 300vh 对应）
            }
        });

    } else {
        console.warn("GSAP 或 ScrollTrigger 未加载，请检查 splash.html 中的引入！");
    }
});
</script>
