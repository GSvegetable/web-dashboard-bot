<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    width: 44px;
    height: 44px;
    border-radius: 999px;
    padding: 0;

    opacity: 0;
    pointer-events: none;
    box-sizing: border-box;
    overflow: hidden;               /* 用于圆角裁剪背景，不影响文字 */
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: flex-start;

    transition:
        transform 0.3s cubic-bezier(0.34, 1.08, 0.64, 1),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        padding 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* 文字样式：初始隐藏，展开时淡入，但延迟极短，与宽度变化同步 */
#topToast span {
    display: inline-block;
    white-space: nowrap;
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    line-height: 44px;
    position: relative;
    top: 2px;
    flex-shrink: 0;
    opacity: 0;                     /* 初始隐藏 */
    transition: opacity 0.3s ease-in 0.1s; /* 延迟0.1s，宽度过渡0.5s，文字在宽度变化约20%时开始淡入 */
}
</style>

<script>
let toastTimer = null;

// 离屏测量文字真实宽度（避免 flex 压缩影响）
function measureTextWidth(text, fontSize, fontWeight) {
    const measurer = document.createElement('span');
    measurer.style.cssText = `
        position: absolute;
        visibility: hidden;
        white-space: nowrap;
        font-size: ${fontSize}px;
        font-weight: ${fontWeight};
    `;
    measurer.textContent = text;
    document.body.appendChild(measurer);
    const width = measurer.offsetWidth;
    document.body.removeChild(measurer);
    return width;
}

window.showTopToast = function (message) {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);
    if (toastTimer) clearTimeout(toastTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    const msgSpan = document.createElement('span');
    msgSpan.innerText = message || '测试提示';
    toast.appendChild(msgSpan);

    // 初始状态：屏幕外 + 轻微拉伸（边缘拉扯）
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.height = '54px';
    toast.style.borderRadius = '50% 50% 45% 45% / 65% 65% 45% 45%';
    toast.style.padding = '0';
    // 文字初始 opacity: 0（已在 CSS 中定义，但可通过内联覆盖确保）
    msgSpan.style.opacity = '0';

    document.body.appendChild(toast);
    void toast.offsetWidth; // 强制重绘

    // 1. 下滑到 40px，恢复圆形
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';
    toast.style.height = '44px';
    toast.style.borderRadius = '999px';

    // 2. 展开胶囊（250ms 后）
    setTimeout(() => {
        // 精确测量文字宽度
        const textWidth = measureTextWidth(msgSpan.innerText, 15, 500);
        const targetWidth = textWidth + 40; // 左右各 20px 内边距
        toast.style.width = targetWidth + 'px';
        toast.style.padding = '0 20px';
        // 让文字开始淡入（与宽度过渡同步，延迟0.1s）
        msgSpan.style.opacity = '1';
    }, 250);

    // 3. 收拢并退场
    toastTimer = setTimeout(() => {
        // 统一过渡，避免偏移
        toast.style.transition = 
            'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'padding 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.height = '44px';
        toast.style.borderRadius = '999px';
        toast.style.padding = '0';
        msgSpan.style.opacity = '0'; // 文字隐藏

        setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
    }, 3300);
};
</script>
