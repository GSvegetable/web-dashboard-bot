<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08); /* 略微提亮背景，保证文字对比度 */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

    /* 通用初始状态 */
    width: 44px;
    height: 44px;
    border-radius: 999px;
    padding: 0;

    opacity: 0;
    pointer-events: none;
    box-sizing: border-box;

    /* 核心动画过渡 */
    transition:
        transform 0.3s cubic-bezier(0.34, 1.08, 0.64, 1),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        padding 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* 内部文字：始终保证可见 */
#topToast span {
    display: inline-block;
    white-space: nowrap;
    color: #ffffff;
    font-size: 15px;
    letter-spacing: 0.5px;
    /* 强阴影确保文字在玻璃上绝对清晰 */
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    opacity: 1 !important; /* 强制文字始终可见 */
    line-height: 44px;
    text-align: center;
    width: 100%;
}
</style>

<script>
let toastTimer = null;
let toastExpandTimer = null;
let toastHideTimer = null;

window.showTopToast = function (message) {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);

    if (toastTimer) clearTimeout(toastTimer);
    if (toastExpandTimer) clearTimeout(toastExpandTimer);
    if (toastHideTimer) clearTimeout(toastHideTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    const msgSpan = document.createElement('span');
    msgSpan.textContent = message || '';
    toast.appendChild(msgSpan);

    // 初始状态：屏幕外
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.height = '54px';
    toast.style.borderRadius = '50% 50% 45% 45% / 65% 65% 45% 45%';
    toast.style.padding = '0';

    document.body.appendChild(toast);
    void toast.offsetWidth;

    // 1. 下滑到 40px，恢复圆形
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';
    toast.style.height = '44px';
    toast.style.borderRadius = '999px';

    // 2. 展开胶囊：离线测量文字真实宽度
    toastExpandTimer = setTimeout(() => {
        // 将文字脱离文档流，测量完整宽度
        msgSpan.style.position = 'absolute';
        msgSpan.style.left = '-9999px';
        msgSpan.style.top = '-9999px';
        document.body.appendChild(msgSpan);
        
        const textWidth = msgSpan.scrollWidth;
        const targetWidth = textWidth + 44; // 左右各 22px 内边距
        document.body.removeChild(msgSpan);
        
        // 恢复文字位置，并展开容器
        msgSpan.style.position = 'relative';
        msgSpan.style.left = '';
        msgSpan.style.top = '';
        
        toast.style.width = targetWidth + 'px';
        toast.style.padding = '0 22px';
    }, 250);

    // 3. 收拢并退场
    toastHideTimer = setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.height = '44px';
        toast.style.borderRadius = '999px';
        toast.style.padding = '0';

        toastTimer = setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
    }, 3300);
};
</script>
