<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    /* 初始状态：圆球 */
    width: 44px;
    height: 44px;
    border-radius: 999px;
    padding: 0;

    opacity: 0;
    pointer-events: none;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center; /* 文字绝对在正中间 */

    transition:
        transform 0.3s cubic-bezier(0.34, 1.08, 0.64, 1),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        padding 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* 内部文字：初始完全透明，膨胀后变为不透明淡入 */
#topToast span {
    display: inline-block;
    white-space: nowrap;
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    /* 深色投影浮层保证文字无论如何都是清晰的 */
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    opacity: 0; /* ✅ 初始隐藏 */
    transition: opacity 0.3s ease-in 0.15s; /* 胶囊展开一半时文字才浮现 */
}
</style>

<script>
let toastTimer = null;

window.showTopToast = function (message) {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);

    if (toastTimer) clearTimeout(toastTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    const msgSpan = document.createElement('span');
    // 💡 为了确保你这次一定能看到，我先设为“测试提示”，你可以随便改
    msgSpan.innerText = message || '测试提示'; 
    toast.appendChild(msgSpan);

    // 初始状态：屏幕外的小球
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.padding = '0';

    document.body.appendChild(toast);
    void toast.offsetWidth; // 强制重绘

    // 1. 下落停稳
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';

    // 2. 250ms 后展开胶囊，并让文字浮现
    setTimeout(() => {
        toast.style.width = 'fit-content';
        toast.style.padding = '0 20px';
        msgSpan.style.opacity = '1'; // ✅ 文字瞬间浮现
    }, 250);

    // 3. 3300ms 后收拢并退场
    toastTimer = setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.padding = '0';
        msgSpan.style.opacity = '0'; // 文字再次隐藏，为下一次做准备

        setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
    }, 3300);
};
</script>
