<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    width: 44px;
    height: 44px;
    border-radius: 999px;
    padding: 0;

    opacity: 0;
    pointer-events: none;
    box-sizing: border-box;
    overflow: hidden;
    white-space: nowrap;

    display: flex;
    align-items: center;
    justify-content: flex-start;

    transition:
        transform 0.3s cubic-bezier(0.34, 1.08, 0.64, 1),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        padding 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

#topToast span {
    display: inline-block;
    white-space: nowrap;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    line-height: 44px;
    position: relative;
    top: 2px;
    flex-shrink: 0;
    /* 不设置 opacity，文字始终可见，由父容器裁剪实现逐渐显示 */
}
</style>

<script>
let toastTimer = null;

// 辅助函数：精确测量文字宽度
function measureTextWidth(text, fontSize, fontWeight) {
    const span = document.createElement('span');
    span.style.cssText = `
        position: absolute;
        visibility: hidden;
        white-space: nowrap;
        font-size: ${fontSize}px;
        font-weight: ${fontWeight};
    `;
    span.textContent = text;
    document.body.appendChild(span);
    const width = span.offsetWidth;
    document.body.removeChild(span);
    return width;
}

window.showTopToast = function (message) {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);
    if (toastTimer) clearTimeout(toastTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    const msgSpan = document.createElement('span');
    msgSpan.innerText = message || '测试提示';
    toast.appendChild(msgSpan);

    // 初始状态：屏幕外 + 轻微拉伸（保留边缘拉扯效果）
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.height = '54px';
    toast.style.borderRadius = '50% 50% 45% 45% / 65% 65% 45% 45%';
    toast.style.padding = '0';

    document.body.appendChild(toast);
    void toast.offsetWidth; // 强制重绘

    // 1. 下滑到 40px，恢复圆形
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';
    toast.style.height = '44px';
    toast.style.borderRadius = '999px';

    // 2. 展开胶囊（250ms 后）
    setTimeout(() => {
        // 精确测量文字宽度（字体大小和字重与 span 样式一致）
        const textWidth = measureTextWidth(msgSpan.innerText, 15, 500);
        const targetWidth = textWidth + 40; // 左右各 20px 内边距
        toast.style.width = targetWidth + 'px';
        toast.style.padding = '0 20px';
        // 文字已经可见，通过 overflow:hidden 裁剪，会随宽度增加逐渐显示
    }, 250);

    // 3. 收拢并退场
    toastTimer = setTimeout(() => {
        // 统一过渡时间和缓动，避免偏移
        toast.style.transition = 
            'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'padding 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.height = '44px';
        toast.style.borderRadius = '999px';
        toast.style.padding = '0';

        setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
    }, 3300);
};
</script>
