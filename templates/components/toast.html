<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    width: 44px;
    height: 44px;
    border-radius: 999px;
    padding: 0;

    opacity: 0;
    pointer-events: none;
    box-sizing: border-box;
    overflow: hidden;            /* 裁剪内容，制造展开显示效果 */
    white-space: nowrap;         /* 防止文字换行 */
    text-align: left;            /* 文字从左开始显示 */

    /* 核心动画过渡 */
    transition:
        transform 0.3s cubic-bezier(0.34, 1.08, 0.64, 1),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        padding 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* 文字样式：通过内联样式设置，这里只提供兜底 */
#topToast span {
    display: inline-block;
    white-space: nowrap;
    color: #ffffff;
    font-size: 14px;
    line-height: 44px;          /* 与容器高度一致，垂直居中 */
    position: relative;
    top: 2px;                   /* 轻微下移 */
    vertical-align: middle;
}
</style>

<script>
let toastTimer = null;
let toastExpandTimer = null;
let toastHideTimer = null;

// 辅助函数：测量文本宽度
function measureTextWidth(text, fontSize) {
    const measurer = document.createElement('span');
    measurer.style.cssText = 'position:absolute; visibility:hidden; white-space:nowrap; font-size:' + fontSize + 'px;';
    measurer.textContent = text;
    document.body.appendChild(measurer);
    const width = measurer.offsetWidth;
    document.body.removeChild(measurer);
    return width;
}

window.showTopToast = function (message) {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);

    if (toastTimer) clearTimeout(toastTimer);
    if (toastExpandTimer) clearTimeout(toastExpandTimer);
    if (toastHideTimer) clearTimeout(toastHideTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    const msgSpan = document.createElement('span');
    msgSpan.textContent = message || '';
    // 直接内联样式，确保不被其他 CSS 覆盖
    msgSpan.style.cssText = 'color:#fff; font-size:14px; line-height:44px; position:relative; top:2px; white-space:nowrap; display:inline-block;';
    toast.appendChild(msgSpan);

    // 初始状态：屏幕外 + 轻微拉伸
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.height = '54px';
    toast.style.borderRadius = '50% 50% 45% 45% / 65% 65% 45% 45%';
    toast.style.padding = '0';
    toast.style.textAlign = 'left';

    document.body.appendChild(toast);
    void toast.offsetWidth;

    // 1. 下滑到 40px，恢复圆形
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';
    toast.style.height = '44px';
    toast.style.borderRadius = '999px';

    // 2. 展开胶囊：使用测量函数得到精确宽度
    toastExpandTimer = setTimeout(() => {
        const fontSize = 14; // 与 msgSpan 内联样式一致
        const textWidth = measureTextWidth(msgSpan.textContent, fontSize);
        const targetWidth = textWidth + 40; // 左右各 20px 内边距
        toast.style.width = targetWidth + 'px';
        toast.style.padding = '0 20px';
        // 文字保持可见，无需其他操作
    }, 250);

    // 3. 收拢并退场：统一过渡，避免偏移
    toastHideTimer = setTimeout(() => {
        // 动态修改 transition，使所有属性同步变化
        toast.style.transition = 
            'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'padding 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.height = '44px';
        toast.style.borderRadius = '999px';
        toast.style.padding = '0';
        // 文字无需改变

        toastTimer = setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
    }, 3300);
};
</script>
