<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    /* 正常小球尺寸：44x44 */
    width: 44px;
    height: 44px;
    border-radius: 999px;
    
    /* 默认无内边距 */
    padding: 0;

    opacity: 0;
    pointer-events: none;
    box-sizing: border-box;

    /* 关键：裁剪内容，让文字在展开过程中逐渐显示 */
    overflow: hidden;
    /* 文字垂直居中，但水平左对齐，使文字从左侧开始显现 */
    display: flex;
    align-items: center;
    justify-content: flex-start;

    /* 核心动画过渡 */
    transition:
        transform 0.3s cubic-bezier(0.34, 1.08, 0.64, 1),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        padding 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* 内部文字：始终可见，但会被容器裁剪，垂直位置微调 */
#topToast span {
    display: inline-block;
    white-space: nowrap;
    opacity: 1;               /* 不再淡入淡出 */
    line-height: 44px;        /* 与容器高度一致，实现垂直居中 */
    position: relative;
    top: 2px;                 /* 轻微下移 */
    /* 移除原来的 opacity 过渡 */
}
</style>

<script>
let toastTimer = null;
let toastExpandTimer = null;
let toastHideTimer = null;

window.showTopToast = function (message) {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);

    if (toastTimer) clearTimeout(toastTimer);
    if (toastExpandTimer) clearTimeout(toastExpandTimer);
    if (toastHideTimer) clearTimeout(toastHideTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    const msgSpan = document.createElement('span');
    msgSpan.innerText = message || '';
    toast.appendChild(msgSpan);

    // 初始状态：屏幕外 + 轻微拉伸
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.height = '54px';              // 拉长 10px
    toast.style.borderRadius = '50% 50% 45% 45% / 65% 65% 45% 45%';
    toast.style.padding = '0';

    document.body.appendChild(toast);
    void toast.offsetWidth; // 强制重绘

    // 1. 下滑到 40px，同时恢复圆形
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';
    toast.style.height = '44px';
    toast.style.borderRadius = '999px';

    // 2. 展开胶囊：测量文字宽度，设置具体像素宽度
    toastExpandTimer = setTimeout(() => {
        const textWidth = msgSpan.scrollWidth; // 文字实际宽度
        const targetWidth = textWidth + 40;    // 左右各 20px 内边距
        toast.style.width = targetWidth + 'px';
        toast.style.padding = '0 20px';
        // 不再设置 msgSpan.style.opacity，文字已经可见
    }, 250);

    // 3. 收拢并退场：统一过渡，避免偏移
    toastHideTimer = setTimeout(() => {
        // 动态修改 transition，使所有属性同步变化
        toast.style.transition = 
            'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'padding 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.height = '44px';
        toast.style.borderRadius = '999px';
        toast.style.padding = '0';
        // 文字不再改变 opacity

        toastTimer = setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300); // 与最慢过渡时间一致
    }, 3300);
};
</script>
