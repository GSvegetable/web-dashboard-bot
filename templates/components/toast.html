<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    /* 初始圆球 */
    width: 44px;
    height: 44px;
    border-radius: 999px;
    padding: 0;

    opacity: 0;
    pointer-events: none;
    box-sizing: border-box;

    /* 关键：裁剪内容，让文字随宽度展开逐渐显示 */
    overflow: hidden;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: flex-start;

    transition:
        transform 0.3s cubic-bezier(0.34, 1.08, 0.64, 1),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        padding 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* 文字始终可见，不透明度为1，通过容器裁剪实现逐渐显示 */
#topToast span {
    display: inline-block;
    white-space: nowrap;
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    line-height: 44px;         /* 与容器高度一致，垂直居中 */
    position: relative;
    top: 2px;                  /* 轻微下移，符合你的要求 */
    flex-shrink: 0;            /* 防止被压缩 */
}
</style>

<script>
let toastTimer = null;

window.showTopToast = function (message) {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);
    if (toastTimer) clearTimeout(toastTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    const msgSpan = document.createElement('span');
    msgSpan.innerText = message || '测试提示';
    toast.appendChild(msgSpan);

    // 初始状态：屏幕外的小球
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.padding = '0';

    document.body.appendChild(toast);
    void toast.offsetWidth; // 强制重绘

    // 1. 下落停稳
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';

    // 2. 展开胶囊：使用具体像素宽度
    setTimeout(() => {
        // 测量文字真实宽度（span 已经存在，且未被压缩）
        const textWidth = msgSpan.scrollWidth;
        // 左右各留 20px 内边距
        const targetWidth = textWidth + 40;
        toast.style.width = targetWidth + 'px';
        toast.style.padding = '0 20px';
        // 文字本身已经可见，通过 overflow:hidden 的裁剪，会随着宽度增加逐渐露出
    }, 250);

    // 3. 收拢并退场
    toastTimer = setTimeout(() => {
        // 动态统一过渡，避免偏移
        toast.style.transition = 
            'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'padding 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.padding = '0';

        setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
    }, 3300);
};
</script>
