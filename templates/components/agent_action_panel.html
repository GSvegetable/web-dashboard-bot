<div class="absolute top-4 left-4 z-20 flex items-center gap-2">
    <div class="agent-tabs-wrapper">
        <div class="container">
            <div class="tabs">
                <input checked="" name="tabs" id="radio-1" type="radio" />
                <label for="radio-1" class="tab">讨论</label>
                <input name="tabs" id="radio-2" type="radio" />
                <label for="radio-2" class="tab">代理人<span class="notification">Model</span></label>

    <!-- ✨ 新增：历史记录按钮 -->

    </button>

    <!-- 原有的“+”加号按钮 -->
    <button id="newChatBtn" class="w-8 h-8 rounded-full bg-[rgba(255,255,255,0.08)] border border-white/20 text-white/70 hover:text-white hover:bg-[rgba(255,255,255,0.15)] flex items-center justify-center transition active:scale-95 text-lg leading-none font-light">
        +
    </button>
