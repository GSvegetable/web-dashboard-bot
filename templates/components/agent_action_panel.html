<style>
  .agent-panel-transition { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  .agent-tabs-wrapper .tabs { display: flex; position: relative; background: rgba(255, 255, 255, 0.08); box-shadow: none; padding: 0.25rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); width: fit-content; gap: 0; }
  .agent-tabs-wrapper .tabs * { z-index: 2; }
  .agent-tabs-wrapper input[type="radio"] { display: none; }
  .agent-tabs-wrapper .tab { display: flex; align-items: center; justify-content: center; height: 30px; width: 60px; font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); font-weight: 500; border-radius: 99px; cursor: pointer; transition: color 0.15s ease-in; position: relative; }
  .agent-tabs-wrapper .notification { display: flex; align-items: center; justify-content: center; width: 3.5rem; height: 0.8rem; position: absolute; top: -0.3rem; left: auto; font-size: 9px; margin-left: 5rem; border-radius: 8px; margin: 0px; background-color: rgba(255, 255, 255, 0.1); transition: 0.15s ease-in; color: rgba(255, 255, 255, 0.5); }
  .agent-tabs-wrapper input[type="radio"]:checked + label { color: #ffffff; }
  .agent-tabs-wrapper input[id="radio-2"]:checked + label > .notification { background-color: #493F36; color: #ffffff; margin: 0px; }
  .agent-tabs-wrapper input[id="radio-1"]:checked ~ .glider { transform: translateX(0); }
  .agent-tabs-wrapper input[id="radio-2"]:checked ~ .glider { transform: translateX(100%); }
  .agent-tabs-wrapper input[id="radio-3"]:checked ~ .glider { transform: translateX(200%); }
  .agent-tabs-wrapper input[id="radio-4"]:checked ~ .glider { transform: translateX(300%); }
  .agent-tabs-wrapper input[type="radio"]:checked ~ .glider { background-color: black; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 0 12px rgba(255, 255, 255, 0.1); }
  .agent-tabs-wrapper .glider { position: absolute; display: flex; height: 30px; width: 60px; background-color: #93965F; z-index: 1; border-radius: 8px; transition: 0.15s ease-out; border: 1px solid transparent; }
  #agentMessageArea { position: absolute; top: 70px; left: 4px; right: 4px; bottom: 0; overflow-y: auto; z-index: 10; padding: 0 8px 90px 8px; scrollbar-width: none; -ms-overflow-style: none; mask-image: linear-gradient(to bottom, transparent 0%, black 2%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 2%); }
  #agentMessageArea::-webkit-scrollbar { display: none; }
  .chat-list { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .chat-list.hidden { display: none; }
  .chat-bubble.user { align-self: flex-end; background: rgba(40, 40, 40, 0.95); color: #f0f0f0; border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: 85%; word-wrap: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.3); animation: msgSlideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; position: relative; margin-bottom: 4px; }
  .chat-bubble.user::after { content: ''; position: absolute; bottom: 0; right: -6px; width: 10px; height: 10px; background: inherit; border-bottom-right-radius: 4px; transform: rotate(45deg) translateY(4px); box-shadow: 2px 2px 4px rgba(0,0,0,0.15); }
  .ai-text-msg { align-self: flex-start; color: rgba(255, 255, 255, 0.85); font-size: 0.9rem; padding: 4px 2px; animation: msgSlideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; margin-bottom: 2px; }
  .ai-thought-msg { align-self: flex-start; color: rgba(255, 255, 255, 0.4); font-size: 0.75rem; font-style: italic; padding: 2px 2px 0; animation: msgSlideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; margin-bottom: -2px; }
  @keyframes msgSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shakeToggle { 0% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } 100% { transform: translateX(0); } }
  .shake-toggle { animation: shakeToggle 0.4s ease-in-out 2; }
  #historyPanel {
      position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
      width: 85%; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px;
      padding: 12px; z-index: 30; display: none;
      flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }
  #historyPanel::-webkit-scrollbar { width: 3px; }
  #historyPanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 99px; }
  .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.04);
      cursor: pointer; transition: background 0.2s; border: 1px solid transparent;
  }
  .history-item:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
  .history-item.active { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
  .history-title { font-size: 13px; color: #e0e0e0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .history-time { font-size: 11px; color: #888; flex-shrink: 0; margin-left: 8px; }
</style>

<div id="agentPanelWrapper" class="fixed bottom-0 left-1/2 -translate-x-1/2 z-50 hidden" style="width: 0;">
    <div id="agentPanel" class="bg-white/10 backdrop-blur-[12px] border-t border-white/20 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.3)] agent-panel-transition translate-y-full relative" style="height: 660px; width: 100%;">
        <div class="absolute top-4 left-4 z-20 flex items-center gap-2">
            <div class="agent-tabs-wrapper">
                <div class="container">
                    <div class="tabs">
                        <input checked="" name="tabs" id="radio-1" type="radio" />
                        <label for="radio-1" class="tab">讨论</label>
                        <input name="tabs" id="radio-2" type="radio" />
                        <label for="radio-2" class="tab">代理人<span class="notification">Model</span></label>
                        <input name="tabs" id="radio-3" type="radio" />
                        <label for="radio-3" class="tab">记录</label>
                        <input name="tabs" id="radio-4" type="radio" />
                        <label for="radio-4" class="tab">新建</label>
                        <span class="glider"></span>
                    </div>
                </div>
            </div>
        </div>
        <div id="historyPanel">
            <div class="text-xs text-white/50 font-medium px-1 mb-1">点击切换历史对话</div>

            <div id="historyEmpty" class="text-xs text-white/30 text-center py-4">暂无历史记录</div>
        </div>
        <div id="agentMessageArea"><div id="discussionList" class="chat-list"></div><div id="agentList" class="chat-list hidden"></div></div>
        <div class="absolute bottom-4 left-4 right-4 z-20 flex flex-col gap-2">
            <div class="flex items-end gap-2 w-full">
                <textarea id="agentInput" rows="1" placeholder="输入消息" class="flex-1 bg-black/30 backdrop-blur-md border border-white/20 rounded-2xl px-4 py-2.5 text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-white/50 transition-all resize-none overflow-hidden max-h-[120px] leading-relaxed"></textarea>
                <button id="agentSendBtn" class="bg-[#493F36] hover:bg-[#3a322c] text-white rounded-2xl px-3 py-1.5 flex items-center justify-center transition active:scale-95 shadow-lg text-xl leading-none" style="transform: translateY(-8px);">+</button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    let agentPanelOpen = false;
    window.toggleAgentPanel = function() {
        console.log('Agent 按钮被点击');
        const wrapper = document.getElementById('agentPanelWrapper');
        const panel = document.getElementById('agentPanel');
        if (!wrapper || !panel) {
            setTimeout(window.toggleAgentPanel, 100);
            return;
        }
        agentPanelOpen = !agentPanelOpen;
        if (agentPanelOpen) {
            const container = document.getElementById('cardStackContainer');
            // ✅ 优先用原版自适应（如果有且有效）
            if (container && container.offsetWidth > 0) {
                const rect = container.getBoundingClientRect();
                wrapper.style.width = (rect.width * 4 / 3) + 'px';
                wrapper.style.left = rect.left + (rect.width / 2) + 'px';
                wrapper.style.transform = 'translateX(-50%)';
            } else {
                // ✅ 回退到偏左贴近边缘（留条缝隙）
                wrapper.style.width = '340px';
                wrapper.style.left = '24px';
                wrapper.style.transform = 'none';
            }
            wrapper.style.display = 'block';
            setTimeout(() => {
                panel.classList.remove('translate-y-full');
                panel.style.opacity = '1';
                panel.style.visibility = 'visible';
            }, 10);
        } else {
            panel.classList.add('translate-y-full');
            setTimeout(() => { wrapper.style.display = 'none'; }, 250);
        }
    };
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const panelWrapper = document.getElementById('agentPanelWrapper');
    const panel = document.getElementById('agentPanel');
    const agentInput = document.getElementById('agentInput');
    const agentSendBtn = document.getElementById('agentSendBtn');
    const agentMessageArea = document.getElementById('agentMessageArea');
    const discussionList = document.getElementById('discussionList');
    const agentList = document.getElementById('agentList');
    const radio1 = document.getElementById('radio-1');
    const radio2 = document.getElementById('radio-2');
    const radio3 = document.getElementById('radio-3');
    const radio4 = document.getElementById('radio-4');
    const historyPanel = document.getElementById('historyPanel');
    const historyList = document.getElementById('historyList');
    const historyEmpty = document.getElementById('historyEmpty');

    const STORAGE_KEY = 'gsbot_demo_sessions';
    let chatSessions = JSON.parse(sessionStorage.getItem(STORAGE_KEY)) || {};
    let currentSessionId = null;
    let currentMode = 'discussion';
    let isProcessing = false;
    window._lastValidMode = 'discussion';

    function initSessions() {
        const keys = Object.keys(chatSessions);
        if (keys.length === 0) {
            currentSessionId = 'session_' + Date.now();
            chatSessions[currentSessionId] = { discussion: [], agent: [], title: '新对话', time: new Date().toLocaleTimeString() };
        } else {
            currentSessionId = keys[keys.length - 1];
        }
        saveSessions();
        renderHistoryList();
        loadCurrentSession();
    }
    function saveSessions() { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(chatSessions)); }
    function generateTitle(messages) {
        if (!messages || messages.length === 0) return '新对话';
        for (let msg of messages) { if (msg.role === 'user') return msg.content.slice(0, 12) + (msg.content.length > 12 ? '...' : ''); }
        return '新对话';
    }
    function renderHistoryList() {
        const keys = Object.keys(chatSessions);
        historyList.innerHTML = '';
        if (keys.length === 0) { historyEmpty.style.display = 'block'; return; }
        historyEmpty.style.display = 'none';
        keys.reverse().forEach(id => {
            const item = document.createElement('div');
            item.className = 'history-item' + (id === currentSessionId ? ' active' : '');
            const titleSpan = document.createElement('span');
            titleSpan.className = 'history-title';
            titleSpan.textContent = chatSessions[id].title || '新对话';
            const timeSpan = document.createElement('span');
            timeSpan.className = 'history-time';
            timeSpan.textContent = chatSessions[id].time || '';
            item.appendChild(titleSpan); item.appendChild(timeSpan);
            item.addEventListener('click', function() { switchSession(id); });
            historyList.appendChild(item);
        });
    }
    function switchSession(sessionId) {
        if (sessionId === currentSessionId) { historyPanel.style.display = 'none'; return; }
        currentSessionId = sessionId; saveSessions(); renderHistoryList(); loadCurrentSession(); historyPanel.style.display = 'none';
    }
    function loadCurrentSession() {
        discussionList.innerHTML = ''; agentList.innerHTML = '';
        const session = chatSessions[currentSessionId];
        if (!session) return;
        (session.discussion || []).forEach(msg => renderMessage(msg, discussionList));
        (session.agent || []).forEach(msg => renderMessage(msg, agentList));
        setTimeout(() => agentMessageArea.scrollTop = agentMessageArea.scrollHeight, 50);
    }
    function renderMessage(msg, targetList) {
        const el = document.createElement('div');
        if (msg.role === 'user') { el.className = 'chat-bubble user'; el.textContent = msg.content; }
        else if (msg.type === 'thought') { el.className = 'ai-thought-msg'; el.textContent = msg.content; }
        else if (msg.role === 'assistant' || msg.type === 'reply') { el.className = 'ai-text-msg'; el.textContent = msg.content; }
        targetList.appendChild(el);
    }
    function switchMode(mode) {
        if (mode === currentMode) return;
        const currentList = currentMode === 'discussion' ? discussionList : agentList;
        const targetList = mode === 'discussion' ? discussionList : agentList;
        currentList.classList.add('hidden'); targetList.classList.remove('hidden'); currentMode = mode; window._lastValidMode = mode;
    }
    radio1.addEventListener('change', function() { if (this.checked) switchMode('discussion'); });
    radio2.addEventListener('change', function() { if (this.checked) switchMode('agent'); });
    radio3.addEventListener('change', function() {
        if (this.checked) {
            renderHistoryList();
            const isHidden = historyPanel.style.display === 'none';
            historyPanel.style.display = isHidden ? 'flex' : 'none';
            if (isHidden) { const count = Object.keys(chatSessions).length; historyPanel.style.maxHeight = count <= 3 ? '140px' : '200px'; }
            setTimeout(() => { let target = radio1; if (window._lastValidMode === 'agent') target = radio2; target.checked = true; }, 300);
        }
    });
    radio4.addEventListener('change', function() {
        if (this.checked) {
            const current = chatSessions[currentSessionId];
            if (current && (current.discussion.length > 0 || current.agent.length > 0)) {
                const newId = 'session_' + Date.now();
                chatSessions[newId] = { discussion: [], agent: [], title: '新对话', time: new Date().toLocaleTimeString() };
                currentSessionId = newId; saveSessions(); renderHistoryList(); loadCurrentSession();
            }
            setTimeout(() => { let target = radio1; if (window._lastValidMode === 'agent') target = radio2; target.checked = true; }, 300);
        }
    });
    function getCurrentConfig() {
        const saved = localStorage.getItem('gsbot_agent_config');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return { discussion: { think: true, search: false, strength: 'low', jailbreak: false }, agent: { think: true, search: false, strength: 'low' } };
    }
    function sendMessageInternal() {
        if (isProcessing) return;
        const text = agentInput.value.trim();
        if (!text) return;
        isProcessing = true;
        const targetList = currentMode === 'discussion' ? discussionList : agentList;
        const userMsg = { role: 'user', content: text };
        renderMessage(userMsg, targetList);
        agentMessageArea.scrollTop = agentMessageArea.scrollHeight;
        agentInput.value = ''; agentInput.style.height = 'auto';
        if (!chatSessions[currentSessionId]) chatSessions[currentSessionId] = { discussion: [], agent: [] };
        chatSessions[currentSessionId][currentMode].push(userMsg);
        if (chatSessions[currentSessionId][currentMode].length === 1) {
            chatSessions[currentSessionId].title = generateTitle(chatSessions[currentSessionId][currentMode]);
            chatSessions[currentSessionId].time = new Date().toLocaleTimeString();
        }
        saveSessions(); renderHistoryList();
        let thoughtBubble = null, replyBubble = null;
        const payloadConfig = getCurrentConfig();
        fetch('/api/agent/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, mode: currentMode, config: payloadConfig }) })
        .then(response => {
            const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = '', finalReplyContent = '';
            function readStream() {
                return reader.read().then(({done, value}) => {
                    if (done) {
                        if (finalReplyContent) { chatSessions[currentSessionId][currentMode].push({ role: 'assistant', content: finalReplyContent }); saveSessions(); renderHistoryList(); }
                        isProcessing = false; return;
                    }
                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n'); buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6).trim();
                            if (jsonStr === '[DONE]') { isProcessing = false; return; }
                            try {
                                const data = JSON.parse(jsonStr);
                                if (data.type === 'reasoning') {
                                    if (!thoughtBubble) { thoughtBubble = document.createElement('div'); thoughtBubble.className = 'ai-thought-msg'; targetList.appendChild(thoughtBubble); }
                                    thoughtBubble.textContent += typeof data.content === 'string' ? data.content : '';
                                    agentMessageArea.scrollTop = agentMessageArea.scrollHeight;
                                } else if (data.type === 'content') {
                                    if (!replyBubble) { replyBubble = document.createElement('div'); replyBubble.className = 'ai-text-msg'; targetList.appendChild(replyBubble); }
                                    const textContent = typeof data.content === 'string' ? data.content : '';
                                    replyBubble.textContent += textContent; finalReplyContent += textContent;
                                    agentMessageArea.scrollTop = agentMessageArea.scrollHeight;
                                } else if (data.type === 'done') { isProcessing = false; }
                                else if (data.type === 'error') {
                                    if (!replyBubble) { replyBubble = document.createElement('div'); replyBubble.className = 'ai-text-msg'; targetList.appendChild(replyBubble); }
                                    replyBubble.textContent = data.content || '网络异常或 Key 未配置。';
                                    agentMessageArea.scrollTop = agentMessageArea.scrollHeight; isProcessing = false;
                                }
                            } catch(e) {}
                        }
                    }
                    return readStream();
                });
            }
            return readStream();
        })
        .catch(() => {
            const errMsg = document.createElement('div'); errMsg.className = 'ai-text-msg text-red-400/80';
            errMsg.textContent = '网络异常或 Key 未配置。'; targetList.appendChild(errMsg); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; isProcessing = false;
        });
    }
    agentSendBtn.addEventListener('click', sendMessageInternal);
    agentInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; if (this.value.length > 40 && this.scrollHeight < 108) { this.style.height = '108px'; } });
    agentInput.addEventListener('keypress', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); agentSendBtn.click(); } });
    initSessions();
});
</script>
