<!-- Agent 玻璃质感底部面板组件 -->
<style>
  .agent-panel-transition {
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* --- 适配暗色毛玻璃的 Tabs 组件 --- */
  .agent-tabs-wrapper .tabs {
    display: flex;
    position: relative;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: none;
    padding: 0.25rem;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .agent-tabs-wrapper .tabs * {
    z-index: 2;
  }

  .agent-tabs-wrapper input[type="radio"] {
    display: none;
  }

  .agent-tabs-wrapper .tab {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 30px;
    width: 70px;
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.6);
    font-weight: 500;
    border-radius: 99px;
    cursor: pointer;
    transition: color 0.15s ease-in;
  }

  .agent-tabs-wrapper .notification {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 3.5rem;
    height: 0.8rem;
    position: absolute;
    top: -0.3rem;
    left: auto;
    font-size: 9px;
    margin-left: 5rem;
    border-radius: 8px;
    margin: 0px;
    background-color: rgba(255, 255, 255, 0.1);
    transition: 0.15s ease-in;
    color: rgba(255, 255, 255, 0.5);
  }

  .agent-tabs-wrapper input[type="radio"]:checked + label {
    color: #ffffff;
  }

  .agent-tabs-wrapper input[id="radio-2"]:checked + label > .notification {
    background-color: #493F36;
    color: #ffffff;
    margin: 0px;
  }

  .agent-tabs-wrapper input[id="radio-1"]:checked ~ .glider {
    transform: translateX(0);
  }

  .agent-tabs-wrapper input[id="radio-2"]:checked ~ .glider {
    transform: translateX(100%);
  }

  .agent-tabs-wrapper input[type="radio"]:checked ~ .glider {
    background-color: black;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
  }

  .agent-tabs-wrapper .glider {
    position: absolute;
    display: flex;
    height: 30px;
    width: 70px;
    background-color: #93965F;
    z-index: 1;
    border-radius: 8px;
    transition: 0.15s ease-out;
    border: 1px solid transparent;
  }
</style>

<div id="agentPanelWrapper" class="fixed bottom-0 left-1/2 -translate-x-1/2 z-50 hidden" style="width: 0;">
    <div id="agentPanel" 
         class="bg-white/10 backdrop-blur-[12px] border-t border-white/20 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.3)] agent-panel-transition translate-y-full relative"
         style="height: 660px; width: 100%;">
         
        <!-- 左上角 Tabs 切换器 -->
        <div class="agent-tabs-wrapper absolute top-4 left-4">
            <div class="container">
              <div class="tabs">
                <input checked="" name="tabs" id="radio-1" type="radio" />
                <label for="radio-1" class="tab">回答</label>

                <input name="tabs" id="radio-2" type="radio" />
                <label for="radio-2" class="tab">代理人<span class="notification">Model</span></label>

                <span class="glider"></span>
              </div>
            </div>
        </div>

        <!-- ✅ 修改：整体往左移动（left-4, right-10），按钮缩小（px-3 py-1.5 text-lg） -->
        <div class="absolute bottom-6 left-4 right-10 flex items-center gap-2">
            <!-- 输入框 -->
            <input type="text" placeholder="输入任何问题" class="flex-1 bg-white/10 border border-white/20 rounded-2xl px-4 py-2.5 text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-white/50 transition-all" />
            <!-- 发送按钮：缩小尺寸 -->
            <button class="bg-[#493F36] hover:bg-[#3a322c] text-white rounded-2xl px-3 py-1.5 flex items-center justify-center transition active:scale-95 shadow-lg text-lg">
                ➠
            </button>
        </div>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const panelWrapper = document.getElementById('agentPanelWrapper');
    const panel = document.getElementById('agentPanel');
    let isPanelOpen = false;

    function updateAgentPanelPosition() {
        if (!isPanelOpen) return;
        const container = document.getElementById('cardStackContainer');
        if (container) {
            const rect = container.getBoundingClientRect();
            panelWrapper.style.width = (rect.width * 4 / 3) + 'px';
            panelWrapper.style.left = rect.left + (rect.width / 2) + 'px';
            panelWrapper.style.transform = 'translateX(-50%)';
        }
    }

    window.toggleAgentPanel = function() {
        isPanelOpen = !isPanelOpen;
        
        if (isPanelOpen) {
            const container = document.getElementById('cardStackContainer');
            if (container) {
                const rect = container.getBoundingClientRect();
                panelWrapper.style.width = (rect.width * 4 / 3) + 'px';
                panelWrapper.style.left = rect.left + (rect.width / 2) + 'px';
                panelWrapper.style.transform = 'translateX(-50%)';
                panelWrapper.style.display = 'block';
            }
            setTimeout(() => {
                panel.classList.remove('translate-y-full');
            }, 10);
        } else {
            panel.classList.add('translate-y-full');
            setTimeout(() => {
                panelWrapper.style.display = 'none';
            }, 250);
        }
    };

    window.addEventListener('resize', updateAgentPanelPosition);
});
</script>
