<!-- Agent 玻璃质感底部面板组件 -->
<style>
  .agent-panel-transition { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  .agent-tabs-wrapper .tabs { display: flex; position: relative; background: rgba(255, 255, 255, 0.08); box-shadow: none; padding: 0.25rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
  .agent-tabs-wrapper .tabs * { z-index: 2; }
  .agent-tabs-wrapper input[type="radio"] { display: none; }
  .agent-tabs-wrapper .tab { display: flex; align-items: center; justify-content: center; height: 30px; width: 70px; font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); font-weight: 500; border-radius: 99px; cursor: pointer; transition: color 0.15s ease-in; }
  .agent-tabs-wrapper .notification { display: flex; align-items: center; justify-content: center; width: 3.5rem; height: 0.8rem; position: absolute; top: -0.3rem; left: auto; font-size: 9px; margin-left: 5rem; border-radius: 8px; margin: 0px; background-color: rgba(255, 255, 255, 0.1); transition: 0.15s ease-in; color: rgba(255, 255, 255, 0.5); }
  .agent-tabs-wrapper input[type="radio"]:checked + label { color: #ffffff; }
  .agent-tabs-wrapper input[id="radio-2"]:checked + label > .notification { background-color: #493F36; color: #ffffff; margin: 0px; }
  .agent-tabs-wrapper input[id="radio-1"]:checked ~ .glider { transform: translateX(0); }
  .agent-tabs-wrapper input[id="radio-2"]:checked ~ .glider { transform: translateX(100%); }
  .agent-tabs-wrapper input[type="radio"]:checked ~ .glider { background-color: black; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 0 12px rgba(255, 255, 255, 0.1); }
  .agent-tabs-wrapper .glider { position: absolute; display: flex; height: 30px; width: 70px; background-color: #93965F; z-index: 1; border-radius: 8px; transition: 0.15s ease-out; border: 1px solid transparent; }
  
  .model-tabs-wrapper { display: flex; position: relative; gap: 6px; align-items: center; }
  .model-tabs-wrapper .model-tab { font-size: 0.7rem; color: rgba(255, 255, 255, 0.4); cursor: pointer; padding: 2px 8px; border-radius: 10px; transition: 0.2s; border: 1px solid transparent; user-select: none; }
  .model-tabs-wrapper .model-tab.active { color: #ffffff; background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
  .model-tabs-wrapper .model-tab:active { transform: scale(0.95); }
  .model-separator { color: rgba(255, 255, 255, 0.2); font-size: 0.7rem; }

  #agentMessageArea { position: absolute; top: 70px; left: 4px; right: 4px; bottom: 0; overflow-y: auto; z-index: 10; padding: 0 8px 90px 8px; scrollbar-width: none; -ms-overflow-style: none; mask-image: linear-gradient(to bottom, transparent 0%, black 2%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 2%); }
  #agentMessageArea::-webkit-scrollbar { display: none; }
  
  .chat-list { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .chat-list.hidden { display: none; }
  .chat-bubble.user { align-self: flex-end; background: rgba(40, 40, 40, 0.95); color: #f0f0f0; border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: 85%; word-wrap: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.3); animation: msgSlideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; position: relative; margin-bottom: 4px; }
  .chat-bubble.user::after { content: ''; position: absolute; bottom: 0; right: -6px; width: 10px; height: 10px; background: inherit; border-bottom-right-radius: 4px; transform: rotate(45deg) translateY(4px); box-shadow: 2px 2px 4px rgba(0,0,0,0.15); }
  .ai-text-msg { align-self: flex-start; color: rgba(255, 255, 255, 0.85); font-size: 0.9rem; padding: 4px 2px; animation: msgSlideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; margin-bottom: 2px; }
  
  @keyframes msgSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div id="agentPanelWrapper" class="fixed bottom-0 left-1/2 -translate-x-1/2 z-50 hidden" style="width: 0;">
    <div id="agentPanel" class="bg-white/10 backdrop-blur-[12px] border-t border-white/20 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.3)] agent-panel-transition translate-y-full relative" style="height: 660px; width: 100%;">
        <div class="absolute top-4 left-4 z-20">
            <div class="agent-tabs-wrapper">
                <div class="container">
                    <div class="tabs">
                        <input checked="" name="tabs" id="radio-1" type="radio" />
                        <label for="radio-1" class="tab">讨论</label>
                        <input name="tabs" id="radio-2" type="radio" />
                        <label for="radio-2" class="tab">代理人<span class="notification">Model</span></label>
                        <span class="glider"></span>
                    </div>
                </div>
            </div>
        </div>

        <div id="agentMessageArea"><div id="discussionList" class="chat-list"></div><div id="agentList" class="chat-list hidden"></div></div>
        <div class="absolute bottom-4 left-4 right-4 z-20 flex flex-col gap-2">
            <div class="flex items-center gap-2 w-full pl-1">
                <div class="model-tabs-wrapper">
                    <span class="model-tab active" data-model="zhipu" onclick="switchModel('zhipu')">智谱</span>
                    <span class="model-separator">|</span>
                    <span class="model-tab" data-model="doubao" onclick="switchModel('doubao')">豆包</span>
                    <span class="model-separator">|</span>
                    <span class="model-tab" data-model="kimi" onclick="switchModel('kimi')">Kimi</span>
                </div>
            </div>

            <div class="flex items-end gap-2 w-full">
                <textarea id="agentInput" rows="1" placeholder="输入任何问题" class="flex-1 bg-black/30 backdrop-blur-md border border-white/20 rounded-2xl px-4 py-2.5 text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-white/50 transition-all resize-none overflow-hidden max-h-[120px] leading-relaxed"></textarea>
                <button id="agentSendBtn" class="bg-[#493F36] hover:bg-[#3a322c] text-white rounded-2xl px-3 py-1.5 flex items-center justify-center transition active:scale-95 shadow-lg text-xl leading-none" style="transform: translateY(-8px);">+</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const panelWrapper = document.getElementById('agentPanelWrapper'), panel = document.getElementById('agentPanel'), agentInput = document.getElementById('agentInput'), agentSendBtn = document.getElementById('agentSendBtn'), agentMessageArea = document.getElementById('agentMessageArea'), discussionList = document.getElementById('discussionList'), agentList = document.getElementById('agentList'), radio1 = document.getElementById('radio-1'), radio2 = document.getElementById('radio-2');
    let discussionHistory = [], agentHistory = [], currentMode = 'discussion', isPanelOpen = false;
    let isProcessing = false;
    let currentModel = 'zhipu';

    const savedModel = localStorage.getItem('gsbot_model_preference');
    if (savedModel === 'zhipu' || savedModel === 'doubao' || savedModel === 'kimi') {
        currentModel = savedModel;
        switchModelUI(currentModel);
    }

    function switchMode(mode) {
        if (mode === currentMode) return;
        const currentList = currentMode === 'discussion' ? discussionList : agentList, targetList = mode === 'discussion' ? discussionList : agentList;
        currentList.classList.add('hidden'); targetList.classList.remove('hidden'); currentMode = mode;
    }
    radio1.addEventListener('change', function() { if (this.checked) switchMode('discussion'); });
    radio2.addEventListener('change', function() { if (this.checked) switchMode('agent'); });

    function updateAgentPanelPosition() {
        if (!isPanelOpen) return;
        const container = document.getElementById('cardStackContainer');
        if (container) {
            const rect = container.getBoundingClientRect();
            panelWrapper.style.width = (rect.width * 4 / 3) + 'px';
            panelWrapper.style.left = rect.left + (rect.width / 2) + 'px';
            panelWrapper.style.transform = 'translateX(-50%)';
        }
    }
    window.toggleAgentPanel = function() {
        isPanelOpen = !isPanelOpen;
        if (isPanelOpen) {
            const container = document.getElementById('cardStackContainer');
            if (container) {
                const rect = container.getBoundingClientRect();
                panelWrapper.style.width = (rect.width * 4 / 3) + 'px';
                panelWrapper.style.left = rect.left + (rect.width / 2) + 'px';
                panelWrapper.style.transform = 'translateX(-50%)';
            } else {
                panelWrapper.style.width = '320px';
                panelWrapper.style.left = '50%';
                panelWrapper.style.transform = 'translateX(-50%)';
            }
            panelWrapper.style.display = 'block';

            setTimeout(() => { 
                panel.classList.remove('translate-y-full'); 
                setTimeout(() => { agentInput.focus(); }, 300);
            }, 10);
        } else {
            panel.classList.add('translate-y-full');
            setTimeout(() => { panelWrapper.style.display = 'none'; }, 250);
        }
    };
    window.addEventListener('resize', updateAgentPanelPosition);

    window.suggestSwitchToAgent = function(originalMessage) {
        if (currentMode === 'discussion') {
            radio2.checked = true; switchMode('agent');
            const checkSwitchDone = setInterval(() => {
                if (currentMode === 'agent') { clearInterval(checkSwitchDone); agentInput.value = originalMessage; sendMessageInternal(); }
            }, 200);
        } else if (currentMode === 'agent') {
            agentInput.value = originalMessage; sendMessageInternal();
        }
    };

    window.switchModel = function(model) {
        if (model === currentModel) return;
        currentModel = model;
        localStorage.setItem('gsbot_model_preference', model);
        switchModelUI(model);
    };

    function switchModelUI(model) {
        const tabs = document.querySelectorAll('.model-tab');
        tabs.forEach(tab => {
            if (tab.dataset.model === model) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });
    }

    // ✅ 核心执行引擎：加入致命错误检查！
    async function executeMacroSequence(actions) {
        // ⚠️ 第一步就检查手脚有没有接上
        if (typeof window.AgentMacros === 'undefined' || window.AgentMacros === null) {
            const errMsg = document.createElement('div');
            errMsg.className = 'ai-text-msg text-red-400/80';
            errMsg.textContent = '❌ 执行系统故障：未找到 agent_macros.js 脚本文件！请确保已正确引入该脚本。';
            const targetList = currentMode === 'agent' ? agentList : discussionList;
            targetList.appendChild(errMsg);
            targetList.scrollTop = targetList.scrollHeight;
            return; // 直接终止执行
        }

        for (let i = 0; i < actions.length; i++) {
            const item = actions[i];
            const macroName = item.action;
            
            if (window.AgentMacros && typeof window.AgentMacros[macroName] === 'function') {
                try {
                    await window.AgentMacros[macroName]();
                } catch (e) {
                    console.error(`宏 ${macroName} 执行出错:`, e);
                }
            } else {
                console.warn(`未找到宏命令: ${macroName}`);
            }

            const waitTime = item.delay || 0;
            if (waitTime > 0) { await new Promise(r => setTimeout(r, waitTime)); }
        }
    }

    function sendMessageInternal() {
        if (isProcessing) return;
        const text = agentInput.value.trim();
        if (!text) return;
        isProcessing = true;

        const isAgent = currentMode === 'agent';
        const targetList = isAgent ? agentList : discussionList;
        const history = isAgent ? agentHistory : discussionHistory;
        
        const userBubble = document.createElement('div'); userBubble.className = 'chat-bubble user'; userBubble.textContent = text;
        targetList.appendChild(userBubble); targetList.scrollTop = targetList.scrollHeight;
        history.push({ type: 'user', text: text });
        agentInput.value = ''; agentInput.rows = 1; agentInput.style.height = 'auto';
        
        let loadingMsg = null;
        if (isAgent) {
            loadingMsg = document.createElement('div'); loadingMsg.className = 'ai-text-msg text-gray-400'; loadingMsg.textContent = 'Thinking...'; loadingMsg.id = 'loading-bubble';
            targetList.appendChild(loadingMsg); targetList.scrollTop = targetList.scrollHeight;
        }

        let payload = { message: text, mode: currentMode, model_type: currentModel };

        fetch('/api/agent/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(res => {
            if (!res.ok) { throw new Error(`API 请求失败，状态码: ${res.status}`); }
            return res.json();
        })
        .then(data => {
            if (loadingMsg && loadingMsg.parentNode) loadingMsg.remove();
            
            if (data.action === 'suggest_agent' || data.action === 'ASK_CONFIRM') {
                isProcessing = false; return;
            }

            let actualReply = data.reply || '抱歉，无法回答。';
            let actions = data.actions || [];

            if (actualReply.startsWith('{') && actualReply.includes('"reply":')) {
                try {
                    const parsed = JSON.parse(actualReply);
                    if (parsed.reply) actualReply = parsed.reply;
                } catch (e) {}
            }

            const botMsg = document.createElement('div');
            botMsg.className = 'ai-text-msg';
            botMsg.textContent = actualReply;
            targetList.appendChild(botMsg);
            targetList.scrollTop = targetList.scrollHeight;
            history.push({ type: 'ai', text: actualReply });

            // ✅ 识别到宏命令，执行“手脚”
            if (isAgent && actions && actions.length > 0) {
                isProcessing = false; 
                setTimeout(() => {
                    executeMacroSequence(actions);
                }, 100);
                return; 
            }

            isProcessing = false;
        })
        .catch(() => {
            if (loadingMsg && loadingMsg.parentNode) loadingMsg.remove();
            const errMsg = document.createElement('div'); errMsg.className = 'ai-text-msg text-red-400/80'; errMsg.textContent = '网络异常，请稍后再试。';
            targetList.appendChild(errMsg); targetList.scrollTop = targetList.scrollHeight;
            history.push({ type: 'ai', text: '网络异常，请稍后再试。' });
            isProcessing = false;
        });
    }

    agentSendBtn.addEventListener('click', sendMessageInternal);
    agentInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; if (this.value.length > 40 && this.scrollHeight < 108) { this.style.height = '108px'; } });
    agentInput.addEventListener('keypress', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessageInternal(); } });
});
</script>
