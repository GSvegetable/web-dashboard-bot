<!-- Agent 玻璃质感底部面板组件 -->
<style>
  .agent-panel-transition { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  
  .agent-tabs-wrapper .tabs { display: flex; position: relative; background: rgba(255, 255, 255, 0.08); box-shadow: none; padding: 0.25rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
  .agent-tabs-wrapper .tabs * { z-index: 2; }
  .agent-tabs-wrapper input[type="radio"] { display: none; }
  .agent-tabs-wrapper .tab { display: flex; align-items: center; justify-content: center; height: 30px; width: 70px; font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); font-weight: 500; border-radius: 99px; cursor: pointer; transition: color 0.15s ease-in; }
  .agent-tabs-wrapper .notification { display: flex; align-items: center; justify-content: center; width: 3.5rem; height: 0.8rem; position: absolute; top: -0.3rem; left: auto; font-size: 9px; margin-left: 5rem; border-radius: 8px; margin: 0px; background-color: rgba(255, 255, 255, 0.1); transition: 0.15s ease-in; color: rgba(255, 255, 255, 0.5); }
  .agent-tabs-wrapper input[type="radio"]:checked + label { color: #ffffff; }
  .agent-tabs-wrapper input[id="radio-2"]:checked + label > .notification { background-color: #493F36; color: #ffffff; margin: 0px; }
  .agent-tabs-wrapper input[id="radio-1"]:checked ~ .glider { transform: translateX(0); }
  .agent-tabs-wrapper input[id="radio-2"]:checked ~ .glider { transform: translateX(100%); }
  .agent-tabs-wrapper input[type="radio"]:checked ~ .glider { background-color: black; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 0 12px rgba(255, 255, 255, 0.1); }
  .agent-tabs-wrapper .glider { position: absolute; display: flex; height: 30px; width: 70px; background-color: #93965F; z-index: 1; border-radius: 8px; transition: 0.15s ease-out; border: 1px solid transparent; }
  
  #agentMessageArea { position: absolute; top: 70px; left: 4px; right: 4px; bottom: 0; overflow-y: auto; z-index: 10; padding: 0 8px 90px 8px; scrollbar-width: none; -ms-overflow-style: none; mask-image: linear-gradient(to bottom, transparent 0%, black 2%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 2%); }
  #agentMessageArea::-webkit-scrollbar { display: none; }
  
  .chat-list { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .chat-list.hidden { display: none; }
  .chat-bubble.user { align-self: flex-end; background: rgba(40, 40, 40, 0.95); color: #f0f0f0; border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: 85%; word-wrap: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.3); animation: msgSlideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; position: relative; margin-bottom: 4px; }
  .chat-bubble.user::after { content: ''; position: absolute; bottom: 0; right: -6px; width: 10px; height: 10px; background: inherit; border-bottom-right-radius: 4px; transform: rotate(45deg) translateY(4px); box-shadow: 2px 2px 4px rgba(0,0,0,0.15); }
  .ai-text-msg { align-self: flex-start; color: rgba(255, 255, 255, 0.85); font-size: 0.9rem; padding: 4px 2px; animation: msgSlideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; margin-bottom: 2px; }
  .suggest-switch-box { align-self: flex-start; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 10px 14px; color: #e5e7eb; font-size: 0.85rem; animation: msgSlideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; margin-bottom: 4px; }
  .suggest-switch-box button { background: #493F36; color: white; border: none; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-top: 6px; cursor: pointer; transition: 0.15s; }
  .suggest-switch-box button:active { transform: scale(0.95); }
  
  @keyframes msgSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  /* --- Mac 风格任务卡片 --- */
  .mac-card-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    padding: 4px 0;
  }
  .mac-card {
    width: 100%;
    max-width: 380px;
    padding: 16px 20px 20px 20px;
    border: 1px solid #333;
    border-radius: 10px;
    background-color: #000;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
    align-self: center;
    margin: 6px 0;
  }
  .mac-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .mac-header span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .mac-header .red { background-color: #ff5f57; }
  .mac-header .yellow { background-color: #ffbd2e; }
  .mac-header .green { background-color: #28c941; }
  .mac-card-title { font-size: 18px; font-weight: bold; margin: 0 0 4px; color: #e6e6ef; }
  .mac-card-subtitle { font-size: 13px; color: #888; margin-bottom: 12px; }
  .mac-code-editor {
    background-color: #0d1117; color: #b0b0b0;
    font-family: monospace; font-size: 13px; line-height: 1.6;
    border-radius: 6px; padding: 14px;
    height: 160px; overflow-y: auto;
    border: 1px solid #333;
  }
  .mac-code-editor::-webkit-scrollbar { width: 6px; }
  .mac-code-editor::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
  .mac-code-line { display: block; white-space: pre-wrap; }
  .mac-code-success { color: #5bed7a; }
  .mac-code-warn { color: #ffd700; }
  .mac-code-info { color: #71a4f0; }
</style>

<div id="agentPanelWrapper" class="fixed bottom-0 left-1/2 -translate-x-1/2 z-50 hidden" style="width: 0;">
    <div id="agentPanel" class="bg-white/10 backdrop-blur-[12px] border-t border-white/20 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.3)] agent-panel-transition translate-y-full relative" style="height: 660px; width: 100%;">
        <div class="agent-tabs-wrapper absolute top-4 left-4 z-20">
            <div class="container"><div class="tabs"><input checked="" name="tabs" id="radio-1" type="radio" /><label for="radio-1" class="tab">讨论</label><input name="tabs" id="radio-2" type="radio" /><label for="radio-2" class="tab">代理人<span class="notification">Model</span></label><span class="glider"></span></div></div>
        </div>
        <div id="agentMessageArea"><div id="discussionList" class="chat-list"></div><div id="agentList" class="chat-list hidden"></div></div>
        <div class="absolute bottom-4 left-4 right-4 flex items-end gap-2 z-20">
            <textarea id="agentInput" rows="1" placeholder="输入任何问题" class="flex-1 bg-black/30 backdrop-blur-md border border-white/20 rounded-2xl px-4 py-2.5 text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-white/50 transition-all resize-none overflow-hidden max-h-[120px] leading-relaxed"></textarea>
            <button id="agentSendBtn" class="bg-[#493F36] hover:bg-[#3a322c] text-white rounded-2xl px-3 py-1.5 flex items-center justify-center transition active:scale-95 shadow-lg text-xl leading-none" style="transform: translateY(-8px);">+</button>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const panelWrapper = document.getElementById('agentPanelWrapper'), panel = document.getElementById('agentPanel'), agentInput = document.getElementById('agentInput'), agentSendBtn = document.getElementById('agentSendBtn'), agentMessageArea = document.getElementById('agentMessageArea'), discussionList = document.getElementById('discussionList'), agentList = document.getElementById('agentList'), radio1 = document.getElementById('radio-1'), radio2 = document.getElementById('radio-2');
    let discussionHistory = [], agentHistory = [], currentMode = 'discussion', isPanelOpen = false, isExecuting = false;

    function switchMode(mode) {
        if (mode === currentMode) return;
        const currentList = currentMode === 'discussion' ? discussionList : agentList, targetList = mode === 'discussion' ? discussionList : agentList;
        currentList.classList.add('hidden'); targetList.classList.remove('hidden'); currentMode = mode; setTimeout(() => { agentInput.focus(); }, 100);
    }
    radio1.addEventListener('change', function() { if (this.checked) switchMode('discussion'); });
    radio2.addEventListener('change', function() { if (this.checked) switchMode('agent'); });

    function updateAgentPanelPosition() {
        if (!isPanelOpen) return;
        const container = document.getElementById('cardStackContainer');
        if (container) { const rect = container.getBoundingClientRect(); panelWrapper.style.width = (rect.width * 4 / 3) + 'px'; panelWrapper.style.left = rect.left + (rect.width / 2) + 'px'; panelWrapper.style.transform = 'translateX(-50%)'; }
    }
    window.toggleAgentPanel = function() {
        isPanelOpen = !isPanelOpen;
        if (isPanelOpen) {
            const container = document.getElementById('cardStackContainer');
            if (container) { const rect = container.getBoundingClientRect(); panelWrapper.style.width = (rect.width * 4 / 3) + 'px'; panelWrapper.style.left = rect.left + (rect.width / 2) + 'px'; panelWrapper.style.transform = 'translateX(-50%)'; panelWrapper.style.display = 'block'; }
            setTimeout(() => { panel.classList.remove('translate-y-full'); setTimeout(() => { agentInput.focus(); }, 300); }, 10);
        } else { panel.classList.add('translate-y-full'); setTimeout(() => { panelWrapper.style.display = 'none'; }, 250); }
    };
    window.addEventListener('resize', updateAgentPanelPosition);

    function suggestSwitchToAgent(originalMessage) {
        if (currentMode === 'discussion') {
            radio2.checked = true; switchMode('agent');
            const checkSwitchDone = setInterval(() => {
                if (currentMode === 'agent') { clearInterval(checkSwitchDone); agentInput.value = originalMessage; sendMessageInternal(); }
            }, 200);
        }
    }
    window.suggestSwitchToAgent = suggestSwitchToAgent;

    // 动作执行器
    window.pauseAudio = function() { const audio = document.getElementById('bg-audio'); if (audio) audio.pause(); };
    window.stopAudio = function() { const audio = document.getElementById('bg-audio'); if (audio) { audio.pause(); audio.currentTime = 0; } };
    window.playAudio = function() { const audio = document.getElementById('bg-audio'); if (audio) audio.play().catch(e => console.log('播放被拦截', e)); };

    function performSingleAction(actionObj) {
        const action = actionObj.action;
        if (action === 'open_music') window.openMusicModal();
        else if (action === 'close_music') window.closeMusicModal();
        else if (action === 'open_log') window.openUpdateLogModal();
        else if (action === 'close_log') window.closeUpdateLogModal();
        else if (action === 'fullscreen') window.toggleFullScreen();
        else if (action === 'open_contact') window.openContactModal();
        else if (action === 'open_login') window.openLoginModal();
        else if (action === 'open_developer') window.openBecomeFanModal();
        else if (action === 'music') {
            const sub = actionObj.sub_action;
            if (sub === 'play') window.playAudio();
            else if (sub === 'pause' || sub === 'stop') window.pauseAudio();
            else if (sub === 'stop') window.stopAudio();
        }
    }

    async function executeSequence(actions) {
        if (isExecuting) return;
        isExecuting = true;
        try {
            for (let i = 0; i < actions.length; i++) {
                const item = actions[i];
                performSingleAction(item);
                const waitTime = item.delay || 0;
                if (waitTime > 0) {
                    await new Promise(r => setTimeout(r, waitTime));
                }
            }
        } finally {
            isExecuting = false;
        }
    }

    // ==========================================
    // ✅ 全新：Mac 风格执行任务卡片（居中展示，无动画）
    // ==========================================
    function renderMacProcessCard(actions) {
        const isAgent = currentMode === 'agent';
        const targetList = isAgent ? agentList : discussionList;
        const history = isAgent ? agentHistory : discussionHistory;

        // 任务字典：根据动作呈现不同的标题、副标题和执行日志
        const taskMetadata = {
            'open_music': {
                title: '音频调度任务',
                subtitle: '媒体娱乐组件',
                steps: [
                    '[Dispatch] Received command: "open_music"',
                    '[System] Resolving service: "AudioController"',
                    '[Action] Invoking: openMusicModal()',
                    '[Status] UI module loaded successfully.',
                    '<span class="mac-code-success">[Success] Audio context initialized and ready.</span>'
                ]
            },
            'open_log': {
                title: '日志查阅任务',
                subtitle: '历史记录检索',
                steps: [
                    '[Dispatch] Received command: "open_log"',
                    '[System] Resolving service: "UpdateLogHandler"',
                    '[Action] Invoking: openUpdateLogModal()',
                    '[Status] Fetching latest change log data...',
                    '<span class="mac-code-success">[Success] Log data retrieved and displayed.</span>'
                ]
            },
            'fullscreen': {
                title: '显示管理任务',
                subtitle: '全屏切换指令',
                steps: [
                    '[Dispatch] Received command: "fullscreen"',
                    '[System] Resolving service: "ScreenManager"',
                    '[Action] Invoking: toggleFullScreen()',
                    '[Status] Checking browser API support...',
                    '<span class="mac-code-success">[Success] Fullscreen mode toggled.</span>'
                ]
            },
            'open_contact': {
                title: '关系链路任务',
                subtitle: '工单提交通道',
                steps: [
                    '[Dispatch] Received command: "open_contact"',
                    '[System] Resolving service: "ContactService"',
                    '[Action] Invoking: openContactModal()',
                    '[Status] Loading contact methods...',
                    '<span class="mac-code-success">[Success] Contact interface activated.</span>'
                ]
            },
            'open_developer': {
                title: '开发者任务',
                subtitle: '权限订阅面板',
                steps: [
                    '[Dispatch] Received command: "open_developer"',
                    '[System] Resolving service: "SubscriptionManager"',
                    '[Action] Invoking: openBecomeFanModal()',
                    '[Status] Fetching pricing plans...',
                    '<span class="mac-code-success">[Success] Subscription panel displayed.</span>'
                ]
            }
        };

        // 如果是多步任务（比如多个动作的数组，但这里需要合并展示）
        // 为了好看，我们只取第一个动作的元数据作为本次任务的标题
        const primaryAction = actions[0] ? actions[0].action : 'open_music';
        const meta = taskMetadata[primaryAction] || taskMetadata['open_music'];

        // 构建 DOM
        const wrapper = document.createElement('div');
        wrapper.className = 'mac-card-wrapper';
        
        const cardHTML = `
            <div class="mac-card">
                <div class="mac-header">
                    <span class="red"></span><span class="yellow"></span><span class="green"></span>
                </div>
                <div class="mac-card-title">${meta.title}</div>
                <div class="mac-card-subtitle">${meta.subtitle}</div>
                <div class="mac-code-editor">
                    ${meta.steps.map(line => `<span class="mac-code-line">${line}</span>`).join('')}
                </div>
            </div>
        `;
        wrapper.innerHTML = cardHTML;

        // 插入聊天记录
        targetList.appendChild(wrapper);
        agentMessageArea.scrollTop = agentMessageArea.scrollHeight;
        history.push({ type: 'ai', text: '[任务报告] 已生成执行详情' });

        // 触发真正的网页操作（隐藏执行）
        setTimeout(() => {
            executeSequence(actions);
        }, 300);
    }

    function sendMessageInternal() {
        const text = agentInput.value.trim();
        if (!text) return;
        const isAgent = currentMode === 'agent', targetList = isAgent ? agentList : discussionList, history = isAgent ? agentHistory : discussionHistory;
        const userBubble = document.createElement('div'); userBubble.className = 'chat-bubble user'; userBubble.textContent = text;
        targetList.appendChild(userBubble); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'user', text: text });
        agentInput.value = ''; agentInput.rows = 1; agentInput.style.height = 'auto';
        
        if (isAgent) {
            const loadingMsg = document.createElement('div'); loadingMsg.className = 'ai-text-msg text-gray-400'; loadingMsg.textContent = 'Thinking...'; loadingMsg.id = 'loading-bubble';
            targetList.appendChild(loadingMsg); agentMessageArea.scrollTop = agentMessageArea.scrollHeight;
        }

        fetch('/api/agent/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, mode: currentMode }) })
        .then(res => res.json()).then(data => {
            const loading = document.getElementById('loading-bubble'); if (loading) loading.remove();
            
            if (data.action === 'suggest_agent') {
                const suggestBox = document.createElement('div'); suggestBox.className = 'suggest-switch-box';
                suggestBox.innerHTML = `看起来你想执行一个指令任务。<br><button onclick="window.suggestSwitchToAgent('${data.reply || text}')">切换到代理人执行</button>`;
                targetList.appendChild(suggestBox); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'ai', text: '已识别指令意图' }); return;
            }

            // ✅ 代理人专享：展示 Mac 风格任务卡片
            if (isAgent && data.action_sequence && Array.isArray(data.action_sequence)) {
                renderMacProcessCard(data.action_sequence);
                return;
            }

            const botMsg = document.createElement('div'); botMsg.className = 'ai-text-msg'; botMsg.textContent = data.reply || '抱歉，无法回答。';
            targetList.appendChild(botMsg); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'ai', text: data.reply || '抱歉，无法回答。' });
        }).catch(() => {
            const loading = document.getElementById('loading-bubble'); if (loading) loading.remove();
            const errMsg = document.createElement('div'); errMsg.className = 'ai-text-msg text-red-400/80'; errMsg.textContent = '网络异常，请稍后再试。';
            targetList.appendChild(errMsg); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'ai', text: '网络异常，请稍后再试。' });
        });
    }
    agentSendBtn.addEventListener('click', sendMessageInternal);
    agentInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; if (this.value.length > 40 && this.scrollHeight < 108) { this.style.height = '108px'; } });
    agentInput.addEventListener('keypress', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessageInternal(); } });
});
</script>
