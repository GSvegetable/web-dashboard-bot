<!-- 在底部的 `sendMessageInternal` 函数中找到 fetch 部分，替换成下面这段增强了错误捕获的代码 -->
<script>
// ... 前面代码不变 ...

    function sendMessageInternal() {
        if (isProcessing) return;
        const text = agentInput.value.trim();
        if (!text) return;
        isProcessing = true;

        const isAgent = currentMode === 'agent';
        const targetList = isAgent ? agentList : discussionList;
        const history = isAgent ? agentHistory : discussionHistory;
        
        const userBubble = document.createElement('div'); userBubble.className = 'chat-bubble user'; userBubble.textContent = text;
        targetList.appendChild(userBubble); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'user', text: text });
        agentInput.value = ''; agentInput.rows = 1; agentInput.style.height = 'auto';
        
        let loadingMsg = null;
        if (isAgent) {
            loadingMsg = document.createElement('div'); loadingMsg.className = 'ai-text-msg text-gray-400'; loadingMsg.textContent = 'Thinking...'; loadingMsg.id = 'loading-bubble';
            targetList.appendChild(loadingMsg); agentMessageArea.scrollTop = agentMessageArea.scrollHeight;
        }

        let payload = { message: text, mode: currentMode, model_type: currentModel };

        fetch('/api/agent/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(res => {
            // ✅ 如果 API 状态码不是 200，直接抛出错误让 catch 捕获
            if (!res.ok) {
                throw new Error(`API 请求失败，状态码: ${res.status}`);
            }
            return res.json();
        })
        .then(data => {
            if (loadingMsg && loadingMsg.parentNode) loadingMsg.remove();
            
            // 正常响应处理（引导、确认、动作、纯文本）...
            // ... (保留你之前的原有逻辑) ...
            if (data.action === 'suggest_agent') {
                const suggestBox = document.createElement('div'); suggestBox.className = 'suggest-switch-box';
                suggestBox.innerHTML = `看起来你这条指令不够清晰。<br><button onclick="window.suggestSwitchToAgent('${data.reply || payload.message}')">点击尝试重新发给我</button>`;
                targetList.appendChild(suggestBox); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'ai', text: '指令模糊，点击按钮重试' }); 
                isProcessing = false;
                return;
            }
            if (data.action === 'ASK_CONFIRM') {
                // ... (原有确认逻辑) ...
                isProcessing = false;
                return;
            }
            if (isAgent) {
                if (data.reply) {
                    const botMsg = document.createElement('div'); botMsg.className = 'ai-text-msg'; botMsg.textContent = data.reply;
                    targetList.appendChild(botMsg); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'ai', text: data.reply });
                }
                if (data.actions && Array.isArray(data.actions) && data.actions.length > 0) {
                    executeSequence(data.actions);
                }
                isProcessing = false;
                return;
            }
            const botMsg = document.createElement('div'); botMsg.className = 'ai-text-msg'; botMsg.textContent = data.reply || '抱歉，无法回答。';
            targetList.appendChild(botMsg); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'ai', text: data.reply || '抱歉，无法回答。' });
            isProcessing = false;
        })
        .catch((error) => {
            if (loadingMsg && loadingMsg.parentNode) loadingMsg.remove();
            // ✅ 核心：一旦捕获到错误，立刻构造诊断指令，发给 AI！
            const errorText = error.message || '未知网络错误';
            // 构造特殊的诊断触发字符串
            const diagnosticMessage = `[执行诊断] 用户尝试执行指令："${text}"，但遇到了网络或服务器错误。错误详情：${errorText}。请帮我分析解决。`;
            
            // 直接把诊断消息当作新消息发送给 AI
            const errBubble = document.createElement('div'); errBubble.className = 'ai-text-msg text-red-400/80'; errBubble.textContent = '遇到系统异常，正在尝试调用智能诊断...';
            targetList.appendChild(errBubble); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'ai', text: '触发系统诊断' });

            // 再次调用 Fetch，但这次发送的是诊断字符串
            fetch('/api/agent/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: diagnosticMessage, mode: currentMode, model_type: currentModel }) })
            .then(res => res.json())
            .then(diagData => {
                const diagMsg = document.createElement('div'); diagMsg.className = 'ai-text-msg'; diagMsg.textContent = diagData.reply || '分析不出具体原因。';
                targetList.appendChild(diagMsg); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'ai', text: diagData.reply || '分析失败。' });
                isProcessing = false;
            })
            .catch(() => {
                const msg = document.createElement('div'); msg.className = 'ai-text-msg text-red-400/80'; msg.textContent = '诊断系统调用也失败了。';
                targetList.appendChild(msg); agentMessageArea.scrollTop = agentMessageArea.scrollHeight; history.push({ type: 'ai', text: '诊断系统调用也失败了。' });
                isProcessing = false;
            });
        });
    }
// ... 后面的代码不变 ...
</script>
