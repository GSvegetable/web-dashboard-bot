<!-- Agent 玻璃质感底部面板组件 -->
<style>
  .agent-panel-transition {
    /* ✅ 修改：去掉弹性回弹曲线，使用平滑缓出曲线，到位置就停 */
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
</style>

<!-- z-index 只设到 50，不遮挡常规页面点击，也不制造黑色遮罩 -->
<div id="agentPanelWrapper" class="fixed bottom-0 left-1/2 -translate-x-1/2 z-50 hidden" style="width: 0;">
    <!-- ✅ 修改：高度改为 11 倍 (660px)，并删掉了中间的文字 -->
    <div id="agentPanel" 
         class="bg-white/10 backdrop-blur-[12px] border-t border-white/20 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.3)] agent-panel-transition translate-y-full"
         style="height: 660px; width: 100%;">
         <!-- 文字已删除，保留空面板 -->
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const panelWrapper = document.getElementById('agentPanelWrapper');
    const panel = document.getElementById('agentPanel');
    let isPanelOpen = false;

    // 暴露到全局供 Agent 按钮调用
    window.toggleAgentPanel = function() {
        isPanelOpen = !isPanelOpen;
        
        if (isPanelOpen) {
            // 1. 对齐三张卡片展开后的总宽度，取其 1/3
            const container = document.getElementById('cardStackContainer');
            if (container) {
                const rect = container.getBoundingClientRect();
                // ✅ 修改：宽度改为当前卡片宽度的 1/3，并保持居中对齐
                panelWrapper.style.width = (rect.width / 3) + 'px';
                panelWrapper.style.left = rect.left + (rect.width / 2) + 'px';
                panelWrapper.style.transform = 'translateX(-50%)';
                panelWrapper.style.display = 'block';
            }
            // 2. 面板从底部滑入（无回弹平滑过渡）
            setTimeout(() => {
                panel.classList.remove('translate-y-full');
            }, 10);
        } else {
            // 3. 面板滑回底部
            panel.classList.add('translate-y-full');
            // 滑回完全隐藏后，隐藏 DOM 节点
            setTimeout(() => {
                panelWrapper.style.display = 'none';
            }, 400);
        }
    };
});
</script>
