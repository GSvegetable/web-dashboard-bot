{% if current_user.is_authenticated %}
<div id="profileContainer" class="fixed top-4 left-4 z-[9999]">
    <!-- 头像按钮 -->
    <div id="avatarBtn" class="w-10 h-10 rounded-full border border-white/30 flex items-center justify-center text-white text-sm font-bold shadow-lg backdrop-blur-sm cursor-pointer transition-transform active:scale-95 select-none overflow-hidden bg-gradient-to-br from-purple-500/40 to-blue-500/40">
        {% if current_user.avatar_url %}
            <img src="{{ current_user.avatar_url }}" class="w-full h-full object-cover">
        {% else %}
            {{ current_user.email[0]|upper if current_user.email else (current_user.telegram_id[0]|upper if current_user.telegram_id else 'U') }}
        {% endif %}
    </div>

    <!-- 下拉菜单（点击后显示，圆形按钮列表） -->
    <div id="avatarDropdown" class="hidden absolute top-12 left-0 z-50 flex flex-col gap-2 p-2 bg-white/5 backdrop-blur-md border border-white/30 rounded-2xl shadow-xl">
        <!-- 退出登录按钮（正圆形） -->
        <a href="/logout" class="w-10 h-10 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 transition text-white" title="退出登录">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </a>
        <!-- 切换账号按钮（正圆形） -->
        <a href="/logout" onclick="event.preventDefault(); window.location.href='/logout';" class="w-10 h-10 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 transition text-white" title="切换账号">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </a>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const avatarBtn = document.getElementById('avatarBtn');
    const dropdown = document.getElementById('avatarDropdown');

    if (avatarBtn && dropdown) {
        avatarBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', function(e) {
            if (!dropdown.classList.contains('hidden') && !avatarBtn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    }
});
</script>
{% endif %}
