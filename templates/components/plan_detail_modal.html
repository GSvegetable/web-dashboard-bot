<!-- 白色高级玻璃质感（边缘高光纯白修复版） -->
<div id="planDetailModal" class="fixed inset-0 z-[9999] hidden flex items-center justify-center pointer-events-none">
    
    <!-- 主体卡片：修复高光发黑问题 -->
    <div class="relative w-[92%] max-w-[480px] bg-white/10 backdrop-blur-2xl border-[1px] border-white/70 shadow-[inset_0_1px_0_rgba(255,255,255,1),0_40px_100px_rgba(0,0,0,0.12)] rounded-[36px] p-8 pb-16 pt-10 min-h-[320px] transition-all duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)] transform translate-y-8 scale-95 opacity-0 pointer-events-auto" id="modalContent">
        
        <!-- 顶部 Flex 布局：左侧超巨大价格，右侧叉号与名称 -->
        <div class="flex flex-row justify-between items-start w-full">
            
            <!-- 左上：超巨大价格 -->
            <div class="flex items-baseline gap-1">
                <span id="modalPlanPrice" class="text-7xl font-black text-gray-800 tracking-tight">15</span>
                <span class="text-sm font-medium text-gray-500">/月</span>
            </div>

            <!-- 右上：名称 + 叉号并排 -->
            <div class="flex flex-row items-center gap-4 mt-1">
                <span id="modalPlanName" class="text-lg font-semibold text-gray-700 tracking-wide">星光</span>
                <button onclick="closePlanModal()" class="text-gray-400 hover:text-gray-800 transition">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

        </div>
        
    </div>
</div>

<script>
    // 价格联动逻辑保持不变
    window.openPlanModal = function(planName) {
        const modal = document.getElementById('planDetailModal');
        const nameEl = document.getElementById('modalPlanName');
        const priceEl = document.getElementById('modalPlanPrice');
        
        const priceMap = {
            '星光': '15',
            '极光': '40',
            '极光pro': '310'
        };

        nameEl.innerText = planName;
        priceEl.innerText = priceMap[planName] || '15';

        modal.classList.remove('hidden');
        setTimeout(() => {
            const content = document.getElementById('modalContent');
            content.classList.remove('translate-y-8', 'scale-95', 'opacity-0');
            content.classList.add('translate-y-0', 'scale-100', 'opacity-100');
        }, 10);
    };

    window.closePlanModal = function() {
        const modal = document.getElementById('planDetailModal');
        const content = document.getElementById('modalContent');
        content.classList.remove('translate-y-0', 'scale-100', 'opacity-100');
        content.classList.add('translate-y-8', 'scale-95', 'opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 500); 
    };
</script>
