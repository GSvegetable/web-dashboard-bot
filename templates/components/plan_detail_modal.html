<!-- 中央弹窗菜单（不靠边、透明感、标题在右上角） -->
<div id="planDetailModal" class="fixed inset-0 z-[9999] hidden bg-black/40 backdrop-blur-[4px] flex items-center justify-center">
    
    <!-- 圆润的透明卡片主体 -->
    <div class="relative w-[90%] max-w-[420px] bg-[rgba(20,20,25,0.85)] backdrop-blur-2xl border border-white/10 rounded-[32px] shadow-[0_30px_80px_rgba(0,0,0,0.6)] p-8 pt-6 transition-all duration-300 scale-95 opacity-0" id="modalContent">
        
        <!-- 左上角：关闭按钮 -->
        <button onclick="closePlanModal()" class="absolute top-4 left-4 w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <!-- 右上角：动态标题 -->
        <div class="flex justify-end items-center pt-1 mb-6">
            <h3 id="modalPlanTitle" class="text-2xl font-bold text-white tracking-wide">星光</h3>
        </div>

        <!-- 菜单的中间内容（给你预留的，未来你在这里放具体的价格/功能说明） -->
        <div class="text-gray-300 text-sm leading-relaxed space-y-3 pb-2">
            <p>你选择的套餐是：<span id="modalPlanName" class="text-[#F5E6CF] font-medium"></span></p>
            <div class="border-t border-white/5 my-4 pt-4 text-xs text-gray-400">
                这里之后可以放详细的权益说明，或者支付二维码/按钮。
            </div>
        </div>

        <!-- 底部占位（如果将来有按钮，可以放这里） -->
        <div class="mt-2 flex justify-center">
            <button class="px-6 py-2 bg-[#3c4779] hover:bg-[#2e385e] text-white text-sm rounded-full transition">确认选择</button>
        </div>
    </div>
</div>

<script>
    // 打开菜单逻辑
    window.openPlanModal = function(planName) {
        const modal = document.getElementById('planDetailModal');
        const titleEl = document.getElementById('modalPlanTitle');
        const nameEl = document.getElementById('modalPlanName');
        
        // 把卡片的名字填入标题和正文
        titleEl.innerText = planName;
        nameEl.innerText = planName;

        // 显示菜单（带一点点淡入效果）
        modal.classList.remove('hidden');
        setTimeout(() => {
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-95', 'opacity-0');
            content.classList.add('scale-100', 'opacity-100');
        }, 10);
    };

    // 关闭菜单逻辑
    window.closePlanModal = function() {
        const modal = document.getElementById('planDetailModal');
        const content = document.getElementById('modalContent');
        
        content.classList.remove('scale-100', 'opacity-100');
        content.classList.add('scale-95', 'opacity-0');
        
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    };
</script>
