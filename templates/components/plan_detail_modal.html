<!-- 白色高级玻璃质感会员卡片（苹果风格、边缘反光） -->
<div id="planDetailModal" class="fixed inset-0 z-[9999] hidden flex items-center justify-center pointer-events-none">
    
    <!-- 主体卡片：奶白/高透玻璃质感，内发光边缘 -->
    <div class="relative w-[92%] max-w-[460px] bg-white/70 backdrop-blur-3xl border border-white/80 shadow-[0_30px_80px_rgba(0,0,0,0.06),inset_0_1px_0_rgba(255,255,255,0.9)] rounded-[32px] p-8 pt-6 transition-all duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)] transform translate-y-8 scale-95 opacity-0 pointer-events-auto" id="modalContent">
        
        <!-- 左上角：纯粹的无圈叉号（苹果式极简） -->
        <button onclick="closePlanModal()" class="absolute top-4 left-4 text-gray-400 hover:text-gray-800 transition">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <!-- 右上角：巨大价格，无多余修饰 -->
        <div class="absolute top-3 right-4 flex items-baseline gap-1">
            <span id="modalPlanPrice" class="text-5xl font-black text-gray-900 tracking-tight">15</span>
            <span class="text-sm font-bold text-gray-500 ml-0.5">/月</span>
        </div>

        <!-- 居中的套餐名称 -->
        <div class="mt-14 mb-8 text-center">
            <h3 id="modalPlanName" class="text-2xl font-bold text-gray-900 tracking-wide">星光</h3>
        </div>

        <!-- 底部确认按钮：使用你偏好的 #3c4779 -->
        <button class="w-full py-4 bg-[#3c4779] hover:bg-[#2e385e] text-white text-base font-semibold rounded-2xl transition active:scale-95 shadow-lg shadow-[#3c4779]/20">
            确认选择
        </button>
    </div>
</div>

<script>
    // 打开菜单逻辑（联动动态价格）
    window.openPlanModal = function(planName) {
        const modal = document.getElementById('planDetailModal');
        const nameEl = document.getElementById('modalPlanName');
        const priceEl = document.getElementById('modalPlanPrice');
        
        // 价格映射表
        const priceMap = {
            '星光': '15',
            '极光': '40',
            '极光pro': '310'
        };

        nameEl.innerText = planName;
        priceEl.innerText = priceMap[planName] || '15'; // 匹配不到时默认为15

        modal.classList.remove('hidden');
        setTimeout(() => {
            const content = document.getElementById('modalContent');
            content.classList.remove('translate-y-8', 'scale-95', 'opacity-0');
            content.classList.add('translate-y-0', 'scale-100', 'opacity-100');
        }, 10);
    };

    // 关闭菜单逻辑
    window.closePlanModal = function() {
        const modal = document.getElementById('planDetailModal');
        const content = document.getElementById('modalContent');
        
        content.classList.remove('translate-y-0', 'scale-100', 'opacity-100');
        content.classList.add('translate-y-8', 'scale-95', 'opacity-0');
        
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 500); 
    };
</script>
