<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    /* 初始就是完整小圆 */
    width: 38px;
    height: 38px;
    border-radius: 999px;

    opacity: 0;
    pointer-events: none;
    padding: 0;
    box-sizing: border-box;

    /*
      核心：给宽度/高度添加轻微果冻弹性
      cubic-bezier(0.34, 1.3, 0.64, 1) 会让动画在到达目标前稍微超过目标值，
      然后再回弹到目标值，产生“拉扯/依依不舍”的感觉。
    */
    transition:
        transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        border-radius 0.5s cubic-bezier(0.34, 1.3, 0.64, 1);
}
</style>

<script>
let toastTimer = null;
let toastExpandTimer = null;
let toastHideTimer = null;

window.showTopToast = function () {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);

    if (toastTimer) clearTimeout(toastTimer);
    if (toastExpandTimer) clearTimeout(toastExpandTimer);
    if (toastHideTimer) clearTimeout(toastHideTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';
    document.body.appendChild(toast);

    void toast.offsetWidth; // 强制浏览器渲染初始状态

    // 1. 小圆下滑到指定位置（40px）
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';

    // 2. 提前 0.05s 开始展开（下滑 0.3s，展开延迟 250ms）
    toastExpandTimer = setTimeout(() => {
        toast.style.width = '240px';
        toast.style.height = '38px';
        toast.style.borderRadius = '999px';
    }, 250);

    // 3. 停留后收起并退场
    toastHideTimer = setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '38px';
        toast.style.height = '38px';
        toast.style.borderRadius = '999px';

        // 收起动画时长 0.5s，延迟 500ms 后移除 DOM
        toastTimer = setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 500);
    }, 1300);
};
</script>
