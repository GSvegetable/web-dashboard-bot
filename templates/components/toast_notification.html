<!-- 独立纯圆球下落组件 -->
<style>
    #topToast {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%) translateY(-100%);
        z-index: 99999;
        
        /* 纯玻璃圆球材质 */
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        
        /* ✨ 尺寸缩小为 38px */
        width: 38px; height: 38px;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        padding: 0;
    }

    /* 加速下落动画：改为 1s */
    @keyframes fallDownAndStop {
        0%   { opacity: 0; transform: translateX(-50%) translateY(-100%); }
        100% { opacity: 1; transform: translateX(-50%) translateY(24px); }
    }
    .c-toast-fall { 
        animation: fallDownAndStop 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; 
    }

    /* 退场动画：原路缩回去 */
    @keyframes hideUp {
        0%   { opacity: 1; transform: translateX(-50%) translateY(24px); }
        100% { opacity: 0; transform: translateX(-50%) translateY(-100%); }
    }
    .c-toast-hide { 
        animation: hideUp 0.5s ease-in forwards; 
    }
</style>

<script>
    let isAnimating = false;

    window.showTopToast = function() {
        if (isAnimating) return;

        const existing = document.getElementById('topToast');
        if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
        }

        isAnimating = true;

        const toast = document.createElement('div');
        toast.id = 'topToast';
        document.body.appendChild(toast);

        void toast.offsetWidth; 
        toast.className = 'c-toast-fall';

        // 停留 3 秒后消失
        setTimeout(() => {
            if (toast.parentNode) {
                toast.className = 'c-toast-hide';
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                    isAnimating = false;
                }, 500);
            }
        }, 3000);
    };
</script>
