<!-- 独立玻璃胶囊通知组件 (绝对防抽风慢动作丝滑版) -->
<style>
    #topToast {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%) translateY(-100%);
        z-index: 99999;
        
        /* 纯玻璃材质 */
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
        border-radius: 50%;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        font-size: 14px;
        font-weight: 500;
        pointer-events: none;
        white-space: nowrap;
        display: flex; justify-content: center; align-items: center;
        
        width: 0px; height: 0px;
        padding: 0;
        opacity: 0;
    }

    /* 第一阶段：缓慢下落变成圆 (1.5秒) */
    @keyframes fallDownFromTop {
        0%   { width: 0px; height: 0px; opacity: 0; transform: translateX(-50%) translateY(-100%); padding: 0; }
        100% { width: 52px; height: 52px; opacity: 1; transform: translateX(-50%) translateY(24px); padding: 0; border-radius: 50%; }
    }
    .c-toast-fall { 
        animation: fallDownFromTop 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; 
    }

    /* 第二阶段：缓慢向两侧拉伸变胶囊 + 文字淡入 (1.2秒) */
    @keyframes expandToCapsule {
        0%   { width: 52px; height: 52px; padding: 0; border-radius: 50%; }
        100% { width: auto; height: auto; padding: 12px 24px; border-radius: 999px; }
    }
    .c-toast-expand { 
        animation: expandToCapsule 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; 
    }
    .c-toast-expand .toast-content { 
        animation: textFadeIn 1s ease-in forwards; 
    }
    @keyframes textFadeIn {
        0%   { opacity: 0; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
    }

    /* 第三阶段：缓慢消失退回顶部 (0.6秒) */
    @keyframes hideAndShrink {
        0%   { width: auto; height: auto; padding: 12px 24px; opacity: 1; transform: translateX(-50%) translateY(24px); border-radius: 999px; }
        100% { width: 0px; height: 0px; padding: 0; opacity: 0; transform: translateX(-50%) translateY(-100%); border-radius: 50%; }
    }
    .c-toast-hide { 
        animation: hideAndShrink 0.6s ease-in forwards; 
    }
</style>

<script>
    let isAnimating = false; // ✅ 防抽风锁：气泡正在播放时，不接受新动画
    let hideTimer = null;

    window.showTopToast = function(message) {
        // 如果当前正在播放，直接忽略新请求，防止抽风
        if (isAnimating) return;

        // 清空残留的旧气泡
        const existing = document.getElementById('topToast');
        if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
        }

        isAnimating = true;

        // 1. 创建新气泡
        const toast = document.createElement('div');
        toast.id = 'topToast';
        const contentSpan = document.createElement('span');
        contentSpan.className = 'toast-content';
        contentSpan.textContent = message;
        contentSpan.style.cssText = 'opacity: 0; display: inline-block;'; 
        toast.appendChild(contentSpan);
        document.body.appendChild(toast);

        // 2. 触发第一阶段：缓慢下落变成圆 (1.5秒)
        void toast.offsetWidth; 
        toast.className = 'c-toast-fall';

        // 3. 1.5秒后触发第二阶段：缓慢拉伸变成胶囊 (1.2秒)
        setTimeout(() => {
            if (toast.parentNode) {
                toast.className = 'c-toast-expand';
            }
        }, 1500);

        // 4. 总共经过 3.5 秒 (1.5秒下落 + 1.2秒展开 + 0.8秒停留) 后，开始消失
        setTimeout(() => {
            if (toast.parentNode) {
                toast.className = 'c-toast-hide';
                // 0.6秒后彻底移除DOM，并解锁
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                    isAnimating = false; // ✅ 解锁
                }, 600);
            }
        }, 3500);
    };
</script>
