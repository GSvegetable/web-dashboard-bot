<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小球落下停住</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #1a1a2e; /* 深色背景，便于看清玻璃球 */
        overflow: hidden;
    }

    .ball {
        position: fixed;
        top: 0;
        left: 50%;
        width: 40px;
        height: 40px;
        border-radius: 50%;

        /* 玻璃材质 */
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);

        /* 初始在屏幕外上方，透明度 0 */
        transform: translateX(-50%) translateY(-100%);
        opacity: 0;

        /* 动画：掉下来停住，forwards 保持结束状态 */
        animation: dropDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes dropDown {
        0% {
            transform: translateX(-50%) translateY(-100%);
            opacity: 0;
        }
        100% {
            transform: translateX(-50%) translateY(24px); /* 停在距顶部 24px */
            opacity: 1;
        }
    }
</style>
</head>
<body>
    <div class="ball"></div>
</body>
</html>
