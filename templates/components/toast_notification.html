<!-- 独立玻璃胶囊通知组件 (Toast Notification) -->
<style>
    #topToast {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%) translateY(-100%);
        z-index: 99999;
        
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
        border-radius: 50%;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        font-size: 14px;
        font-weight: 500;
        pointer-events: none;
        white-space: nowrap;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        opacity: 0;
        box-sizing: border-box;
        overflow: hidden;

        /* 动画参数：时长 5s，缓动可定制 */
        --target-width: 200px; /* 由 JS 动态设置 */
    }

    /* 一个动画完成：下落 -> 展开 -> 停留 -> 收缩 -> 消失 */
    @keyframes toastLifecycle {
        0% {
            transform: translateX(-50%) translateY(-100%);
            opacity: 0;
            width: 36px;
            padding: 0;
            border-radius: 50%;
        }
        12% { /* 下落完成，小球停在顶部下方 24px */
            transform: translateX(-50%) translateY(24px);
            opacity: 1;
            width: 36px;
            padding: 0;
            border-radius: 50%;
        }
        36% { /* 展开完成，宽度达到目标值，成为胶囊 */
            transform: translateX(-50%) translateY(24px);
            opacity: 1;
            width: var(--target-width);
            padding: 0 12px;
            border-radius: 18px;
        }
        80% { /* 停留，保持胶囊状态 */
            transform: translateX(-50%) translateY(24px);
            opacity: 1;
            width: var(--target-width);
            padding: 0 12px;
            border-radius: 18px;
        }
        100% { /* 收缩并向上移出 */
            transform: translateX(-50%) translateY(-100%);
            opacity: 0;
            width: 36px;
            padding: 0;
            border-radius: 50%;
        }
    }

    .c-toast-run {
        animation: toastLifecycle 5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 文字淡入：在展开阶段（动画 12%~36% 之间）出现 */
    .toast-content {
        opacity: 0;
        display: inline-block;
        white-space: nowrap;
    }
    .c-toast-run .toast-content {
        animation: textFadeIn 0.8s ease-in 0.6s forwards;
    }
    @keyframes textFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }
</style>

<script>
    let toastElement = null;

    window.showTopToast = function(message) {
        // 如果已有 toast，先移除（或直接替换，这里简单移除旧的）
        if (toastElement && toastElement.parentNode) {
            toastElement.parentNode.removeChild(toastElement);
        }

        const toast = document.createElement('div');
        toast.id = 'topToast';
        
        const contentSpan = document.createElement('span');
        contentSpan.className = 'toast-content';
        contentSpan.textContent = message;
        toast.appendChild(contentSpan);
        document.body.appendChild(toast);

        // 先不添加动画类，测量文字宽度
        toast.style.transition = 'none';
        toast.style.width = '36px';
        toast.style.height = '36px';
        toast.style.padding = '0';
        toast.style.borderRadius = '50%';
        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        contentSpan.style.opacity = '0';

        // 强制 reflow，确保样式生效
        void toast.offsetWidth;

        // 测量文字实际宽度
        const contentWidth = contentSpan.offsetWidth;
        // 目标宽度 = 文字宽度 + 左右 padding (12*2) + 边框 (1*2)
        const targetWidth = contentWidth + 24 + 2;

        // 设置 CSS 变量，供动画使用
        toast.style.setProperty('--target-width', targetWidth + 'px');

        // 添加动画类，触发整个生命周期
        toast.classList.add('c-toast-run');

        // 动画结束后移除元素（5秒后）
        toast.addEventListener('animationend', function handler() {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
            toastElement = null;
            toast.removeEventListener('animationend', handler);
        });

        // 保存引用
        toastElement = toast;
    }
</script>
