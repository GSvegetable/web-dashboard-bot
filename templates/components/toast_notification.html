<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    /* 初始就是完整小圆，但高度稍高，顶部圆角稍大，为拉伸做准备 */
    width: 38px;
    height: 44px;               /* 比正常高 6px */
    border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
                                /* 顶部垂直半径 60%，底部 40%，形成轻微拉长 */

    opacity: 0;
    pointer-events: none;
    padding: 0;
    box-sizing: border-box;

    /* 分别设置不同属性的过渡时间：
       - transform/opacity: 0.3s（下滑）
       - width: 0.5s 果冻（展开/收起）
       - height/border-radius: 0.2s（快速恢复圆形，造成“边缘拉扯”瞬态）
    */
    transition:
        transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
</style>

<script>
let toastTimer = null;
let toastExpandTimer = null;
let toastHideTimer = null;

window.showTopToast = function () {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);

    if (toastTimer) clearTimeout(toastTimer);
    if (toastExpandTimer) clearTimeout(toastExpandTimer);
    if (toastHideTimer) clearTimeout(toastHideTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    // 强制初始状态：屏幕外 + 轻微拉伸形状
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.height = '44px';
    toast.style.borderRadius = '50% 50% 40% 40% / 60% 60% 40% 40%';
    toast.style.width = '38px';

    document.body.appendChild(toast);
    void toast.offsetWidth; // 强制浏览器渲染初始状态

    // 1. 下滑到指定位置，同时快速恢复圆形（高度 38px，圆角 999px）
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';
    toast.style.height = '38px';
    toast.style.borderRadius = '999px';

    // 2. 提前 0.05s 开始展开（下滑 0.3s，展开延迟 250ms）
    toastExpandTimer = setTimeout(() => {
        toast.style.width = '240px';
        toast.style.height = '38px';
        toast.style.borderRadius = '999px';
    }, 250);

    // 3. 停留后收起并退场
    toastHideTimer = setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '38px';
        toast.style.height = '38px';
        toast.style.borderRadius = '999px';

        toastTimer = setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 500);
    }, 1300);
};
</script>
