<!-- 独立玻璃圆球 原地拉长空胶囊组件 -->
<style>
    #topToast {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%) translateY(-100%);
        z-index: 99999;
        
        /* 纯玻璃材质 */
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        
        width: 38px; height: 38px;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        padding: 0;
    }

    /* 第一步：下落为球 (1秒) */
    @keyframes fallDownAndStop {
        0%   { opacity: 0; transform: translateX(-50%) translateY(-100%); }
        100% { opacity: 1; transform: translateX(-50%) translateY(24px); }
    }
    .c-toast-fall { 
        animation: fallDownAndStop 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; 
    }

    /* 第二步：原地直接拉长成胶囊 (0.8秒) —— ✅ 强制锁定位置，不会缩回顶部 */
    @keyframes expandToBar {
        0%   { width: 38px; height: 38px; border-radius: 50%; transform: translateX(-50%) translateY(24px); }
        100% { width: 80px; height: 38px; border-radius: 999px; transform: translateX(-50%) translateY(24px); }
    }
    .c-toast-expand { 
        animation: expandToBar 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; 
    }

    /* 第三步：消失退回顶部 (0.5秒) —— ✅ 从原地直接缩回上方 */
    @keyframes hideUp {
        0%   { opacity: 1; transform: translateX(-50%) translateY(24px); width: 80px; height: 38px; border-radius: 999px; }
        100% { opacity: 0; transform: translateX(-50%) translateY(-100%); width: 38px; height: 38px; border-radius: 50%; }
    }
    .c-toast-hide { 
        animation: hideUp 0.5s ease-in forwards; 
    }
</style>

<script>
    let isAnimating = false;

    window.showTopToast = function() {
        if (isAnimating) return;

        const existing = document.getElementById('topToast');
        if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
        }

        isAnimating = true;

        const toast = document.createElement('div');
        toast.id = 'topToast';
        document.body.appendChild(toast);

        // 触发第一阶段：下落成球 (1s)
        void toast.offsetWidth; 
        toast.className = 'c-toast-fall';

        // 1秒后 -> 触发第二阶段：原地拉长成胶囊 (0.8s)
        setTimeout(() => {
            if (toast.parentNode) {
                toast.className = 'c-toast-expand';
            }
        }, 1000);

        // 1.8秒后 (1s下落 + 0.8s拉长)，停留 1.2 秒 -> 触发第三阶段：消失退场 (0.5s)
        setTimeout(() => {
            if (toast.parentNode) {
                toast.className = 'c-toast-hide';
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                    isAnimating = false; // 解锁
                }, 500);
            }
        }, 3000); // 总时长控制在 3 秒
    };
</script>
