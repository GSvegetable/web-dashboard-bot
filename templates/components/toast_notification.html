<!-- 独立玻璃胶囊通知组件 (Toast Notification) -->
<style>
    #topToast {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%) translateY(-100%);
        z-index: 99999;
        
        /* 纯玻璃材质 */
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
        border-radius: 50%;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        font-size: 14px;
        font-weight: 500;
        pointer-events: none;
        white-space: nowrap;
        display: flex; justify-content: center; align-items: center;
        width: 0px; height: 0px;
        padding: 0;
        opacity: 0;
    }

    /* 第一步：垂直下落变成圆 */
    @keyframes fallDownFromTop {
        0%   { width: 0px; height: 0px; opacity: 0; transform: translateX(-50%) translateY(-100%); padding: 0; }
        100% { width: 52px; height: 52px; opacity: 1; transform: translateX(-50%) translateY(24px); padding: 0; border-radius: 50%; }
    }
    .c-toast-fall { animation: fallDownFromTop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* 第二步：左右拉伸变胶囊 + 文字淡入（已修复） */
    @keyframes expandToCapsule {
        0%   { 
            width: 52px; 
            height: 52px; 
            padding: 0; 
            border-radius: 50%;
            transform: translateX(-50%) translateY(24px); /* 关键：固定位置 */
            opacity: 1;                                   /* 关键：保持可见 */
        }
        100% { 
            width: auto; 
            height: auto; 
            padding: 12px 24px; 
            border-radius: 999px;
            transform: translateX(-50%) translateY(24px); /* 位置不变 */
            opacity: 1;                                   /* 持续可见 */
        }
    }
    .c-toast-expand { animation: expandToCapsule 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
    .c-toast-expand .toast-content { animation: textFadeIn 0.5s ease-in forwards; }
    @keyframes textFadeIn {
        0%   { opacity: 0; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1); }
    }

    /* 第三步：消失退场 */
    @keyframes hideAndShrink {
        0%   { width: auto; height: auto; padding: 12px 24px; opacity: 1; transform: translateX(-50%) translateY(24px); border-radius: 999px; }
        100% { width: 0px; height: 0px; padding: 0; opacity: 0; transform: translateX(-50%) translateY(-100%); border-radius: 50%; }
    }
    .c-toast-hide { animation: hideAndShrink 0.4s ease-in forwards; }
</style>

<script>
    // 全局通知触发函数（动画防冲突版）
    let toastAnimTimer = null;

    window.showTopToast = function(message) {
        const existing = document.getElementById('topToast');

        if (existing) {
            if (toastAnimTimer) { clearTimeout(toastAnimTimer); toastAnimTimer = null; }
            existing.className = 'c-toast-hide';
            setTimeout(() => {
                if (existing.parentNode) existing.parentNode.removeChild(existing);
                createNewToast(message);
            }, 400);
        } else {
            createNewToast(message);
        }
    }

    function createNewToast(message) {
        if (toastAnimTimer) { clearTimeout(toastAnimTimer); toastAnimTimer = null; }

        const toast = document.createElement('div');
        toast.id = 'topToast';
        
        const contentSpan = document.createElement('span');
        contentSpan.className = 'toast-content';
        contentSpan.textContent = message;
        contentSpan.style.cssText = 'opacity: 0; display: inline-block;'; 
        toast.appendChild(contentSpan);
        document.body.appendChild(toast);

        void toast.offsetWidth; 
        toast.className = 'c-toast-fall';

        // 600ms 后展开
        toastAnimTimer = setTimeout(() => {
            if (toast.parentNode) {
                toast.className = 'c-toast-expand';
            }
        }, 600);

        // 3500ms 后自动隐藏
        const hideTimer = setTimeout(() => {
            if (toast.parentNode) {
                toast.className = 'c-toast-hide';
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 400);
            }
        }, 3500);
        
        toast._hideTimer = hideTimer;
    }
</script>
