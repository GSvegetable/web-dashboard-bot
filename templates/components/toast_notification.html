<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    /* 初始就是完整小圆 */
    width: 38px;
    height: 38px;
    border-radius: 999px;

    opacity: 0;
    pointer-events: none;
    padding: 0;
    box-sizing: border-box;

    transition:
        transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        height 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
</style>

<script>
let toastTimer = null;
let toastExpandTimer = null;
let toastHideTimer = null;

window.showTopToast = function () {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);

    if (toastTimer) clearTimeout(toastTimer);
    if (toastExpandTimer) clearTimeout(toastExpandTimer);
    if (toastHideTimer) clearTimeout(toastHideTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';
    document.body.appendChild(toast);

    void toast.offsetWidth; // 强制浏览器渲染初始状态

    // 1. 小圆快速滑下来
    toast.style.transform = 'translateX(-50%) translateY(24px)';
    toast.style.opacity = '1';

    // 2. 更快展开，长度更长
    toastExpandTimer = setTimeout(() => {
        toast.style.width = '120px';   // 长度调长，想更长就继续加大
        toast.style.height = '38px';
        toast.style.borderRadius = '999px';
    }, 600);

    // 3. 更快收起并退场
    toastHideTimer = setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '38px';
        toast.style.height = '38px';
        toast.style.borderRadius = '999px';

        toastTimer = setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 400);
    }, 2500);
};
</script>
