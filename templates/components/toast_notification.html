<!-- 独立纯圆球下落组件 -->
<style>
    #topToast {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%) translateY(-100%);
        z-index: 99999;
        
        /* 纯玻璃圆球材质 */
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        
        /* 固定为标准的圆球大小 */
        width: 52px; height: 52px;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        
        /* 里面什么文字都没有 */
        padding: 0;
    }

    /* 唯一动画：极其缓慢地滑下来停住 */
    @keyframes fallDownAndStop {
        0%   { opacity: 0; transform: translateX(-50%) translateY(-100%); }
        100% { opacity: 1; transform: translateX(-50%) translateY(24px); }
    }
    .c-toast-fall { 
        animation: fallDownAndStop 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; 
    }

    /* 退场动画：原路缩回去 */
    @keyframes hideUp {
        0%   { opacity: 1; transform: translateX(-50%) translateY(24px); }
        100% { opacity: 0; transform: translateX(-50%) translateY(-100%); }
    }
    .c-toast-hide { 
        animation: hideUp 0.6s ease-in forwards; 
    }
</style>

<script>
    let isAnimating = false;

    // 直接调用这个方法，小球就会掉下来。
    window.showTopToast = function() {
        // 如果正在动，忽略新请求，防止抽风
        if (isAnimating) return;

        // 清除残留的旧元素
        const existing = document.getElementById('topToast');
        if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
        }

        isAnimating = true;

        // 1. 创建纯圆球元素
        const toast = document.createElement('div');
        toast.id = 'topToast';
        document.body.appendChild(toast);

        // 2. 触发缓慢下落
        void toast.offsetWidth; 
        toast.className = 'c-toast-fall';

        // 3. 停留 3 秒后，原路消失缩回顶部
        setTimeout(() => {
            if (toast.parentNode) {
                toast.className = 'c-toast-hide';
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                    isAnimating = false; // 解锁
                }, 600);
            }
        }, 3000);
    };
</script>
