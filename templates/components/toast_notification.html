<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.3); /* 边框加粗 */
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    /* 正常小球尺寸：44x44（加粗变大） */
    width: 44px;
    height: 44px;
    border-radius: 999px;

    opacity: 0;
    pointer-events: none;
    padding: 0;
    box-sizing: border-box;

    /*
      关键：高度/圆角过渡与下滑同步（0.3s），
      使“屏幕边缘拉扯”的变形在下滑过程中可见。
      宽度依然用果冻曲线（0.5s）实现回弹。
    */
    transition:
        transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
</style>

<script>
let toastTimer = null;
let toastExpandTimer = null;
let toastHideTimer = null;

window.showTopToast = function () {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);

    if (toastTimer) clearTimeout(toastTimer);
    if (toastExpandTimer) clearTimeout(toastExpandTimer);
    if (toastHideTimer) clearTimeout(toastHideTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    // 初始状态：屏幕外 + 明显拉伸形状（模拟被屏幕边缘拽住）
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.height = '54px';              // 拉长 10px
    toast.style.borderRadius = '50% 50% 45% 45% / 65% 65% 45% 45%';
                                              // 顶部垂直半径 65%，底部 45%

    document.body.appendChild(toast);
    void toast.offsetWidth; // 强制浏览器渲染初始状态

    // 1. 下滑到指定位置，同时快速恢复圆形（高度 44px，圆角 999px）
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';
    toast.style.height = '44px';
    toast.style.borderRadius = '999px';

    // 2. 提前 0.05s 开始展开（下滑 0.3s，展开延迟 250ms）
    toastExpandTimer = setTimeout(() => {
        toast.style.width = '240px';
        toast.style.height = '44px';
        toast.style.borderRadius = '999px';
    }, 250);

    // 3. 停留更长时间（3300ms，比之前多 2 秒）后收起并退场
    toastHideTimer = setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.height = '44px';
        toast.style.borderRadius = '999px';

        // 收起动画结束后移除 DOM
        toastTimer = setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 500);
    }, 3300);
};
</script>
