<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    /* 初始圆球，设置为 flex center 让文字正好在正中间 */
    width: 44px;
    height: 44px;
    border-radius: 999px;
    padding: 0;

    opacity: 0;
    pointer-events: none;
    box-sizing: border-box;
    
    display: flex;
    align-items: center;
    justify-content: center; /* 文字绝对居中 */
    
    /* 不再裁剪内容，让文字自然展开 */
    transition:
        transform 0.3s cubic-bezier(0.34, 1.08, 0.64, 1),
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        padding 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* 文字初始完全透明 */
#topToast span {
    display: inline-block;
    white-space: nowrap;
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    opacity: 0; /* ✅ 强制隐藏 */
    transition: opacity 0.1s ease-in; /* 出现得快一点，根据你的要求 */
}
</style>

<script>
let toastTimer = null;

window.showTopToast = function (message) {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);
    if (toastTimer) clearTimeout(toastTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    const msgSpan = document.createElement('span');
    msgSpan.innerText = message || '测试提示';
    toast.appendChild(msgSpan);

    // 初始状态
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.padding = '0';

    document.body.appendChild(toast);
    void toast.offsetWidth; 

    // 1. 小球下落
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';

    // 2. 250ms 后展开胶囊，并让文字淡入
    setTimeout(() => {
        const textWidth = msgSpan.scrollWidth;
        const targetWidth = textWidth + 40; 
        toast.style.width = targetWidth + 'px';
        toast.style.padding = '0 20px';
        
        // ✅ 胶囊展开的同时，立刻让文字显现出来
        msgSpan.style.opacity = '1'; 
    }, 250);

    // 3. 收拢并退场
    toastTimer = setTimeout(() => {
        // 退场时统一把文字隐藏
        msgSpan.style.opacity = '0'; 

        toast.style.transition = 
            'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'padding 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), ' +
            'border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.padding = '0';

        setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
    }, 3300);
};
</script>
