<style>
#topToast {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    z-index: 99999;

    background: rgba(255, 255, 255, 0.04); /* 更通透 */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.2); /* 边框也通透一些 */
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

    /* 正常小球尺寸：44x44（加粗变大） */
    width: 44px;
    height: 44px;
    border-radius: 999px;

    opacity: 0;
    pointer-events: none;
    padding: 0;
    box-sizing: border-box;

    /*
      关键：
      - transform 使用带轻微过冲的缓动，让下坠到位后稍微超出一点再回弹
      - width 使用果冻曲线
      - height/border-radius 与 transform 同步，保持拉伸恢复
    */
    transition:
        transform 0.3s cubic-bezier(0.34, 1.08, 0.64, 1), /* 过冲回弹 */
        opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1),       /* 果冻展开 */
        height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
</style>

<script>
let toastTimer = null;
let toastExpandTimer = null;
let toastHideTimer = null;

window.showTopToast = function () {
    const existing = document.getElementById('topToast');
    if (existing) existing.parentNode.removeChild(existing);

    if (toastTimer) clearTimeout(toastTimer);
    if (toastExpandTimer) clearTimeout(toastExpandTimer);
    if (toastHideTimer) clearTimeout(toastHideTimer);

    const toast = document.createElement('div');
    toast.id = 'topToast';

    // 初始状态：屏幕外 + 明显拉伸形状（模拟被屏幕边缘拽住）
    toast.style.transform = 'translateX(-50%) translateY(-100%)';
    toast.style.opacity = '0';
    toast.style.width = '44px';
    toast.style.height = '54px';              // 拉长 10px
    toast.style.borderRadius = '50% 50% 45% 45% / 65% 65% 45% 45%';

    document.body.appendChild(toast);
    void toast.offsetWidth; // 强制浏览器渲染初始状态

    // 1. 下滑到 40px，并通过过冲曲线产生轻微回弹
    toast.style.transform = 'translateX(-50%) translateY(40px)';
    toast.style.opacity = '1';
    toast.style.height = '44px';
    toast.style.borderRadius = '999px';

    // 2. 提前 0.05s 开始展开（下滑 0.3s，展开延迟 250ms）
    toastExpandTimer = setTimeout(() => {
        toast.style.width = '240px';
        toast.style.height = '44px';
        toast.style.borderRadius = '999px';
    }, 250);

    // 3. 停留更长时间（3300ms，展开后多停留 2 秒）后收起并退场
    toastHideTimer = setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
        toast.style.width = '44px';
        toast.style.height = '44px';
        toast.style.borderRadius = '999px';

        toastTimer = setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 500);
    }, 3300);
};
</script>
