<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gsbot 编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; /* 纯黑底色 */
            color: #c9d1d9; height: 100vh; display: flex; flex-direction: column;
        }

        /* 顶部导航条 */
        .navbar {
            background-color: #161b22;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; border-bottom: 1px solid #30363d;
        }
        .navbar-left { font-weight: 600; font-size: 18px; color: #ffffff; }
        .navbar-right { display: flex; gap: 20px; font-size: 14px; color: #8b949e; }
        .nav-item { cursor: pointer; transition: color 0.2s; }
        .nav-item:hover { color: #ffffff; }

        /* 功能灰色矩形卡片 */
        .main-container {
            flex: 1; display: flex; justify-content: center; align-items: flex-start; padding-top: 80px;
        }
        .config-card {
            background-color: #161b22; border: 1px solid #30363d;
            border-radius: 6px; padding: 24px;
            width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .config-card label { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 500; color: #f0f6fc; }
        .config-card input {
            width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d;
            background-color: #0d1117; color: #c9d1d9; font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        .config-card input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3); }
        .config-card button {
            width: 100%; margin-top: 24px; padding: 10px 16px;
            background-color: #238636; color: #ffffff; border: 1px solid #238636;
            border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer;
        }
        .config-card button:active { transform: scale(0.98); }
        
        #status { margin-top: 16px; font-size: 13px; text-align: center; padding: 8px; border-radius: 6px; background-color: #21262d; color: #8b949e; }
        .success { background-color: #238636 !important; color: #ffffff !important; }
        .error { background-color: #da3633 !important; color: #ffffff !important; }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="navbar-left">gsbot编辑器</div>
        <div class="navbar-right">
            <div class="nav-item">仓库</div>
            <div class="nav-item">agent</div>
            <div class="nav-item">邮箱</div>
            <div class="nav-item">设置</div>
            <div class="nav-item">我的</div>
        </div>
    </nav>

    <!-- 核心灰色功能卡片 -->
    <div class="main-container">
        <div class="config-card">
            <label>输入你的机器人 Token</label>
            <input type="text" id="bot_token" placeholder="例如: 8506542682:AAH..." />

            <label>绑定指令</label>
            <input type="text" id="command" placeholder="例如: /gs" value="/gs" />

            <label>绑定的内容</label>
            <input type="text" id="content" placeholder="例如: 你好" value="你好" />
            
            <button id="run_btn">🚀 运行绑定</button>
            <div id="status">等待操作...</div>
        </div>
    </div>

    <script>
        // 完全符合你的要求：点击没有任何反应
        document.getElementById('run_btn').addEventListener('click', function() {
            const status = document.getElementById('status');
            status.className = '';
            status.innerText = '点击无任何反应 (纯 UI 演示)';
        });
    </script>
</body>
</html>
